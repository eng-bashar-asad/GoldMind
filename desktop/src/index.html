<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator Pro</title>
<link rel="stylesheet" href="calc.css">
</head>
<body>
<main class="calc" dir="ltr">
  <div class="screen">
    <div class="mode">DEG</div>
    <div id="expr" class="expr"></div>
    <div id="display" class="display">0</div>
  </div>
  <div class="keys">
    <button data-k="sin" class="sci">sin</button>
    <button data-k="cos" class="sci">cos</button>
    <button data-k="tan" class="sci">tan</button>
    <button data-k="ln" class="sci">ln</button>
    <button data-k="log" class="sci">log</button>
    <button data-k="²" class="sci">x²</button>
    <button data-k="^" class="sci">xʸ</button>
    <button data-k="√" class="sci">√</button>
    <button data-k="π" class="sci">π</button>
    <button data-k="e" class="sci">e</button>
    <button data-k="C" class="fn">C</button>
    <button data-k="B" class="fn" aria-label="Backspace">⌫</button>
    <button data-k="(" class="fn">(</button>
    <button data-k=")" class="fn">)</button>
    <button data-k="÷" class="op">÷</button>
    <button data-k="!" class="sci">n!</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="×" class="op">×</button>
    <button data-k="⁻¹" class="sci">1/x</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="−" class="op">−</button>
    <button data-k="±" class="sci">±</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="+" class="op">+</button>
    <button data-k="%" class="sci">%</button>
    <button data-k="0">0</button>
    <button data-k=".">.</button>
    <button data-k="=" class="eq wide">=</button>
  </div>
</main>

<section id="gate" class="panel hidden" role="dialog" aria-modal="true">
  <div class="box">
    <p id="gate-msg" class="msg" aria-live="polite"></p>
    <button id="gate-open" class="primary">إعادة المحاولة</button>
  </div>
</section>

<section id="newseq" class="panel hidden" role="dialog" aria-modal="true">
  <div class="box">
    <p id="ns-title" class="title"></p>
    <p id="ns-dots" class="dots" dir="ltr"></p>
    <p id="ns-msg" class="msg" aria-live="polite"></p>
    <button id="ns-cancel" class="secondary">إلغاء</button>
  </div>
</section>

<script src="calc.js"></script>
</body>
</html>
