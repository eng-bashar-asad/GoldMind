<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>فاتورة | GoldMind</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style> body { font-family: 'IBM Plex Sans Arabic', sans-serif; } </style>
</head>
<body class="bg-gray-100 text-gray-900">

<div id="loading" class="min-h-screen flex items-center justify-center text-gray-500 text-sm">جارِ تحميل الفاتورة...</div>
<div id="not-found" class="hidden min-h-screen flex items-center justify-center text-center px-6 text-gray-500 text-sm">
تعذّر العثور على هذه الفاتورة. تأكد من الرابط أو تواصل مع المحل مباشرة.
</div>

<div id="receipt" class="hidden max-w-md lg:max-w-3xl mx-auto min-h-screen bg-white">

<!-- Letterhead -->
<div class="p-6 text-center border-b-4 border-amber-600">
<img id="storeLogo" crossorigin="anonymous" class="hidden w-16 h-16 mx-auto mb-2 object-contain"/>
<h1 id="storeName" class="text-xl font-bold"></h1>
<p id="storeAddress" class="text-[12px] text-gray-500 mt-1"></p>
<p id="storeContact" class="text-[12px] text-gray-500" dir="ltr"></p>
</div>

<div class="p-5">
<div class="flex items-center justify-between mb-1">
<h2 class="text-lg font-bold" id="typeLabel">فاتورة</h2>
<span id="statusBadge" class="text-[11px] font-bold px-3 py-1 rounded-full"></span>
</div>
<div class="mb-4">
<div class="font-bold text-[12px] tracking-wide" id="doc-type-ar"></div>
<div class="text-[9px] text-gray-500 tracking-widest uppercase" id="doc-type-en"></div>
<div class="hidden text-[11px] text-gray-600 mt-1" id="doc-note"></div>
</div>

<table class="w-full text-[13px] mb-4">
<tbody>
<tr class="border-b"><td class="py-2 text-gray-500">رقم الفاتورة</td><td class="py-2 font-bold text-left" dir="ltr" id="invNumber"></td></tr>
<tr class="border-b"><td class="py-2 text-gray-500">التاريخ</td><td class="py-2 font-semibold text-left" id="invDate"></td></tr>
<tr class="border-b"><td class="py-2 text-gray-500">طريقة الدفع</td><td class="py-2 font-semibold text-left" id="invPayment"></td></tr>
<tr id="custRow" class="hidden"><td class="py-2 text-gray-500">العميل</td><td class="py-2 font-semibold text-left" id="custName"></td></tr>
</tbody>
</table>

<table class="w-full text-[11px] mb-4">
<thead>
<tr class="border-b-2 border-gray-800 text-gray-600">
<th class="py-2 text-right">الوصف</th>
<th class="py-2 text-center">الكمية</th>
<th class="py-2 text-center">العيار</th>
<th class="py-2 text-center">الوزن</th>
<th class="py-2 text-left">الإجمالي</th>
</tr>
</thead>
<tbody id="itemsBody" class="divide-y divide-gray-100"></tbody>
</table>

<div class="border-t-2 border-gray-800 pt-3 space-y-1 text-[12px]">
<div class="flex justify-between text-gray-600">
<span>القيمة قبل الضريبة</span>
<span id="sumBeforeTax"></span>
</div>
<div class="flex justify-between text-gray-600">
<span>قيمة الضريبة</span>
<span id="sumVat"></span>
</div>
<div class="flex justify-between font-bold text-base pt-1 border-t border-gray-200 mt-1">
<span>الإجمالي الكامل</span>
<span id="sumTotal"></span>
</div>
</div>

<div class="text-center text-[10px] text-gray-400 mt-6">شكراً لتعاملكم معنا</div>

<a id="policyLink" href="#" class="block text-center mt-4 text-[12px] text-amber-700 font-semibold underline">سياسة البيع والإرجاع والتبديل</a>

<button onclick="downloadReceiptPdf()" id="download-pdf-btn" class="mt-5 w-full flex items-center justify-center gap-2 bg-black text-white py-3 rounded-lg text-sm font-semibold">
<span>تحميل نسخة PDF</span>
</button>
</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const invoiceId = params.get('id');

const TYPE_LABELS = { sale: 'فاتورة بيع', buyTrader: 'فاتورة شراء', buyRetail: 'فاتورة شراء', traderPay: 'سند دفع', return: 'فاتورة مرتجع' };
const STATUS_LABELS = { paid: 'مدفوعة', unpaid: 'غير مدفوعة' };
const STATUS_COLORS = { paid: 'bg-green-100 text-green-700', unpaid: 'bg-amber-100 text-amber-800' };
const PAYMENT_LABELS = { cash: 'نقدي', bank: 'فيزا / بنك', credit: 'دين', mixed: 'مختلط' };

function fmt(n) {
  return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
// Mirrors theme.js's gmFormatDualCurrency, kept local since this public
// unauthenticated receipt page doesn't load theme.js.
function fmtDual(amount, row) {
  const base = fmt(amount) + ' ' + (row.currency || 'AED');
  if (!row.secondary_currency || !row.secondary_currency_rate) return base;
  const rate = Number(row.secondary_currency_rate);
  if (!isFinite(rate) || rate <= 0) return base;
  return base + ' (' + fmt(Number(amount) * rate) + ' ' + row.secondary_currency + ')';
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('ar-EG-u-nu-latn', { year: 'numeric', month: 'long', day: 'numeric' });
}
function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

async function load() {
  if (!invoiceId) { showNotFound(); return; }

  const { data, error } = await goldmindClient.rpc('get_invoice_receipt', { p_id: invoiceId });
  const row = data && data[0];

  if (error || !row) { showNotFound(); return; }

  if (row.store_logo_url) {
    const logo = document.getElementById('storeLogo');
    logo.src = row.store_logo_url;
    logo.classList.remove('hidden');
  }
  document.getElementById('storeName').textContent = row.store_name || 'المحل';
  if (row.store_address) document.getElementById('storeAddress').textContent = row.store_address;
  const contactParts = [];
  if (row.store_phone) contactParts.push(row.store_phone);
  if (row.store_email) contactParts.push(row.store_email);
  document.getElementById('storeContact').textContent = contactParts.join(' | ');

  document.getElementById('typeLabel').textContent = TYPE_LABELS[row.invoice_type] || 'فاتورة';
  document.getElementById('invNumber').textContent = row.invoice_number || '—';
  document.getElementById('invDate').textContent = fmtDate(row.created_at);
  document.getElementById('invPayment').textContent = PAYMENT_LABELS[row.payment_method] || row.payment_method || '—';
  document.getElementById('statusBadge').textContent = STATUS_LABELS[row.status] || row.status || '';
  document.getElementById('statusBadge').className = 'text-[11px] font-bold px-3 py-1 rounded-full ' + (STATUS_COLORS[row.status] || 'bg-gray-100 text-gray-600');

  if (row.customer_name) {
    document.getElementById('custRow').classList.remove('hidden');
    document.getElementById('custName').textContent = row.customer_name;
  }

  const items = row.items || [];
  document.getElementById('itemsBody').innerHTML = items.map(item => `
    <tr>
      <td class="py-2">${escapeHtml(item.description) || '—'}</td>
      <td class="py-2 text-center">${item.quantity || 1}</td>
      <td class="py-2 text-center">${item.karat}K</td>
      <td class="py-2 text-center">${item.weight_grams}</td>
      <td class="py-2 text-left font-semibold">${fmt(item.line_total)}</td>
    </tr>`).join('');

  // Document-type label per FTA Article 59/60: "Tax Invoice"/"Tax Credit
  // Note" only when the store is VAT-registered (has a TRN); plain
  // "Invoice"/"Credit Note" otherwise. A purchase record (buyTrader/
  // buyRetail) is this store's own internal voucher, not a tax invoice it
  // issued — the store is the buyer, not the supplier, in that transaction.
  const isReturn = row.invoice_type === 'return';
  const isPurchase = row.invoice_type === 'buyTrader' || row.invoice_type === 'buyRetail';
  if (isPurchase) {
    document.getElementById('doc-type-ar').textContent = 'سند شراء (مستند داخلي)';
    document.getElementById('doc-type-en').textContent = 'Purchase Voucher (Internal)';
    const noteEl = document.getElementById('doc-note');
    noteEl.textContent = row.invoice_type === 'buyRetail'
      ? 'شراء من فرد — لا تُطبَّق ضريبة القيمة المضافة.'
      : 'شراء من تاجر — الفاتورة الضريبية الرسمية يصدرها التاجر البائع.';
    noteEl.classList.remove('hidden');
  } else if (isReturn) {
    document.getElementById('doc-type-ar').textContent = row.tax_number ? 'إشعار دائن ضريبي' : 'إشعار دائن';
    document.getElementById('doc-type-en').textContent = row.tax_number ? 'Tax Credit Note' : 'Credit Note';
  } else if (row.tax_number) {
    document.getElementById('doc-type-ar').textContent = 'فاتورة ضريبية';
    document.getElementById('doc-type-en').textContent = 'Tax Invoice';
  } else {
    document.getElementById('doc-type-ar').textContent = 'فاتورة';
    document.getElementById('doc-type-en').textContent = 'Invoice';
  }

  let beforeTax, tax, total;
  if (isPurchase) {
    // A purchase voucher never applies the store's flat sale VAT rate to
    // the gold value (buyRetail sellers can't charge VAT at all; buyTrader
    // gold falls under the reverse-charge mechanism handled separately by
    // the store's accountant). The authoritative figure is whatever
    // create-invoice-v2-ar.html computed and stored at save time — 0 for
    // buyRetail, VAT-on-fabrication-fee-only for buyTrader.
    total = Number(row.total_amount || 0);
    tax = Number(row.vat_amount || 0);
    beforeTax = total - tax;
  } else {
    // vat_amount stored on sale/return rows wasn't reliable historically
    // (recorded as 0 at sale time on older invoices), so derive it from
    // vat_rate the same way invoice-print-ar.html does: total_amount is
    // tax-inclusive.
    const vatRate = Number(row.vat_rate || 0);
    const vatMultiplier = 1 + (vatRate / 100);
    total = Number(row.total_amount || 0);
    beforeTax = total / vatMultiplier;
    tax = total - beforeTax;
  }

  document.getElementById('sumBeforeTax').textContent = fmtDual(beforeTax, row);
  document.getElementById('sumVat').textContent = fmtDual(tax, row);
  document.getElementById('sumTotal').textContent = fmtDual(total, row);

  document.getElementById('policyLink').href = 'invoice-receipt-policy-ar.html?store=' + encodeURIComponent(row.store_name || '');

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('receipt').classList.remove('hidden');
}

function showNotFound() {
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('not-found').classList.remove('hidden');
}

load();

// ---- Download an official PDF copy for the customer (client-side html2pdf.js) ----
async function downloadReceiptPdf() {
  const receipt = document.getElementById('receipt');
  if (!receipt || receipt.classList.contains('hidden')) return;

  const btn = document.getElementById('download-pdf-btn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span>...جارِ التجهيز</span>';

  const clone = receipt.cloneNode(true);
  clone.classList.remove('hidden');
  clone.style.minHeight = '0';
  clone.style.width = '780px';
  clone.style.maxWidth = '780px';
  // Drop the download button itself from the exported clone
  const cloneBtn = clone.querySelector('#download-pdf-btn');
  if (cloneBtn) cloneBtn.remove();

  const wrapper = document.createElement('div');
  wrapper.style.position = 'fixed';
  wrapper.style.top = '0';
  wrapper.style.left = '-99999px';
  wrapper.style.background = '#ffffff';
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);
  if (document.fonts && document.fonts.ready) { await document.fonts.ready; }
  await new Promise(r => setTimeout(r, 50));

  const invNumber = (document.getElementById('invNumber')?.textContent || 'فاتورة').trim();

  try {
    await html2pdf().set({
      margin: 10,
      filename: `${invNumber}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff', letterRendering: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(wrapper).save();
  } catch (err) {
    console.error('PDF generation failed', err);
    alert('تعذّر توليد ملف PDF، حاول مرة أخرى');
  } finally {
    document.body.removeChild(wrapper);
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}
</script>
</body></html>
