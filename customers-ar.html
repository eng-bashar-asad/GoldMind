<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>

<title>الزبائن | GoldMind</title>
<script src="https://cdn.tailwindcss.com/3.4.17?plugins=forms@0.5.10,container-queries@0.1.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="supabase-config.js?v=54"></script>
<script src="theme.js?v=80"></script>
<script src="gm-report.js?v=5"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d", "success": "#1e7d32", "success-container": "#d7f3dc"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
    .cat-chip { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--gm-outline-variant); font-size: 13px; font-weight: 600; white-space: nowrap; }
    @media (max-width:1023px) { #add-btn { display: none !important; } }
    .cu-side { display: none; }
    @media (min-width:1024px) {
      #page-content:not(.hidden) { display: grid !important; grid-template-columns: minmax(0,1fr) minmax(300px,360px); gap: 12px 18px; align-items: start; }
      #page-content > * { grid-column: 1; }
      #page-content > #cuSide { grid-column: 2; grid-row: 1 / span 20; position: sticky; top: 84px; display: flex; flex-direction: column; gap: 12px; }
      #page-content > #cuSide.hidden { display: none; }
      #sums { max-width: none; }
      #list { background: var(--gm-surface-lowest,#fff); border: 1px solid var(--gm-outline-variant); border-radius: 14px; overflow: hidden; }
    }
    .cu-t { width: 100%; border-collapse: collapse; }
    .cu-t th { padding: 9px 12px; text-align: right; font-size: 12px; font-weight: 700; color: var(--gm-on-surface-variant); background: #F7F2E6; border-bottom: 1px solid #E4DAC0; white-space: nowrap; }
    .cu-t td { padding: 8px 12px; font-size: 13.5px; border-bottom: 1px solid #EFE7D2; white-space: nowrap; }
    .cu-t tr[data-id] { cursor: pointer; }
    .cu-t tr[data-id]:hover td { background: #FBF8F1; }
    .cu-t tr.on td { background: #FBF8F1; }
    .cu-t tr.on td:first-child { box-shadow: inset -4px 0 0 #1C1A16; }
    .cu-tag { font-size: 10.5px; background: #EFE7D2; border-radius: 999px; padding: 2px 7px; }
    .cu-age { border-radius: 999px; padding: 2px 8px; font-size: 11.5px; font-weight: 700; background: #FDF0DC; color: #8A4B08; }
    .cu-age.old { background: #FBE4E1; color: #8A1D17; }
    .cu-card { background: var(--gm-surface-lowest,#fff); border: 1px solid var(--gm-outline-variant); border-radius: 14px; padding: 14px 16px; }
    .cu-card h2 { margin: 0 0 4px; font-size: 14px; font-weight: 700; }
    .cu-tile { background: #F7F2E6; border-radius: 12px; padding: 8px 12px; }
    .cu-tile span { display: block; font-size: 11px; color: #6B6355; }
    .cu-tile b { display: block; font-size: 19px; }
    .cu-tile.owe { background: #E8F3EA; } .cu-tile.owe span, .cu-tile.owe b { color: #1B5E20; }
    .cu-tile.due { background: #FBE9E7; } .cu-tile.due span, .cu-tile.due b { color: #8A2A1E; }
    .cu-act { height: 40px; border-radius: 10px; border: 1px solid #CBBF9E; background: #fff; font-size: 13px; font-weight: 700; color: #211D17; display: flex; align-items: center; justify-content: center; }
    .cu-act.dark { background: #1C1A16; color: #FBF8F1; border-color: #1C1A16; }
    .cu-kv { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid #EFE7D2; }
    .cu-sum { background: var(--gm-surface-lowest,#fff); border: 1px solid var(--gm-outline-variant); border-radius: 14px; padding: 10px 12px; }
    .cu-sum span { display: block; font-size: 11.5px; color: var(--gm-on-surface-variant); }
    .cu-sum b { display: block; font-size: 19px; }
    .cu-av { width: 40px; height: 40px; border-radius: 50%; background: #7A6640; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
    .cat-chip.on { background: var(--gm-primary); color: var(--gm-on-primary); border-color: var(--gm-primary); }
</style>
</head>
<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="gmSmartBack('index-ar.html')" aria-label="رجوع" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 700; font-size: 28px;">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">الزبائن</h1>
</div>
<a href="customer-debt-table-ar.html" class="h-10 px-3 rounded-lg border border-outline-variant text-[13px] font-semibold flex items-center gap-1"><span class="material-symbols-outlined">table_chart</span>جدول الديون</a>
<a href="customer-add-ar.html" id="add-btn" class="hidden h-10 px-3 rounded-lg bg-primary text-on-primary text-[13px] font-semibold flex items-center gap-1"><span class="material-symbols-outlined">person_add</span>زبون جديد</a>
</div>
</header>
<main class="pb-32 max-w-md lg:max-w-7xl mx-auto px-4 lg:px-8 py-4 flex flex-col gap-3">
<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>
<div id="no-access" class="hidden py-16 text-center text-error text-sm">ليس لديك صلاحية عرض الزبائن.</div>
<div id="page-content" class="hidden flex flex-col gap-3">
<!-- totals for the shown kind (design "MCustomers") -->
<div class="grid grid-cols-2 gap-2 lg:max-w-xl" id="sums">
<div class="cu-sum"><span>لنا على الزبائن</span><b class="font-data-mono text-success" id="sumOwed">0.00</b></div>
<div class="cu-sum"><span>علينا للزبائن</span><b class="font-data-mono text-error" id="sumCredit">0.00</b></div>
</div>
<div class="relative lg:max-w-xl">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input id="q" oninput="render()" placeholder="ابحث بالاسم أو رقم الهاتف" class="w-full h-12 border border-outline-variant rounded-lg pr-10 pl-3 text-[14px] bg-surface-container-lowest"/>
</div>
<!-- individuals and companies are never listed together -->
<div class="grid grid-cols-2 gap-1 p-1 bg-surface-container-low border border-outline-variant rounded-xl text-[14px]" id="kinds">
<button type="button" data-k="person" class="kind h-10 rounded-lg font-bold">زبائن أفراد</button>
<button type="button" data-k="company" class="kind h-10 rounded-lg font-bold">زبائن شركات</button>
</div>
<div class="flex flex-wrap gap-2 text-[13px]" id="bals">
<button type="button" data-b="all" class="bal h-9 px-4 rounded-full border border-outline-variant font-semibold">الكل</button>
<button type="button" data-b="debt" class="bal h-9 px-4 rounded-full border border-outline-variant font-semibold">عليهم دين</button>
<button type="button" data-b="credit" class="bal h-9 px-4 rounded-full border border-outline-variant font-semibold">لهم رصيد</button>
<button type="button" data-b="open" class="bal h-9 px-4 rounded-full border border-outline-variant font-semibold">لهم أو عليهم</button>
<button type="button" data-b="old" class="bal h-9 px-4 rounded-full border border-outline-variant font-semibold">دين أقدم من 15 يوماً</button>
</div>
<div class="text-[12px] text-on-surface-variant" id="count"></div>
<div id="list" class="flex flex-col gap-2"></div>
<!-- computer: the picked customer beside the list (design "قائمة الزبائن") -->
<aside id="cuSide" class="cu-side hidden" aria-live="polite"></aside>
</div>
</main>
<nav class="gm-bottom-tabs"></nav>
<a class="gm-fab hidden" id="add-fab" href="customer-add-ar.html" aria-label="زبون جديد" title="زبون جديد"><span class="material-symbols-outlined">person_add</span></a>
<script>
let SINCE = {}; // customer -> date of the oldest unpaid debt (first in, first paid)
let CUSTOMERS = [], BAL = {}, KIND = new URLSearchParams(location.search).get('kind') === 'company' ? 'company' : 'person', BALF = 'all', CAN_EDIT = false, CUR = '';
const esc = v => gmEscapeHtml(v == null ? '' : String(v));
const fmt = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const digits = v => String(v || '').replace(/[^0-9]/g, '');

document.querySelectorAll('.kind').forEach(b => b.addEventListener('click', () => { KIND = b.dataset.k; history.replaceState(null, '', '?kind=' + KIND); render(); }));
document.querySelectorAll('.bal').forEach(b => b.addEventListener('click', () => { BALF = b.dataset.b; render(); }));

// tab = individuals or companies; chip = balance filter inside that tab
// (balance > 0 = owes the shop, < 0 = the shop owes them)
const KIND_OK = { person: c => !c.is_company, company: c => !!c.is_company };
const BAL_OK = { all: () => true, debt: b => b > 0.005, credit: b => b < -0.005, open: b => Math.abs(b) > 0.005,
  old: (b, c) => b > 0.005 && SINCE[c.id] && (Date.now() - new Date(SINCE[c.id])) / 86400000 >= 15 };
let GOLD = {}, LAST = {}, MOVES = {}, PICK = null;
const isDesk = () => window.matchMedia('(min-width:1024px)').matches;
window.matchMedia('(min-width:1024px)').addEventListener('change', () => { if (CUSTOMERS.length) render(); });

function render() {
  document.querySelectorAll('.kind, .bal').forEach(b => {
    const on = b.dataset.k ? b.dataset.k === KIND : b.dataset.b === BALF;
    b.style.background = on ? 'var(--gm-primary)' : '';
    b.style.color = on ? 'var(--gm-on-primary)' : '';
  });
  const q = document.getElementById('q').value.trim().toLowerCase(), qd = digits(q);
  const list = CUSTOMERS.filter(c =>
    KIND_OK[KIND](c) && BAL_OK[BALF](BAL[c.id] || 0, c) &&
    (!q || (c.name || '').toLowerCase().includes(q) || (qd.length >= 3 && digits(c.phone).includes(qd))));
  document.getElementById('count').textContent = gmCountLabel(list.length, KIND === 'company' ? ['شركة', 'شركتان', 'شركات'] : ['زبون', 'زبونان', 'زبائن']);
  // totals for this kind (individuals or companies), whatever the chip
  let owed = 0, credit = 0;
  CUSTOMERS.filter(KIND_OK[KIND]).forEach(c => { const b = BAL[c.id] || 0; if (b > 0.005) owed += b; else if (b < -0.005) credit -= b; });
  document.getElementById('sumOwed').textContent = fmt(owed) + ' ' + CUR;
  document.getElementById('sumCredit').textContent = fmt(credit) + ' ' + CUR;
  if (isDesk()) { renderTable(list); return; }
  document.getElementById('cuSide').classList.add('hidden');
  document.getElementById('list').innerHTML = list.slice(0, 300).map(c => {
    const b = BAL[c.id] || 0;
    const age = b > 0.005 && SINCE[c.id] ? Math.floor((Date.now() - new Date(SINCE[c.id])) / 86400000) : null;
    return `<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 flex items-center gap-3">
      <a href="customer-debts-ar.html?open=${c.id}" class="flex-1 min-w-0 flex items-center gap-3">
        <span class="cu-av" aria-hidden="true">${esc(gmInitials(c.name))}</span>
        <span class="min-w-0 flex-1">
        <span class="block font-bold text-[14px] truncate">${esc(c.name)}</span>
        <span class="block text-[12px] text-on-surface-variant font-data-mono" dir="ltr" style="text-align:right">${esc(c.phone || '')}</span>
        ${Math.abs(b) > 0.005 ? `<span class="block text-[12px] font-semibold ${b > 0 ? 'text-success' : 'text-error'}">${b > 0 ? 'لنا عنده' : 'علينا له'} ${fmt(Math.abs(b))} ${CUR}${age != null ? ` <span class="font-normal text-on-surface-variant">· منذ ${age} يوماً</span>` : ''}</span>` : ''}
        </span>
      </a>
      <a href="customer-debts-print-ar.html?id=${c.id}" aria-label="كشف حساب ${esc(c.name)}" class="w-10 h-10 rounded-lg border border-outline-variant flex items-center justify-center"><span class="material-symbols-outlined">receipt_long</span></a>
      ${CAN_EDIT ? `<a href="customer-edit-ar.html?id=${c.id}" class="h-10 px-3 rounded-lg border border-primary text-primary text-[13px] font-semibold flex items-center gap-1"><span class="material-symbols-outlined">edit</span>تعديل</a>` : ''}
    </div>`;
  }).join('') || '<p class="text-center text-on-surface-variant text-sm py-8">لا يوجد زبائن مطابقون.</p>';
}

// oldest unpaid debt per customer: payments settle the oldest debts first
function gmDebtSince(rows) {
  const q = {};
  rows.forEach(m => {
    const a = Number(m.cash_amount || 0), list = q[m.customer_id] || (q[m.customer_id] = []);
    if (m.movement_type === 'debt_increase') { if (a > 0) list.push([a, m.created_at]); return; }
    let left = a;
    while (left > 0.005 && list.length) { const take = Math.min(left, list[0][0]); list[0][0] -= take; left -= take; if (list[0][0] <= 0.005) list.shift(); }
  });
  const out = {};
  Object.keys(q).forEach(id => { if (q[id].length) out[id] = q[id][0][1]; });
  return out;
}
console.assert(JSON.stringify(gmDebtSince([{ customer_id: 'x', movement_type: 'debt_increase', cash_amount: 100, created_at: 'd1' },
  { customer_id: 'x', movement_type: 'debt_increase', cash_amount: 50, created_at: 'd2' }, { customer_id: 'x', movement_type: 'debt_decrease', cash_amount: 120, created_at: 'd3' }])) === '{"x":"d2"}', 'gmDebtSince FIFO');

// computer: one table, largest debt first; a click shows the customer beside it, a double click opens the account
function ageOf(c) { return (BAL[c.id] || 0) > 0.005 && SINCE[c.id] ? Math.floor((Date.now() - new Date(SINCE[c.id])) / 86400000) : null; }
const dm = at => at ? new Date(at).toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit' }) : '—';
function balCell(b) {
  return Math.abs(b) > 0.005
    ? `<b class="font-data-mono ${b > 0 ? 'text-success' : 'text-error'}">${fmt(Math.abs(b))}</b> <span class="text-[11px] ${b > 0 ? 'text-success' : 'text-error'}">${b > 0 ? 'لنا' : 'علينا'}</span>`
    : '<span class="font-data-mono text-on-surface-variant">0.00</span> <span class="text-[11px] text-on-surface-variant">مسدَّد</span>';
}
function renderTable(list) {
  const rows = list.slice().sort((a, b) => (BAL[b.id] || 0) - (BAL[a.id] || 0)).slice(0, 500);
  if (!rows.length) { document.getElementById('list').innerHTML = '<p class="text-center text-on-surface-variant text-sm py-8">لا يوجد زبائن مطابقون.</p>'; document.getElementById('cuSide').classList.add('hidden'); return; }
  if (!PICK || !rows.some(c => c.id === PICK)) PICK = rows[0].id;
  document.getElementById('list').innerHTML = `<table class="cu-t"><thead><tr><th>الزبون</th><th>الهاتف</th><th>آخر حركة</th><th>عمر الدين</th><th>ذهب</th><th style="text-align:left">الرصيد</th></tr></thead><tbody>` +
    rows.map(c => {
      const a = ageOf(c), g = GOLD[c.id] || 0;
      return `<tr data-id="${c.id}" class="${c.id === PICK ? 'on' : ''}" tabindex="0">
        <td><span class="flex items-center gap-2.5"><span class="cu-av" style="width:34px;height:34px;font-size:13px">${esc(gmInitials(c.name))}</span><b>${esc(c.name)}</b>${c.is_company ? ' <span class="cu-tag">شركة</span>' : ''}</span></td>
        <td class="font-data-mono" dir="ltr" style="text-align:right">${esc(c.phone || '')}</td>
        <td class="font-data-mono">${dm(LAST[c.id])}</td>
        <td>${a != null ? `<span class="cu-age${a >= 30 ? ' old' : ''}">${a} يوماً</span>` : '—'}</td>
        <td class="font-data-mono">${Math.abs(g) > 0.0005 ? fmt(Math.abs(g)) + ' غ' : '—'}</td>
        <td style="text-align:left">${balCell(BAL[c.id] || 0)}</td></tr>`;
    }).join('') + '</tbody></table><p class="text-[12px] text-on-surface-variant px-3 py-2">الضغط على السطر يعرض الزبون بالجنب؛ الضغط مرتين يفتح حسابه الكامل.</p>';
  renderSide();
}
function renderSide() {
  const c = CUSTOMERS.find(x => x.id === PICK), el = document.getElementById('cuSide');
  if (!c) { el.classList.add('hidden'); return; }
  const b = BAL[c.id] || 0, g = GOLD[c.id] || 0;
  const wa = c.phone ? gmWhatsAppUrl(c.phone, null, 'مرحباً ' + c.name + '، رصيد حسابكم لدينا: ' + fmt(Math.abs(b)) + ' ' + CUR) : '';
  const LBL = { payment: 'دفعة', discount: 'خصم على الدين', cash_out: 'صرف مبلغ', deposit: 'عربون', deposit_refund: 'استرجاع عربون', opening_balance: 'رصيد سابق' };
  const moves = (MOVES[c.id] || []).slice(-3).reverse();
  el.innerHTML = `<section class="cu-card">
      <div class="flex items-center gap-3"><span class="cu-av" style="width:48px;height:48px;font-size:19px">${esc(gmInitials(c.name))}</span>
      <div class="min-w-0"><div class="font-bold text-[17px] truncate">${esc(c.name)}</div><div class="font-data-mono text-[12.5px] text-on-surface-variant" dir="ltr" style="text-align:right">${esc(c.phone || '')}</div></div></div>
      <div class="grid grid-cols-2 gap-2 mt-3">
        <div class="cu-tile ${b > 0.005 ? 'owe' : b < -0.005 ? 'due' : ''}"><span>نقدي${b > 0.005 ? ' — لنا عنده' : b < -0.005 ? ' — علينا له' : ''}</span><b class="font-data-mono">${fmt(Math.abs(b))}</b></div>
        <div class="cu-tile"><span>ذهب (عيار 24)</span><b class="font-data-mono">${fmt(Math.abs(g))} غ</b></div>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3">
        <a class="cu-act dark" href="customer-debts-ar.html?open=${c.id}&pay=1">+ دفعة</a>
        <a class="cu-act" href="new-sale-ar.html?customer=${c.id}">فاتورة بيع</a>
        <a class="cu-act" href="customer-debts-print-ar.html?id=${c.id}">كشف حساب</a>
        ${wa ? `<a class="cu-act" href="${esc(wa)}" target="_blank" rel="noopener">واتساب</a>` : '<span class="cu-act" aria-disabled="true" style="opacity:.45">واتساب</span>'}
      </div>
      <a href="customer-debts-ar.html?open=${c.id}" class="block text-center mt-3 text-[13px] font-bold min-h-[24px] gm-hit" style="color:#7A6640">فتح الحساب الكامل ←</a>
    </section>
    <section class="cu-card"><h2>آخر الحركات</h2>${moves.length ? moves.map(m => `<div class="cu-kv"><span><span class="font-data-mono text-on-surface-variant">${dm(m.created_at)}</span> ${esc(m.source && LBL[m.source] ? LBL[m.source] : m.movement_type === 'debt_increase' ? 'بيع / دين' : 'دفعة')}</span><span class="font-data-mono ${m.movement_type === 'debt_increase' ? '' : 'text-success'}">${m.movement_type === 'debt_increase' ? '+' : '−'}${fmt(m.cash_amount)}</span></div>`).join('') : '<p class="text-[12.5px] text-on-surface-variant py-1">لا توجد حركات على الحساب.</p>'}</section>
    <section class="cu-card"><h2>البيانات</h2>
      ${c.id_number ? `<div class="cu-kv"><span class="text-on-surface-variant">الهوية</span><span class="font-data-mono">${esc(c.id_number)}${c.id_expiry_date ? ' · تنتهي ' + esc(c.id_expiry_date) : ''}</span></div>` : ''}
      ${c.nationality ? `<div class="cu-kv"><span class="text-on-surface-variant">الجنسية</span><span>${esc(c.nationality)}</span></div>` : ''}
      ${c.tax_number ? `<div class="cu-kv"><span class="text-on-surface-variant">الرقم الضريبي</span><span class="font-data-mono" dir="ltr">${esc(c.tax_number)}</span></div>` : ''}
      <div class="cu-kv" style="border:0"><span class="text-on-surface-variant">زبون منذ</span><span class="font-data-mono">${c.created_at ? new Date(c.created_at).getFullYear() : '—'}</span></div>
      ${CAN_EDIT ? `<a href="customer-edit-ar.html?id=${c.id}" class="text-[12.5px] font-bold" style="color:#7A6640">تعديل البيانات</a>` : ''}
    </section>`;
  el.classList.remove('hidden');
}
document.getElementById('list').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  PICK = tr.dataset.id;
  document.querySelectorAll('.cu-t tr[data-id]').forEach(r => r.classList.toggle('on', r.dataset.id === PICK));
  renderSide();
});
document.getElementById('list').addEventListener('dblclick', e => { const tr = e.target.closest('tr[data-id]'); if (tr) location.href = 'customer-debts-ar.html?open=' + tr.dataset.id; });
document.getElementById('list').addEventListener('keydown', e => { const tr = e.target.closest('tr[data-id]'); if (tr && e.key === 'Enter') location.href = 'customer-debts-ar.html?open=' + tr.dataset.id; });

(async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;
  const __orgIds = await gmOrgStoreIds(); // customers and their balances are shared by the organization's branches
  const [{ data: me }, { data: store }, cust, debts] = await Promise.all([
    goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle(),
    goldmindClient.from('stores').select('currency').eq('id', GOLDMIND_STORE_ID).maybeSingle(),
    gmFetchAllRows(() => goldmindClient.from('customers').select('id, name, phone, is_company, id_number, id_expiry_date, nationality, tax_number, created_at').in('store_id', __orgIds).order('name')),
    gmFetchAllRows(() => goldmindClient.from('customer_debts').select('customer_id, movement_type, cash_amount, gold_grams_24k, source, created_at').or('source.is.null,source.neq.allocation').in('store_id', __orgIds).order('created_at'))
  ]);
  document.getElementById('loading-state').classList.add('hidden');
  const perms = (me && me.permissions) || {}, owner = me && me.role === 'owner';
  if (!(owner || perms.view_customers === true)) { document.getElementById('no-access').classList.remove('hidden'); return; }
  CAN_EDIT = owner || perms.edit_customers === true;
  if (owner || perms.add_customers === true) { document.getElementById('add-btn').classList.remove('hidden'); document.getElementById('add-fab').classList.remove('hidden'); }
  const code = ((store && store.currency) || 'AED').toUpperCase();
  CUR = ({ AED: 'AED', USD: 'USD', SAR: 'SAR', SYP: 'SYP' })[code] || code;
  CUSTOMERS = cust.data || [];
  SINCE = gmDebtSince(debts.data || []);
  (debts.data || []).forEach(m => {
    GOLD[m.customer_id] = (GOLD[m.customer_id] || 0) + (m.movement_type === 'debt_increase' ? 1 : -1) * Number(m.gold_grams_24k || 0);
    if (!LAST[m.customer_id] || m.created_at > LAST[m.customer_id]) LAST[m.customer_id] = m.created_at;
    (MOVES[m.customer_id] || (MOVES[m.customer_id] = [])).push(m);
  });
  (debts.data || []).forEach(m => { BAL[m.customer_id] = (BAL[m.customer_id] || 0) + (m.movement_type === 'debt_increase' ? 1 : -1) * Number(m.cash_amount || 0); });
  document.getElementById('page-content').classList.remove('hidden');
  render();
})();
</script>
