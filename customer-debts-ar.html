<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ديون العملاء | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d", "success": "#1e7d32", "success-container": "#d7f3dc"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="goBack()" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold" id="page-title">ديون العملاء</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>

<!-- Customers list -->
<div id="customers-list-view" class="hidden py-6">
<div class="relative mb-4">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input id="customerFilterInput" oninput="renderCustomers()" placeholder="ابحث باسم العميل..." class="w-full h-11 border border-outline-variant rounded-lg pr-10 pl-3 text-[13px] bg-surface-container-lowest"/>
</div>
<div id="customers-list" class="flex flex-col gap-3"></div>
</div>

<!-- Customer detail -->
<div id="customer-detail-view" class="hidden py-6 flex flex-col gap-4">
<button onclick="showCustomersList()" class="text-[12px] text-secondary font-semibold self-start">→ كل العملاء</button>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
<h2 class="font-bold text-[16px]" id="detail-customer-name"></h2>
<p class="text-[12px] text-on-surface-variant font-data-mono" dir="ltr" id="detail-customer-phone"></p>
<div class="mt-3 pt-3 border-t border-outline-variant flex justify-between items-center">
<span class="text-[13px] text-on-surface-variant">رصيد الدين (نقدي)</span>
<span class="font-bold text-[18px] font-data-mono" id="detail-balance">0.00</span>
</div>
<p class="text-[10px] text-outline mt-1">قيمة موجبة = دين على العميل لصالح المحل لم يُسدَّد بعد</p>
</div>

<button onclick="toggleSettleForm()" class="w-full h-12 border-2 border-dashed border-outline-variant text-on-surface-variant rounded-xl flex items-center justify-center gap-2">
<span class="material-symbols-outlined">payments</span> تسجيل دفعة من العميل
</button>
<a id="printStatementLink" href="#" target="_blank" class="w-full h-11 border border-outline-variant text-on-surface-variant rounded-xl flex items-center justify-center gap-2 text-[13px]">
<span class="material-symbols-outlined text-[18px]">print</span> طباعة كشف حساب
</a>

<div class="hidden bg-surface-container-lowest border border-outline-variant rounded-xl p-4" id="settle-form">
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">المبلغ المدفوع</label>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 font-data-mono mb-3" id="settle-amount" step="0.01" type="number"/>
<textarea class="w-full h-16 border border-outline-variant rounded-lg px-3 py-2 text-[13px] mb-3" id="settle-notes" placeholder="ملاحظة (اختياري)"></textarea>
<button onclick="submitSettlement()" id="settle-btn" class="w-full h-11 bg-primary text-on-primary rounded-lg text-sm font-semibold">حفظ الدفعة</button>
<p class="text-error text-[12px] hidden mt-2" id="settle-error"></p>
</div>

<h3 class="font-semibold text-[13px] mt-2">سجل الحركات</h3>
<div id="movements-list" class="flex flex-col gap-2"></div>
<p id="empty-movements" class="hidden text-center text-on-surface-variant text-sm py-8">لا توجد حركات مسجّلة بعد.</p>

</div>
</main>

<script>
let customers = [];
let movementsByCustomer = {};
let currentCustomerId = null;

function fmt(n) {
  return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

const MOVEMENT_LABELS = { debt_increase: 'فاتورة بيع بالدين', debt_decrease: 'دفعة من العميل' };

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  // Enforce permission (real page-level gate, not just the dashboard icon)
  const { data: __staffPerm } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
  const __allowed = __staffPerm && (__staffPerm.role === 'owner' || (__staffPerm.permissions && __staffPerm.permissions['view_customers'] === true));
  if (!__allowed) { window.__permCheckInserted = true; alert('ليس لديك صلاحية الدخول لهذه الشاشة.'); window.location.href = 'index-ar.html'; return; }

  const [{ data: customerRows, error: cErr }, { data: moveRows, error: mErr }] = await Promise.all([
    goldmindClient.from('customers').select('*').eq('store_id', GOLDMIND_STORE_ID).order('name'),
    goldmindClient.from('customer_debts').select('*, invoice:invoice_id(invoice_number)').eq('store_id', GOLDMIND_STORE_ID).order('created_at', { ascending: false })
  ]);

  document.getElementById('loading-state').classList.add('hidden');

  if (cErr) {
    document.getElementById('customers-list').innerHTML = `<p class="text-error text-sm text-center py-8">تعذّر التحميل: ${cErr.message}</p>`;
    document.getElementById('customers-list-view').classList.remove('hidden');
    return;
  }

  customers = customerRows || [];
  movementsByCustomer = {};
  (moveRows || []).forEach(m => {
    if (!movementsByCustomer[m.customer_id]) movementsByCustomer[m.customer_id] = [];
    movementsByCustomer[m.customer_id].push(m);
  });

  showCustomersList();
}

function customerBalance(customerId) {
  const moves = movementsByCustomer[customerId] || [];
  return moves.reduce((sum, m) => sum + (m.movement_type === 'debt_increase' ? Number(m.cash_amount || 0) : -Number(m.cash_amount || 0)), 0);
}

function showCustomersList() {
  currentCustomerId = null;
  document.getElementById('page-title').textContent = 'ديون العملاء';
  document.getElementById('customer-detail-view').classList.add('hidden');
  document.getElementById('customers-list-view').classList.remove('hidden');
  renderCustomers();
}

function renderCustomers() {
  const q = (document.getElementById('customerFilterInput').value || '').trim().toLowerCase();
  const list = (q ? customers.filter(c => c.name.toLowerCase().includes(q)) : customers)
    .slice()
    .sort((a, b) => customerBalance(b.id) - customerBalance(a.id));

  document.getElementById('customers-list').innerHTML = list.map(c => {
    const bal = customerBalance(c.id);
    return `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 cursor-pointer" onclick="showCustomerDetail('${c.id}')">
        <div class="flex items-center justify-between">
          <div>
            <p class="font-bold text-[14px]">${c.name}</p>
            <p class="text-[11px] text-on-surface-variant font-data-mono" dir="ltr">${c.phone || ''}</p>
          </div>
          <span class="font-bold text-[14px] font-data-mono ${bal > 0 ? 'text-error' : 'text-success'}">${fmt(Math.abs(bal))}</span>
        </div>
      </div>`;
  }).join('') || '<p class="text-center text-on-surface-variant text-sm py-8">لا يوجد عملاء مطابقون.</p>';
}

function showCustomerDetail(customerId) {
  currentCustomerId = customerId;
  const customer = customers.find(c => c.id === customerId);
  if (!customer) return;

  document.getElementById('page-title').textContent = customer.name;
  document.getElementById('customers-list-view').classList.add('hidden');
  document.getElementById('customer-detail-view').classList.remove('hidden');
  document.getElementById('settle-form').classList.add('hidden');
  document.getElementById('printStatementLink').href = 'customer-debts-print-ar.html?id=' + customerId;

  document.getElementById('detail-customer-name').textContent = customer.name;
  document.getElementById('detail-customer-phone').textContent = customer.phone || '';

  const bal = customerBalance(customerId);
  const balEl = document.getElementById('detail-balance');
  balEl.textContent = fmt(Math.abs(bal));
  balEl.className = 'font-bold text-[18px] font-data-mono ' + (bal > 0 ? 'text-error' : 'text-success');

  const moves = movementsByCustomer[customerId] || [];
  const listEl = document.getElementById('movements-list');
  const emptyEl = document.getElementById('empty-movements');

  if (moves.length === 0) {
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');

  listEl.innerHTML = moves.map(m => {
    const isIncrease = m.movement_type === 'debt_increase';
    const date = new Date(m.created_at).toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short', year: 'numeric' });
    return `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[13px] font-semibold ${isIncrease ? 'text-error' : 'text-success'}">${MOVEMENT_LABELS[m.movement_type] || m.movement_type}</span>
          <span class="text-[11px] text-on-surface-variant">${date}</span>
        </div>
        <p class="text-[13px] font-data-mono font-bold ${isIncrease ? 'text-error' : 'text-success'}">${isIncrease ? '+' : '-'}${fmt(m.cash_amount)}</p>
        ${m.notes ? `<p class="text-[12px] text-on-surface-variant mt-1">${m.notes}</p>` : ''}
        ${m.invoice && m.invoice.invoice_number ? `<p class="text-[11px] text-outline mt-1">فاتورة: ${m.invoice.invoice_number}</p>` : ''}
      </div>`;
  }).join('');
}

function toggleSettleForm() {
  document.getElementById('settle-form').classList.toggle('hidden');
}

async function submitSettlement() {
  const amount = parseFloat(document.getElementById('settle-amount').value);
  const notes = document.getElementById('settle-notes').value.trim();
  const errEl = document.getElementById('settle-error');
  errEl.classList.add('hidden');

  if (!amount || amount <= 0) {
    errEl.textContent = 'فضلاً أدخل مبلغاً صحيحاً';
    errEl.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('settle-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  const { error } = await goldmindClient.from('customer_debts').insert({
    store_id: GOLDMIND_STORE_ID,
    customer_id: currentCustomerId,
    movement_type: 'debt_decrease',
    cash_amount: amount,
    gold_grams_24k: 0,
    notes: notes || 'دفعة يدوية',
    created_by: GOLDMIND_STAFF_ID
  });

  if (!error) {
    // Payment collected -> also reflect in the daily cash box
    await goldmindClient.from('cash_movements').insert({
      store_id: GOLDMIND_STORE_ID,
      box: 'main',
      direction: 'in',
      amount: amount,
      description: 'تحصيل دين عميل',
      created_by: GOLDMIND_STAFF_ID
    });
  }

  btn.disabled = false;
  btn.textContent = 'حفظ الدفعة';

  if (error) {
    errEl.textContent = 'تعذّر الحفظ: ' + error.message;
    errEl.classList.remove('hidden');
    return;
  }

  document.getElementById('settle-amount').value = '';
  document.getElementById('settle-notes').value = '';
  document.getElementById('settle-form').classList.add('hidden');
  const customerIdToReopen = currentCustomerId;
  await load();
  showCustomerDetail(customerIdToReopen);
}

function goBack() {
  if (currentCustomerId) { showCustomersList(); return; }
  window.location.href = 'index-ar.html';
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
