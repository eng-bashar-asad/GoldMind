<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoldMind | جارِ تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
        html { font-size: 87.5%; }

        :root { --royal-gold: #FFD700; --deep-navy: #0f172a; }
        body {
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
            background-color: var(--deep-navy);
            color: #fff;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300;
            font-size: 18px;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,215,0,0.2);
            border-top-color: var(--royal-gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .gold-gradient { background: linear-gradient(135deg, #FFD700 0%, #B4955A 100%); }
    </style>
</head>
<body>
<main class="glass-panel w-full max-w-[420px] p-8 rounded-xl shadow-2xl text-center">
<div class="flex justify-center mb-6" id="spinnerWrap">
<div class="spinner"></div>
</div>
<span class="material-symbols-outlined text-primary text-5xl mb-4 hidden" id="statusIcon" style="color:#FFD700">check_circle</span>
<h1 class="text-xl font-bold mb-2" id="statusTitle">جارِ تأكيد تسجيل الدخول...</h1>
<p class="text-sm text-primary/70" id="statusMsg" style="color:rgba(255,215,0,0.7)">لحظات ويتم تحويلك للوحة التحكم</p>
<a class="hidden gold-gradient text-black font-bold inline-block mt-6 py-3 px-6 rounded-lg" href="login-entry-ar.html" id="retryBtn">حاول مرة أخرى</a>
</main>
<script>
        (async function () {
            // The Supabase JS client automatically parses the access_token from the
            // URL hash left by the magic link and turns it into a session.
            const { data: { session }, error } = await goldmindClient.auth.getSession();

            const spinnerWrap = document.getElementById('spinnerWrap');
            const statusIcon = document.getElementById('statusIcon');
            const statusTitle = document.getElementById('statusTitle');
            const statusMsg = document.getElementById('statusMsg');
            const retryBtn = document.getElementById('retryBtn');

            if (error || !session) {
                spinnerWrap.classList.add('hidden');
                statusIcon.textContent = 'error';
                statusIcon.style.color = '#ff6b6b';
                statusIcon.classList.remove('hidden');
                statusTitle.textContent = 'انتهت صلاحية الرابط أو غير صالح';
                statusMsg.textContent = 'فضلاً اطلب رابط دخول جديد';
                retryBtn.classList.remove('hidden');
                return;
            }

            // First-time login: create the company/staff membership based on
            // whichever mode was chosen on the login-entry screen.
            const user = session.user;
            const mode = sessionStorage.getItem('goldmind_mode');
            let rpcError = null;

            if (mode === 'join') {
                const storeId = sessionStorage.getItem('goldmind_store_id');
                const { data: alreadyMember } = await goldmindClient
                    .from('staff').select('id').eq('user_id', user.id).eq('store_id', storeId).maybeSingle();
                if (!alreadyMember) {
                    ({ error: rpcError } = await goldmindClient.rpc('join_company_by_invite', { target_store_id: storeId }));
                }
            } else {
                const { data: anyMembership } = await goldmindClient
                    .from('staff').select('id').eq('user_id', user.id).limit(1).maybeSingle();
                if (!anyMembership) {
                    if (mode === 'new') {
                        const companyName = sessionStorage.getItem('goldmind_company_name');
                        ({ error: rpcError } = await goldmindClient.rpc('register_new_company', { company_name: companyName }));
                    } else {
                        rpcError = { message: 'NO_MODE' };
                    }
                }
            }

            if (rpcError) {
                spinnerWrap.classList.add('hidden');
                statusIcon.textContent = 'error';
                statusIcon.style.color = '#ff6b6b';
                statusIcon.classList.remove('hidden');
                statusTitle.textContent = 'تعذّر إكمال التسجيل';
                statusMsg.textContent = rpcError.message && rpcError.message.includes('NOT_INVITED')
                    ? 'هذا البريد غير مدعو من هذه الشركة.'
                    : 'فضلاً حاول تسجيل الدخول من جديد.';
                retryBtn.classList.remove('hidden');
                await goldmindClient.auth.signOut();
                return;
            }

            sessionStorage.removeItem('goldmind_email');
            sessionStorage.removeItem('goldmind_mode');
            sessionStorage.removeItem('goldmind_company_name');
            sessionStorage.removeItem('goldmind_store_id');
            sessionStorage.removeItem('goldmind_store_name');

            spinnerWrap.classList.add('hidden');
            statusIcon.textContent = 'check_circle';
            statusIcon.classList.remove('hidden');
            statusTitle.textContent = 'تم تسجيل الدخول بنجاح';
            statusMsg.textContent = 'جارِ تحويلك...';

            setTimeout(() => { window.location.href = 'index-ar.html'; }, 900);
        })();
    </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
