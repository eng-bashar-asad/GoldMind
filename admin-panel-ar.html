<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>لوحة تحكم المنصة | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "#45464d", "secondary": "#745a25", "on-secondary": "#ffffff",
          "on-secondary-container": "#795f29", "secondary-container": "#ffdb99",
          "error": "#ba1a1a", "error-container": "#ffdad6", "on-error": "#ffffff", "on-error-container": "#93000a",
          "on-surface": "#191c1e", "surface-container-low": "#f2f4f6", "surface-container": "#eceef0",
          "surface-container-high": "#e6e8ea",
          "on-primary": "#ffffff", "background": "#f7f9fb", "outline-variant": "#c6c6cd",
          "surface-container-lowest": "#ffffff", "surface": "#f7f9fb", "primary": "#000000", "outline": "#76777d",
          "success": "#1e7d32", "success-container": "#d7f3dc"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
    .luxury-shadow { box-shadow: 0px 4px 20px rgba(15, 23, 42, 0.05); }
    .tab-btn.active { background: #000; color: #fff; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-surface font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" style="font-size:22px;">admin_panel_settings</span>
<h1 class="font-headline-md text-headline-md font-bold">لوحة تحكم المنصة</h1>
</div>
<button onclick="goldMindSignOut()" class="text-error text-[13px] font-semibold flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">logout</span> خروج
</button>
</div>
</header>
<main class="pb-32 max-w-2xl mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>
<div id="no-access" class="hidden py-16 text-center text-error text-sm">هذا الحساب لا يملك صلاحية الوصول للوحة تحكم المنصة.</div>

<div id="page-content" class="hidden pt-6">

<div class="flex bg-surface-container-low rounded-lg p-1 gap-1 mb-6">
<button class="tab-btn active flex-1 py-2.5 rounded-md text-sm font-semibold" id="tabCompanies" onclick="setTab('companies')">الشركات</button>
<button class="tab-btn flex-1 py-2.5 rounded-md text-sm font-semibold" id="tabSupport" onclick="setTab('support')">طلبات الدعم</button>
</div>

<!-- Companies tab -->
<section id="companiesPanel">
<div class="grid grid-cols-2 gap-3 mb-6">
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl luxury-shadow">
<span class="font-label-md text-label-md text-on-surface-variant block mb-1">إجمالي الشركات</span>
<div id="stat-total-stores" class="font-headline-md text-headline-md font-bold text-primary">0</div>
</div>
<div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-xl luxury-shadow">
<span class="font-label-md text-label-md text-on-surface-variant block mb-1">اشتراكات فعّالة</span>
<div id="stat-active-subs" class="font-headline-md text-headline-md font-bold text-secondary">0</div>
</div>
</div>
<div id="stores-list" class="flex flex-col gap-3"></div>
</section>

<!-- Support tab -->
<section id="supportPanel" class="hidden">
<div id="support-list" class="flex flex-col gap-3"></div>
</section>

</div>
</main>

<!-- Reply modal -->
<div class="fixed inset-0 bg-black/40 z-[100] hidden items-center justify-center p-4" id="replyModal">
<div class="bg-surface-container-lowest rounded-xl p-5 w-full max-w-md">
<h3 class="font-bold text-lg mb-3">الرد على الطلب</h3>
<textarea id="replyText" class="w-full h-28 border border-outline-variant rounded-lg p-3 text-sm mb-3" placeholder="اكتب ردك هنا..."></textarea>
<div class="flex items-center gap-2 mb-4">
<label class="text-[12px] text-on-surface-variant">الحالة:</label>
<select id="replyStatus" class="flex-1 h-10 border border-outline-variant rounded-lg px-2 text-[13px]">
<option value="open">مفتوح</option>
<option value="in_progress">قيد المعالجة</option>
<option value="resolved">تم الحل</option>
</select>
</div>
<div class="flex gap-2">
<button onclick="closeReplyModal()" class="flex-1 h-11 border border-outline-variant rounded-lg text-sm font-semibold">إلغاء</button>
<button onclick="submitReply()" class="flex-1 h-11 bg-primary text-on-primary rounded-lg text-sm font-semibold">حفظ</button>
</div>
</div>
</div>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-primary text-on-primary text-[13px] px-4 py-2 rounded-full opacity-0 pointer-events-none transition-opacity z-[110]"></div>

<script>
const STATUS_LABELS = { open: 'مفتوح', in_progress: 'قيد المعالجة', resolved: 'تم الحل' };
let replyingRequestId = null;

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 text-[13px] px-4 py-2 rounded-full z-[110] transition-opacity ' +
    (isError ? 'bg-error text-on-error' : 'bg-primary text-on-primary');
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

function setTab(tab) {
  document.getElementById('tabCompanies').classList.toggle('active', tab === 'companies');
  document.getElementById('tabSupport').classList.toggle('active', tab === 'support');
  document.getElementById('companiesPanel').classList.toggle('hidden', tab !== 'companies');
  document.getElementById('supportPanel').classList.toggle('hidden', tab !== 'support');
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
}

async function loadStores() {
  const { data, error } = await goldmindClient.rpc('admin_list_stores');
  if (error) { showToast('تعذّر تحميل الشركات: ' + error.message, true); return; }

  document.getElementById('stat-total-stores').textContent = data.length;
  document.getElementById('stat-active-subs').textContent = data.filter(s => s.subscription_status === 'active' || s.subscription_status === 'trialing').length;

  document.getElementById('stores-list').innerHTML = data.map(s => `
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl luxury-shadow p-4">
      <div class="flex items-center justify-between mb-2">
        <p class="font-bold text-[15px]">${s.name}</p>
        <button onclick="deleteStore('${s.id}', '${s.name.replace(/'/g, "\\'")}')" class="text-error">
          <span class="material-symbols-outlined text-[18px]">delete</span>
        </button>
      </div>
      <div class="flex flex-wrap gap-x-4 gap-y-1 text-[12px] text-on-surface-variant">
        <span>الموظفون: ${s.staff_count}</span>
        <span>الخطة: ${s.plan_name || '—'}</span>
        <span>الحالة: ${STATUS_LABELS[s.subscription_status] || s.subscription_status || '—'}</span>
        <span>تاريخ التسجيل: ${fmtDate(s.created_at)}</span>
      </div>
    </div>`).join('') || '<p class="text-center text-on-surface-variant text-sm py-8">لا توجد شركات مسجّلة بعد.</p>';
}

async function deleteStore(id, name) {
  if (!confirm('هل أنت متأكد من حذف شركة "' + name + '" نهائياً؟ سيتم حذف كل بياناتها (موظفين، فواتير، مخزون) بدون رجعة.')) return;
  const { error } = await goldmindClient.rpc('admin_delete_store', { target_store_id: id });
  if (error) { showToast('تعذّر الحذف: ' + error.message, true); return; }
  showToast('تم حذف الشركة');
  loadStores();
}

async function loadSupportRequests() {
  const { data, error } = await goldmindClient.rpc('admin_list_support_requests');
  if (error) { showToast('تعذّر تحميل طلبات الدعم: ' + error.message, true); return; }

  document.getElementById('support-list').innerHTML = data.map(r => `
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl luxury-shadow p-4">
      <div class="flex items-center justify-between mb-1">
        <p class="font-bold text-[14px]">${r.subject}</p>
        <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${r.status === 'resolved' ? 'bg-success-container text-success' : r.status === 'in_progress' ? 'bg-secondary-container text-on-secondary-container' : 'bg-surface-container-high text-on-surface-variant'}">${STATUS_LABELS[r.status] || r.status}</span>
      </div>
      <p class="text-[11px] text-on-surface-variant mb-2">من: ${r.store_name} — ${fmtDate(r.created_at)}</p>
      <p class="text-[13px] mb-2">${r.message}</p>
      ${r.admin_reply ? `<div class="bg-surface-container-low rounded-lg p-2 text-[12px] mb-2"><strong>ردك:</strong> ${r.admin_reply}</div>` : ''}
      <button onclick="openReplyModal('${r.id}', '${r.status}', '${(r.admin_reply || '').replace(/'/g, "\\'")}')" class="text-secondary text-[12px] font-semibold">الرد / تحديث الحالة</button>
    </div>`).join('') || '<p class="text-center text-on-surface-variant text-sm py-8">لا توجد طلبات دعم بعد.</p>';
}

function openReplyModal(id, status, existingReply) {
  replyingRequestId = id;
  document.getElementById('replyStatus').value = status;
  document.getElementById('replyText').value = existingReply || '';
  const modal = document.getElementById('replyModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeReplyModal() {
  const modal = document.getElementById('replyModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  replyingRequestId = null;
}

async function submitReply() {
  if (!replyingRequestId) return;
  const status = document.getElementById('replyStatus').value;
  const reply = document.getElementById('replyText').value.trim();
  const { error } = await goldmindClient.rpc('admin_update_support_request', {
    request_id: replyingRequestId, new_status: status, reply: reply || null
  });
  if (error) { showToast('تعذّر الحفظ: ' + error.message, true); return; }
  showToast('تم الحفظ');
  closeReplyModal();
  loadSupportRequests();
}

async function load() {
  const { data: { session } } = await goldmindClient.auth.getSession();
  if (!session) { window.location.href = 'login-entry-ar.html'; return; }

  const { data: isAdmin, error } = await goldmindClient.rpc('is_platform_admin');

  document.getElementById('loading-state').classList.add('hidden');

  if (error || !isAdmin) {
    document.getElementById('no-access').classList.remove('hidden');
    return;
  }

  document.getElementById('page-content').classList.remove('hidden');
  loadStores();
  loadSupportRequests();
}

load();
</script>
</body></html>
