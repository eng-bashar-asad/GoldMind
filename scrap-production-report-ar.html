<thead><tr><th>التاريخ</th><th>الباركود</th><th>الوصف</th><th>العيار</th><th class="rp-num">الوزن القائم</th><th class="rp-num rp-acc">الوزن المحاسبي</th><th>الحالة</th></tr></thead>

<script>
// Pieces produced from the scrap boxes (كسر 18/21/22/24) in a chosen period:
// count, gross and accounting weight per box/karat, then the pieces themselves.
// Source: piece_lot_draws (one row per piece per scrap lot it drew weight from).
const isScrapBox = n => /^كسر \d+$/.test(n || '');
const STATUS_AR = { available: 'متوفرة', sold: 'مباعة', reserved: 'محجوزة', given_to_trader: 'مُعادة للتاجر', gifted: 'هدية', cancelled: 'ملغاة' };
const w3 = n => (Math.round(Number(n || 0) * 1000) / 1000).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
let canSeeAcc = false;

function dayStart(d) { return new Date(d + 'T00:00:00').toISOString(); }
function dayAfter(d) { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + 1); return x.toISOString(); }

async function init() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;
  const { data: me } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
  const perms = (me && me.permissions) || {};
  const isOwner = me && me.role === 'owner';
  if (!(isOwner || perms.add_piece === true || perms.view_reports === true)) { alert('ليس لديك صلاحية الدخول لهذه الشاشة.'); location.href = 'index-ar.html'; return; }
  canSeeAcc = isOwner || perms.view_reports === true; // accounting weight: owner / report viewers only
  if (!canSeeAcc) document.querySelectorAll('.rp-acc').forEach(e => e.remove());
  const q = new URLSearchParams(location.search);
  const today = gmTodayStr();
  document.getElementById('rp-from').value = q.get('from') || today.slice(0, 8) + '01';
  document.getElementById('rp-to').value = q.get('to') || today;
  const { data: lots } = await goldmindClient.from('gold_stock_lots').select('box_name').eq('store_id', GOLDMIND_STORE_ID);
  const boxes = [...new Set((lots || []).map(l => (l.box_name || '').trim()).filter(isScrapBox))].sort();
  const sel = document.getElementById('rp-box');
  boxes.forEach(b => { const o = document.createElement('option'); o.value = b; o.textContent = b; sel.appendChild(o); });
  if (q.get('box')) sel.value = q.get('box');
  loadReport();
}

async function loadReport() {
  const from = document.getElementById('rp-from').value, to = document.getElementById('rp-to').value;
  const box = document.getElementById('rp-box').value;
  const state = document.getElementById('rp-state');
  ['rp-tiles', 'rp-summary-wrap', 'rp-list-wrap'].forEach(id => document.getElementById(id).classList.add('hidden'));
  if (!from || !to || from > to) { state.textContent = 'اختر فترة صحيحة (من تاريخ قبل إلى تاريخ).'; state.classList.remove('hidden'); return; }
  state.textContent = 'جارِ التحميل...'; state.classList.remove('hidden');
  document.getElementById('rp-period').textContent = 'الفترة: من ' + from.split('-').reverse().join('/') + ' إلى ' + to.split('-').reverse().join('/') + (box ? ' — ' + box : '');
  const { data, error } = await goldmindClient.from('piece_lot_draws')
    .select('piece_id, grams, created_at, lot:lot_id(box_name, karat), piece:piece_id(barcode, description_ar, karat, weight_grams, accounting_weight_grams, status)')
    .eq('store_id', GOLDMIND_STORE_ID).gte('created_at', dayStart(from)).lt('created_at', dayAfter(to))
    .order('created_at', { ascending: true }).limit(5000);
  if (error) { state.textContent = 'تعذّر التحميل: ' + error.message; return; }
  // one entry per piece (a piece can draw from several lots of the same box)
  const pieces = new Map();
  (data || []).forEach(d => {
    const b = ((d.lot && d.lot.box_name) || '').trim();
    if (!isScrapBox(b) || (box && b !== box) || !d.piece) return;
    const p = pieces.get(d.piece_id) || { id: d.piece_id, box: b, at: d.created_at, drawn: 0, ...d.piece };
    p.drawn += Number(d.grams || 0);
    pieces.set(d.piece_id, p);
  });
  const list = [...pieces.values()];
  if (!list.length) { state.textContent = 'لا توجد قطع منتَجة من الكسر في هذه الفترة.'; return; }
  state.classList.add('hidden');
  const groups = new Map();
  list.forEach(p => {
    const k = p.box + '|' + p.karat;
    const g = groups.get(k) || { box: p.box, karat: p.karat, n: 0, gross: 0, acc: 0, drawn: 0 };
    g.n++; g.gross += Number(p.weight_grams || 0); g.acc += Number(p.accounting_weight_grams != null ? p.accounting_weight_grams : p.weight_grams || 0); g.drawn += p.drawn;
    groups.set(k, g);
  });
  const rows = [...groups.values()].sort((a, b) => a.box.localeCompare(b.box) || a.karat - b.karat);
  const tot = rows.reduce((t, g) => ({ n: t.n + g.n, gross: t.gross + g.gross, acc: t.acc + g.acc, drawn: t.drawn + g.drawn }), { n: 0, gross: 0, acc: 0, drawn: 0 });
  const acc = v => canSeeAcc ? `<td class="rp-num">${w3(v)}</td>` : '';
  document.getElementById('rp-summary').innerHTML = rows.map(g => `<tr><td>${gmEscapeHtml(g.box)}</td><td>${gmEscapeHtml(String(g.karat))}K</td><td class="rp-num">${g.n}</td><td class="rp-num">${w3(g.gross)}</td>${acc(g.acc)}<td class="rp-num">${w3(g.drawn)}</td></tr>`).join('')
    + (rows.length > 1 ? `<tr class="font-bold"><td colspan="2">المجموع</td><td class="rp-num">${tot.n}</td><td class="rp-num">${w3(tot.gross)}</td>${acc(tot.acc)}<td class="rp-num">${w3(tot.drawn)}</td></tr>` : '');
  document.getElementById('rp-list').innerHTML = list.map(p => `<tr>
    <td class="rp-num">${gmEscapeHtml(new Date(p.at).toLocaleDateString('en-GB'))}</td>
    <td><a class="underline font-semibold" href="piece-edit-ar.html?id=${encodeURIComponent(p.id)}">${gmEscapeHtml(p.barcode || '—')}</a></td>
    <td>${gmEscapeHtml(p.description_ar || '')}</td>
    <td>${gmEscapeHtml(String(p.karat || ''))}K</td>
    <td class="rp-num">${w3(p.weight_grams)}</td>${acc(p.accounting_weight_grams != null ? p.accounting_weight_grams : p.weight_grams)}
    <td>${gmEscapeHtml(STATUS_AR[p.status] || p.status || '')}</td></tr>`).join('');
  const tile = (label, v) => `<div class="rp-card bg-surface-container-lowest border border-outline-variant rounded-xl p-3"><div class="text-[11px] text-on-surface-variant mb-1">${label}</div><div class="font-bold text-[18px] rp-num" style="text-align:right">${v}</div></div>`;
  document.getElementById('rp-tiles').innerHTML = tile('عدد القطع', tot.n) + tile('الوزن القائم', w3(tot.gross) + ' غ') + (canSeeAcc ? tile('الوزن المحاسبي', w3(tot.acc) + ' غ') : tile('المسحوب من الكسر', w3(tot.drawn) + ' غ'));
  ['rp-tiles', 'rp-summary-wrap', 'rp-list-wrap'].forEach(id => document.getElementById(id).classList.remove('hidden'));
}

init();
</script>
