<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>فتح الملف | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "primary": "var(--gm-primary)", "outline": "#76777d"
        },
        "fontFamily": { "body-md": ["Inter"] }
      } } }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center px-6">
<div class="max-w-sm w-full text-center flex flex-col items-center gap-4">
<div id="statusIcon" class="text-5xl">📎</div>
<p id="statusText" class="text-[15px]">جارِ فتح الملف...</p>
<a id="manualLink" href="#" class="hidden h-12 px-6 flex items-center justify-center bg-primary text-on-primary rounded-lg text-sm font-semibold">فتح الملف</a>
</div>

<script>
async function openReport() {
  const params = new URLSearchParams(window.location.search);
  const linkId = params.get('id');
  const statusText = document.getElementById('statusText');
  const statusIcon = document.getElementById('statusIcon');

  if (!linkId) {
    statusIcon.textContent = '⚠️';
    statusText.textContent = 'رابط غير صالح.';
    return;
  }

  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return; // requireGoldMindSession already redirects to login

  const { data: row, error: rowError } = await goldmindClient
    .from('daily_report_links').select('storage_path, store_id').eq('id', linkId).maybeSingle();

  if (rowError || !row) {
    statusIcon.textContent = '⚠️';
    statusText.textContent = 'تعذّر العثور على الملف — الرابط غير موجود أو ما عندك صلاحية الوصول لهذه الشركة.';
    return;
  }

  const { data: signed, error: signError } = await goldmindClient.storage
    .from('daily-reports').createSignedUrl(row.storage_path, 60 * 5);

  if (signError || !signed) {
    statusIcon.textContent = '⚠️';
    statusText.textContent = 'تعذّر تجهيز رابط التحميل: ' + (signError ? signError.message : '');
    return;
  }

  statusText.textContent = 'جارِ التحويل لتحميل الملف...';
  window.location.href = signed.signedUrl;

  // Fallback in case the automatic redirect is blocked by the browser.
  const manualLink = document.getElementById('manualLink');
  manualLink.href = signed.signedUrl;
  manualLink.classList.remove('hidden');
  manualLink.classList.add('flex');
}

openReport();
</script>
</body></html>
