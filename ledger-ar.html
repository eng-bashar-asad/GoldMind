<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>سجل التجار | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "#45464d", "secondary": "#745a25", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "#191c1e", "surface-container-low": "#f2f4f6",
          "on-primary": "#ffffff", "background": "#f7f9fb", "outline-variant": "#c6c6cd",
          "surface-container-lowest": "#ffffff", "surface": "#f7f9fb", "primary": "#000000",
          "outline": "#76777d", "success": "#1e7d32", "success-container": "#d7f3dc"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
    .settle-tab-btn.active { background: #000; color: #fff; }
    .settle-tab-btn:not(.active) { color: #45464d; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-surface font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="goBack()" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold" id="page-title">سجل التجار</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>

<!-- Traders list -->
<div id="traders-list-view" class="hidden py-6">
<div class="relative mb-4">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input id="traderFilterInput" oninput="renderTraders()" placeholder="ابحث باسم التاجر..." class="w-full h-11 border border-outline-variant rounded-lg pr-10 pl-3 text-[13px] bg-surface-container-lowest"/>
</div>
<div id="traders-list" class="flex flex-col gap-3"></div>
</div>

<!-- Trader detail -->
<div id="trader-detail-view" class="hidden py-6 flex flex-col gap-4">
<button onclick="showTradersList()" class="text-[12px] text-secondary font-semibold self-start">→ كل التجار</button>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
<h2 class="font-bold text-[16px]" id="detail-trader-name"></h2>
<p class="text-[12px] text-on-surface-variant font-data-mono" dir="ltr" id="detail-trader-phone"></p>
<div class="mt-3 pt-3 border-t border-outline-variant flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-[13px] text-on-surface-variant">دين الذهب (بمكافئ عيار ٢٤)</span>
<span class="font-bold text-[16px] font-data-mono" id="detail-gold-balance">0.00 غ</span>
</div>
<div class="flex justify-between items-center">
<span class="text-[13px] text-on-surface-variant">دين المصنعية (نقدي)</span>
<span class="font-bold text-[16px] font-data-mono" id="detail-fee-balance">0.00 د.إ</span>
</div>
</div>
<p class="text-[10px] text-outline mt-1">قيمة موجبة = دين علينا للتاجر لم يُسوَّ بعد. الذهب والمصنعية دينان منفصلان تماماً.</p>
</div>

<button onclick="toggleSettleForm()" class="w-full h-12 border-2 border-dashed border-outline-variant text-on-surface-variant rounded-xl flex items-center justify-center gap-2">
<span class="material-symbols-outlined">handshake</span> تسجيل تسوية / دفعة للتاجر
</button>

<div class="hidden bg-surface-container-lowest border border-outline-variant rounded-xl p-4" id="settle-form">
<div class="flex bg-surface-container-low rounded-lg p-1 gap-1 mb-3">
<button class="settle-tab-btn flex-1 py-2 rounded-md text-[13px] font-semibold" id="settleTabGold" onclick="setSettleMode('gold')">تسوية ذهب</button>
<button class="settle-tab-btn flex-1 py-2 rounded-md text-[13px] font-semibold" id="settleTabCash" onclick="setSettleMode('cash')">تسوية نقدية (مصنعية)</button>
</div>
<div id="settle-gold-fields" class="grid grid-cols-2 gap-3 mb-3">
<div>
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">الوزن المُسوّى (غ)</label>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 font-data-mono" id="settle-weight" step="0.01" type="number"/>
</div>
<div>
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">العيار</label>
<select class="w-full h-11 border border-outline-variant rounded-lg px-3" id="settle-karat">
<option value="18">18</option>
<option selected value="21">21</option>
<option value="22">22</option>
<option value="24">24</option>
</select>
</div>
</div>
<div class="hidden mb-3" id="settle-cash-fields">
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">المبلغ المدفوع (د.إ)</label>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 font-data-mono" id="settle-cash-amount" step="0.01" type="number"/>
</div>
<textarea class="w-full h-16 border border-outline-variant rounded-lg px-3 py-2 text-[13px] mb-3" id="settle-notes" placeholder="ملاحظة (اختياري)"></textarea>
<button onclick="submitSettlement()" id="settle-btn" class="w-full h-11 bg-primary text-on-primary rounded-lg text-sm font-semibold">حفظ التسوية</button>
<p class="text-error text-[12px] hidden mt-2" id="settle-error"></p>
</div>

<h3 class="font-semibold text-[13px] mt-2">سجل الحركات</h3>
<div id="movements-list" class="flex flex-col gap-2"></div>
<p id="empty-movements" class="hidden text-center text-on-surface-variant text-sm py-8">لا توجد حركات مسجّلة بعد.</p>

</div>
</main>

<script>
let traders = [];
let movementsByTrader = {};
let currentTraderId = null;

function fmt(n) {
  return Number(n || 0).toLocaleString('ar-EG', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
}

const MOVEMENT_LABELS = { debt_increase: 'استلام ذهب (زيادة دين)', debt_decrease: 'تسوية / دفعة (تخفيض دين)' };

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  const [{ data: traderRows, error: tErr }, { data: moveRows, error: mErr }] = await Promise.all([
    goldmindClient.from('traders').select('*').eq('store_id', GOLDMIND_STORE_ID).order('name'),
    goldmindClient.from('trader_movements').select('*, invoice:invoice_id(invoice_number)').eq('store_id', GOLDMIND_STORE_ID).order('created_at', { ascending: false })
  ]);

  document.getElementById('loading-state').classList.add('hidden');

  if (tErr) {
    document.getElementById('traders-list').innerHTML = `<p class="text-error text-sm text-center py-8">تعذّر التحميل: ${tErr.message}</p>`;
    document.getElementById('traders-list-view').classList.remove('hidden');
    return;
  }

  traders = traderRows || [];
  movementsByTrader = {};
  (moveRows || []).forEach(m => {
    if (!movementsByTrader[m.trader_id]) movementsByTrader[m.trader_id] = [];
    movementsByTrader[m.trader_id].push(m);
  });

  showTradersList();
}

function traderGoldBalance(traderId) {
  const moves = movementsByTrader[traderId] || [];
  return moves.reduce((sum, m) => sum + (m.movement_type === 'debt_increase' ? Number(m.gold_24k_equivalent || 0) : -Number(m.gold_24k_equivalent || 0)), 0);
}

function traderFeeBalance(traderId) {
  const moves = movementsByTrader[traderId] || [];
  return moves.reduce((sum, m) => sum + (m.movement_type === 'debt_increase' ? Number(m.fab_fee_amount || 0) : -Number(m.fab_fee_amount || 0)), 0);
}

function showTradersList() {
  currentTraderId = null;
  document.getElementById('page-title').textContent = 'سجل التجار';
  document.getElementById('trader-detail-view').classList.add('hidden');
  document.getElementById('traders-list-view').classList.remove('hidden');
  renderTraders();
}

function renderTraders() {
  const q = (document.getElementById('traderFilterInput').value || '').trim().toLowerCase();
  const list = q ? traders.filter(t => t.name.toLowerCase().includes(q)) : traders;

  document.getElementById('traders-list').innerHTML = list.map(t => {
    const goldBal = traderGoldBalance(t.id);
    const feeBal = traderFeeBalance(t.id);
    return `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 cursor-pointer" onclick="showTraderDetail('${t.id}')">
        <div class="flex items-center justify-between mb-1">
          <div>
            <p class="font-bold text-[14px]">${t.name}</p>
            <p class="text-[11px] text-on-surface-variant font-data-mono" dir="ltr">${t.phone || ''}</p>
          </div>
        </div>
        <div class="flex gap-4 text-[12px] font-data-mono mt-1">
          <span class="${goldBal > 0 ? 'text-error' : 'text-success'}">ذهب: ${fmt(Math.abs(goldBal))} غ</span>
          <span class="${feeBal > 0 ? 'text-error' : 'text-success'}">مصنعية: ${fmt(Math.abs(feeBal))} د.إ</span>
        </div>
      </div>`;
  }).join('') || '<p class="text-center text-on-surface-variant text-sm py-8">لا يوجد تجار مطابقون. يُضافون تلقائياً عند إنشاء أول فاتورة شراء منهم.</p>';
}

function showTraderDetail(traderId) {
  currentTraderId = traderId;
  const trader = traders.find(t => t.id === traderId);
  if (!trader) return;

  document.getElementById('page-title').textContent = trader.name;
  document.getElementById('traders-list-view').classList.add('hidden');
  document.getElementById('trader-detail-view').classList.remove('hidden');
  document.getElementById('settle-form').classList.add('hidden');

  document.getElementById('detail-trader-name').textContent = trader.name;
  document.getElementById('detail-trader-phone').textContent = trader.phone || '';

  const goldBal = traderGoldBalance(traderId);
  const feeBal = traderFeeBalance(traderId);
  const goldEl = document.getElementById('detail-gold-balance');
  goldEl.textContent = fmt(Math.abs(goldBal)) + ' غ';
  goldEl.className = 'font-bold text-[16px] font-data-mono ' + (goldBal > 0 ? 'text-error' : 'text-success');
  const feeEl = document.getElementById('detail-fee-balance');
  feeEl.textContent = fmt(Math.abs(feeBal)) + ' د.إ';
  feeEl.className = 'font-bold text-[16px] font-data-mono ' + (feeBal > 0 ? 'text-error' : 'text-success');

  const moves = movementsByTrader[traderId] || [];
  const listEl = document.getElementById('movements-list');
  const emptyEl = document.getElementById('empty-movements');

  if (moves.length === 0) {
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');

  listEl.innerHTML = moves.map(m => {
    const isIncrease = m.movement_type === 'debt_increase';
    const date = new Date(m.created_at).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short', year: 'numeric' });
    return `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[13px] font-semibold ${isIncrease ? 'text-error' : 'text-success'}">${MOVEMENT_LABELS[m.movement_type] || m.movement_type}</span>
          <span class="text-[11px] text-on-surface-variant">${date}</span>
        </div>
        <p class="text-[12px] font-data-mono">${m.weight_grams ? `${m.weight_grams}غ عيار ${m.karat} = ${fmt(m.gold_24k_equivalent)}غ (٢٤)` : ''}${(m.fab_fee_amount && Number(m.fab_fee_amount) > 0) ? ` ${m.weight_grams ? '+' : ''}مصنعية ${fmt(m.fab_fee_amount)} د.إ` : ''}</p>
        ${m.notes ? `<p class="text-[12px] text-on-surface-variant mt-1">${m.notes}</p>` : ''}
        ${m.invoice && m.invoice.invoice_number ? `<p class="text-[11px] text-outline mt-1">فاتورة: ${m.invoice.invoice_number}</p>` : ''}
      </div>`;
  }).join('');
}

function toggleSettleForm() {
  document.getElementById('settle-form').classList.toggle('hidden');
  setSettleMode('gold');
}

let settleMode = 'gold';
function setSettleMode(mode) {
  settleMode = mode;
  document.getElementById('settleTabGold').classList.toggle('active', mode === 'gold');
  document.getElementById('settleTabCash').classList.toggle('active', mode === 'cash');
  document.getElementById('settle-gold-fields').classList.toggle('hidden', mode !== 'gold');
  document.getElementById('settle-cash-fields').classList.toggle('hidden', mode !== 'cash');
}

async function submitSettlement() {
  const notes = document.getElementById('settle-notes').value.trim();
  const errEl = document.getElementById('settle-error');
  errEl.classList.add('hidden');

  let movement;
  if (settleMode === 'gold') {
    const weight = parseFloat(document.getElementById('settle-weight').value);
    const karat = parseInt(document.getElementById('settle-karat').value, 10);
    if (!weight || weight <= 0) {
      errEl.textContent = 'فضلاً أدخل وزناً صحيحاً';
      errEl.classList.remove('hidden');
      return;
    }
    movement = {
      store_id: GOLDMIND_STORE_ID,
      trader_id: currentTraderId,
      movement_type: 'debt_decrease',
      weight_grams: weight,
      karat: karat,
      gold_24k_equivalent: +(weight * (karat / 24)).toFixed(3),
      fab_fee_amount: 0,
      notes: notes || 'تسوية ذهب يدوية'
    };
  } else {
    const amount = parseFloat(document.getElementById('settle-cash-amount').value);
    if (!amount || amount <= 0) {
      errEl.textContent = 'فضلاً أدخل مبلغاً صحيحاً';
      errEl.classList.remove('hidden');
      return;
    }
    movement = {
      store_id: GOLDMIND_STORE_ID,
      trader_id: currentTraderId,
      movement_type: 'debt_decrease',
      weight_grams: 0,
      karat: null,
      gold_24k_equivalent: 0,
      fab_fee_amount: amount,
      notes: notes || 'تسوية مصنعية نقدية'
    };
  }

  const btn = document.getElementById('settle-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  const { error } = await goldmindClient.from('trader_movements').insert(movement);

  btn.disabled = false;
  btn.textContent = 'حفظ التسوية';

  if (error) {
    errEl.textContent = 'تعذّر الحفظ: ' + error.message;
    errEl.classList.remove('hidden');
    return;
  }

  document.getElementById('settle-weight').value = '';
  document.getElementById('settle-cash-amount').value = '';
  document.getElementById('settle-notes').value = '';
  document.getElementById('settle-form').classList.add('hidden');
  const traderIdToReopen = currentTraderId;
  await load();
  showTraderDetail(traderIdToReopen);
}

function goBack() {
  if (currentTraderId) { showTradersList(); return; }
  window.location.href = 'index-ar.html';
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
