    html { font-size: 87.5%; }

<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="goBack()" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold" id="page-title">سجل التجار</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>

<!-- Traders list -->
<div id="traders-list-view" class="hidden py-6">
<div class="relative mb-4">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input id="traderFilterInput" oninput="renderTraders()" placeholder="ابحث باسم التاجر..." class="w-full h-11 border border-outline-variant rounded-lg pr-10 pl-3 text-[13px] bg-surface-container-lowest"/>

<button onclick="toggleAddTraderForm()" class="w-full h-11 border-2 border-dashed border-outline-variant text-on-surface-variant rounded-xl flex items-center justify-center gap-2 mb-4">
<span class="material-symbols-outlined">person_add</span> إضافة تاجر جديد
</button>
<div class="hidden bg-surface-container-lowest border border-outline-variant rounded-xl p-4 mb-4" id="addTraderForm">

<div class="flex rounded-lg border border-outline-variant overflow-hidden mb-3">
<button type="button" id="trader-type-individual-btn" onclick="setTraderType(false)" class="flex-1 h-10 font-semibold text-xs transition-all">فرد</button>
<button type="button" id="trader-type-company-btn" onclick="setTraderType(true)" class="flex-1 h-10 font-semibold text-xs transition-all">شركة</button>
</div>

<label class="block text-[12px] font-semibold text-on-surface-variant mb-1" id="newTraderNameLabel">اسم التاجر</label>
<input id="newTraderName" class="w-full h-11 border border-outline-variant rounded-lg px-3 text-sm mb-3"/>

<div id="trader-company-fields" class="hidden flex-col gap-3 mb-3">
<div>
<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">اسم الشركة القانوني</label>
<input id="traderLegalName" class="w-full h-11 border border-outline-variant rounded-lg px-3 text-sm"/>
</div>
<div>
<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">الرقم الضريبي (اختياري)</label>
<input id="traderTaxNumber" dir="ltr" class="w-full h-11 border border-outline-variant rounded-lg px-3 text-sm"/>
</div>
<div>
<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">عنوان الشركة</label>
<textarea id="traderAddress" class="w-full h-16 border border-outline-variant rounded-lg px-3 py-2 text-sm resize-none"></textarea>
</div>
<div>
<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">إيميل الشركة</label>
<input id="traderEmail" dir="ltr" class="w-full h-11 border border-outline-variant rounded-lg px-3 text-sm"/>
</div>
<div>
<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">رقم التواصل</label>
<div class="flex gap-2">
<select id="traderPhoneCode" dir="ltr" class="h-11 border border-outline-variant rounded-lg px-2 text-xs"></select>
<input id="traderCompanyPhone" dir="ltr" class="flex-1 h-11 border border-outline-variant rounded-lg px-3 text-sm" placeholder="رقم الموبايل أو الأرضي"/>
</div>
</div>
<div>
<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">مستندات KYC (صور أو PDF)</label>
<input id="traderKycFiles" multiple="" type="file" accept="image/*,.pdf" class="w-full text-xs border border-dashed border-outline-variant rounded-lg px-2 py-2"/>
</div>
</div>

<div id="trader-individual-phone-wrap">
<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">رقم الهاتف (اختياري)</label>
<input id="newTraderPhone" dir="ltr" class="w-full h-11 border border-outline-variant rounded-lg px-3 text-sm mb-3"/>
</div>

<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">ملاحظات (اختياري)</label>
<textarea id="newTraderNotes" class="w-full h-16 border border-outline-variant rounded-lg px-3 py-2 text-sm mb-3"></textarea>
<button onclick="submitNewTrader()" id="newTraderBtn" class="w-full h-11 bg-primary text-on-primary rounded-lg text-sm font-semibold">حفظ التاجر</button>
<p class="text-error text-[12px] hidden mt-2" id="newTraderError"></p>
</div>

<div id="traders-list" class="flex flex-col gap-3"></div>
</div>

<!-- Trader detail -->
<div id="trader-detail-view" class="hidden py-6 flex flex-col gap-4">
<button onclick="showTradersList()" class="text-[12px] text-secondary font-semibold self-start">→ كل التجار</button>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
<h2 class="font-bold text-[16px]" id="detail-trader-name"></h2>
<p class="text-[12px] text-on-surface-variant font-data-mono" dir="ltr" id="detail-trader-phone"></p>
<div class="mt-3 pt-3 border-t border-outline-variant flex flex-col gap-2">
<div class="flex justify-between items-center">
<span class="text-[13px] text-on-surface-variant">دين الذهب (بمكافئ عيار ٢٤)</span>
<span class="font-bold text-[16px] font-data-mono" id="detail-gold-balance">0.00 غ</span>
</div>
<div class="flex justify-between items-center">
<span class="text-[13px] text-on-surface-variant" id="cashDebtLabel">دين نقدي (مصنعية)</span>
<span class="font-bold text-[16px] font-data-mono" id="detail-fee-balance">0.00 د.إ</span>
</div>
</div>
<p class="text-[10px] text-outline mt-1" id="cashDebtHint">قيمة موجبة = دين علينا للتاجر لم يُسوَّ بعد. الذهب والمصنعية دينان منفصلان تماماً.</p>
</div>

<button onclick="toggleSettleForm()" class="w-full h-12 border-2 border-dashed border-outline-variant text-on-surface-variant rounded-xl flex items-center justify-center gap-2">
<span class="material-symbols-outlined">handshake</span> تسجيل تسوية / دفعة للتاجر
</button>

<div class="hidden bg-surface-container-lowest border border-outline-variant rounded-xl p-4" id="settle-form">
<div class="flex bg-surface-container-low rounded-lg p-1 gap-1 mb-3">
<button class="settle-tab-btn flex-1 py-2 rounded-md text-[13px] font-semibold" id="settleTabGold" onclick="setSettleMode('gold')">تسوية ذهب</button>
<button class="settle-tab-btn flex-1 py-2 rounded-md text-[13px] font-semibold" id="settleTabCash" onclick="setSettleMode('cash')">تسوية نقدية (مصنعية)</button>
</div>

<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">الوزن المُسوّى (غ)</label>

</div>
<div>
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">العيار</label>
<select class="w-full h-11 border border-outline-variant rounded-lg px-3" id="settle-karat">
<option value="18">18</option>
<option selected value="21">21</option>
<option value="22">22</option>
<option value="24">24</option>
</select>
</div>
</div>
<div class="hidden mb-3" id="settle-cash-fields">
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">المبلغ المدفوع (د.إ)</label>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 font-data-mono" id="settle-cash-amount" step="0.01" type="number"/>
</div>
<textarea class="w-full h-16 border border-outline-variant rounded-lg px-3 py-2 text-[13px] mb-3" id="settle-notes" placeholder="ملاحظة (اختياري)"></textarea>
<button onclick="submitSettlement()" id="settle-btn" class="w-full h-11 bg-primary text-on-primary rounded-lg text-sm font-semibold">حفظ التسوية</button>

<h3 class="font-semibold text-[13px] mt-2">سجل الحركات</h3>

</div>

<script>
let traders = [];
let movementsByTrader = {};
let currentTraderId = null;
let diamondsEnabled = false;

function fmt(n) {
  return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
}

const MOVEMENT_LABELS = { debt_increase: 'استلام ذهب (زيادة دين)', debt_decrease: 'تسوية / دفعة (تخفيض دين)' };

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  const [{ data: traderRows, error: tErr }, { data: moveRows, error: mErr }, { data: storeRow }] = await Promise.all([
    goldmindClient.from('traders').select('*').eq('store_id', GOLDMIND_STORE_ID).order('name'),
    goldmindClient.from('trader_movements').select('*, invoice:invoice_id(invoice_number)').eq('store_id', GOLDMIND_STORE_ID).order('created_at', { ascending: false }),
    goldmindClient.from('stores').select('diamonds_enabled').eq('id', GOLDMIND_STORE_ID).maybeSingle()
  ]);

  diamondsEnabled = !!(storeRow && storeRow.diamonds_enabled);
  // The cash-debt label only mentions diamonds for stores that actually use
  // that feature — gold-only shops keep the plain, pre-diamond wording so
  // the screen doesn't introduce a concept they never use.
  if (diamondsEnabled) {
    document.getElementById('cashDebtLabel').textContent = 'دين نقدي (مصنعية/ألماس)';
    document.getElementById('cashDebtHint').textContent = 'قيمة موجبة = دين علينا للتاجر لم يُسوَّ بعد. دين الذهب والدين النقدي (مصنعية أو ألماس) منفصلان تماماً.';
    document.getElementById('settleTabCash').textContent = 'تسوية نقدية (مصنعية/ألماس)';
  }

  document.getElementById('loading-state').classList.add('hidden');

  if (tErr) {
    document.getElementById('traders-list').innerHTML = `<p class="text-error text-sm text-center py-8">تعذّر التحميل: ${tErr.message}</p>`;
    document.getElementById('traders-list-view').classList.remove('hidden');
    return;
  }

  traders = traderRows || [];
  movementsByTrader = {};
  (moveRows || []).forEach(m => {
    if (!movementsByTrader[m.trader_id]) movementsByTrader[m.trader_id] = [];
    movementsByTrader[m.trader_id].push(m);
  });

  showTradersList();
}

function traderGoldBalance(traderId) {
  const moves = movementsByTrader[traderId] || [];
  return moves.reduce((sum, m) => sum + (m.movement_type === 'debt_increase' ? Number(m.gold_24k_equivalent || 0) : -Number(m.gold_24k_equivalent || 0)), 0);
}

function traderFeeBalance(traderId) {
  const moves = movementsByTrader[traderId] || [];
  return moves.reduce((sum, m) => sum + (m.movement_type === 'debt_increase' ? Number(m.fab_fee_amount || 0) : -Number(m.fab_fee_amount || 0)), 0);
}

function showTradersList() {
  currentTraderId = null;
  document.getElementById('page-title').textContent = 'سجل التجار';
  document.getElementById('trader-detail-view').classList.add('hidden');
  document.getElementById('traders-list-view').classList.remove('hidden');
  renderTraders();
}

function toggleAddTraderForm() {
  document.getElementById('addTraderForm').classList.toggle('hidden');
}

let traderIsCompany = false;

(function initTraderPhoneCodes() {
  const sel = document.getElementById('traderPhoneCode');
  Object.keys(GOLDMIND_COUNTRY_PHONE_MAP).forEach(function (cc) {
    const opt = document.createElement('option');
    opt.value = GOLDMIND_COUNTRY_PHONE_MAP[cc];
    opt.textContent = '+' + GOLDMIND_COUNTRY_PHONE_MAP[cc] + ' (' + cc + ')';
    sel.appendChild(opt);
  });
  sel.value = GOLDMIND_DEFAULT_PHONE_CODE;
})();

function setTraderType(company) {
  traderIsCompany = company;
  document.getElementById('trader-type-company-btn').classList.toggle('bg-primary', company);
  document.getElementById('trader-type-company-btn').classList.toggle('text-on-primary', company);
  document.getElementById('trader-type-individual-btn').classList.toggle('bg-primary', !company);
  document.getElementById('trader-type-individual-btn').classList.toggle('text-on-primary', !company);
  document.getElementById('trader-company-fields').classList.toggle('hidden', !company);
  document.getElementById('trader-company-fields').classList.toggle('flex', company);
  document.getElementById('trader-individual-phone-wrap').classList.toggle('hidden', company);
  document.getElementById('newTraderNameLabel').textContent = company ? 'اسم التاجر (مختصر/شائع)' : 'اسم التاجر';
}
setTraderType(false);

async function uploadTraderKycFiles(traderId) {
  const filesInput = document.getElementById('traderKycFiles');
  const files = filesInput.files;
  if (!files || files.length === 0) return { ok: true };

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
    const path = GOLDMIND_STORE_ID + '/trader-' + traderId + '/' + Date.now() + '-' + i + '.' + ext;

    const { error: uploadError } = await goldmindClient.storage
      .from('company-kyc-documents').upload(path, file, { upsert: false });
    if (uploadError) return { ok: false, message: uploadError.message };

    const { error: rowError } = await goldmindClient.from('company_kyc_documents').insert({
      store_id: GOLDMIND_STORE_ID,
      owner_type: 'trader',
      owner_id: traderId,
      file_url: path,
      file_name: file.name,
      uploaded_by: GOLDMIND_STAFF_ID
    });
    if (rowError) return { ok: false, message: rowError.message };
  }
  return { ok: true };
}

async function submitNewTrader() {
  const name = document.getElementById('newTraderName').value.trim();
  const phone = document.getElementById('newTraderPhone').value.trim();
  const notes = document.getElementById('newTraderNotes').value.trim();
  const errEl = document.getElementById('newTraderError');
  errEl.classList.add('hidden');

  if (!name) {
    errEl.textContent = 'فضلاً أدخل اسم التاجر';
    errEl.classList.remove('hidden');
    return;
  }

  const legalName = document.getElementById('traderLegalName').value.trim();
  if (traderIsCompany && !legalName) {
    errEl.textContent = 'فضلاً أدخل اسم الشركة القانوني';
    errEl.classList.remove('hidden');
    return;
  }

  const btn = document.getElementById('newTraderBtn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  const insertPayload = {
    store_id: GOLDMIND_STORE_ID,
    name: name,
    notes: notes || null,
    is_company: traderIsCompany
  };

  if (traderIsCompany) {
    const companyPhone = document.getElementById('traderCompanyPhone').value.trim();
    insertPayload.phone = companyPhone || null;
    insertPayload.phone_country_code = companyPhone ? document.getElementById('traderPhoneCode').value : null;
    insertPayload.legal_name = legalName;
    insertPayload.tax_number = document.getElementById('traderTaxNumber').value.trim() || null;
    insertPayload.address = document.getElementById('traderAddress').value.trim() || null;
    insertPayload.email = document.getElementById('traderEmail').value.trim() || null;
  } else {
    insertPayload.phone = phone || null;
  }

  const { data: inserted, error } = await goldmindClient.from('traders').insert(insertPayload).select('id').single();

  if (error) {
    btn.disabled = false;
    btn.textContent = 'حفظ التاجر';
    errEl.textContent = 'تعذّر الحفظ: ' + error.message;
    errEl.classList.remove('hidden');
    return;
  }

  if (traderIsCompany) {
    const kycResult = await uploadTraderKycFiles(inserted.id);
    if (!kycResult.ok) {
      errEl.textContent = 'تم حفظ التاجر لكن تعذّر رفع بعض مستندات KYC: ' + kycResult.message;
      errEl.classList.remove('hidden');
    }
  }

  btn.disabled = false;
  btn.textContent = 'حفظ التاجر';

  document.getElementById('newTraderName').value = '';
  document.getElementById('newTraderPhone').value = '';
  document.getElementById('newTraderNotes').value = '';
  document.getElementById('traderLegalName').value = '';
  document.getElementById('traderTaxNumber').value = '';
  document.getElementById('traderAddress').value = '';
  document.getElementById('traderEmail').value = '';
  document.getElementById('traderCompanyPhone').value = '';
  document.getElementById('traderKycFiles').value = '';
  document.getElementById('addTraderForm').classList.add('hidden');
  await load();
}

function renderTraders() {
  const q = (document.getElementById('traderFilterInput').value || '').trim().toLowerCase();
  const list = q ? traders.filter(t => t.name.toLowerCase().includes(q)) : traders;

  document.getElementById('traders-list').innerHTML = list.map(t => {
    const goldBal = traderGoldBalance(t.id);
    const feeBal = traderFeeBalance(t.id);
    return `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 cursor-pointer" onclick="showTraderDetail('${t.id}')">
        <div class="flex items-center justify-between mb-1">
          <div>
            <p class="font-bold text-[14px]">${t.name}</p>
            <p class="text-[11px] text-on-surface-variant font-data-mono" dir="ltr">${t.phone || ''}</p>
          </div>
        </div>
        <div class="flex gap-4 text-[12px] font-data-mono mt-1">
          <span class="${goldBal > 0 ? 'text-error' : 'text-success'}">ذهب: ${fmt(Math.abs(goldBal))} غ</span>
          <span class="${feeBal > 0 ? 'text-error' : 'text-success'}">نقدي: ${fmt(Math.abs(feeBal))} د.إ</span>
        </div>
      </div>`;
  }).join('') || '<p class="text-center text-on-surface-variant text-sm py-8">لا يوجد تجار مطابقون. يُضافون تلقائياً عند إنشاء أول فاتورة شراء منهم.</p>';
}

function showTraderDetail(traderId) {
  currentTraderId = traderId;
  const trader = traders.find(t => t.id === traderId);
  if (!trader) return;

  document.getElementById('page-title').textContent = trader.name;
  document.getElementById('traders-list-view').classList.add('hidden');
  document.getElementById('trader-detail-view').classList.remove('hidden');
  document.getElementById('settle-form').classList.add('hidden');

  document.getElementById('detail-trader-name').textContent = trader.name;
  document.getElementById('detail-trader-phone').textContent = trader.phone || '';

  const goldBal = traderGoldBalance(traderId);
  const feeBal = traderFeeBalance(traderId);
  const goldEl = document.getElementById('detail-gold-balance');
  goldEl.textContent = fmt(Math.abs(goldBal)) + ' غ';
  goldEl.className = 'font-bold text-[16px] font-data-mono ' + (goldBal > 0 ? 'text-error' : 'text-success');
  const feeEl = document.getElementById('detail-fee-balance');
  feeEl.textContent = fmt(Math.abs(feeBal)) + ' د.إ';
  feeEl.className = 'font-bold text-[16px] font-data-mono ' + (feeBal > 0 ? 'text-error' : 'text-success');

  const moves = movementsByTrader[traderId] || [];
  const listEl = document.getElementById('movements-list');
  const emptyEl = document.getElementById('empty-movements');

  if (moves.length === 0) {
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');

  listEl.innerHTML = moves.map(m => {
    const isIncrease = m.movement_type === 'debt_increase';
    const date = new Date(m.created_at).toLocaleDateString('ar-EG-u-nu-latn', { day: 'numeric', month: 'short', year: 'numeric' });
    return `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[13px] font-semibold ${isIncrease ? 'text-error' : 'text-success'}">${MOVEMENT_LABELS[m.movement_type] || m.movement_type}</span>
          <span class="text-[11px] text-on-surface-variant">${date}</span>
        </div>
        <p class="text-[12px] font-data-mono">${m.weight_grams ? `${m.weight_grams}غ عيار ${m.karat} = ${fmt(m.gold_24k_equivalent)}غ (٢٤)` : ''}${(m.fab_fee_amount && Number(m.fab_fee_amount) > 0) ? ` ${m.weight_grams ? '+' : ''}${diamondsEnabled ? 'نقدي (مصنعية/ألماس)' : 'مصنعية'} ${fmt(m.fab_fee_amount)} د.إ` : ''}</p>
        ${m.notes ? `<p class="text-[12px] text-on-surface-variant mt-1">${m.notes}</p>` : ''}
        ${m.invoice && m.invoice.invoice_number ? `<p class="text-[11px] text-outline mt-1">فاتورة: ${m.invoice.invoice_number}</p>` : ''}
      </div>`;
  }).join('');
}

function toggleSettleForm() {
  document.getElementById('settle-form').classList.toggle('hidden');
  setSettleMode('gold');
}

let settleMode = 'gold';
function setSettleMode(mode) {
  settleMode = mode;
  document.getElementById('settleTabGold').classList.toggle('active', mode === 'gold');
  document.getElementById('settleTabCash').classList.toggle('active', mode === 'cash');
  document.getElementById('settle-gold-fields').classList.toggle('hidden', mode !== 'gold');
  document.getElementById('settle-cash-fields').classList.toggle('hidden', mode !== 'cash');
}

async function submitSettlement() {
  const notes = document.getElementById('settle-notes').value.trim();
  const errEl = document.getElementById('settle-error');
  errEl.classList.add('hidden');

  let movement;
  if (settleMode === 'gold') {
    const weight = parseFloat(document.getElementById('settle-weight').value);
    const karat = parseInt(document.getElementById('settle-karat').value, 10);
    if (!weight || weight <= 0) {
      errEl.textContent = 'فضلاً أدخل وزناً صحيحاً';
      errEl.classList.remove('hidden');
      return;
    }
    movement = {
      store_id: GOLDMIND_STORE_ID,
      trader_id: currentTraderId,
      movement_type: 'debt_decrease',
      weight_grams: weight,
      karat: karat,
      gold_24k_equivalent: +(weight * (karat / 24)).toFixed(3),
      fab_fee_amount: 0,
      notes: notes || 'تسوية ذهب يدوية'
    };
  } else {
    const amount = parseFloat(document.getElementById('settle-cash-amount').value);
    if (!amount || amount <= 0) {
      errEl.textContent = 'فضلاً أدخل مبلغاً صحيحاً';
      errEl.classList.remove('hidden');
      return;
    }
    movement = {
      store_id: GOLDMIND_STORE_ID,
      trader_id: currentTraderId,
      movement_type: 'debt_decrease',
      weight_grams: 0,
      karat: null,
      gold_24k_equivalent: 0,
      fab_fee_amount: amount,
      notes: notes || (diamondsEnabled ? 'تسوية نقدية (مصنعية/ألماس)' : 'تسوية مصنعية نقدية')
    };
  }

  const btn = document.getElementById('settle-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  const { error } = await goldmindClient.from('trader_movements').insert(movement);

  btn.disabled = false;
  btn.textContent = 'حفظ التسوية';

  if (error) {
    errEl.textContent = 'تعذّر الحفظ: ' + error.message;
    errEl.classList.remove('hidden');
    return;
  }

  document.getElementById('settle-weight').value = '';
  document.getElementById('settle-cash-amount').value = '';
  document.getElementById('settle-notes').value = '';
  document.getElementById('settle-form').classList.add('hidden');
  const traderIdToReopen = currentTraderId;
  await load();
  showTraderDetail(traderIdToReopen);
}

function goBack() {
  if (currentTraderId) { showTradersList(); return; }
  window.location.href = 'index-ar.html';
}

load();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
