<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>مصروف جديد | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js?v=13"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d", "success": "#1e7d32", "success-container": "#d7f3dc"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="window.location.href='index-ar.html'" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="font-bold" style="direction:ltr;font-size:28px;">&#8594;</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">مصروف جديد</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md lg:max-w-3xl mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>

<div id="page-content" class="hidden py-6 flex flex-col gap-5">

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
<label class="block text-[12px] font-semibold text-on-surface-variant mb-2" for="category-select">خانة المصروف</label>
<div class="flex gap-2 mb-2">
<select class="flex-1 h-12 border border-outline-variant rounded-lg px-3 text-right" id="category-select">
<option value="">— اختر خانة —</option>
</select>
<button onclick="toggleNewCategoryForm()" class="w-12 h-12 border border-primary text-primary rounded-lg flex items-center justify-center" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
<div class="hidden flex gap-2" id="new-category-form">
<input class="flex-1 h-11 border border-outline-variant rounded-lg px-3 text-right" id="new-category-name" placeholder="اسم خانة جديدة"/>
<button onclick="saveNewCategory()" class="h-11 px-4 bg-primary text-white rounded-lg text-[13px] font-semibold" type="button">حفظ</button>
</div>
</div>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
<label class="block text-[12px] font-semibold text-on-surface-variant mb-2" for="amount-input">المبلغ</label>
<input class="w-full h-12 border border-outline-variant rounded-lg px-3 font-data-mono text-right mb-4" dir="ltr" id="amount-input" placeholder="0.00" step="0.01" type="number"/>
<label class="block text-[12px] font-semibold text-on-surface-variant mb-2" for="desc-input">الوصف / السبب</label>
<textarea class="w-full h-20 border border-outline-variant rounded-lg px-3 py-2 text-right" id="desc-input" placeholder="مثال: فاتورة كهرباء شهر أغسطس"></textarea>
</div>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
<h2 class="font-semibold text-[13px] mb-2">إرفاق مستند (اختياري)</h2>
<p class="text-[11px] text-outline mb-2">صورة أو PDF للفاتورة أو الإيصال — لتوثيق المصروف قانونياً.</p>
<input accept="image/*,application/pdf" class="hidden" id="attachment-input" type="file"/>
<button onclick="document.getElementById('attachment-input').click()" class="w-full h-12 border-2 border-dashed border-outline-variant rounded-lg flex items-center justify-center gap-2 text-on-surface-variant" type="button">
<span class="material-symbols-outlined">attach_file</span> <span id="attachment-label">اختر ملف</span>
</button>
</div>

<button onclick="saveExpense()" id="save-btn" class="w-full h-14 bg-secondary text-on-secondary rounded-lg font-bold shadow-md">حفظ المصروف</button>
<p class="text-error text-[12px] hidden text-center" id="save-error"></p>
<p class="text-success text-[12px] hidden text-center" id="save-success"></p>

</div>
</main>

<script>
let attachmentFile = null;

document.getElementById('attachment-input').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  attachmentFile = file || null;
  document.getElementById('attachment-label').textContent = file ? file.name : 'اختر ملف';
});

function toggleNewCategoryForm() {
  document.getElementById('new-category-form').classList.toggle('hidden');
}

async function loadCategories() {
  const { data, error } = await goldmindClient
    .from('expense_categories').select('id, name').eq('store_id', GOLDMIND_STORE_ID).order('name');

  const select = document.getElementById('category-select');
  select.innerHTML = '<option value="">— اختر خانة —</option>' +
    (data || []).map(c => `<option value="${c.id}">${gmEscapeHtml(c.name)}</option>`).join('');
}

async function saveNewCategory() {
  const name = document.getElementById('new-category-name').value.trim();
  if (!name) { alert('فضلاً أدخل اسم الخانة'); return; }

  const { data, error } = await goldmindClient
    .from('expense_categories').insert({ store_id: GOLDMIND_STORE_ID, name }).select().single();

  if (error) { alert('تعذّر الحفظ: ' + error.message); return; }

  await loadCategories();
  document.getElementById('category-select').value = data.id;
  document.getElementById('new-category-form').classList.add('hidden');
  document.getElementById('new-category-name').value = '';
}

async function saveExpense() {
  const categoryId = document.getElementById('category-select').value;
  const amount = parseFloat(document.getElementById('amount-input').value);
  const desc = document.getElementById('desc-input').value.trim();
  const errEl = document.getElementById('save-error');
  const okEl = document.getElementById('save-success');
  errEl.classList.add('hidden');
  okEl.classList.add('hidden');

  if (!categoryId) { errEl.textContent = 'فضلاً اختر خانة المصروف'; errEl.classList.remove('hidden'); return; }
  if (!amount || amount <= 0) { errEl.textContent = 'فضلاً أدخل مبلغاً صحيحاً'; errEl.classList.remove('hidden'); return; }
  if (!desc) { errEl.textContent = 'فضلاً اكتب وصفاً للمصروف'; errEl.classList.remove('hidden'); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  let attachmentUrl = null;
  if (attachmentFile) {
    const ext = (attachmentFile.name.split('.').pop() || 'bin').toLowerCase();
    const path = GOLDMIND_STORE_ID + '/expense-' + Date.now() + '.' + ext;
    const { error: uploadError } = await goldmindClient.storage
      .from('invoice-attachments').upload(path, attachmentFile, { upsert: false });
    if (uploadError) {
      btn.disabled = false;
      btn.textContent = 'حفظ المصروف';
      errEl.textContent = 'تعذّر رفع المرفق: ' + uploadError.message;
      errEl.classList.remove('hidden');
      return;
    }
    const { data: publicUrlData } = goldmindClient.storage.from('invoice-attachments').getPublicUrl(path);
    attachmentUrl = publicUrlData ? publicUrlData.publicUrl : null;
  }

  const { error } = await goldmindClient.from('expense_entries').insert({
    store_id: GOLDMIND_STORE_ID,
    category_id: categoryId,
    amount: amount,
    description: desc,
    attachment_url: attachmentUrl,
    created_by: GOLDMIND_STAFF_ID
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = 'حفظ المصروف';
    errEl.textContent = 'تعذّر الحفظ: ' + error.message;
    errEl.classList.remove('hidden');
    return;
  }

  // Also record as a cash-out movement so the daily cash box reflects it
  await goldmindClient.from('cash_movements').insert({
    store_id: GOLDMIND_STORE_ID,
    box: 'main',
    direction: 'out',
    amount: amount,
    description: 'مصروف: ' + desc,
    created_by: GOLDMIND_STAFF_ID
  });

  okEl.textContent = 'تم حفظ المصروف بنجاح';
  okEl.classList.remove('hidden');
  document.getElementById('amount-input').value = '';
  document.getElementById('desc-input').value = '';
  attachmentFile = null;
  document.getElementById('attachment-label').textContent = 'اختر ملف';
  btn.disabled = false;
  btn.textContent = 'حفظ المصروف';
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  await loadCategories();
  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('page-content').classList.remove('hidden');
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
