<style>
    html { font-size: 87.5%; }
    body { font-family: 'Inter', sans-serif; background: #f4f0e6; color: #2b241a; min-height: max(884px, 100dvh); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
    .no-print { }
    @media print { .no-print { display: none !important; } body { background: #fff; } .stmt-sheet { box-shadow: none !important; margin: 0 !important; } }
    .stmt-sheet { background: #fff; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); }

    .st-seg { display: inline-flex; border: 1px solid #d8cfb8; border-radius: 10px; overflow: hidden; }
    .st-seg button { padding: 6px 14px; font-size: 12px; font-weight: 700; background: #fff; color: #5b5140; }
    .st-seg button.on { background: #1F1A12; color: #fff; }
    .st-gold { table-layout: fixed; }
    .st-gold td { overflow-wrap: anywhere; }
    .stmt-table tr.st-d td { background: #F1E9D6; text-align: right; font-weight: 700; padding: 7px 10px; border-bottom: 0; }
    .stmt-table tr.st-v td { background: #faf6ec; font-weight: 700; }
    .st-pc { display: flex; align-items: center; gap: 6px; text-align: right; }
    @media (max-width: 640px) {
      .stmt-table th { font-size: 9.5px; padding: 6px 2px; }
      .stmt-table td { font-size: 11px; padding: 6px 2px; }

      .summary-card { padding: 10px 12px; }
      .st-ph { width: 38px; height: 38px; }
      .st-pc { flex-direction: column; text-align: center; gap: 2px; }

    .st-ph { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; display: inline-block; vertical-align: middle; }

<script>
function gmEscapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(n) { return (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtDate(d) { return gmFormatDateTime(d, { year: 'numeric', month: 'short', day: 'numeric' }); }

const GOLD_TYPE_LABELS = {
    'debt_increase|stock_received': 'استلام بضاعة',
    'debt_decrease|stock_given': 'إعطاء بضاعة',
    'debt_increase|opening_balance': 'رصيد سابق (دين علينا)',
    'debt_decrease|opening_balance': 'رصيد سابق (دين له)',
    'debt_increase|settlement': 'تسوية',
    'debt_decrease|settlement': 'تسوية',
    'debt_decrease|gold_to_cash': 'تسكير عملات — تسديد ذهب علينا',
    'debt_decrease|scrap_given': 'إخراج كسر بالكلفة',
    'debt_increase|gold_to_cash': 'تسكير عملات — تسديد ذهب لنا'
};
let ST_GOLD_GROUPS = [], ST_PIECES = {}, ST_CUR = '';
function stGet(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }
function stSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
let ST_VIEW = stGet('gm_stmt_view', 'vouchers'), ST_PHOTOS = stGet('gm_stmt_photos', '1') === '1';
// ↑ صادر = goods/gold going out to the trader; ↓ وارد = coming in from him
function stArrow(type) {
    return type === 'debt_increase'
        ? '<span class="material-symbols-outlined st-arrow" style="color:#3F6B47" title="وارد">arrow_downward</span>'
        : '<span class="material-symbols-outlined st-arrow" style="color:#8A3B32" title="صادر">arrow_upward</span>';
}
// strip the long repeated wording the give-out screen writes into notes
function stShort(n) {
    return String(n || '').replace(/^\s*(إخراج|إعطاء|استلام|إدخال)\s+(بضاعة|قطع|قطعة)\s*[—–-]\s*/, '').replace(/باركود\s*/g, '').trim();
}
const ST_SRC = { stock_given: 'بضاعة', stock_received: 'بضاعة', opening_balance: 'رصيد سابق', settlement: 'تسوية', gold_to_cash: 'تسكير عملات', scrap_given: 'كسر بالكلفة' };
const stBilled = m => Number(m.karat) ? Number(m.gold_24k_equivalent || 0) * 24 / Number(m.karat) : Number(m.weight_grams || 0);
function stRenderGold() {
    document.querySelectorAll('#stOpts [data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === ST_VIEW));
    document.querySelectorAll('#stOpts [data-photos]').forEach(b => b.classList.toggle('on', (b.dataset.photos === '1') === ST_PHOTOS));
    const sgn = m => m.movement_type === 'debt_increase' ? -1 : 1;
    const col = v => v >= 0 ? '#3F6B47' : '#8A3B32';
    const html = ST_GOLD_GROUPS.map(g => {
        const f = g.rows[0], s = sgn(f);
        const gold = g.rows.reduce((a, m) => a + sgn(m) * Number(m.gold_24k_equivalent || 0), 0);
        const fab = g.rows.reduce((a, m) => a + sgn(m) * Number(m.fab_fee_amount || 0), 0);
        const w = g.rows.reduce((a, m) => a + stBilled(m), 0);
        const pcs = g.rows.filter(m => m.piece_id).length;
        const karats = [...new Set(g.rows.map(m => m.karat).filter(Boolean))].join('/');
        let title = (ST_SRC[f.source] || '') + (f.batch_ref ? ' ' + f.batch_ref : '');
        if (g.rows.length === 1 && !f.piece_id && f.notes) title = stShort(f.notes);
        const dateRow = `<tr class="st-d"><td colspan="5">${stArrow(f.movement_type)} ${fmtDate(f.created_at)} <span class="font-normal text-gray-600">· ${gmEscapeHtml(title.trim() || '—')}${karats ? ' · عيار ' + karats : ''}</span></td></tr>`;
        const head = dateRow + `<tr class="st-v">
            <td>المجموع</td>
            <td>${pcs || '—'}</td>
            <td class="font-data-mono">${fmt(w)}</td>
            <td class="font-data-mono" style="color:${col(gold)}">${gold >= 0 ? '+' : ''}${fmt(gold)}</td>
            <td class="font-data-mono" style="color:${col(fab)}">${fab ? fmt(fab) : '—'}</td></tr>`;
        if (ST_VIEW !== 'details' || g.rows.length < 2 && !f.piece_id) return head;
        return head + g.rows.map(m => {
            const p = ST_PIECES[m.piece_id] || {};
            const ph = ST_PHOTOS && p.photo_url ? `<img class="st-ph" src="${gmEscapeHtml(p.photo_url)}" alt=""/>` : '';
            return `<tr class="st-p">
                <td><div class="st-pc">${ph}<span>${gmEscapeHtml(stShort(m.notes) || p.barcode || '')}</span></div></td>
                <td>${m.karat ? 'ع' + m.karat : ''}</td>
                <td class="font-data-mono">${fmt(stBilled(m))}</td>
                <td class="font-data-mono">${fmt(m.gold_24k_equivalent)}</td>
                <td class="font-data-mono">${Number(m.fab_fee_amount) ? fmt(m.fab_fee_amount) : ''}</td></tr>`;
        }).join('');
    }).join('');
    document.getElementById('stGoldRows').innerHTML = html || '<tr><td colspan="5" class="text-gray-400 py-6">لا توجد حركات ذهب بهذه الفترة</td></tr>';
}
document.addEventListener('click', e => {
    const b = e.target.closest('#stOpts button'); if (!b) return;
    if (b.dataset.view) { ST_VIEW = b.dataset.view; stSet('gm_stmt_view', ST_VIEW); }
    if (b.dataset.photos) { ST_PHOTOS = b.dataset.photos === '1'; stSet('gm_stmt_photos', ST_PHOTOS ? '1' : '0'); }
    stRenderGold();
});
let ST_TRADER = null, ST_STORE = {};
const stPdfName = () => 'كشف حساب ' + (ST_TRADER ? ST_TRADER.name : '') + '.pdf';
async function stWhatsApp(btn) {
    const text = `مرحباً ${ST_TRADER.name}،\nنرسل لكم كشف الحساب من ${ST_STORE.name || 'المحل'}.\n\nشكراً لتعاملكم معنا.`;
    const old = btn.innerHTML;
    btn.disabled = true;
    try { await gmWhatsAppPdf([gmReportNode(document.getElementById('page-content'))], stPdfName(), 'كشف حساب', text, ST_TRADER.phone, ST_STORE.country); }
    catch (e) { alert('تعذّر تجهيز ملف PDF: ' + (e && e.message ? e.message : e)); }
    finally { btn.disabled = false; btn.innerHTML = old; }
}

async function loadStatement() {
    const session = await requireGoldMindSession('login-entry-ar.html');
    if (!session) return;

    const params = new URLSearchParams(window.location.search);
    const traderId = params.get('trader');
    const fromDate = params.get('from');
    if (!traderId) { document.getElementById('loading-state').textContent = 'لا يوجد معرّف تاجر بالرابط'; return; }

    const { data: staffPerm } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
    const allowed = staffPerm && (staffPerm.role === 'owner' || (staffPerm.permissions && staffPerm.permissions['view_reports'] === true));
    if (!allowed) {
        document.getElementById('loading-state').classList.add('hidden');
        document.getElementById('no-access').classList.remove('hidden');
        return;
    }

    const [{ data: trader }, { data: store }] = await Promise.all([
        goldmindClient.from('traders').select('id, name, phone').eq('id', traderId).maybeSingle(),
        goldmindClient.from('stores').select('name, currency, country').eq('id', GOLDMIND_STORE_ID).maybeSingle()
    ]);
    if (!trader) { document.getElementById('loading-state').textContent = 'تعذّر إيجاد هذا التاجر'; return; }
    ST_TRADER = trader; ST_STORE = store || {};
    const CUR = (typeof gmCurrencySymbol === 'function' ? gmCurrencySymbol(ST_STORE.currency) : null) || ST_STORE.currency || '';

    let goldQuery = goldmindClient.from('trader_movements').select('*')
        .eq('store_id', GOLDMIND_STORE_ID).eq('trader_id', traderId).order('created_at', { ascending: true });
    if (fromDate) goldQuery = goldQuery.gte('created_at', fromDate + 'T00:00:00');
    const batchId = params.get('batch');
    if (batchId) goldQuery = goldQuery.eq('batch_id', batchId); // one voucher: its pieces with photos
    const { data: allMoves } = await goldQuery;
    if (batchId) { ST_VIEW = 'details'; ST_PHOTOS = true; }

    // ---- Header ----
    document.getElementById('stTraderName').textContent = trader.name;
    document.getElementById('stTraderPhone').textContent = trader.phone || '';
    document.getElementById('stStoreName').textContent = (store && store.name) || '';
    document.getElementById('stPeriodLabel').textContent = batchId ? 'سند واحد' : fromDate
        ? ('من ' + fmtDate(fromDate + 'T00:00:00') + ' إلى اليوم')
        : 'كل الحركات منذ بداية الحساب';

    // ---- Gold: same sign convention used everywhere else in ledger-ar.html ----
    // debt_increase -> shop owes the trader more (subtracts from "trader owes shop" balance)
    // debt_decrease -> trader owes the shop more / settles up (adds to that balance)
    let goldNet = 0;
    (allMoves || []).forEach(m => { goldNet += m.movement_type === 'debt_increase' ? -Number(m.gold_24k_equivalent || 0) : Number(m.gold_24k_equivalent || 0); });
    // one voucher = one batch (all pieces given/received together)
    const groups = [], byKey = {};
    (allMoves || []).forEach(m => {
        const k = m.batch_id || m.id;
        if (!byKey[k]) { byKey[k] = { key: k, rows: [] }; groups.push(byKey[k]); }
        byKey[k].rows.push(m);
    });
    ST_GOLD_GROUPS = groups.filter(g => g.rows.some(m => Number(m.gold_24k_equivalent || 0) !== 0));
    const goldIds = new Set(); ST_GOLD_GROUPS.forEach(g => g.rows.forEach(m => goldIds.add(m.id)));
    const pieceIds = [...new Set(ST_GOLD_GROUPS.flatMap(g => g.rows.map(m => m.piece_id)).filter(Boolean))];
    if (pieceIds.length) {
        const { data: pcs } = await goldmindClient.from('pieces').select('id, barcode, photo_url').in('id', pieceIds);
        (pcs || []).forEach(p => { ST_PIECES[p.id] = p; });
    }
    ST_CUR = CUR;
    document.getElementById('stFabCur').textContent = CUR ? ' (' + CUR + ')' : '';
    stRenderGold();
    document.getElementById('stGoldNet').textContent = fmt(goldNet) + ' غ';
    document.getElementById('stGoldNet').style.color = goldNet >= 0 ? '#3F6B47' : '#8A3B32';
    document.getElementById('stGoldHint').textContent = goldNet >= 0 ? '(التاجر مديون للمحل)' : '(المحل مديون للتاجر)';

    // ---- Cash: sourced from trader_movements.fab_fee_amount, same as the
    // live "دين نقدي" figure on ledger-ar.html — NOT from cash_movements,
    // which only records money that actually crossed the register and
    // completely misses debt-only entries (opening balance, stock
    // given/received) that never touch the cash box. Sourcing from
    // cash_movements alone made this statement's cash total wildly
    // understate the real debt.
    const CASH_TYPE_LABELS = {
        'debt_increase|opening_balance': 'رصيد سابق (دين علينا)',
        'debt_decrease|opening_balance': 'رصيد سابق (دين له)',
        'debt_increase|stock_received': 'استلام بضاعة (مصنعية)',
        'debt_decrease|stock_given': 'إعطاء بضاعة (مصنعية)',
        'debt_increase|settlement': 'تسوية واردة',
        'debt_decrease|settlement': 'تسوية صادرة',
        'debt_decrease|cash_out': 'صرف كاش للتاجر',
        'debt_increase|cash_in': 'قبض كاش من التاجر',
        'debt_increase|gold_to_cash': 'تسكير عملات — قيمة الذهب لصالح التاجر',
        'debt_decrease|gold_to_cash': 'تسكير عملات — قيمة الذهب لصالح المحل'
    };
    let cashNet = 0;
    (allMoves || []).forEach(m => { cashNet += m.movement_type === 'debt_increase' ? -Number(m.fab_fee_amount || 0) : Number(m.fab_fee_amount || 0); });
    // making of goods vouchers already shows in the gold table above
    const cashRows = (allMoves || []).filter(m => Number(m.fab_fee_amount || 0) !== 0 && !goldIds.has(m.id));
    document.getElementById('stCashRows').innerHTML = cashRows.map(m => {
        const signed = m.movement_type === 'debt_increase' ? -Number(m.fab_fee_amount || 0) : Number(m.fab_fee_amount || 0);
        const label = CASH_TYPE_LABELS[m.movement_type + '|' + m.source] || (signed >= 0 ? 'تخفيض دين' : 'زيادة دين');
        return `<tr>
            <td>${fmtDate(m.created_at)}</td>
            <td>${stArrow(m.movement_type)}</td>
            <td>${gmEscapeHtml(label)}</td>
            <td class="font-data-mono font-bold" style="color:${signed >= 0 ? '#3F6B47' : '#8A3B32'};">${signed >= 0 ? '+' : ''}${fmt(signed)} ${CUR}</td>
            <td class="text-[11px]">${gmEscapeHtml(stShort(m.notes) === label ? '' : stShort(m.notes))}</td>
        </tr>`;
    }).join('') || '<tr><td colspan="5" class="text-gray-400 py-6">لا توجد حركات نقدية بهذه الفترة</td></tr>';

    const cashCardsEl = document.getElementById('stCashCards');
    cashCardsEl.innerHTML = `<div class="summary-card flex-1" style="background:#E1EADB;">
        <div class="text-[11px] font-bold text-[#3F6B47] mb-1">صافي حركة النقد (${CUR})</div>
        <div class="text-[20px] font-bold font-data-mono" style="color:${cashNet >= 0 ? '#3F6B47' : '#8A3B32'};">${fmt(cashNet)}</div>
        <div class="text-[10px] text-[#8a7f68] mt-1">${cashNet >= 0 ? '(التاجر مديون للمحل)' : '(المحل مديون للتاجر)'}</div>
    </div>`;

    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('page-content').classList.remove('hidden');
}
