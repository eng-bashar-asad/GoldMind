<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="gmSmartBack('index-ar.html')" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 700; font-size: 28px;">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">الفواتير</h1>
</div>
<button onclick="gmOpenTimezonePicker()" class="w-9 h-9 rounded-full border border-outline-variant flex items-center justify-center active:scale-90 transition-all" title="المنطقة الزمنية للعرض">
<span class="material-symbols-outlined text-primary text-[18px]">schedule</span>
</button>
</div>

<main class="pb-32 max-w-md lg:max-w-7xl mx-auto px-4 lg:px-8">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>

<div id="page-content" class="hidden py-4 lg:py-6">

<!-- Filters -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex flex-col gap-3 mb-3 lg:grid lg:grid-cols-[2fr_1fr_1.4fr_auto] lg:items-end lg:gap-4">

<div class="relative">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
<input id="searchInput" oninput="applyFilters()" placeholder="رقم الفاتورة، الباركود، اسم العميل/التاجر، أو رقم الهاتف" class="w-full h-11 border border-outline-variant rounded-lg pr-10 pl-3 text-[13px] bg-background text-on-background"/>
</div>

<div>
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">القسم</label>
<select id="typeFilter" onchange="applyFilters()" class="w-full h-11 border border-outline-variant rounded-lg px-3 text-[13px] bg-background text-on-background">
<option value="">الكل</option>
<option value="sale">مبيعات زبائن</option>
<option value="traderSale">مبيعات تجار (بضاعة خرجت لتاجر)</option>
<option value="buyRetail">مشتريات كسر (من زبائن)</option>
<option value="buyTrader">مشتريات من تاجر</option>
<option value="stockOut">إخراج بضاعة</option>
<option value="stockIn">إدخال بضاعة</option>
<option value="traderCashOut">دفعات تجار — صادر كاش</option>
<option value="traderCashIn">دفعات تجار — وارد كاش</option>
<option value="customerPay">دفعات زبائن</option>
<option value="return">مرتجع</option>
<option value="repair">صيانة</option>
</select>
</div>

<div class="grid grid-cols-2 gap-3">
<div>
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">من تاريخ</label>
<input id="fromDate" type="date" onchange="loadData()" class="w-full h-11 border border-outline-variant rounded-lg px-2 text-[13px] bg-background text-on-background"/>
</div>
<div>
<label class="block text-[11px] font-semibold text-on-surface-variant mb-1">إلى تاريخ</label>
<input id="toDate" type="date" onchange="loadData()" class="w-full h-11 border border-outline-variant rounded-lg px-2 text-[13px] bg-background text-on-background"/>
</div>
</div>

<button onclick="clearFilters()" class="text-[11px] text-secondary font-semibold self-start lg:self-center lg:h-11">مسح الفلاتر</button>
</div>

<p class="text-[11px] text-on-surface-variant" id="resultCount"></p>

<div id="results-list" class="flex flex-col gap-2"></div>

</div>

</div>
</main>

<script>
const TYPE_LABELS = { sale: 'بيع', buyTrader: 'شراء من تاجر', buyRetail: 'شراء كسر', traderPay: 'سند دفع تاجر', return: 'مرتجع', repair: 'صيانة',
  traderSale: 'مبيعات تاجر', stockOut: 'إخراج بضاعة', stockIn: 'إدخال بضاعة', traderCashOut: 'صادر لتاجر', traderCashIn: 'وارد من تاجر', customerPay: 'دفعة زبون' };
const TYPE_COLORS = {
  traderSale: 'bg-teal-50 text-teal-700', stockOut: 'bg-slate-100 text-slate-700', stockIn: 'bg-slate-100 text-slate-700',
  traderCashOut: 'bg-rose-50 text-rose-700', traderCashIn: 'bg-blue-50 text-blue-700', customerPay: 'bg-blue-50 text-blue-700',
  sale: 'bg-green-50 text-green-700',
  buyTrader: 'bg-amber-50 text-amber-700',
  buyRetail: 'bg-amber-50 text-amber-700',
  traderPay: 'bg-blue-50 text-blue-700',
  return: 'bg-red-50 text-red-700',
  repair: 'bg-purple-50 text-purple-700'
};
// One colour per kind of document (design «الفواتير بالألوان»): the row's edge, its badge and the filter chip.
const KIND_COLORS = {
  sale: ['#1E7D32', '#E3F1E4', '#1B5E20'], buyRetail: ['#1F5FA8', '#E3EDF8', '#1A4F8C'], buyTrader: ['#3B4C9B', '#E6E9F6', '#33427F'],
  traderPay: ['#6B3FA0', '#EEE6F6', '#5B3588'], traderCashOut: ['#6B3FA0', '#EEE6F6', '#5B3588'], traderCashIn: ['#6B3FA0', '#EEE6F6', '#5B3588'],
  traderSale: ['#6B3FA0', '#EEE6F6', '#5B3588'], stockIn: ['#0F766E', '#DDF1EE', '#0B5F58'], stockOut: ['#B45309', '#FCEBD7', '#8A4006'],
  customerPay: ['#7A6640', '#EFE7D2', '#5E4E30'], return: ['#B3261E', '#FBE4E1', '#8A1D17'], repair: ['#8C6A2E', '#F4ECDC', '#6B4F1F'],
  exchange: ['#3D5A80', '#E6ECF3', '#2F4763']
};
const KIND_GROUPS = [['sale', 'بيع', ['sale']], ['buyRetail', 'شراء كسر', ['buyRetail']], ['buyTrader', 'شراء من تاجر', ['buyTrader']],
  ['traders', 'سندات التجار', ['traderPay', 'traderCashOut', 'traderCashIn', 'traderSale']], ['stockIn', 'إدخال بضاعة', ['stockIn']],
  ['stockOut', 'إخراج بضاعة', ['stockOut']], ['customerPay', 'دفعات زبائن', ['customerPay']], ['return', 'مرتجع', ['return']], ['repair', 'صيانة', ['repair']]];
const DAY_BANDS = [['#F2EAD6', '#7A6640'], ['#E9EEF4', '#3D5A80'], ['#EEF3E8', '#4F6B3A'], ['#F5E9EC', '#8A4B5A']];
let KIND_PICK = null; // a KIND_GROUPS id, or null for all
const kindColor = r => KIND_COLORS[r.isExchange ? 'exchange' : r.type] || ['#76777d', '#EFEFEF', '#4A4A4A'];
function renderKindChips(rows) {
  const el = document.getElementById('kind-chips'); if (!el) return;
  const count = id => { const g = KIND_GROUPS.find(x => x[0] === id); return rows.filter(r => g[2].includes(r.type)).length; };
  el.innerHTML = `<button type="button" onclick="pickKind(null)" aria-pressed="${!KIND_PICK}" class="shrink-0 h-9 px-3 rounded-full border-2 text-[12.5px] font-bold" style="${!KIND_PICK ? 'background:#1C1A16;color:#FBF8F1;border-color:#1C1A16' : 'background:#fff;border-color:#CBBF9E'}">الكل <span class="font-data-mono">${rows.length}</span></button>` +
    KIND_GROUPS.filter(g => count(g[0])).map(g => { const c = KIND_COLORS[g[2][0]], on = KIND_PICK === g[0];
      return `<button type="button" onclick="pickKind('${g[0]}')" aria-pressed="${on}" class="shrink-0 h-9 px-3 rounded-full border-2 text-[12.5px] font-bold inline-flex items-center gap-1.5" style="border-color:${c[0]};${on ? 'background:' + c[0] + ';color:#fff' : 'background:#fff;color:' + c[2]}"><span style="width:8px;height:8px;border-radius:50%;background:${on ? '#fff' : c[0]}"></span>${g[1]} <span class="font-data-mono">${count(g[0])}</span></button>`; }).join('');
}
if (window.matchMedia) { const mq = window.matchMedia('(min-width: 1024px)'); (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(() => { if (allRows.length) applyFilters(); }); }
function pickKind(id) { KIND_PICK = KIND_PICK === id ? null : id; if (KIND_PICK) document.getElementById('typeFilter').value = ''; applyFilters(); }

const STATUS_LABELS = { paid: 'مدفوعة', unpaid: 'غير مدفوعة', cancelled: 'ملغاة', received: 'مستلمة', in_progress: 'قيد التصليح', ready: 'جاهزة', delivered: 'تم التسليم' };

let allRows = [];
const INV_SELECT = 'id, invoice_number, type, is_exchange, status, total_amount, fabrication_fees, vat_amount, created_at, currency, pay_currency, pay_fx_rate, pay_breakdown, customer:customer_id(name, phone), trader:trader_id(name, phone), counterparty_name';

// Barcodes (all invoices) + net weight (buyTrader) from invoice_items, in chunks of 100 ids.
async function gmLoadItems(ids) {
  const out = [];
  for (let k = 0; k < ids.length; k += 100) {
    const { data } = await goldmindClient.from('invoice_items').select('invoice_id, barcode, weight_grams, karat').in('invoice_id', ids.slice(k, k + 100));
    out.push(...(data || []));
  }
  return out;
}

// What the customer actually paid in: one foreign currency (pay_currency x rate), a split
// (pay_breakdown), or the store currency.
function gmPaidText(i) {
  const n = v => Number(v).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  const isBuy = i.type === 'buyTrader' || i.type === 'buyRetail';
  if (!isBuy && i.pay_currency && Number(i.pay_fx_rate) > 0) return { main: n(Number(i.total_amount || 0) * Number(i.pay_fx_rate)) + ' ' + i.pay_currency, sub: true };
  if (Array.isArray(i.pay_breakdown) && i.pay_breakdown.length) return { main: null, split: i.pay_breakdown.map(b => n(b.amount) + ' ' + b.currency).join(' + ') };
  return { main: null };
}

// Documents that are not invoices, so every section can be searched here: goods out to traders,
// goods received, stock vouchers, trader cash in/out and customer payments.
async function gmOtherDocRows(fromISO, toISO) {
  const range = q => { if (fromISO) q = q.gte('created_at', fromISO); if (toISO) q = q.lte('created_at', toISO); return q; };
  const [{ data: tms }, { data: vouchers }, { data: pays }] = await Promise.all([
    range(goldmindClient.from('trader_movements')
      .select('id, trader_id, source, batch_id, batch_ref, gold_24k_equivalent, fab_fee_amount, currency, notes, created_at, trader:trader_id(name, phone)')
      .eq('store_id', GOLDMIND_STORE_ID).in('source', ['stock_given', 'scrap_given', 'stock_received', 'cash_out', 'cash_in'])
      .order('created_at', { ascending: false }).limit(1000)),
    range(goldmindClient.from('stock_vouchers').select('id, direction, voucher_number, notes, created_at, party:party_id(name)')
      .eq('store_id', GOLDMIND_STORE_ID).order('created_at', { ascending: false }).limit(300)),
    range(goldmindClient.from('customer_debts').select('id, customer_id, cash_amount, currency, notes, created_at, customer:customer_id(name, phone)')
      .eq('store_id', GOLDMIND_STORE_ID).eq('source', 'payment').order('created_at', { ascending: false }).limit(300))
  ]);
  const TYPE_OF = { stock_given: 'traderSale', scrap_given: 'traderSale', stock_received: 'stockIn', cash_out: 'traderCashOut', cash_in: 'traderCashIn' };
  const groups = new Map(); // one row per voucher (batch), otherwise per movement
  (tms || []).forEach(m => {
    const key = m.batch_id ? 'b' + m.batch_id : 'm' + m.id;
    const g = groups.get(key);
    if (g) { g.g24 += Number(m.gold_24k_equivalent || 0); g.fab += Number(m.fab_fee_amount || 0); g.n++; return; }
    groups.set(key, { m, g24: Number(m.gold_24k_equivalent || 0), fab: Number(m.fab_fee_amount || 0), n: 1 });
  });
  const rows = [...groups.values()].map(({ m, g24, fab, n }) => {
    const type = TYPE_OF[m.source], cash = type === 'traderCashOut' || type === 'traderCashIn';
    return { id: m.id, kind: 'trader', number: m.batch_ref || (cash ? 'سند كاش' : 'سند تاجر'), type, status: '',
      amount: fab, currency: m.currency || '', weightNote: cash ? '' : fmt(g24) + ' غ ع24' + (n > 1 ? ' · ' + n + ' قطعة' : ''),
      created_at: m.created_at, counterpartyName: (m.trader && m.trader.name) || '', counterpartyPhone: (m.trader && m.trader.phone) || '',
      href: 'ledger-ar.html?trader=' + m.trader_id };
  });
  (vouchers || []).forEach(v => rows.push({ id: v.id, kind: 'voucher', number: v.voucher_number || '—', type: v.direction === 'in' ? 'stockIn' : 'stockOut',
    status: '', amount: null, created_at: v.created_at, counterpartyName: (v.party && v.party.name) || '', counterpartyPhone: '',
    href: 'stock-voucher-print-ar.html?id=' + v.id }));
  (pays || []).forEach(p => rows.push({ id: p.id, kind: 'payment', number: 'دفعة', type: 'customerPay', status: '',
    amount: p.cash_amount, currency: p.currency || '', created_at: p.created_at,
    counterpartyName: (p.customer && p.customer.name) || '', counterpartyPhone: (p.customer && p.customer.phone) || '',
    href: 'customer-debts-ar.html?open=' + p.customer_id }));
  return rows;
}

async function gmBuildInvoiceRows(invoices) {
  const items = await gmLoadItems(invoices.map(i => i.id));
  const bc = {}, weightByInvoice = {};
  items.forEach(it => {
    if (it.barcode) (bc[it.invoice_id] = bc[it.invoice_id] || []).push(String(it.barcode));
    weightByInvoice[it.invoice_id] = (weightByInvoice[it.invoice_id] || 0) + Number(it.weight_grams || 0) * (Number(it.karat || 0) / 24);
  });
  return invoices.map(i => {
    const paid = gmPaidText(i);
    return {
      id: i.id,
      kind: 'invoice',
      number: i.invoice_number,
      type: i.type,
      status: i.status,
      // buyTrader: total_amount is only the cash paid now; the fab fee + VAT is the debt it created.
      amount: i.type === 'buyTrader' ? (Number(i.fabrication_fees || 0) + Number(i.vat_amount || 0)) : i.total_amount,
      currency: i.currency || '',
      paidMain: paid.main, paidSub: !!paid.sub, paidSplit: paid.split || '',
      barcodes: bc[i.id] || [],
      isExchange: !!i.is_exchange,
      isTraderDebt: i.type === 'buyTrader',
      netWeight: i.type === 'buyTrader' ? (weightByInvoice[i.id] || 0) : null,
      created_at: i.created_at,
      counterpartyName: (i.customer && i.customer.name) || (i.trader && i.trader.name) || i.counterparty_name || '',
      counterpartyPhone: (i.customer && i.customer.phone) || (i.trader && i.trader.phone) || '',
      href: 'invoice-print-ar.html?id=' + i.id
    };
  });
}

// A barcode typed in the search may belong to an invoice older than the 300 loaded: look it up.
let gmBcTimer = null, gmBcSeen = {};
function gmBarcodeLookup(q) {
  clearTimeout(gmBcTimer);
  if (q.length < 3 || gmBcSeen[q]) return;
  gmBcTimer = setTimeout(async () => {
    gmBcSeen[q] = true;
    const { data: hits } = await goldmindClient.from('invoice_items').select('invoice_id').ilike('barcode', '%' + q + '%').limit(50);
    const have = new Set(allRows.map(r => r.id));
    const ids = [...new Set((hits || []).map(h => h.invoice_id))].filter(id => !have.has(id));
    if (!ids.length) return;
    const { data: inv } = await goldmindClient.from('invoices').select(INV_SELECT).eq('store_id', GOLDMIND_STORE_ID).in('id', ids);
    if (!inv || !inv.length) return;
    allRows = allRows.concat(await gmBuildInvoiceRows(inv)).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    if (document.getElementById('searchInput').value.trim().toLowerCase() === q) applyFilters();
  }, 350);
}

function fmt(n) { return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

async function loadData() {
  const fromVal = document.getElementById('fromDate').value;
  const toVal = document.getElementById('toDate').value;
  const fromISO = fromVal ? new Date(fromVal + 'T00:00:00').toISOString() : null;
  const toISO = toVal ? new Date(toVal + 'T23:59:59').toISOString() : null;

  let invQuery = goldmindClient
    .from('invoices')
    .select(INV_SELECT)
    .eq('store_id', GOLDMIND_STORE_ID)
    .order('created_at', { ascending: false })
    .limit(300);
  if (fromISO) invQuery = invQuery.gte('created_at', fromISO);
  if (toISO) invQuery = invQuery.lte('created_at', toISO);

  let repQuery = goldmindClient
    .from('repair_tickets')
    .select('id, ticket_number, customer_name, customer_phone, estimated_cost, status, created_at')
    .eq('store_id', GOLDMIND_STORE_ID)
    .order('created_at', { ascending: false })
    .limit(300);
  if (fromISO) repQuery = repQuery.gte('created_at', fromISO);
  if (toISO) repQuery = repQuery.lte('created_at', toISO);

  const [{ data: invoices, error: invErr }, { data: repairs, error: repErr }, otherRows] = await Promise.all([invQuery, repQuery, gmOtherDocRows(fromISO, toISO)]);

  const invRows = (await gmBuildInvoiceRows(invoices || [])).concat(otherRows);

  const repRows = (repairs || []).map(r => ({
    id: r.id,
    kind: 'repair',
    number: r.ticket_number || '—',
    type: 'repair',
    status: r.status,
    amount: r.estimated_cost,
    created_at: r.created_at,
    counterpartyName: r.customer_name || '',
    counterpartyPhone: r.customer_phone || '',
    href: 'repair-detail-ar.html?id=' + r.id
  }));

  allRows = invRows.concat(repRows).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  if (invErr || repErr) {
    document.getElementById('results-list').innerHTML = `<p class="text-error text-sm text-center py-8">تعذّر تحميل البيانات: ${(invErr || repErr).message}</p>`;
  } else {
    applyFilters();
  }
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const type = document.getElementById('typeFilter').value;

  let rows = allRows;
  if (type) { rows = rows.filter(r => r.type === type); KIND_PICK = null; }
  if (q) {
    rows = rows.filter(r =>
      (r.number || '').toLowerCase().includes(q) ||
      (r.counterpartyName || '').toLowerCase().includes(q) ||
      (r.counterpartyPhone || '').toLowerCase().includes(q) ||
      (r.barcodes || []).some(b => b.toLowerCase().includes(q))
    );
    gmBarcodeLookup(q);
  }

  renderKindChips(rows);
  if (KIND_PICK) { const g = KIND_GROUPS.find(x => x[0] === KIND_PICK); rows = rows.filter(r => g[2].includes(r.type)); }
  document.getElementById('resultCount').textContent = rows.length + ' نتيجة';
  const list = document.getElementById('results-list');
  const empty = document.getElementById('empty-state');

  if (rows.length === 0) {
    list.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');

  // grouped by day: a header per date with the count and that day's sales
  const dayKey = r => gmFormatDateTime(r.created_at, { day: 'numeric', month: 'numeric', year: 'numeric' });
  const groups = [];
  rows.forEach(r => { const k = dayKey(r); const g = groups[groups.length - 1]; if (g && g.key === k) g.rows.push(r); else groups.push({ key: k, rows: [r] }); });
  const today = dayKey({ created_at: new Date() }), yday = dayKey({ created_at: new Date(Date.now() - 864e5) });
  const weekday = d => gmFormatDateTime(d, { weekday: 'long' });
  const wide = window.matchMedia && window.matchMedia('(min-width: 1024px)').matches;
  const dayHead = (g, gi, label, sales, sum, cur, buys, bsum) => { const band = DAY_BANDS[gi % DAY_BANDS.length];
    return `<div class="inv-day flex items-center gap-3 px-3 py-2 rounded-xl" style="background:${band[0]}">
      <span class="rounded-lg px-3 py-1 text-[12.5px] font-bold text-white" style="background:${band[1]}">${label} <span class="font-data-mono">${g.key}</span></span>
      <span class="text-[11.5px] text-on-surface-variant">${g.rows.length} ${g.rows.length === 1 ? 'مستند' : 'مستندات'}</span>
      <span class="ms-auto text-[12px]">${sales.length ? 'مبيعات <b class="font-data-mono" dir="ltr" style="color:#1B5E20">' + fmt(sum) + (cur ? ' ' + gmEscapeHtml(cur) : '') + '</b>' : ''}${buys.length ? ' · مشتريات <b class="font-data-mono" dir="ltr" style="color:#1A4F8C">' + fmt(bsum) + '</b>' : ''}</span>
    </div>`; };
  const amountHtml = r => r.amount == null ? '—' : (r.paidMain ? gmEscapeHtml(r.paidMain) : fmt(r.isExchange ? Math.abs(r.amount) : r.amount) + (r.currency ? ' ' + gmEscapeHtml(r.currency) : ''));
  list.innerHTML = (wide ? '<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden"><table class="w-full border-collapse text-[13px]"><thead><tr>' +
      ['الوقت', 'الرقم', 'النوع', 'الطرف', 'التفاصيل', 'الحالة', 'المبلغ'].map((h, i) => `<th class="px-3 py-2.5 text-[12px] font-bold text-on-surface-variant bg-surface-container-low border-b border-outline-variant" style="text-align:${i === 6 ? 'left' : 'right'}">${h}</th>`).join('') + '</tr></thead><tbody>' : '') +
    groups.map((g, gi) => {
    const sales = g.rows.filter(r => r.type === 'sale');
    const buys = g.rows.filter(r => r.type === 'buyRetail' || r.type === 'buyTrader');
    const cur = (sales[0] && sales[0].currency) || '';
    const sum = sales.reduce((t, r) => t + Number(r.amount || 0), 0), bsum = buys.reduce((t, r) => t + Number(r.amount || 0), 0);
    const label = g.key === today ? 'اليوم' : g.key === yday ? 'أمس' : weekday(g.rows[0].created_at);
    const head = dayHead(g, gi, label, sales, sum, cur, buys, bsum);
    if (wide) return `<tr><td colspan="7" class="p-1.5">${head}</td></tr>` + g.rows.map(r => {
      const kc = kindColor(r), statusLabel = STATUS_LABELS[r.status] || r.status || '';
      const details = [r.isTraderDebt ? 'وزن صافي ' + fmt(r.netWeight) + ' غ' : '', r.weightNote ? gmEscapeHtml(r.weightNote) : ''].filter(Boolean).join(' · ');
      return `<tr class="inv-row cursor-pointer hover:bg-surface-container-low" onclick="location.href='${r.href}'" style="box-shadow:inset -5px 0 0 ${kc[0]}">
        <td class="px-3 py-2 border-b border-outline-variant font-data-mono whitespace-nowrap">${gmFormatDateTime(r.created_at, { hour: '2-digit', minute: '2-digit' })}</td>
        <td class="px-3 py-2 border-b border-outline-variant font-data-mono font-bold whitespace-nowrap"><a href="${r.href}" onclick="event.stopPropagation()">${gmEscapeHtml(r.number || '')}</a></td>
        <td class="px-3 py-2 border-b border-outline-variant whitespace-nowrap"><span class="rounded-full px-2.5 py-0.5 text-[12px] font-bold" style="background:${kc[1]};color:${kc[2]}">${r.isExchange ? 'تبديل' : (TYPE_LABELS[r.type] || gmEscapeHtml(r.type))}</span></td>
        <td class="px-3 py-2 border-b border-outline-variant">${gmEscapeHtml(r.counterpartyName || 'بدون اسم')}${r.counterpartyPhone ? ' <span class="text-[11px] text-on-surface-variant font-data-mono" dir="ltr">' + gmEscapeHtml(r.counterpartyPhone) + '</span>' : ''}</td>
        <td class="px-3 py-2 border-b border-outline-variant text-[12px] text-on-surface-variant">${details}${r.barcodes && r.barcodes.length ? '<div class="inv-bc font-data-mono flex flex-wrap gap-1 mt-0.5" dir="ltr">' + gmBarcodeChips(r.barcodes, q) + '</div>' : ''}</td>
        <td class="px-3 py-2 border-b border-outline-variant text-[12px] whitespace-nowrap">${gmEscapeHtml(statusLabel)}</td>
        <td class="px-3 py-2 border-b border-outline-variant font-data-mono font-bold text-left whitespace-nowrap" dir="ltr"><span class="inv-amount">${amountHtml(r)}</span>${r.paidMain ? '<div class="text-[10px] font-normal text-on-surface-variant">' + fmt(r.amount) + ' ' + gmEscapeHtml(r.currency || '') + '</div>' : ''}${r.paidSplit ? '<div class="inv-split text-[10px] font-normal text-on-surface-variant">' + gmEscapeHtml(r.paidSplit) + '</div>' : ''}</td></tr>`;
    }).join('');
    return `<div class="mt-2">${head}</div>` + g.rows.map(r => {
    const dateStr = gmFormatDateTime(r.created_at, { hour: '2-digit', minute: '2-digit' });
    const kc = kindColor(r);
    const statusLabel = STATUS_LABELS[r.status] || r.status || '';
    return `
      <a href="${r.href}" style="border-inline-start:5px solid ${kc[0]}" class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 flex items-center gap-3 justify-between hover:bg-surface-container-low transition-colors active:scale-[0.99]">
        <div class="w-10 h-10 rounded-full gm-avatar-grad flex items-center justify-center font-bold text-[13px] shrink-0">${gmEscapeHtml(gmInitials(r.counterpartyName))}</div>
        <div class="flex flex-col gap-1 min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="font-data-mono font-bold text-[13px]">${r.number}</span>
            <span class="type-badge" style="background:${kc[1]};color:${kc[2]}">${r.isExchange ? 'تبديل' : (TYPE_LABELS[r.type] || r.type)}</span>
          </div>
          <p class="text-[12px] text-on-surface-variant truncate">${r.counterpartyName || 'بدون اسم'} ${r.counterpartyPhone ? '· ' + r.counterpartyPhone : ''}</p>
          <p class="text-[10px] text-outline">${dateStr}${statusLabel ? ' · ' + statusLabel : ''}${r.isTraderDebt ? ' · وزن صافي ' + fmt(r.netWeight) + ' غ' : ''}${r.weightNote ? ' · ' + gmEscapeHtml(r.weightNote) : ''}</p>
          ${r.barcodes && r.barcodes.length ? `<p class="inv-bc text-[11px] font-data-mono text-on-surface-variant flex flex-wrap gap-1" dir="ltr">${gmBarcodeChips(r.barcodes, q)}</p>` : ''}
        </div>
        <div class="flex items-center gap-1 shrink-0">
          <div class="flex flex-col items-end">
            ${r.amount == null ? '' : `<span class="inv-amount font-data-mono font-bold text-[14px]" dir="ltr">${r.paidMain ? gmEscapeHtml(r.paidMain) : fmt(r.isExchange ? Math.abs(r.amount) : r.amount) + (r.currency ? ' ' + gmEscapeHtml(r.currency) : '')}</span>`}
            ${r.isExchange ? `<span class="text-[9px] text-on-surface-variant">${Number(r.amount) > 0.004 ? 'فرق على الزبون' : Number(r.amount) < -0.004 ? 'فرق للزبون' : 'بدون فرق'}</span>` : ''}
            ${r.paidMain ? `<span class="font-data-mono text-[10px] text-on-surface-variant" dir="ltr">${fmt(r.amount)} ${gmEscapeHtml(r.currency)}</span>` : ''}
            ${r.paidSplit ? `<span class="inv-split font-data-mono text-[10px] text-on-surface-variant" dir="ltr">${gmEscapeHtml(r.paidSplit)}</span>` : ''}
            ${r.isTraderDebt ? '<span class="text-[9px] text-on-surface-variant">دين مصنعية</span>' : ''}
          </div>
          <span class="material-symbols-outlined text-on-surface-variant text-[18px]">chevron_left</span>
        </div>
      </a>`;
  }).join('');
  }).join('') + (wide ? '</tbody></table></div>' : '');
}

function gmBarcodeChips(list, q) {
  const shown = list.slice(0, 8).map(b => `<span class="px-1.5 rounded ${q && b.toLowerCase().includes(q) ? 'bg-amber-200 text-amber-900 font-bold' : 'bg-surface-container-high'}">${gmEscapeHtml(b)}</span>`);
  if (list.length > 8) {
    const hit = q && list.slice(8).find(b => b.toLowerCase().includes(q));
    if (hit) shown.push(`<span class="px-1.5 rounded bg-amber-200 text-amber-900 font-bold">${gmEscapeHtml(hit)}</span>`);
    shown.push(`<span>+${list.length - 8}</span>`);
  }
  return shown.join('');
}

function clearFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('typeFilter').value = '';
  document.getElementById('fromDate').value = '';
  document.getElementById('toDate').value = '';
  loadData();
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('page-content').classList.remove('hidden');
  await loadData();
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
