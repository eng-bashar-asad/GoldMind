<script>
let currentPiece = null;
let selectedPhotoFile = null;
let photoRemoved = false;
let selectedColor = 'Gold';
let canEdit = false;
let canDelete = false;

const pieceId = new URLSearchParams(window.location.search).get('id');

const photoInput = document.getElementById('photo-input');
const photoPlaceholder = document.getElementById('photo-placeholder');
const photoPreview = document.getElementById('photo-preview');
const photoRemoveBtn = document.getElementById('photo-remove-btn');

function applyPhotoFile(file) {
  if (!file) return;
  selectedPhotoFile = file;
  photoRemoved = false;
  const url = URL.createObjectURL(file);
  photoPreview.src = url;
  photoPreview.classList.remove('hidden');
  photoPlaceholder.classList.add('hidden');
  photoRemoveBtn.classList.remove('hidden');
  photoRemoveBtn.classList.add('flex');
}

async function triggerPhotoCapture() {
  if (typeof GMCamera !== 'undefined' && GMCamera.isSupported()) {
    const file = await GMCamera.capture();
    if (file) { applyPhotoFile(file); return; }
  }
  photoInput.click();
}

photoInput.addEventListener('change', () => {
  const file = photoInput.files && photoInput.files[0];
  applyPhotoFile(file);
});

function removePhoto() {
  selectedPhotoFile = null;
  photoRemoved = true;
  photoInput.value = '';
  photoPreview.classList.add('hidden');
  photoPlaceholder.classList.remove('hidden');
  photoRemoveBtn.classList.add('hidden');
  photoRemoveBtn.classList.remove('flex');
}

function setColor(color) {
  selectedColor = color;
  document.querySelectorAll('.color-btn').forEach(btn => {
    const active = btn.dataset.color === color;
    btn.classList.toggle('border-2', active);
    btn.classList.toggle('border-primary', active);
    btn.classList.toggle('border', !active);
    btn.querySelector('span').classList.toggle('font-bold', active);
  });
}
document.querySelectorAll('.color-btn').forEach(btn => btn.addEventListener('click', () => setColor(btn.dataset.color)));

// ---------- Type / Category expandable dropdowns ----------
const ADD_NEW_VALUE = '__add_new__';
const classificationCache = {};

async function loadClassificationOptions(selectId, fieldKey, label, selectedValue) {
  const select = document.getElementById(selectId);
  const { data, error } = await goldmindClient
    .from('piece_classification_options')
    .select('value')
    .eq('store_id', GOLDMIND_STORE_ID)
    .eq('field_key', fieldKey)
    .order('value', { ascending: true });

  if (error) { console.error('classification load error', fieldKey, error); return; }

  classificationCache[fieldKey] = (data || []).map(r => r.value);
  renderClassificationSelect(select, fieldKey, label, selectedValue);
}

function renderClassificationSelect(select, fieldKey, label, selectedValue) {
  const current = selectedValue !== undefined ? selectedValue : select.value;
  select.innerHTML = '';
  const emptyOpt = document.createElement('option');
  emptyOpt.value = '';
  emptyOpt.textContent = 'اختر ' + label;
  select.appendChild(emptyOpt);

  (classificationCache[fieldKey] || []).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    select.appendChild(opt);
  });

  const addOpt = document.createElement('option');
  addOpt.value = ADD_NEW_VALUE;
  addOpt.textContent = '+ إضافة صنف جديد...';
  select.appendChild(addOpt);

  if (current && (classificationCache[fieldKey] || []).includes(current)) {
    select.value = current;
  }
}

async function handleClassificationChange(selectId, fieldKey, label) {
  const select = document.getElementById(selectId);
  if (select.value !== ADD_NEW_VALUE) return;

  const newValue = (prompt('أدخل قيمة ' + label + ' الجديدة:') || '').trim();
  if (!newValue) { renderClassificationSelect(select, fieldKey, label, ''); return; }

  if ((classificationCache[fieldKey] || []).includes(newValue)) {
    renderClassificationSelect(select, fieldKey, label, newValue);
    return;
  }

  const { error } = await goldmindClient.from('piece_classification_options').insert({
    store_id: GOLDMIND_STORE_ID,
    field_key: fieldKey,
    value: newValue,
    created_by: GOLDMIND_STAFF_ID
  });

  if (error && error.code !== '23505') {
    alert('تعذّر إضافة الصنف: ' + error.message);
    renderClassificationSelect(select, fieldKey, label, '');
    return;
  }

  if (!classificationCache[fieldKey]) classificationCache[fieldKey] = [];
  classificationCache[fieldKey].push(newValue);
  classificationCache[fieldKey].sort((a, b) => a.localeCompare(b, 'ar'));
  renderClassificationSelect(select, fieldKey, label, newValue);
}

document.getElementById('piece-type').addEventListener('change', () => handleClassificationChange('piece-type', 'type', 'النوع'));
document.getElementById('category1').addEventListener('change', () => handleClassificationChange('category1', 'category1', 'صنف ١'));
document.getElementById('category2').addEventListener('change', () => handleClassificationChange('category2', 'category2', 'صنف ٢'));

let currentStore = null;
let zebraPrintFields = [];

async function printLabelDirectly() {
  const btn = document.getElementById('print-label-btn');
  if (!currentPiece) return;
  if (!GMZebra.isAvailable()) {
    showMessage('Zebra Browser Print غير متاح على هذا الجهاز.', true);
    return;
  }
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> جارِ الطباعة...';

  const mcMultiplier = (currentStore && currentStore.label_mc_multiplier != null) ? Number(currentStore.label_mc_multiplier) : 1;
  const mcAddend = (currentStore && currentStore.label_mc_addend != null) ? Number(currentStore.label_mc_addend) : 0;
  const rawFab = currentPiece.cost_fabrication_per_gram;
  const mcText = rawFab != null ? String(Math.round(Number(rawFab) * mcMultiplier + mcAddend)) : '—';
  const values = {
    barcode: currentPiece.barcode,
    storeName: (currentStore && currentStore.name) || 'GoldMind',
    weight: Number(currentPiece.weight_grams || 0).toFixed(2),
    karat: currentPiece.karat || '',
    mc: mcText,
    description: currentPiece.description_en || '',
    diamondCarat: currentPiece.accent_diamond_carat != null ? Number(currentPiece.accent_diamond_carat).toFixed(2) : '',
    centerStoneCarat: currentPiece.center_stone_carat != null ? Number(currentPiece.center_stone_carat).toFixed(2) : ''
  };
  const dpi = (currentStore && currentStore.zebra_label_dpi) || 203;

  try {
    await GMZebra.printBarcodeLabel({
      fields: zebraPrintFields,
      values: values,
      dpi: dpi,
      widthDots: GMZebra.mmToDots((currentStore && currentStore.zebra_label_width_mm) || 50, dpi),
      heightDots: GMZebra.mmToDots((currentStore && currentStore.zebra_label_height_mm) || 25, dpi),
      xOffsetDots: GMZebra.mmToDots((currentStore && currentStore.zebra_label_x_offset_mm) || 0, dpi),
      yOffsetDots: GMZebra.mmToDots((currentStore && currentStore.zebra_label_y_offset_mm) || 0, dpi),
      barHeightDots: GMZebra.mmToDots((currentStore && currentStore.zebra_barcode_height_mm) || 5, dpi),
      spacingDots: GMZebra.mmToDots((currentStore && currentStore.zebra_field_spacing_mm != null) ? currentStore.zebra_field_spacing_mm : 0.75, dpi),
      moduleWidth: (currentStore && currentStore.zebra_barcode_module_width) || 2,
      rotate180: !!(currentStore && currentStore.zebra_label_rotate_180),
      darkness: (currentStore && currentStore.zebra_darkness != null) ? currentStore.zebra_darkness : 15
    });
    showMessage('تم إرسال الملصقة للطباعة.', false);
  } catch (err) {
    showMessage('تعذّرت الطباعة: ' + (err.message || err), true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  if (!pieceId) {
    document.getElementById('loading-state').classList.add('hidden');
    showMessage('لم يتم تحديد القطعة.', true);
    document.getElementById('form-wrap').classList.remove('hidden');
    return;
  }

  const { data: me } = await goldmindClient
    .from('staff').select('role, permissions').eq('user_id', session.user.id).eq('store_id', GOLDMIND_STORE_ID).single();
  canEdit = me && (me.role === 'owner' || (me.permissions && me.permissions.edit_piece === true));
  canDelete = me && (me.role === 'owner' || (me.permissions && me.permissions.delete_piece === true));

  if (!canEdit) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('no-access').classList.remove('hidden');
    return;
  }

  const [{ data: piece, error }, { data: storeData }, { data: fieldsData }] = await Promise.all([
    goldmindClient.from('pieces').select('*').eq('id', pieceId).eq('store_id', GOLDMIND_STORE_ID).single(),
    goldmindClient.from('stores').select('name, label_mc_multiplier, label_mc_addend, zebra_label_width_mm, zebra_label_height_mm, zebra_label_dpi, zebra_label_x_offset_mm, zebra_label_y_offset_mm, zebra_barcode_height_mm, zebra_label_rotate_180, zebra_darkness, zebra_field_spacing_mm, zebra_barcode_module_width').eq('id', GOLDMIND_STORE_ID).maybeSingle(),
    goldmindClient.from('zebra_label_fields').select('*').eq('store_id', GOLDMIND_STORE_ID).order('column_num').order('row_order')
  ]);
  currentStore = storeData;
  zebraPrintFields = fieldsData || [];

  document.getElementById('loading-state').classList.add('hidden');

  if (error || !piece) {
    showMessage('تعذّر تحميل بيانات القطعة.', true);
    document.getElementById('form-wrap').classList.remove('hidden');
    return;
  }

  currentPiece = piece;
  document.getElementById('barcode-id').value = piece.barcode || '';
  document.getElementById('weight').value = piece.weight_grams;
  document.getElementById('karat').value = piece.karat;
  document.getElementById('fab-cost').value = piece.cost_fabrication_per_gram != null ? piece.cost_fabrication_per_gram : '';
  document.getElementById('accounting-weight').value = piece.accounting_weight_grams != null ? piece.accounting_weight_grams : '';
  document.getElementById('accent-diamond-carat').value = piece.accent_diamond_carat != null ? piece.accent_diamond_carat : '';
  document.getElementById('accent-diamond-price').value = piece.accent_diamond_price_per_carat != null ? piece.accent_diamond_price_per_carat : '';
  document.getElementById('center-stone-carat').value = piece.center_stone_carat != null ? piece.center_stone_carat : '';
  document.getElementById('center-stone-price').value = piece.center_stone_price_per_carat != null ? piece.center_stone_price_per_carat : '';
  document.getElementById('status').value = piece.status;
  setColor(piece.color || 'Gold');
  loadClassificationOptions('piece-type', 'type', 'النوع', piece.piece_type || '');
  loadClassificationOptions('category1', 'category1', 'صنف ١', piece.category1 || '');
  loadClassificationOptions('category2', 'category2', 'صنف ٢', piece.category2 || '');

  if (piece.photo_url) {
    photoPreview.src = piece.photo_url;
    photoPreview.classList.remove('hidden');
    photoPlaceholder.classList.add('hidden');
    photoRemoveBtn.classList.remove('hidden');
    photoRemoveBtn.classList.add('flex');
  }

  if (canDelete) document.getElementById('delete-btn').classList.remove('hidden');
  gmRenderPieceView();
  document.getElementById('form-wrap').classList.remove('hidden');

  loadPieceLog();
}

const EVENT_LABELS = { created: 'إنشاء القطعة', edited: 'تعديل', sold: 'بيع', returned: 'مرتجع', status_changed: 'تغيير الحالة', photo_changed: 'تغيير الصورة', given_to_trader: 'إعطاء بضاعة للتاجر' };
function fmtLogDate(d) { return gmFormatDateTime(d, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }

async function loadPieceLog() {
  const el = document.getElementById('piece-log-list');
  const { data: logs, error } = await goldmindClient
    .from('piece_movements').select('*, staff:created_by(full_name)')
    .eq('piece_id', pieceId).order('created_at', { ascending: false }).limit(50);
  if (error || !logs || !logs.length) {
    el.innerHTML = '<div class="text-[12px] text-on-surface-variant">لا توجد حركات مسجّلة لهذه القطعة</div>';
    return;
  }
  el.innerHTML = logs.map(l => `
    <div>
      <div class="flex items-center justify-between mb-0.5">
        <span class="text-[12px] font-bold text-on-surface">${EVENT_LABELS[l.event_type] || l.event_type}</span>
        <span class="text-[10.5px] text-on-surface-variant">${fmtLogDate(l.created_at)}</span>
      </div>
      ${l.note ? `<div class="text-[11.5px] text-on-surface-variant">${(l.note || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>` : ''}
      ${l.staff && l.staff.full_name ? `<div class="text-[10px] text-outline mt-0.5">${l.staff.full_name}</div>` : ''}
    </div>`).join('');
}

document.getElementById('save-btn').addEventListener('click', async () => {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session || !currentPiece) return;

  const barcode = document.getElementById('barcode-id').value.trim();
  const weight = parseFloat(document.getElementById('weight').value);
  const karat = parseInt(document.getElementById('karat').value, 10);
  const fabCostInput = document.getElementById('fab-cost').value;
  const fabCost = fabCostInput === '' ? null : parseFloat(fabCostInput);
  const accountingWeightInput = document.getElementById('accounting-weight').value;
  const accountingWeight = accountingWeightInput === '' ? weight : parseFloat(accountingWeightInput);
  const diamondCaratInput = document.getElementById('accent-diamond-carat').value;
  const diamondCarat = diamondCaratInput === '' ? null : parseFloat(diamondCaratInput);
  const diamondPriceInput = document.getElementById('accent-diamond-price').value;
  const diamondPrice = diamondPriceInput === '' ? null : parseFloat(diamondPriceInput);
  const centerStoneCaratInput = document.getElementById('center-stone-carat').value;
  const centerStoneCarat = centerStoneCaratInput === '' ? null : parseFloat(centerStoneCaratInput);
  const centerStonePriceInput = document.getElementById('center-stone-price').value;
  const centerStonePrice = centerStonePriceInput === '' ? null : parseFloat(centerStonePriceInput);
  const status = document.getElementById('status').value;

  if (!weight || weight <= 0) { showMessage('فضلاً أدخل وزناً صحيحاً.', true); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  let photoUrl = currentPiece.photo_url;

  if (selectedPhotoFile) {
    const ext = (selectedPhotoFile.name.split('.').pop() || 'jpg').toLowerCase();
    const path = GOLDMIND_STORE_ID + '/' + (barcode || currentPiece.id) + '-' + Date.now() + '.' + ext;
    const { error: uploadError } = await goldmindClient.storage
      .from('piece-photos').upload(path, selectedPhotoFile, { upsert: false });
    if (uploadError) {
      btn.disabled = false;
      btn.textContent = 'حفظ التعديلات';
      showMessage('فشل رفع الصورة: ' + uploadError.message, true);
      return;
    }
    const { data: pub } = goldmindClient.storage.from('piece-photos').getPublicUrl(path);
    photoUrl = pub ? pub.publicUrl : photoUrl;
  } else if (photoRemoved) {
    photoUrl = null;
  }

  const { error } = await goldmindClient.from('pieces').update({
    barcode: barcode || null,
    weight_grams: weight,
    karat: karat,
    cost_fabrication_per_gram: (fabCost != null && !isNaN(fabCost)) ? fabCost : null,
    accent_diamond_carat: (diamondCarat != null && !isNaN(diamondCarat)) ? diamondCarat : null,
    accent_diamond_price_per_carat: (diamondPrice != null && !isNaN(diamondPrice)) ? diamondPrice : null,
    center_stone_carat: (centerStoneCarat != null && !isNaN(centerStoneCarat)) ? centerStoneCarat : null,
    center_stone_price_per_carat: (centerStonePrice != null && !isNaN(centerStonePrice)) ? centerStonePrice : null,
    accounting_weight_grams: accountingWeight,
    color: selectedColor,
    status: status,
    photo_url: photoUrl,
    piece_type: document.getElementById('piece-type').value || null,
    category1: document.getElementById('category1').value || null,
    category2: document.getElementById('category2').value || null
  }).eq('id', currentPiece.id);

  if (!error) {
    const changes = [];
    if (Number(currentPiece.weight_grams) !== weight) changes.push('الوزن: ' + currentPiece.weight_grams + ' ← ' + weight);
    if (Number(currentPiece.karat) !== karat) changes.push('العيار: ' + currentPiece.karat + ' ← ' + karat);
    if (currentPiece.status !== status) changes.push('الحالة: ' + currentPiece.status + ' ← ' + status);
    if ((currentPiece.barcode || '') !== barcode) changes.push('الباركود تغيّر');
    if (photoUrl !== currentPiece.photo_url) changes.push('الصورة تغيّرت');
    if (changes.length) {
      await goldmindClient.from('piece_movements').insert({
        store_id: GOLDMIND_STORE_ID, piece_id: currentPiece.id,
        event_type: currentPiece.status !== status ? 'status_changed' : 'edited',
        note: changes.join(' — '), created_by: GOLDMIND_STAFF_ID
      });
    }
  }

  btn.disabled = false;
  btn.textContent = 'حفظ التعديلات';

  if (error) { showMessage('خطأ: ' + error.message, true); return; }

  // Keep the in-memory piece in sync with what was just saved, so printing
  // a barcode right after editing (e.g. after changing the barcode itself)
  // uses the fresh values instead of the ones from before the edit.
  currentPiece.barcode = barcode || null;
  currentPiece.weight_grams = weight;
  currentPiece.karat = karat;
  currentPiece.cost_fabrication_per_gram = (fabCost != null && !isNaN(fabCost)) ? fabCost : null;
  currentPiece.accounting_weight_grams = accountingWeight;
  currentPiece.accent_diamond_carat = (diamondCarat != null && !isNaN(diamondCarat)) ? diamondCarat : null;
  currentPiece.accent_diamond_price_per_carat = (diamondPrice != null && !isNaN(diamondPrice)) ? diamondPrice : null;
  currentPiece.center_stone_carat = (centerStoneCarat != null && !isNaN(centerStoneCarat)) ? centerStoneCarat : null;
  currentPiece.center_stone_price_per_carat = (centerStonePrice != null && !isNaN(centerStonePrice)) ? centerStonePrice : null;
  currentPiece.color = selectedColor;
  currentPiece.status = status;
  currentPiece.photo_url = photoUrl;
  currentPiece.piece_type = document.getElementById('piece-type').value || null;
  currentPiece.category1 = document.getElementById('category1').value || null;
  currentPiece.category2 = document.getElementById('category2').value || null;
  selectedPhotoFile = null;
  photoRemoved = false;

  showMessage('تم حفظ التعديلات بنجاح!', false);
  gmRenderPieceView();
  loadPieceLog();
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!currentPiece) return;
  if (!confirm('هل أنت متأكد من حذف هذه القطعة نهائياً؟')) return;

  const btn = document.getElementById('delete-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحذف...';

  const { error } = await goldmindClient.from('pieces').delete().eq('id', currentPiece.id);

  btn.disabled = false;
  btn.textContent = 'حذف القطعة';

  if (error) { showMessage('تعذّر الحذف: ' + error.message, true); return; }

  window.location.href = 'inventory-list-ar.html';
});

// ---- Piece view (chosen design 2026-09-28): read-only summary above the edit form ----
const GM_STATUS = { available: ['متوفرة', '#E3F1E6', '#2E7D46'], reserved: ['محجوزة', '#FFF1D6', '#8A6A1C'], sold: ['مباعة', '#EDE7DA', '#6B6150'], given_to_trader: ['عند تاجر', '#E6ECF5', '#34568B'] };
const GM_COLORS = { Gold: 'ذهبي', White: 'أبيض', Rose: 'وردي' };
function gmN(v) { return v == null || v === '' || isNaN(Number(v)) ? '—' : Number(v).toFixed(2); }
function gmRenderPieceView() {
  const p = currentPiece; if (!p) return;
  document.getElementById('gmPieceTitle').textContent = [p.piece_type, p.category1].filter(Boolean).join(' · ') || 'قطعة';
  document.getElementById('gmPieceBarcode').textContent = p.barcode || '';
  const st = GM_STATUS[p.status] || [p.status, '#EDE7DA', '#6B6150'];
  const chip = document.getElementById('gmPieceStatus');
  chip.textContent = st[0]; chip.style.background = st[1]; chip.style.color = st[2];
  document.getElementById('gmSpecKarat').textContent = p.karat ? p.karat + 'K' : '—';
  document.getElementById('gmSpecWeight').textContent = gmN(p.weight_grams);
  document.getElementById('gmSpecAcc').textContent = gmN(p.accounting_weight_grams != null ? p.accounting_weight_grams : p.weight_grams);
  const days = p.created_at ? Math.max(0, Math.floor((Date.now() - new Date(p.created_at).getTime()) / 86400000)) : null;
  const ageText = document.getElementById('gmAgeText'), bar = document.getElementById('gmAgeBar'), hint = document.getElementById('gmAgeHint');
  if (p.status === 'sold') {
    ageText.textContent = 'بيعت هذه القطعة'; bar.style.width = '0'; hint.textContent = '';
  } else if (days == null) {
    ageText.textContent = '—'; bar.style.width = '0'; hint.textContent = '';
  } else {
    ageText.textContent = days === 0 ? 'دخلت المخزن اليوم' : days === 1 ? 'بالمخزن منذ يوم واحد' : days === 2 ? 'بالمخزن منذ يومين' : 'بالمخزن منذ ' + days + (days <= 10 ? ' أيام' : ' يوماً');
    const pct = Math.min(100, days / 90 * 100);
    bar.style.width = pct + '%';
    bar.style.background = days >= 90 ? 'linear-gradient(90deg,#B24A34,#F2A99C)' : 'linear-gradient(90deg,#8A6A1F,#F6E2A6)';
    hint.textContent = days >= 90 ? 'تجاوزت 90 يوماً — تُعدّ بضاعة راكدة' : 'بقي ' + (90 - days) + ' يوماً قبل أن تُعدّ راكدة (90 يوماً)';
  }
  document.getElementById('gmAgeFab').textContent = gmN(p.cost_fabrication_per_gram);
  document.getElementById('gmAgeColor').textContent = GM_COLORS[p.color] || p.color || '—';
  document.getElementById('gmAgeBox').textContent = p.box_name || '—';
  const sell = document.getElementById('gmSellBtn');
  sell.href = 'new-sale-ar.html' + (p.barcode ? '?barcode=' + encodeURIComponent(p.barcode) : '');
  sell.classList.toggle('hidden', p.status !== 'available');
  document.getElementById('gmBar').classList.remove('hidden');
}
function gmOpenEdit() {
  const d = document.getElementById('gmEditBox'); d.open = true;
  d.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
