<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>تعديل قطعة | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d", "error-container": "#ffdad6", "on-error-container": "#93000a"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
        html { font-size: 87.5%; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
    </style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-surface font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="window.location.href='inventory-list-ar.html'" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">تعديل قطعة</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>
<div id="no-access" class="hidden py-16 text-center text-error text-sm">لا تملك صلاحية تعديل القطع.</div>

<div id="form-wrap" class="hidden py-6 flex flex-col gap-6">

<!-- Photo -->
<input accept="image/*" capture="environment" class="hidden" id="photo-input" type="file"/>
<div class="relative cursor-pointer active:scale-[0.98] transition-transform" onclick="document.getElementById('photo-input').click()">
<div class="aspect-square w-full rounded-xl border-2 border-dashed border-outline-variant bg-surface-container-low flex flex-col items-center justify-center overflow-hidden" id="photo-placeholder">
<span class="material-symbols-outlined text-outline text-5xl mb-3">photo_camera</span>
<p class="font-label-md text-label-md text-on-surface-variant font-semibold">اضغط لتغيير الصورة</p>
</div>
<img alt="" class="hidden aspect-square w-full rounded-xl object-cover border border-outline-variant" id="photo-preview"/>
<button class="hidden absolute top-2 left-2 w-9 h-9 bg-black/60 text-white rounded-full items-center justify-center" id="photo-remove-btn" onclick="event.stopPropagation(); removePhoto();" type="button">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>

<!-- Barcode -->
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[11px] font-semibold text-outline" for="barcode-id">الباركود</label>
<input class="w-full h-14 border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary outline-none text-right font-data-mono" dir="ltr" id="barcode-id" type="text"/>
</div>

<div class="grid grid-cols-2 gap-4">
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[11px] font-semibold text-outline" for="weight">الوزن (غرام)</label>
<input class="w-full h-14 border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary outline-none text-right font-data-mono font-bold" id="weight" step="0.01" type="number"/>
</div>
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[11px] font-semibold text-outline" for="karat">العيار</label>
<select class="w-full h-14 border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary outline-none text-right" id="karat">
<option value="18">18K</option>
<option value="21">21K</option>
<option value="22">22K</option>
<option value="24">24K</option>
</select>
</div>
</div>

<!-- Color -->
<div class="flex flex-col gap-2">
<span class="text-[11px] font-semibold text-outline">اللون</span>
<div class="flex flex-wrap gap-3" id="color-group">
<button type="button" data-color="Gold" class="color-btn flex items-center gap-2 px-4 py-3 border border-outline-variant rounded-xl active:scale-95 transition-all">
<div class="w-4 h-4 rounded-full bg-[#E3C58E]"></div><span class="font-label-md text-label-md">ذهبي</span>
</button>
<button type="button" data-color="White" class="color-btn flex items-center gap-2 px-4 py-3 border border-outline-variant rounded-xl active:scale-95 transition-all">
<div class="w-4 h-4 rounded-full bg-[#E5E7EB]"></div><span class="font-label-md text-label-md">أبيض</span>
</button>
<button type="button" data-color="Rose" class="color-btn flex items-center gap-2 px-4 py-3 border border-outline-variant rounded-xl active:scale-95 transition-all">
<div class="w-4 h-4 rounded-full bg-[#D4AF37]"></div><span class="font-label-md text-label-md">وردي</span>
</button>
</div>
</div>

<!-- Status -->
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[11px] font-semibold text-outline" for="status">الحالة</label>
<select class="w-full h-14 border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary outline-none text-right" id="status">
<option value="available">متوفرة</option>
<option value="sold">مباعة</option>
<option value="reserved">محجوزة</option>
</select>
</div>

<div id="save-message" class="hidden text-center text-sm font-semibold py-2 rounded-lg"></div>

<button id="save-btn" class="w-full h-14 bg-primary text-on-primary rounded-lg font-bold active:scale-[0.98] transition-all">حفظ التعديلات</button>
<button id="delete-btn" class="hidden w-full h-14 border-2 border-error text-error rounded-lg font-bold active:scale-[0.98] transition-all">حذف القطعة</button>

</div>
</main>

<script>
let currentPiece = null;
let selectedPhotoFile = null;
let photoRemoved = false;
let selectedColor = 'Gold';
let canEdit = false;
let canDelete = false;

const pieceId = new URLSearchParams(window.location.search).get('id');

const photoInput = document.getElementById('photo-input');
const photoPlaceholder = document.getElementById('photo-placeholder');
const photoPreview = document.getElementById('photo-preview');
const photoRemoveBtn = document.getElementById('photo-remove-btn');

photoInput.addEventListener('change', () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;
  selectedPhotoFile = file;
  photoRemoved = false;
  const url = URL.createObjectURL(file);
  photoPreview.src = url;
  photoPreview.classList.remove('hidden');
  photoPlaceholder.classList.add('hidden');
  photoRemoveBtn.classList.remove('hidden');
  photoRemoveBtn.classList.add('flex');
});

function removePhoto() {
  selectedPhotoFile = null;
  photoRemoved = true;
  photoInput.value = '';
  photoPreview.classList.add('hidden');
  photoPlaceholder.classList.remove('hidden');
  photoRemoveBtn.classList.add('hidden');
  photoRemoveBtn.classList.remove('flex');
}

function setColor(color) {
  selectedColor = color;
  document.querySelectorAll('.color-btn').forEach(btn => {
    const active = btn.dataset.color === color;
    btn.classList.toggle('border-2', active);
    btn.classList.toggle('border-primary', active);
    btn.classList.toggle('border', !active);
    btn.querySelector('span').classList.toggle('font-bold', active);
  });
}
document.querySelectorAll('.color-btn').forEach(btn => btn.addEventListener('click', () => setColor(btn.dataset.color)));

function showMessage(text, isError) {
  const box = document.getElementById('save-message');
  box.textContent = text;
  box.classList.remove('hidden', 'bg-error-container', 'text-on-error-container', 'bg-green-100', 'text-green-700');
  box.classList.add(isError ? 'bg-error-container' : 'bg-green-100', isError ? 'text-on-error-container' : 'text-green-700');
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  if (!pieceId) {
    document.getElementById('loading-state').classList.add('hidden');
    showMessage('لم يتم تحديد القطعة.', true);
    document.getElementById('form-wrap').classList.remove('hidden');
    return;
  }

  const { data: me } = await goldmindClient
    .from('staff').select('role, permissions').eq('user_id', session.user.id).eq('store_id', GOLDMIND_STORE_ID).single();
  canEdit = me && (me.role === 'owner' || (me.permissions && me.permissions.edit_piece === true));
  canDelete = me && (me.role === 'owner' || (me.permissions && me.permissions.delete_piece === true));

  if (!canEdit) {
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('no-access').classList.remove('hidden');
    return;
  }

  const { data: piece, error } = await goldmindClient
    .from('pieces').select('*').eq('id', pieceId).eq('store_id', GOLDMIND_STORE_ID).single();

  document.getElementById('loading-state').classList.add('hidden');

  if (error || !piece) {
    showMessage('تعذّر تحميل بيانات القطعة.', true);
    document.getElementById('form-wrap').classList.remove('hidden');
    return;
  }

  currentPiece = piece;
  document.getElementById('barcode-id').value = piece.barcode || '';
  document.getElementById('weight').value = piece.weight_grams;
  document.getElementById('karat').value = piece.karat;
  document.getElementById('status').value = piece.status;
  setColor(piece.color || 'Gold');

  if (piece.photo_url) {
    photoPreview.src = piece.photo_url;
    photoPreview.classList.remove('hidden');
    photoPlaceholder.classList.add('hidden');
    photoRemoveBtn.classList.remove('hidden');
    photoRemoveBtn.classList.add('flex');
  }

  if (canDelete) document.getElementById('delete-btn').classList.remove('hidden');
  document.getElementById('form-wrap').classList.remove('hidden');
}

document.getElementById('save-btn').addEventListener('click', async () => {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session || !currentPiece) return;

  const barcode = document.getElementById('barcode-id').value.trim();
  const weight = parseFloat(document.getElementById('weight').value);
  const karat = parseInt(document.getElementById('karat').value, 10);
  const status = document.getElementById('status').value;

  if (!weight || weight <= 0) { showMessage('فضلاً أدخل وزناً صحيحاً.', true); return; }

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  let photoUrl = currentPiece.photo_url;

  if (selectedPhotoFile) {
    const ext = (selectedPhotoFile.name.split('.').pop() || 'jpg').toLowerCase();
    const path = GOLDMIND_STORE_ID + '/' + (barcode || currentPiece.id) + '-' + Date.now() + '.' + ext;
    const { error: uploadError } = await goldmindClient.storage
      .from('piece-photos').upload(path, selectedPhotoFile, { upsert: false });
    if (uploadError) {
      btn.disabled = false;
      btn.textContent = 'حفظ التعديلات';
      showMessage('فشل رفع الصورة: ' + uploadError.message, true);
      return;
    }
    const { data: pub } = goldmindClient.storage.from('piece-photos').getPublicUrl(path);
    photoUrl = pub ? pub.publicUrl : photoUrl;
  } else if (photoRemoved) {
    photoUrl = null;
  }

  const { error } = await goldmindClient.from('pieces').update({
    barcode: barcode || null,
    weight_grams: weight,
    karat: karat,
    color: selectedColor,
    status: status,
    photo_url: photoUrl
  }).eq('id', currentPiece.id);

  btn.disabled = false;
  btn.textContent = 'حفظ التعديلات';

  if (error) { showMessage('خطأ: ' + error.message, true); return; }

  showMessage('تم حفظ التعديلات بنجاح!', false);
  setTimeout(() => { window.location.href = 'inventory-list-ar.html'; }, 700);
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!currentPiece) return;
  if (!confirm('هل أنت متأكد من حذف هذه القطعة نهائياً؟')) return;

  const btn = document.getElementById('delete-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحذف...';

  const { error } = await goldmindClient.from('pieces').delete().eq('id', currentPiece.id);

  btn.disabled = false;
  btn.textContent = 'حذف القطعة';

  if (error) { showMessage('تعذّر الحذف: ' + error.message, true); return; }

  window.location.href = 'inventory-list-ar.html';
});

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
