<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إخراج هدية | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=26"></script>
<script src="theme.js?v=27"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d", "success": "#1e7d32", "success-container": "#d7f3dc"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="gmSmartBack('index-ar.html')" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 700; font-size: 28px;">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">إخراج قطعة كهدية</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md lg:max-w-3xl mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>
<div id="no-access" class="hidden py-16 text-center text-error text-sm">ليس لديك صلاحية إخراج قطع كهدايا.</div>

<div id="page-content" class="hidden py-6 flex flex-col gap-5">

<p class="text-[12px] text-on-surface-variant leading-5">القطعة بتطلع من المخزن بدون فاتورة بيع. كلفتها (دهب بسعر اليوم + مصنعيتها) بتنسجّل <b>مصروف</b> تحت خانة «هدايا»، فما بتأثر على أرباح الفواتير ولا على مبيعات الضريبة ولا على الصندوق.</p>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 space-y-3">
<h2 class="font-semibold text-[13px]">القطعة</h2>
<div class="flex gap-2">
<input class="flex-1 h-12 px-4 border border-outline-variant rounded-lg font-data-mono text-right" dir="ltr" id="barcode-input" placeholder="امسح أو اكتب الباركود" type="text"/>
<button onclick="findPiece()" class="w-12 h-12 bg-primary text-white rounded-lg flex items-center justify-center" type="button"><span class="material-symbols-outlined">search</span></button>
</div>
<div id="piece-box"></div>
</div>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 space-y-3">
<h2 class="font-semibold text-[13px]">لمين الهدية؟</h2>
<input class="w-full h-12 border border-outline-variant rounded-lg px-3 text-right" id="recipient-input" placeholder="اسم الشخص أو الجهة"/>
<input class="w-full h-12 border border-outline-variant rounded-lg px-3 text-right" id="reason-input" placeholder="المناسبة / السبب (اختياري) — مثال: عيد ميلاد، مسابقة، عميل مميز"/>
<textarea class="w-full h-16 border border-outline-variant rounded-lg px-3 py-2 text-right" id="notes-input" placeholder="ملاحظات (اختياري)"></textarea>
</div>

<button onclick="saveGift()" id="save-btn" class="w-full h-14 bg-secondary text-on-secondary rounded-lg font-bold shadow-md" type="button">إخراج كهدية</button>
<p class="text-error text-[12px] hidden text-center" id="save-error"></p>
<p class="text-success text-[12px] hidden text-center" id="save-success"></p>

<div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
<div class="px-4 py-3 border-b border-outline-variant flex items-center justify-between">
<h2 class="font-semibold text-[13px]">سجل الهدايا</h2>
<span class="text-[12px] text-on-surface-variant" id="gifts-total"></span>
</div>
<div id="gifts-list" class="divide-y divide-outline-variant"></div>
</div>

</div>
</main>

<!-- photo viewer -->
<div id="photo-lightbox" class="hidden fixed inset-0 z-[70] bg-black/80 items-center justify-center p-4" onclick="this.classList.add('hidden'); this.classList.remove('flex');">
<img id="photo-big" alt="" class="max-w-full max-h-full rounded-lg object-contain"/>
</div>

<script>
let currentPiece = null;
let CUR = '';
const COLOR_NAMES = { Gold: 'ذهبي', White: 'أبيض', Rose: 'وردي' };
const n = (v, d = 2) => Number(v || 0).toFixed(d);
const money = v => Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + CUR;

function showPhoto(src) {
  document.getElementById('photo-big').src = src;
  const b = document.getElementById('photo-lightbox'); b.classList.remove('hidden'); b.classList.add('flex');
}

document.getElementById('barcode-input').addEventListener('keydown', e => { if (e.key === 'Enter') findPiece(); });

async function findPiece() {
  const code = document.getElementById('barcode-input').value.trim();
  const box = document.getElementById('piece-box');
  currentPiece = null;
  if (!code) return;
  box.innerHTML = '<div class="text-on-surface-variant text-sm">جارِ البحث...</div>';
  const [{ data: p, error }, { data: prices }] = await Promise.all([
    goldmindClient.from('pieces').select('*').eq('store_id', GOLDMIND_STORE_ID).eq('barcode', code).in('status', ['available', 'in_box']).maybeSingle(),
    goldmindClient.from('gold_prices').select('karat, price_per_gram').eq('store_id', GOLDMIND_STORE_ID)
  ]);
  if (error) { box.innerHTML = `<div class="text-error text-sm">خطأ: ${gmEscapeHtml(error.message)}</div>`; return; }
  if (!p) { box.innerHTML = '<div class="text-error text-sm">ما في قطعة متاحة بالمخزن بهالباركود.</div>'; return; }
  currentPiece = p;
  // same formula the server uses (shown here as a preview only)
  const gp = ((prices || []).find(x => x.karat === p.karat) || {}).price_per_gram || 0;
  const w = Number(p.accounting_weight_grams != null ? p.accounting_weight_grams : p.weight_grams) || 0;
  const gold = w * gp, fab = w * (Number(p.cost_fabrication_per_gram) || 0);
  const photo = p.photo_url
    ? `<img src="${gmEscapeHtml(p.photo_url)}" onclick="showPhoto(this.src)" style="width:72px;height:72px" class="rounded-lg object-cover border border-outline-variant cursor-zoom-in shrink-0"/>`
    : `<div style="width:72px;height:72px" class="rounded-lg border border-dashed border-outline-variant flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-outline">no_photography</span></div>`;
  const specs = [
    ['الباركود', p.barcode], ['النوع', [p.piece_type, p.category1, p.category2].filter(Boolean).join(' · ')],
    ['العيار', p.karat + 'K'], ['اللون', COLOR_NAMES[p.color] || p.color],
    ['الوزن', n(p.weight_grams, 3) + ' غ'], ['المحاسبي', n(w, 3) + ' غ'], ['الوصف', p.description_ar]
  ].filter(x => x[1]);
  box.innerHTML = `
    <div class="flex items-center gap-3 p-2 bg-surface-container-low rounded-lg">
      ${photo}
      <div class="flex-1 min-w-0 flex flex-wrap gap-x-4 gap-y-1 text-[12px]">
        ${specs.map(([k, v]) => `<span class="whitespace-nowrap"><span class="text-outline">${k}:</span> <b>${gmEscapeHtml(String(v))}</b></span>`).join('')}
      </div>
    </div>
    <div class="mt-2 p-3 rounded-lg bg-amber-50 border border-amber-200 text-[12px] text-amber-900 space-y-1">
      <div class="flex justify-between"><span>قيمة الدهب (${n(w, 3)}غ × ${n(gp)})</span><b class="font-data-mono">${money(gold)}</b></div>
      <div class="flex justify-between"><span>المصنعية</span><b class="font-data-mono">${money(fab)}</b></div>
      <div class="flex justify-between border-t border-amber-200 pt-1 text-[13px]"><span class="font-bold">كلفة الهدية (مصروف)</span><b class="font-data-mono">${money(gold + fab)}</b></div>
      ${gp ? '' : '<div class="text-error">ما في سعر ذهب محفوظ لهالعيار — حدّث سعر الذهب أولاً.</div>'}
    </div>`;
}

async function saveGift() {
  const err = document.getElementById('save-error'), ok = document.getElementById('save-success');
  err.classList.add('hidden'); ok.classList.add('hidden');
  const recipient = document.getElementById('recipient-input').value.trim();
  if (!currentPiece) { err.textContent = 'اختار القطعة أولاً (امسح الباركود)'; err.classList.remove('hidden'); return; }
  if (!recipient) { err.textContent = 'اكتب اسم الشخص يلي رح ياخد الهدية'; err.classList.remove('hidden'); return; }
  if (!confirm('إخراج القطعة ' + currentPiece.barcode + ' كهدية إلى ' + recipient + '؟')) return;
  const btn = document.getElementById('save-btn');
  btn.disabled = true; btn.textContent = 'جارِ الحفظ...';
  const { error } = await goldmindClient.rpc('gift_out_piece', {
    target_piece_id: currentPiece.id, p_recipient: recipient,
    p_reason: document.getElementById('reason-input').value.trim() || null,
    p_notes: document.getElementById('notes-input').value.trim() || null
  });
  btn.disabled = false; btn.textContent = 'إخراج كهدية';
  if (error) { err.textContent = 'تعذّر الحفظ: ' + error.message; err.classList.remove('hidden'); return; }
  ok.textContent = 'طلعت القطعة من المخزن وانسجلت كلفتها كمصروف هدايا.';
  ok.classList.remove('hidden');
  ['barcode-input', 'recipient-input', 'reason-input', 'notes-input'].forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('piece-box').innerHTML = '';
  currentPiece = null;
  loadGifts();
}

async function revertGift(id, barcode) {
  if (!confirm('ترجيع القطعة ' + barcode + ' للمخزن وإلغاء مصروفها؟')) return;
  const { error } = await goldmindClient.rpc('revert_gift', { target_gift_id: id });
  if (error) { alert('تعذّر: ' + error.message); return; }
  loadGifts();
}

async function loadGifts() {
  const { data, error } = await goldmindClient.from('inventory_gifts')
    .select('id, barcode, karat, accounting_weight_grams, total_cost, recipient, reason, status, created_at, staff:created_by(full_name)')
    .eq('store_id', GOLDMIND_STORE_ID).order('created_at', { ascending: false }).limit(100);
  const list = document.getElementById('gifts-list');
  if (error) { list.innerHTML = `<p class="p-4 text-error text-sm">${gmEscapeHtml(error.message)}</p>`; return; }
  const rows = data || [];
  const active = rows.filter(g => g.status === 'active');
  document.getElementById('gifts-total').textContent = active.length ? 'المجموع: ' + money(active.reduce((s, g) => s + Number(g.total_cost), 0)) : '';
  list.innerHTML = rows.length ? rows.map(g => `
    <div class="p-3 flex items-center gap-3 ${g.status === 'reverted' ? 'opacity-50' : ''}">
      <span class="material-symbols-outlined text-secondary">redeem</span>
      <div class="flex-1 min-w-0">
        <div class="font-semibold text-[13px]">${gmEscapeHtml(g.recipient)}${g.reason ? ' <span class="text-on-surface-variant font-normal">— ' + gmEscapeHtml(g.reason) + '</span>' : ''}</div>
        <div class="text-[11px] text-on-surface-variant font-data-mono">${gmEscapeHtml(g.barcode || '')} · ${g.karat}K · ${n(g.accounting_weight_grams, 3)}غ · ${gmFormatDateTime(g.created_at)}${g.staff && g.staff.full_name ? ' · ' + gmEscapeHtml(g.staff.full_name) : ''}</div>
      </div>
      <div class="text-left">
        <div class="font-bold font-data-mono text-[13px]">${money(g.total_cost)}</div>
        ${g.status === 'active'
          ? `<button type="button" onclick="revertGift('${g.id}', '${gmEscapeHtml(g.barcode || '').replace(/'/g, '')}')" class="text-[11px] text-primary underline">رجوع للمخزن</button>`
          : '<span class="text-[11px]">مرجّعة</span>'}
      </div>
    </div>`).join('') : '<p class="p-4 text-center text-on-surface-variant text-sm">ما في هدايا لسا.</p>';
}

(async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;
  const [{ data: me }, { data: store }] = await Promise.all([
    goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle(),
    goldmindClient.from('stores').select('currency').eq('id', GOLDMIND_STORE_ID).maybeSingle()
  ]);
  document.getElementById('loading-state').classList.add('hidden');
  if (!(me && (me.role === 'owner' || (me.permissions && me.permissions.give_gifts === true)))) {
    document.getElementById('no-access').classList.remove('hidden');
    return;
  }
  const code = (store && store.currency || 'AED').toUpperCase();
  CUR = ({ AED: 'د.إ', USD: '$', SAR: 'ر.س' })[code] || code;
  document.getElementById('page-content').classList.remove('hidden');
  loadGifts();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(() => {}); });
}
</script>
</body></html>
