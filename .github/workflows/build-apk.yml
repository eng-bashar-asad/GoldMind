name: Build GoldMind APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        working-directory: app
        run: npm install

      # Bundle the live site's own HTML/JS/assets straight into the app so
      # it opens instantly from local storage instead of fetching every
      # page over the network like a browser tab. This copies the same
      # files GitHub Pages serves — nothing app-specific to maintain
      # separately; every push to main ships in the very next APK build.
      - name: Bundle site files into app/www
        run: |
          rm -rf app/www
          mkdir -p app/www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.ico" -o -name "*.webmanifest" \) \
            ! -path "./app/*" -exec cp {} app/www/ \;
          if [ -f app/www/login-entry-ar.html ]; then
            cp app/www/login-entry-ar.html app/www/index.html
          fi

      # Stamp this build with the commit it was built from. The app itself
      # (running from theme.js, see the in-app update check there) reads
      # this file and compares it against the latest commit on GitHub to
      # know whether a newer APK is available — since installing this app
      # from a sideloaded APK never auto-updates on its own the way the
      # website (GitHub Pages / PWA) does.
      - name: Stamp build version into the app
        run: |
          printf '{"sha": "%s", "built_at": "%s"}' "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > app/www/build-info.json

      # The live site loads Tailwind's Play CDN, which recompiles CSS from
      # scratch in-browser on every single page load — real, measurable
      # overhead on a phone. For the packaged app we precompile one static
      # stylesheet covering every page instead, and strip the runtime CDN
      # script out of the bundled copies (the live GitHub Pages site is
      # untouched and keeps using the CDN as before).
      - name: Precompile static Tailwind CSS for the app
        working-directory: app
        run: |
          node build-tools/merge-tailwind-config.js
          npx tailwindcss -i build-tools/input.css -o www/tailwind-built.css --config build-tools/tailwind.config.js --minify
          node build-tools/strip-tailwind-cdn.js

      - name: Sync Capacitor Android project
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        working-directory: app/android
        run: |
          mkdir -p ../../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../../apk-output/GoldMind.apk

      - name: Publish/refresh download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "GoldMind APK (latest)"
          body: "Automatically built from commit ${{ github.sha }}. Download GoldMind.apk below and open it on your phone to install (allow 'install unknown apps' for your browser if asked)."
          files: apk-output/GoldMind.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
