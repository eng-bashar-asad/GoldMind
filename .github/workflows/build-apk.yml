name: Build GoldMind APK
# Manual trigger note (2026-08-26 15:20 UTC): the last two pushes (invoice
# items fab-fee fix + buyTrader voucher redesign) never triggered a workflow
# run at all -- main was confirmed at the right commit, but no run appeared
# even queued. This comment-only edit forces a fresh push event to nudge the
# webhook/runner past whatever stalled.
# Manual trigger note (2026-08-24 11:50 UTC): the previous successful-build's
# asset upload hit a transient GitHub API timeout right after deleting the
# old GoldMind.apk asset ("We couldn't respond to your request in time"),
# leaving the app-latest release with zero assets — the APK download link
# 404'd even though the build itself succeeded. This comment-only edit
# forces one clean rebuild to repopulate the asset.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Multiple pushes landing close together (e.g. several files updated in a
# row) used to trigger several of these builds running fully in parallel.
# With no ordering guarantee, a slower build for an OLDER commit could
# finish after a faster build for a NEWER commit and overwrite the
# "app-latest" release with a stale APK — which is exactly what made the
# in-app update banner (theme.js) loop: the freshly-downloaded APK's own
# baked-in commit was actually behind main's real HEAD. This ensures only
# one build for this branch runs at a time, and a new push cancels
# whatever older build is still in flight instead of racing it.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Capacitor 8 (Android 16 / SDK 36) builds with Java 21 and Node 22
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Google removed the legacy 'tools' SDK package from the
          # repository (2026-09-14) -- the action's own default packages
          # input is still 'tools platform-tools', which now fails
          # immediately. platform-tools (adb) is the only extra this build
          # actually needs; build-tools/platforms are installed by the
          # explicit "Install Android Build Tools" step below.
          packages: 'platform-tools'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: app
        run: npm install

      # Bundle the live site's own HTML/JS/assets straight into the app so
      # it opens instantly from local storage instead of fetching every
      # page over the network like a browser tab. This copies the same
      # files GitHub Pages serves — nothing app-specific to maintain
      # separately; every push to main ships in the very next APK build.
      - name: Bundle site files into app/www
        run: |
          rm -rf app/www
          mkdir -p app/www
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.ico" -o -name "*.webmanifest" \) \
            ! -path "./app/*" -exec cp {} app/www/ \;
          if [ -f app/www/login-entry-ar.html ]; then
            cp app/www/login-entry-ar.html app/www/index.html
          fi

      # Stamp this build with the commit it was built from. The app itself
      # (running from theme.js, see the in-app update check there) reads
      # this file and compares it against the latest commit on GitHub to
      # know whether a newer APK is available — since installing this app
      # from a sideloaded APK never auto-updates on its own the way the
      # website (GitHub Pages / PWA) does.
      - name: Stamp build version into the app
        run: |
          printf '{"sha": "%s", "built_at": "%s"}' "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > app/www/build-info.json

      # Precompile static Tailwind CSS (one file per distinct page config)
      # and strip the runtime Play CDN script from the bundled pages.
      - name: Precompile static Tailwind CSS for the app
        working-directory: app
        run: |
          node build-tools/build-tailwind.js --dir=www
          if grep -l "cdn.tailwindcss.com" www/*.html; then echo "pages still load the Tailwind CDN"; exit 1; fi

      # Offline: bundle the Supabase library and icon font inside the app.
      - name: Bundle libraries for offline use
        working-directory: app
        run: node build-tools/localize-cdn.js

      # RFID on Chainway handhelds (C72...): Chainway's DeviceAPI SDK is fetched from
      # their official download page at build time and never committed (public repo).
      # The app is built to work without it (GMUhfPlugin uses reflection), so a
      # failed download only means no RFID support in this build.
      - name: Chainway RFID SDK
        continue-on-error: true
        run: |
          mkdir -p /tmp/cw app/android/app/libs
          curl -fsSL --retry 3 -o /tmp/cw/api.rar "https://www.chainway.net/download/SDKs-Android/API_Ver20251103.rar"
          cd /tmp/cw
          if ! (command -v unrar >/dev/null && unrar x -o+ api.rar >/dev/null) && ! 7z x -y api.rar >/dev/null; then
            sudo apt-get install -y -qq unrar-free >/dev/null && unrar-free -x api.rar
          fi
          cp /tmp/cw/*.aar "$GITHUB_WORKSPACE/app/android/app/libs/"
          ls -la "$GITHUB_WORKSPACE/app/android/app/libs/"

      # RFID on Urovo handhelds (DT50P, sold as Tagway THS 3.0): Urovo's URFIDLibrary from their
      # official sample repo, pinned to a commit and checked by SHA-256. Used by reflection
      # (UrovoUhf.java), so a failed download only means no Urovo RFID in this build.
      - name: Urovo RFID SDK
        continue-on-error: true
        run: |
          mkdir -p app/android/app/libs
          curl -fsSL --retry 3 -o /tmp/urfid.aar "https://raw.githubusercontent.com/urovosamples/RFIDSDKSample/e19fb447c9496df5e37542d161c4eb98ca0ef20e/libs/URFIDLibrary-v2.5.0718.aar"
          echo "0ae03ee59eb102c5575751cf8ec0950349c9bc486b33ad498c0d4aaab6e381a8  /tmp/urfid.aar" | sha256sum -c -
          cp /tmp/urfid.aar app/android/app/libs/URFIDLibrary-v2.5.0718.aar

      # RFID on the Zebra RFD4031 Bluetooth sled: Zebra's RFID SDK may not be published in this
      # public repo, so it is kept in the private repo eng-bashar-asad/GoldMind-private-libs and read
      # with a read-only token (secret ZEBRA_LIBS_TOKEN). Checked by SHA-256. Without the secret or
      # the file the build simply has no Zebra support (the Zebra code is compiled only when the .aar
      # is in libs/, see app/build.gradle).
      - name: Zebra RFID SDK
        continue-on-error: true
        env:
          ZEBRA_LIBS_TOKEN: ${{ secrets.ZEBRA_LIBS_TOKEN }}
        run: |
          if [ -z "$ZEBRA_LIBS_TOKEN" ]; then echo "ZEBRA_LIBS_TOKEN not set - building without Zebra"; exit 0; fi
          mkdir -p app/android/app/libs
          curl -fsSL --retry 3 -H "Authorization: Bearer $ZEBRA_LIBS_TOKEN" -H "Accept: application/vnd.github.raw" \
            -o /tmp/zebra.aar "https://api.github.com/repos/eng-bashar-asad/GoldMind-private-libs/contents/zebra/rfidapi3lib-2.0.5.297.aar"
          echo "82ebd79109ba2f78723eb3d841764b1352abe49c2c963d343251fdc00f6cd4a0  /tmp/zebra.aar" | sha256sum -c -
          cp /tmp/zebra.aar app/android/app/libs/rfidapi3lib-2.0.5.297.aar

      - name: Sync Capacitor Android project
        working-directory: app
        run: npx cap sync android

      # Permanent signing key (repo secrets ANDROID_KEYSTORE_BASE64 +
      # ANDROID_KEYSTORE_PASSWORD). Skipped when the secrets are not set.
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/goldmind.p12"
            echo "GM_KEYSTORE_PATH=$RUNNER_TEMP/goldmind.p12" >> "$GITHUB_ENV"
            echo "Signing with the permanent GoldMind key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - using a temporary debug key (updates will need a reinstall)"
          fi

      - name: Build debug APK
        working-directory: app/android
        env:
          GM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        working-directory: app/android
        run: |
          mkdir -p ../../apk-output
          cp app/build/outputs/apk/debug/app-debug.apk ../../apk-output/GoldMind.apk

      - name: Publish/refresh download release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: app-latest
          name: "GoldMind APK (latest)"
          body: "Automatically built from commit ${{ github.sha }}. Download GoldMind.apk below and open it on your phone to install (allow 'install unknown apps' for your browser if asked)."
          files: apk-output/GoldMind.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
