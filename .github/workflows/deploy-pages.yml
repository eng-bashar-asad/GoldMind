name: Deploy GoldMind site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install build tooling
        working-directory: app
        run: npm install

      # Same as the packaged app: precompile static Tailwind CSS (one file per
      # distinct page config) instead of shipping the runtime Play CDN script,
      # which recompiles CSS in the browser on every page load.
      - name: Assemble deploy output (_site)
        run: |
          rm -rf _site
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.ico" -o -name "*.webmanifest" -o -name "*.json" \) \
            ! -path "./app/*" -exec cp {} _site/ \;
          node app/build-tools/build-tailwind.js --dir=_site
          if grep -l "cdn.tailwindcss.com" _site/*.html; then echo "pages still load the Tailwind CDN"; exit 1; fi
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5