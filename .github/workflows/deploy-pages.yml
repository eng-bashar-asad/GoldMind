name: Deploy GoldMind site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tooling
        working-directory: app
        run: npm install

      # Same idea as the packaged app: precompile one static Tailwind CSS
      # covering every page instead of shipping the runtime Play CDN
      # script, which recompiles CSS from scratch in-browser on every
      # single page load — the main source of the site feeling slow.
      - name: Assemble deploy output (_site)
        run: |
          rm -rf _site
          mkdir -p _site
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.svg" -o -name "*.ico" -o -name "*.webmanifest" -o -name "*.json" \) \
            ! -path "./app/*" -exec cp {} _site/ \;
          cd app
          node build-tools/merge-tailwind-config.js
          npx tailwindcss -i build-tools/input.css -o ../_site/tailwind-built.css --config build-tools/tailwind.config.js --minify
          cd ..
          node app/build-tools/strip-tailwind-cdn.js --dir=_site
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
