<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 136" role="img" aria-label="GoldMind">
  <!-- GoldMind emblem: shield (trust) + balance scale with gold bars (gold accounting) + three linked nodes (mind). Vector, no background. -->
  <defs>
    <linearGradient id="gmGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E08A"/>
      <stop offset=".45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9A7428"/>
    </linearGradient>
    <linearGradient id="gmGoldSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE9A6"/>
      <stop offset="1" stop-color="#C79B2E"/>
    </linearGradient>
    <linearGradient id="gmShieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D4AF37" stop-opacity=".16"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity=".03"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path d="M60 5 L111 22 V66 C111 99 88 120 60 131 C32 120 9 99 9 66 V22 Z" fill="url(#gmShieldFill)" stroke="url(#gmGold)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M60 15 L101 29 V66 C101 93 83 111 60 120 C37 111 19 93 19 66 V29 Z" fill="none" stroke="#D4AF37" stroke-opacity=".35" stroke-width="1.2"/>

  <!-- mind: three linked nodes above the scale -->
  <g stroke="#E9C95B" stroke-width="1.6" stroke-linecap="round">
    <line x1="60" y1="36" x2="45" y2="29"/>
    <line x1="60" y1="36" x2="75" y2="29"/>
  </g>
  <circle cx="45" cy="29" r="3" fill="url(#gmGoldSoft)"/>
  <circle cx="75" cy="29" r="3" fill="url(#gmGoldSoft)"/>
  <circle cx="60" cy="36" r="4.2" fill="url(#gmGoldSoft)"/>

  <!-- scale: post, beam, base -->
  <rect x="58" y="39" width="4" height="55" rx="1.5" fill="url(#gmGold)"/>
  <path d="M28 48 Q60 42 92 48" fill="none" stroke="url(#gmGold)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M46 94 H74 L80 101 H40 Z" fill="url(#gmGold)"/>

  <!-- chains -->
  <g stroke="#E9C95B" stroke-width="1.4" stroke-linecap="round">
    <line x1="28" y1="48" x2="18" y2="73"/><line x1="28" y1="48" x2="38" y2="73"/>
    <line x1="92" y1="48" x2="82" y2="73"/><line x1="92" y1="48" x2="102" y2="73"/>
  </g>

  <!-- pans -->
  <path d="M15 73 H41 Q38 83 28 83 Q18 83 15 73 Z" fill="url(#gmGold)"/>
  <path d="M79 73 H105 Q102 83 92 83 Q82 83 79 73 Z" fill="url(#gmGold)"/>

  <!-- gold bars on the pans -->
  <g fill="url(#gmGoldSoft)" stroke="#8C6A22" stroke-width=".6">
    <path d="M20 73 L22 68 H27 L29 73 Z"/><path d="M28 73 L30 68 H35 L37 73 Z"/><path d="M24 68 L26 63.5 H31 L33 68 Z"/>
    <path d="M84 73 L86 68 H91 L93 73 Z"/><path d="M92 73 L94 68 H99 L101 73 Z"/><path d="M88 68 L90 63.5 H95 L97 68 Z"/>
  </g>
</svg>
