<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>الأدلة والشروحات | GoldMind</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gm-guides.js?v=3"></script>
<script src="supabase-config.js?v=32"></script>
<script src="theme.js?v=49"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d", "success": "#1e7d32", "success-container": "#d7f3dc"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style> html { font-size: 87.5%; } .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; } body { min-height: max(884px, 100dvh); } </style>
<style>
.gd h2{font-size:18px;font-weight:700;margin:28px 0 10px;display:flex;align-items:center;gap:8px;color:var(--gm-primary)}
.gd h3{font-size:15px;font-weight:700;margin:18px 0 6px}
.gd p,.gd li{font-size:14.5px;line-height:1.9}
.gd ol,.gd ul{padding-inline-start:22px;margin:6px 0}
.gd ol{list-style:decimal}.gd ul{list-style:disc}
.gd .card{border:1px solid var(--gm-outline-variant);border-radius:12px;padding:14px 16px;margin:10px 0;background:var(--gm-surface-lowest)}
.gd .note{border-inline-start:4px solid #d97706;background:rgba(217,119,6,.08);border-radius:8px;padding:10px 12px;margin:10px 0}
.gd .ok{border-inline-start:4px solid #1e7d32;background:rgba(30,125,50,.08);border-radius:8px;padding:10px 12px;margin:10px 0}
.gd code{font-family:monospace;background:rgba(127,127,127,.15);padding:1px 6px;border-radius:5px;direction:ltr;unicode-bidi:embed}
.gd table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
.gd th,.gd td{border:1px solid var(--gm-outline-variant);padding:8px;text-align:right;vertical-align:top}
.gd th{background:var(--gm-surface-low)}
.gd .toc a{color:var(--gm-primary);text-decoration:underline}
@media print{main.gd{max-width:none!important;padding-top:0!important}body{background:#fff!important}header,.no-print,#gmNav,#gmNavOverlay{display:none!important}body{min-height:0}.gd h2{break-after:avoid}.gd .card{break-inside:avoid}}
.gd-card{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--gm-outline-variant);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--gm-surface-lowest);text-decoration:none;color:inherit}
.gd-card:hover{border-color:var(--gm-primary)}
.gd-card .material-symbols-outlined{color:var(--gm-primary);font-size:24px!important;margin-top:2px}
.gd-card b{display:block;font-size:15px}.gd-card small{display:block;font-size:12.5px;color:var(--gm-on-surface-variant);line-height:1.7;margin-top:2px}
.gd a.gd-go{display:inline-flex;align-items:center;gap:6px;margin:14px 0 4px;padding:10px 16px;border-radius:10px;background:var(--gm-primary);color:var(--gm-on-primary);font-weight:700;text-decoration:none}
.gd .gd-sum{color:var(--gm-on-surface-variant);margin-bottom:6px}
</style>
</head>
<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="gmSmartBack('index-ar.html')" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center" aria-label="رجوع">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 700; font-size: 28px;">arrow_forward</span>
</button>
<h1 id="gd-title" class="font-headline-md text-headline-md font-bold">الأدلة</h1>
</div>

</div>
</header>
<main class="gd pb-32 max-w-md lg:max-w-3xl mx-auto px-4 py-6 text-on-surface">
<p class="text-xl font-bold mb-1">الأدلة والشروحات</p>
<p class="text-on-surface-variant mb-3">شرح خطوة بخطوة لكل عمليات البرنامج. اكتب ما تبحث عنه أو اختر من القائمة.</p>
<input id="gd-q" type="search" class="w-full h-12 border border-outline-variant rounded-xl px-4 mb-2 bg-transparent" placeholder="ابحث: فاتورة تاجر، باركود جديد، جرد، صندوق…" autocomplete="off"/>
<div id="gd-list"></div>
</main>
<script>
function gdEsc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function gdNorm(s) { return String(s || '').toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/[\u064B-\u0652]/g, ''); }
function gdRender() {
  const words = gdNorm(document.getElementById('gd-q').value).split(/\s+/).filter(Boolean);
  const hit = g => { const t = gdNorm(g.title + ' ' + g.summary + ' ' + g.keywords + ' ' + g.md); return words.every(w => t.includes(w)); };
  const card = g => `<a class="gd-card" href="${g.href || 'guide-ar.html?id=' + g.id}"><span class="material-symbols-outlined">${g.icon}</span><span><b>${gdEsc(g.title)}</b><small>${gdEsc(g.summary)}</small></span></a>`;
  const html = GM_GUIDE_GROUPS.map(grp => {
    const items = GM_GUIDES.filter(g => g.group === grp && hit(g));
    return items.length ? `<h2>${gdEsc(grp)}</h2>` + items.map(card).join('') : '';
  }).join('');
  document.getElementById('gd-list').innerHTML = html || '<p class="text-on-surface-variant py-6 text-center">لا يوجد دليل بهذا الاسم. جرّب كلمة أخرى أو تواصل مع الدعم.</p>';
}
document.getElementById('gd-q').addEventListener('input', gdRender);
gdRender();
</script>
</body></html>
