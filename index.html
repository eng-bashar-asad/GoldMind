<script>
// Existing users (with an active session) go straight to their dashboard,
// like before. Anyone new/logged-out lands on the public marketing page
// instead of being dropped straight into a login wall.
(async function () {
    try {
        const { data: { session } } = await goldmindClient.auth.getSession();
        window.location.replace(session ? 'index-ar.html' : 'landing-ar.html');
    } catch (e) {
        window.location.replace('landing-ar.html');
    }
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=landing-ar.html"/></noscript>
</body></html>
