<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1"
     width="100%" height="100%" viewBox="0 0 1408 768" preserveAspectRatio="xMidYMid meet">

<defs>
  <radialGradient id="bgGlow" cx="50%" cy="46%" r="65%">
    <stop offset="0%" stop-color="#132a33"/>
    <stop offset="55%" stop-color="#0c1e26"/>
    <stop offset="100%" stop-color="#060f14"/>
  </radialGradient>

  <linearGradient id="goldFace" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fff3c8"/>
    <stop offset="24%" stop-color="#f6d375"/>
    <stop offset="50%" stop-color="#c9962f"/>
    <stop offset="76%" stop-color="#8a601c"/>
    <stop offset="100%" stop-color="#f6d375"/>
  </linearGradient>

  <linearGradient id="goldEdge" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7c5620"/>
    <stop offset="50%" stop-color="#ffe9a8"/>
    <stop offset="100%" stop-color="#7c5620"/>
  </linearGradient>

  <linearGradient id="wordGold" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f6d375"/>
    <stop offset="50%" stop-color="#fff3c8"/>
    <stop offset="100%" stop-color="#c9962f"/>
  </linearGradient>

  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="shieldClip">
    <path d="M 200,72 L 268,40 L 336,72 L 336,196 C 336,266 292,318 200,354 C 108,318 64,266 64,196 L 64,72 L 132,40 Z"/>
  </clipPath>
</defs>

<style>
  .gm-part { opacity: 0; }
  .gm-frame-top    { transform: translate(0px, -260px) rotate(-14deg); }
  .gm-frame-left   { transform: translate(-260px, 40px) rotate(10deg); }
  .gm-frame-right  { transform: translate(260px, 40px) rotate(-10deg); }
  .gm-glyph        { transform: scale(0.2); transform-origin: 200px 210px; }
  .gm-word         { transform: translate(0px, 46px); }
  .gm-tag          { transform: translate(0px, 30px); }
  .gm-spark        { transform: scale(0); transform-origin: center; }

  @keyframes gmFlyIn {
    0%   { opacity: 0; }
    100% { opacity: 1; transform: translate(0,0) rotate(0deg) scale(1); }
  }
  @keyframes gmPop {
    0%   { opacity: 0; transform: scale(0); }
    70%  { opacity: 1; transform: scale(1.25); }
    100% { opacity: 1; transform: scale(1); }
  }

  .gm-frame-top   { animation: gmFlyIn 0.9s cubic-bezier(.2,.8,.2,1) 0.10s forwards; }
  .gm-frame-left  { animation: gmFlyIn 0.9s cubic-bezier(.2,.8,.2,1) 0.28s forwards; }
  .gm-frame-right { animation: gmFlyIn 0.9s cubic-bezier(.2,.8,.2,1) 0.28s forwards; }
  .gm-glyph       { animation: gmFlyIn 0.7s cubic-bezier(.2,.8,.2,1) 0.62s forwards; }
  .gm-word        { animation: gmFlyIn 0.7s ease-out 0.85s forwards; }
  .gm-tag         { animation: gmFlyIn 0.6s ease-out 1.05s forwards; }
  .gm-spark1      { animation: gmPop 0.5s ease-out 1.15s forwards; }
  .gm-spark2      { animation: gmPop 0.5s ease-out 1.25s forwards; }
  .gm-spark3      { animation: gmPop 0.5s ease-out 1.35s forwards; }

  @media (prefers-reduced-motion: reduce) {
    .gm-part { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>

<rect x="0" y="0" width="1408" height="768" fill="url(#bgGlow)"/>

<!-- ============ MARK (shield) ============ -->
<g transform="translate(60,10) scale(1.2)">

  <!-- soft halo behind the mark -->
  <circle cx="200" cy="200" r="230" fill="#f6d375" opacity="0.10" filter="url(#softGlow)"/>

  <!-- shield frame, built from three pieces that fly in from different
       directions and lock together -->
  <g class="gm-part gm-frame-top">
    <path d="M 132,40 L 200,10 L 268,40 L 250,86 L 200,66 L 150,86 Z" fill="url(#goldEdge)"/>
  </g>
  <g class="gm-part gm-frame-left">
    <path d="M 64,72 L 150,86 L 132,180 L 90,200 L 64,196 Z" fill="url(#goldFace)" stroke="url(#goldEdge)" stroke-width="3"/>
  </g>
  <g class="gm-part gm-frame-right">
    <path d="M 336,72 L 250,86 L 268,180 L 310,200 L 336,196 Z" fill="url(#goldFace)" stroke="url(#goldEdge)" stroke-width="3"/>
  </g>

  <!-- full shield outline + body, drawn once the three pieces have
       landed, so the seams read as one solid piece -->
  <g class="gm-part gm-frame-top" style="animation-delay:0.42s;">
    <path d="M 200,72 L 268,40 L 336,72 L 336,196 C 336,266 292,318 200,354 C 108,318 64,266 64,196 L 64,72 L 132,40 Z"
          fill="url(#goldFace)" stroke="url(#goldEdge)" stroke-width="4"/>
    <path d="M 200,72 L 268,40 L 336,72 L 336,196 C 336,266 292,318 200,354 C 108,318 64,266 64,196 L 64,72 L 132,40 Z"
          fill="none" stroke="#3a2a10" stroke-width="1.5" opacity="0.35"/>
  </g>

  <!-- shield inner face: dark, so the network below reads as GLOWING gold
       against it (matching the original mark), not a flat dark icon on gold -->
  <g class="gm-part gm-frame-top" style="animation-delay:0.50s;" clip-path="url(#shieldClip)">
    <rect x="40" y="0" width="320" height="400" fill="#08141a"/>
  </g>

  <!-- full shield outline, drawn once the three pieces have landed, so the
       seams read as one solid frame (fill is transparent; the dark
       face above already fills the inside) -->
  <g class="gm-part gm-frame-top" style="animation-delay:0.42s;">
    <path d="M 200,72 L 268,40 L 336,72 L 336,196 C 336,266 292,318 200,354 C 108,318 64,266 64,196 L 64,72 L 132,40 Z"
          fill="none" stroke="url(#goldEdge)" stroke-width="7"/>
  </g>

  <!-- inner glyph: a brain-like network of glowing gold nodes with a
       balance scale at its heart, reading as "intelligence weighing
       value"; pops in last, at the shield's center -->
  <g class="gm-part gm-glyph" clip-path="url(#shieldClip)" filter="url(#softGlow)">
    <!-- classic flat-icon brain silhouette: one smooth rounded mass with
         scalloped folds (gyri), split down the middle ; organic curves,
         not a straight-edged polygon -->
    <path d="M 200,95
             C 190,80 168,78 158,90
             C 140,82 118,90 112,108
             C 92,108 80,128 88,146
             C 74,156 74,178 90,190
             C 84,206 96,222 114,224
             C 116,238 132,248 148,244
             C 158,254 176,254 184,244
             C 190,250 196,250 200,246
             C 204,250 210,250 216,244
             C 224,254 242,254 252,244
             C 268,248 284,238 286,224
             C 304,222 316,206 310,190
             C 326,178 326,156 312,146
             C 320,128 308,108 288,108
             C 282,90 260,82 242,90
             C 232,78 210,80 200,95 Z"
          fill="#08141a" stroke="#f6d375" stroke-width="3"/>
    <!-- central fissure -->
    <path d="M 200,95 C 198,130 198,170 198,246" fill="none" stroke="#f6d375" stroke-width="2.5" opacity="0.8"/>

    <!-- dense star-point network filling the brain, thin connecting lines -->
    <g fill="none" stroke="#f6d375" stroke-width="1.2" opacity="0.6">
      <path d="M 170,108 L 140,133 M 230,108 L 260,133 M 170,108 L 200,133 M 230,108 L 200,133
               M 140,133 L 118,163 M 260,133 L 282,163 M 140,133 L 160,158 M 260,133 L 240,158
               M 200,133 L 160,158 M 200,133 L 240,158 M 160,158 L 200,163 M 240,158 L 200,163
               M 118,163 L 140,198 M 282,163 L 260,198 M 160,158 L 118,163 M 240,158 L 282,163
               M 200,163 L 175,213 M 200,163 L 225,213 M 140,198 L 175,213 M 260,198 L 225,213
               M 140,198 L 200,213 M 260,198 L 200,213 M 175,213 L 200,224 M 225,213 L 200,224"/>
    </g>
    <g fill="#fff3c8">
      <path d="M 170,102 L 172.5,105.5 176,108 172.5,110.5 170,114 167.5,110.5 164,108 167.5,105.5 Z"/>
      <path d="M 230,102 L 232.5,105.5 236,108 232.5,110.5 230,114 227.5,110.5 224,108 227.5,105.5 Z"/>
      <path d="M 140,127 L 142.5,130.5 146,133 142.5,135.5 140,139 137.5,135.5 134,133 137.5,130.5 Z"/>
      <path d="M 260,127 L 262.5,130.5 266,133 262.5,135.5 260,139 257.5,135.5 254,133 257.5,130.5 Z"/>
      <path d="M 200,127 L 202.5,130.5 206,133 202.5,135.5 200,139 197.5,135.5 194,133 197.5,130.5 Z"/>
      <path d="M 118,157 L 120.5,160.5 124,163 120.5,165.5 118,169 115.5,165.5 112,163 115.5,160.5 Z"/>
      <path d="M 282,157 L 284.5,160.5 288,163 284.5,165.5 282,169 279.5,165.5 276,163 279.5,160.5 Z"/>
      <path d="M 160,152 L 162.5,155.5 166,158 162.5,160.5 160,164 157.5,160.5 154,158 157.5,155.5 Z"/>
      <path d="M 240,152 L 242.5,155.5 246,158 242.5,160.5 240,164 237.5,160.5 234,158 237.5,155.5 Z"/>
      <path d="M 200,157 L 202.5,160.5 206,163 202.5,165.5 200,169 197.5,165.5 194,163 197.5,160.5 Z"/>
      <path d="M 140,192 L 142.5,195.5 146,198 142.5,200.5 140,204 137.5,200.5 134,198 137.5,195.5 Z"/>
      <path d="M 260,192 L 262.5,195.5 266,198 262.5,200.5 260,204 257.5,200.5 254,198 257.5,195.5 Z"/>
      <path d="M 175,207 L 177.5,210.5 181,213 177.5,215.5 175,219 172.5,215.5 169,213 172.5,210.5 Z"/>
      <path d="M 225,207 L 227.5,210.5 231,213 227.5,215.5 225,219 222.5,215.5 219,213 222.5,210.5 Z"/>
      <path d="M 200,218 L 202.5,221.5 206,224 202.5,226.5 200,230 197.5,226.5 194,224 197.5,221.5 Z"/>
    </g>
    <!-- scale, anchored below the network, reading as what the "mind" weighs -->
    <g stroke="#f6d375" stroke-width="6" fill="none" stroke-linecap="round">
      <line x1="200" y1="256" x2="200" y2="316"/>
      <line x1="152" y1="282" x2="248" y2="282"/>
      <path d="M 152,282 L 133,324 A 21,13 0 0 0 171,324 Z" fill="#f6d375" stroke="none"/>
      <path d="M 248,282 L 229,324 A 21,13 0 0 0 267,324 Z" fill="#f6d375" stroke="none"/>
    </g>
    <rect x="176" y="314" width="48" height="11" rx="3" fill="#f6d375"/>
  </g>

  <!-- sparkle accents -->
  <g class="gm-part gm-spark1" fill="#fff3c8">
    <path d="M 348,150 l 6,16 16,6 -16,6 -6,16 -6,-16 -16,-6 16,-6 Z"/>
  </g>
  <g class="gm-part gm-spark2" fill="#fff3c8">
    <path d="M 20,120 l 4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 Z"/>
  </g>
  <g class="gm-part gm-spark3" fill="#fff3c8">
    <path d="M 300,330 l 5,13 13,5 -13,5 -5,13 -5,-13 -13,-5 13,-5 Z"/>
  </g>
</g>

<!-- ============ WORDMARK ============ -->
<g transform="translate(590,175)">
  <g class="gm-part gm-word">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="112" letter-spacing="2" fill="url(#wordGold)">GOLD</text>
    <text x="392" y="0" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="112" letter-spacing="2" fill="#eef3f5">MIND</text>
  </g>
  <g class="gm-part gm-tag">
    <text x="2" y="52" font-family="Arial, sans-serif" font-weight="600" font-size="26" letter-spacing="10" fill="#c9962f">ENTERPRISE GOLD ACCOUNTING</text>
  </g>
</g>

</svg>
