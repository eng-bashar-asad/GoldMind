<body class="bg-background text-on-background font-body-md selection:bg-secondary-container selection:text-on-secondary-container">

<input id="search-input" type="text" placeholder="ابحث بالباركود أو الوصف أو الوزن أو القيراط أو رقم/جهة الشهادة" class="w-full h-12 bg-surface-container-low border border-outline-variant rounded-lg pr-10 pl-4 outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all text-right text-on-background font-label-md text-label-md"/>
</div>

<!-- Summary bar -->

</div>

<!-- Loading state -->

<script>
    (async function __enforcePermission() {
        await requireGoldMindSession('login-entry-ar.html');
        const { data: __staffPerm } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
        const __allowed = __staffPerm && (__staffPerm.role === 'owner' || (__staffPerm.permissions && __staffPerm.permissions['view_inventory'] === true));
        if (!__allowed) { alert('ليس لديك صلاحية الدخول لهذه الشاشة.'); window.location.href = 'index-ar.html'; return; }
        const { data: __store } = await goldmindClient.from('stores').select('diamonds_enabled').eq('id', GOLDMIND_STORE_ID).maybeSingle();
        if (!__store || !__store.diamonds_enabled) { window.location.href = 'index-ar.html'; }
    })();

    function openPhotoLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('photo-lightbox').classList.remove('hidden');
    }
    function closePhotoLightbox() {
        document.getElementById('photo-lightbox').classList.add('hidden');
    }

    const statusNames = { available: 'متوفرة', sold: 'مباعة', reserved: 'محجوزة' };
    const statusStyle = {
        available: 'bg-green-100 text-green-700',
        sold: 'bg-gray-200 text-gray-600',
        reserved: 'bg-amber-100 text-amber-700'
    };

    let allPieces = [];

    function pieceCardHtml(piece) {
        const badgeClass = statusStyle[piece.status] || 'bg-gray-100 text-gray-600';
        const statusLabel = statusNames[piece.status] || piece.status;
        const photo = piece.photo_url
            ? `<img src="${piece.photo_url}" onclick="openPhotoLightbox('${piece.photo_url}')" class="w-16 h-16 rounded-lg object-cover border border-outline-variant cursor-pointer active:scale-95 transition-transform" alt="صورة القطعة"/>`
            : `<div class="w-16 h-16 rounded-lg border border-dashed border-outline-variant bg-surface-container-low flex items-center justify-center">
                 <span class="material-symbols-outlined text-outline">diamond</span>
               </div>`;

        const goldLine = piece.has_gold
            ? `<span class="text-on-surface-variant font-label-md text-label-md">+ ذهب ${piece.gold_weight_grams ?? ''} غ عيار ${piece.gold_karat ?? ''}</span>`
            : '';

        const shapeNames = { round: 'مستدير', princess: 'برنسيس', cushion: 'كوشن', oval: 'بيضاوي', emerald: 'إمرالد', pear: 'كمثرى', marquise: 'ماركيز', heart: 'قلب', radiant: 'راديانت', asscher: 'آشر' };
        const fourCsParts = [];
        if (piece.shape) fourCsParts.push(shapeNames[piece.shape] || piece.shape);
        if (piece.clarity) fourCsParts.push(piece.clarity);
        if (piece.cut) fourCsParts.push(piece.cut);
        if (piece.color) fourCsParts.push('لون ' + piece.color);
        const fourCsLine = fourCsParts.length
            ? `<div class="text-on-surface-variant font-label-md text-label-md mt-1 truncate">${fourCsParts.join(' · ')}</div>`
            : '';

        const certLine = (piece.certificate_lab || piece.certificate_number)
            ? `<div class="text-outline text-[11px] font-data-mono mt-1 truncate">${piece.certificate_lab || ''}${piece.certificate_lab && piece.certificate_number ? ' - ' : ''}${piece.certificate_number || ''}</div>`
            : '';

        return `
        <div class="flex items-center gap-4 p-3 bg-surface-container-lowest border border-outline-variant rounded-xl">
            ${photo}
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                    <span class="font-data-mono text-data-mono font-bold">${piece.diamond_carat} ct</span>
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${badgeClass}">${statusLabel}</span>
                </div>
                <div class="flex items-center gap-2 mt-1">
                    ${goldLine}
                </div>
                ${fourCsLine}
                <div class="text-on-surface-variant font-label-md text-label-md mt-1 truncate">${piece.description_ar || piece.description_en || ''}</div>
                <div class="text-outline text-[11px] font-data-mono mt-1 truncate">${piece.barcode ? piece.barcode : 'بدون باركود'}</div>
                ${certLine}
            </div>
            <div class="flex flex-col gap-2 shrink-0">
                <a href="diamond-piece-label-ar.html?id=${piece.id}" class="w-7 h-7 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform" title="طباعة الملصق">
                    <span class="material-symbols-outlined text-[14px]">print</span>
                </a>
                <a href="diamond-certificate-ar.html?id=${piece.id}" class="w-7 h-7 rounded-full border border-outline-variant flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform" title="طباعة شهادة الماس">
                    <span class="material-symbols-outlined text-[14px]">workspace_premium</span>
                </a>
            </div>
        </div>`;
    }

    function renderPieces(list) {
        const empty = document.getElementById('empty-state');
        const noResults = document.getElementById('no-results-state');
        const listEl = document.getElementById('pieces-list');
        const countLabel = document.getElementById('piece-count');
        const caratLabel = document.getElementById('total-carat');

        empty.classList.add('hidden');
        noResults.classList.add('hidden');

        if (allPieces.length === 0) {
            empty.classList.remove('hidden');
            countLabel.textContent = '0 قطعة';
            caratLabel.textContent = '';
            listEl.innerHTML = '';
            return;
        }

        if (list.length === 0) {
            noResults.classList.remove('hidden');
            listEl.innerHTML = '';
            countLabel.textContent = '0 نتيجة';
            caratLabel.textContent = '';
            return;
        }

        const totalCarat = list.reduce((sum, p) => sum + Number(p.diamond_carat || 0), 0);
        countLabel.textContent = list.length + ' قطعة';
        caratLabel.textContent = 'الإجمالي ' + totalCarat.toFixed(2) + ' ct';

        listEl.innerHTML = list.map(pieceCardHtml).join('');
    }

    function filterPieces(query) {
        const q = query.trim().toLowerCase();
        if (!q) return allPieces;
        return allPieces.filter(p => {
            return (p.barcode && p.barcode.toLowerCase().includes(q)) ||
                   (p.description_ar && p.description_ar.toLowerCase().includes(q)) ||
                   (p.description_en && p.description_en.toLowerCase().includes(q)) ||
                   (p.diamond_carat && String(p.diamond_carat).includes(q)) ||
                   (p.gold_weight_grams && String(p.gold_weight_grams).includes(q)) ||
                   (p.certificate_number && p.certificate_number.toLowerCase().includes(q)) ||
                   (p.certificate_lab && p.certificate_lab.toLowerCase().includes(q));
        });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
        renderPieces(filterPieces(e.target.value));
    });

    async function loadPieces() {
        const session = await requireGoldMindSession('login-entry-ar.html');
        if (!session) return;

        const loading = document.getElementById('loading-state');
        const errorBox = document.getElementById('error-state');

        const { data, error } = await goldmindClient
            .from('diamond_pieces')
            .select('*')
            .eq('store_id', GOLDMIND_STORE_ID)
            .order('created_at', { ascending: false });

        loading.classList.add('hidden');

        if (error) {
            errorBox.textContent = 'حدث خطأ أثناء تحميل مخزون الماس: ' + error.message;
            errorBox.classList.remove('hidden');
            return;
        }

        allPieces = data || [];
        renderPieces(filterPieces(document.getElementById('search-input').value));
    }

    loadPieces();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
