<!DOCTYPE html>

<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoldMind | تسجيل الدخول</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --royal-gold: #FFD700;
            --deep-navy: #0f172a;
        }
        body {
            font-family: 'IBM+Plex+Sans+Arabic', 'Inter', sans-serif;
            background-color: var(--deep-navy);
            overflow: hidden;
        }
        .gold-glow {
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .gold-border-focus:focus-within {
            border-color: var(--royal-gold);
            box-shadow: 0 0 0 1px var(--royal-gold);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #FFD700 0%, #B4955A 100%);
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FFD700",
                        "on-primary": "#0f172a",
                        "secondary": "#745a25",
                        "surface": "#0f172a",
                        "surface-container": "#1e293b",
                        "outline": "#76777d",
                        "background": "#0f172a"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    fontFamily: {
                        "headline-xl": ["Inter", "IBM+Plex+Sans+Arabic"],
                        "body-md": ["Inter", "IBM+Plex+Sans+Arabic"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">
<!-- Atmospheric Background Animation -->
<div class="fixed inset-0 z-0 opacity-20 pointer-events-none">
</div>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Identity -->
<div class="mb-10 text-center animate-fade-in">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full border-2 border-primary/30 mb-6 bg-surface-container relative">
<span class="material-symbols-outlined text-primary text-5xl gold-glow" style="font-variation-settings: 'FILL' 1;">temp_preferences_custom</span>
<div class="absolute inset-0 rounded-full animate-pulse bg-primary/10 blur-xl"></div>
</div>
<h1 class="text-4xl font-headline-xl font-bold tracking-tight text-primary mb-2">جولد مايند</h1>
<p class="text-xl text-primary/80 opacity-90">مرحباً بك في جولد مايند</p>
</div>
<!-- Login Form Card -->
<div class="glass-panel w-full p-8 rounded-xl shadow-2xl space-y-8 animate-fade-in">
<div class="text-center mb-8">
<h2 class="text-2xl font-bold text-white">التحقق بخطوتين</h2>
<div class="h-1 w-12 bg-primary mx-auto mt-2 rounded-full"></div>
<p class="text-sm text-primary/70 mt-4">أدخل الرمز المرسل إلى هاتفك لضمان أمان حسابك</p>
</div>
<form class="space-y-8" onsubmit="event.preventDefault(); window.location.href='index-ar.html';">
<!-- OTP Input Group -->
<div class="flex justify-center gap-2 dir-ltr" dir="ltr">
<input class="w-12 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
</div>
<!-- Verify Button -->
<button class="w-full gold-gradient text-on-primary font-bold py-4 rounded-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-200 text-lg" type="submit">
            تحقق
        </button>
<!-- Resend Link -->
<div class="text-center">
<button class="text-sm font-semibold text-primary hover:text-white transition-colors duration-200" type="button">
                إعادة إرسال الرمز
            </button>
</div>
</form>
</div>
<!-- Footer / Language Switcher -->
<footer class="mt-12 flex flex-col items-center gap-6 text-primary/40">
<div class="flex items-center gap-4 text-sm font-medium">
<button class="text-primary hover:text-white transition-colors">العربية</button>
<div class="w-px h-3 bg-primary/20"></div>
<button class="hover:text-primary transition-colors">English</button>
</div>
<p class="text-xs">© ٢٠٢٤ جولد مايند لإدارة محلات الذهب. جميع الحقوق محفوظة.</p>
</footer>
</main>
<!-- Side Decorative elements -->
<div class="fixed top-0 right-0 w-64 h-64 bg-primary/5 blur-[120px] rounded-full -mr-32 -mt-32"></div>
<div class="fixed bottom-0 left-0 w-64 h-64 bg-primary/5 blur-[120px] rounded-full -ml-32 -mb-32"></div>
<script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple mouse tracking for a subtle parallax glow effect on the card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-panel');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
</body></html>
