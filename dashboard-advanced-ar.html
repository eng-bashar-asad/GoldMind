<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>اللوحة المتقدمة | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d"
        },
        "fontFamily": { "body-md": ["Inter"], "headline-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 20px; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="window.location.href='index-ar.html'" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">اللوحة المتقدمة</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md lg:max-w-2xl mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>

<div id="page-content" class="hidden py-6 flex flex-col gap-3">

<p class="text-[12px] text-outline leading-relaxed">
تصميم بديل للاختصارات — كل صف اضغط عليه للانتقال مباشرة، أو اضغط على القائمة يمين الصف لتغيير الاختصار المعروض بهاد المكان. الترتيب يتحفظ على هاد الجهاز بس.
</p>

<div id="slots-list" class="flex flex-col gap-2"></div>

<button onclick="resetSlots()" class="w-full h-11 border border-outline-variant text-on-surface-variant rounded-xl text-[13px] font-semibold mt-2">إعادة الترتيب الافتراضي</button>

</div>
</main>

<script>
// Every shortcut a slot can be assigned to. Mirrors the quick-actions grid
// on index-ar.html (same hrefs/icons/permissions) plus a few extra
// destinations from the hamburger menu, so the customizable list here has
// real choice instead of being locked to exactly the original 15.
const GM_SHORTCUT_CATALOG = [
  { key: 'search-invoices', icon: 'manage_search', label: 'بحث الفواتير', href: 'invoices-list-ar.html', perm: null },
  { key: 'new-sale', icon: 'add_shopping_cart', label: 'فاتورة جديدة', href: 'new-sale-ar.html', perm: 'create_invoice' },
  { key: 'purchase-invoice', icon: 'local_shipping', label: 'فاتورة شراء', href: 'create-invoice-v2-ar.html', perm: 'create_invoice' },
  { key: 'sales-return', icon: 'keyboard_return', label: 'مرتجع مبيعات', href: 'sales-return-ar.html', perm: 'create_invoice' },
  { key: 'daily-cashbox', icon: 'account_balance_wallet', label: 'الصندوق اليومي', href: 'daily-cashbox-ar.html', perm: 'manage_daily_cashbox' },
  { key: 'add-piece', icon: 'inventory_2', label: 'إضافة قطعة', href: 'inventory-add.html', perm: 'add_piece' },
  { key: 'production', icon: 'precision_manufacturing', label: 'إنتاج القطع', href: 'stock-production-ar.html', perm: 'add_piece' },
  { key: 'opening-stock', icon: 'warehouse', label: 'بضاعة أول المدة', href: 'opening-stock-ar.html', perm: 'owner_only_opening_stock' },
  { key: 'inventory-list', icon: 'inventory_2', label: 'المخزن', href: 'inventory-list-ar.html', perm: 'view_inventory' },
  { key: 'add-customer', icon: 'person_add', label: 'إضافة عميل', href: 'customer-add-ar.html', perm: 'add_customers' },
  { key: 'customer-debts', icon: 'account_balance_wallet', label: 'كشف حساب', href: 'customer-debts-ar.html', perm: 'view_customers' },
  { key: 'ledger', icon: 'groups', label: 'حسابات التجار', href: 'ledger-ar.html', perm: null },
  { key: 'repairs', icon: 'build', label: 'الصيانة', href: 'repairs-ar.html', perm: 'view_repairs' },
  { key: 'expense-entry', icon: 'receipt', label: 'مصروف جديد', href: 'expense-entry-ar.html', perm: null },
  { key: 'main-cashbox', icon: 'account_balance', label: 'الصندوق الرئيسي', href: 'main-cashbox-ar.html', perm: 'manage_daily_cashbox' },
  { key: 'reports', icon: 'bar_chart', label: 'التقارير والتحليلات', href: 'reports-ar.html', perm: 'view_profit_report' },
  { key: 'gold-price', icon: 'payments', label: 'سعر الذهب', href: 'gold-price-ar.html', perm: null },
  { key: 'diamond-add', icon: 'diamond', label: 'إضافة ألماسة', href: 'diamond-inventory-add.html', perm: 'add_piece', diamondOnly: true },
  { key: 'diamond-list', icon: 'diamond', label: 'مخزون الألماس', href: 'diamond-inventory-list-ar.html', perm: 'view_inventory', diamondOnly: true },
];

let allowedCatalog = []; // catalog entries the current staff member can actually see
let slotAssignments = []; // array of catalog keys, one per slot

function catalogItem(key) {
  return GM_SHORTCUT_CATALOG.find(c => c.key === key) || allowedCatalog[0];
}

function defaultSlots() {
  return allowedCatalog.map(c => c.key);
}

function loadSavedSlots() {
  try {
    const saved = JSON.parse(localStorage.getItem('goldmind_advanced_slots') || 'null');
    if (Array.isArray(saved) && saved.length) {
      // Drop any saved slot the user no longer has permission for (e.g. a
      // permission was revoked, or diamonds got turned off since).
      const filtered = saved.filter(k => allowedCatalog.some(c => c.key === k));
      // Append any newly-permitted catalog items not already in the saved
      // list, so new destinations aren't invisible after an update.
      allowedCatalog.forEach(c => { if (!filtered.includes(c.key)) filtered.push(c.key); });
      return filtered;
    }
  } catch (e) { /* fall through to defaults */ }
  return defaultSlots();
}

function saveSlots() {
  localStorage.setItem('goldmind_advanced_slots', JSON.stringify(slotAssignments));
}

function resetSlots() {
  slotAssignments = defaultSlots();
  saveSlots();
  renderSlots();
}

function reassignSlot(index, newKey) {
  slotAssignments[index] = newKey;
  saveSlots();
  renderSlots();
}

function renderSlots() {
  const listEl = document.getElementById('slots-list');
  listEl.innerHTML = slotAssignments.map((key, i) => {
    const item = catalogItem(key);
    const options = allowedCatalog.map(c =>
      `<option value="${c.key}" ${c.key === key ? 'selected' : ''}>${gmEscapeHtml(c.label)}</option>`
    ).join('');
    return `
      <div class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant rounded-xl pl-2 gap-2">
        <a href="${item.href}" class="flex items-center gap-3 flex-1 min-w-0 px-3 py-3">
          <span class="material-symbols-outlined text-secondary shrink-0">${item.icon}</span>
          <span class="font-semibold text-[14px] truncate">${gmEscapeHtml(item.label)}</span>
        </a>
        <select class="h-10 border border-outline-variant rounded-lg text-[12px] px-2 bg-transparent max-w-[110px]" onchange="reassignSlot(${i}, this.value)" title="تغيير الاختصار بهاد المكان">
          ${options}
        </select>
      </div>`;
  }).join('');
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  const { data: staffRow } = await goldmindClient.from('staff').select('permissions, role').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
  const isOwner = staffRow && staffRow.role === 'owner';
  const hasPerm = (perm) => !perm || isOwner || (staffRow && staffRow.permissions && staffRow.permissions[perm] === true);

  const { data: store } = await goldmindClient.from('stores').select('diamonds_enabled').eq('id', GOLDMIND_STORE_ID).maybeSingle();
  const diamondsOn = !!(store && store.diamonds_enabled);

  allowedCatalog = GM_SHORTCUT_CATALOG.filter(c => hasPerm(c.perm) && (!c.diamondOnly || diamondsOn));
  if (allowedCatalog.length === 0) allowedCatalog = [GM_SHORTCUT_CATALOG[0]];

  slotAssignments = loadSavedSlots();

  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('page-content').classList.remove('hidden');
  renderSlots();
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
