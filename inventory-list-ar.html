<style id="gm-inv-v2">
.gm-inv-q{margin:4px 0 12px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #CBBF9E;border-radius:14px;padding:0 4px 0 0;height:50px;padding-inline-start:12px;color:#6B6355}
.gm-inv-q input{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:15px;color:#211D17;box-shadow:none}
.gm-inv-q button{width:44px;height:44px;border:0;border-inline-start:1px solid #E4DAC0;background:transparent;color:#211D17;display:flex;align-items:center;justify-content:center}
.gm-gold{background:linear-gradient(125deg,#7a5a16 0%,#c89a3c 18%,#f6e2a6 30%,#d4a64a 42%,#8a6a1f 58%,#e2bd67 76%,#fff0bf 88%,#b58a33 100%);background-size:220% 220%;animation:gmGoldShift 9s ease-in-out infinite alternate;color:#2A1F08}
@keyframes gmGoldShift{from{background-position:0% 50%}to{background-position:100% 50%}}
.gm-sweep{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.gm-sweep::after{content:'';position:absolute;top:-40%;bottom:-40%;width:38%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6) 45%,rgba(255,255,255,.08) 60%,transparent);transform:skewX(-18deg);animation:gmSweep 5.5s cubic-bezier(.65,0,.35,1) infinite}
@keyframes gmSweep{0%,55%{left:-60%}85%,100%{left:130%}}
.gm-gicon{position:relative;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#FFF6D6,#D9B45A 55%,#8A6A1F);color:#3d2c08;font-weight:700}
.gm-inv-hero{background:#1F1A12;color:#FFFDF8;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:14px;margin:12px 0}
.gm-inv-hero .l{font-size:12px;color:#CDBF9F}
.gm-inv-hero .big{font-size:30px;font-weight:700;line-height:1.2}
.gm-inv-hero .mid{font-size:19px;font-weight:700}
.gm-inv-mini{background:#2A2419;border-radius:16px;padding:10px 12px;min-width:0}
.gm-inv-mini .v{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-dist{height:10px;border-radius:6px;background:#2E271B;display:flex;gap:2px;overflow:hidden}
.gm-dist i{display:block;height:100%;transform-origin:right;animation:gmFill 1s cubic-bezier(.22,1,.36,1) both}
@keyframes gmFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gm-status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:12px}
.gm-status button{height:52px;border-radius:16px;border:1px solid #D8CCAE;background:#FFFDF8;color:#1F1A12;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;transition:background .2s,color .2s}
.gm-status button b{font-size:14px}
.gm-status button[aria-pressed="true"]{background:#1F1A12;color:#F3E3B5;border-color:#1F1A12}
.gm-row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border-radius:22px;background:#FFFDF8;color:#1F1A12;text-align:right;border:0;transition:transform .15s}
.gm-row:active{transform:scale(.98)}
.gm-row .nm{display:block;font-size:14px;font-weight:700}
.gm-row .sb{display:block;font-size:12px;color:#6B6150}
.gm-row .w{font-size:16px;font-weight:700;white-space:nowrap}
.gm-sec{grid-column:1/-1;margin:8px 0 2px;font-size:15px;font-weight:700;color:#1F1A12}
/* dark themes: titles sitting straight on the page colour turn light */
html:not(.gm-light-canvas) .gm-sec, html:not(.gm-light-canvas) .gm-on-canvas{color:#F4F1EA!important}
html:not(.gm-light-canvas) .gm-on-canvas-sub{color:#C9CED8!important}
.gm-piece{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:#FFFDF8;color:#1F1A12;transition:transform .15s}
.gm-piece:active{transform:scale(.98)}
.gm-piece img,.gm-piece .ph{width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0}
.gm-chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px;white-space:nowrap}
.gm-hbtn{display:flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:20px;border:0;background:#FFFDF8;color:#1F1A12;font-size:12px;font-weight:600}
@media (max-width:389px){.gm-hbtn{padding:0 9px;gap:3px}header .gm-gold{padding:0 10px!important}header h1{font-size:17px!important}header .gap-3{gap:8px}}
@media (max-width:369px){.gm-hbtn{padding:0 7px}header .gm-gold{padding:0 8px!important}}
@media (max-width:429px){.gm-hbtn{font-size:0;padding:0 10px;gap:0}.gm-hbtn .material-symbols-outlined{font-size:20px!important}}
@media (prefers-reduced-motion: reduce){.gm-gold,.gm-sweep::after,.gm-dist i{animation:none!important}}
/* computer (design "المخزن: أرقام + شبكة علب"): the dark summary becomes a strip of number tiles,
   boxes fill the width as a grid, a side column shows recent pieces, what needs attention and the last count */
#invSide,#inv-karat-tiles{display:none}
@media (min-width:1024px){
  main.gm-inv-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,320px);column-gap:20px;align-items:start}
  main.gm-inv-main>*{grid-column:1;min-width:0}
  main.gm-inv-main>#invSide{grid-column:2;grid-row:3/span 40;display:flex;flex-direction:column;gap:12px;position:sticky;top:80px}
  main.gm-inv-main>.gm-inv-q,main.gm-inv-main>#inv-summary{grid-column:1/-1}
  .gm-inv-q.lg\:hidden{display:flex!important;max-width:560px;margin-top:8px}
  .gm-inv-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;background:none;padding:0;border-radius:0;color:#211D17;margin:4px 0 14px}
  .gm-inv-hero>.flex,.gm-inv-hero>.grid,#inv-karat-tiles{display:contents!important}
  .gm-inv-hero>.flex>div,.gm-inv-mini{background:var(--gm-surface-lowest,#fff);border:1px solid var(--gm-outline-variant);border-radius:14px;padding:12px 16px;min-width:0;text-align:right}
  .gm-inv-hero>.flex>div:first-child{background:#1C1A16;border-color:#1C1A16;color:#FBF8F1}
  .gm-inv-hero>.flex>div:first-child .l{color:#CFC4AA}
  .gm-inv-hero .l{color:#6B6355;font-size:12px}
  .gm-inv-hero .big,.gm-inv-hero .mid,.gm-inv-mini .v{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;line-height:1.3}
  .gm-inv-mini.hidden{display:none}
  .gm-dist{grid-column:1/-1;order:9;background:#E4DAC0;height:8px}
  #karat-boxes,#box-boxes,#diamond-card,#lot-boxes{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))!important;gap:10px!important}
  .gm-row{border:1px solid #E4DAC0;border-radius:16px;padding:14px 14px 18px}
  .gm-row[style*="--share"]::after{content:'';position:absolute;inset-inline:14px;bottom:8px;height:4px;border-radius:3px;background:linear-gradient(to left,#C8952E 0 var(--share),#EFE7D2 var(--share))}
  .gm-status{max-width:560px}
}
.inv-card{background:var(--gm-surface-lowest,#fff);border:1px solid var(--gm-outline-variant);border-radius:14px;padding:12px 16px;color:#211D17}
.inv-card h2{margin:0 0 4px;font-size:14px;font-weight:700}
.inv-kv{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:6px 0;border-bottom:1px solid #EFE7D2;color:inherit;text-decoration:none}
.inv-kv:last-child{border-bottom:0}
.inv-tag{border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:#F7F2E6;color:#6B6355;white-space:nowrap}
.inv-tag.warn{background:#FDF0DC;color:#8A4B08}.inv-tag.ok{background:#E8F3EA;color:#1B5E20}.inv-tag.bad{background:#FBE9E7;color:#8A2A1E}
</style>
  </head>
<body class="bg-background text-on-background font-body-md selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation Bar -->
<header class="docked full-width top-0 z-50 sticky" style="background:var(--gm-bg-elevated,#F3EEDF);">
<div class="flex justify-between items-center px-margin-mobile w-full h-16 gap-2">
<div class="flex items-center gap-3">
<button onclick="gmSmartBack('index-ar.html')" aria-label="رجوع" class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:#1F1A12;color:#F3E3B5;">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_forward</span>
</button>
<h1 class="gm-on-canvas" style="margin:0;font-size:19px;font-weight:700;color:#1F1A12;">المخزن</h1>
</div>
<div class="flex items-center gap-2">
<button onclick="toggleSearch()" class="gm-hbtn hidden lg:inline-flex" title="بحث بالمخزون"><span class="material-symbols-outlined text-[20px]">search</span>بحث</button>
<button onclick="window.location.href='intake-batches-ar.html'" class="gm-hbtn" title="سندات الإدخال والإنتاج"><span class="material-symbols-outlined text-[20px]">receipt_long</span>السندات</button>
<button onclick="window.location.href='inventory-add.html'" class="gm-gold relative hidden lg:flex items-center gap-1 h-10 px-3 rounded-full text-[13px] font-bold"><span class="gm-sweep" aria-hidden="true"></span><span class="material-symbols-outlined text-[20px]" style="position:relative;">add</span><span style="position:relative;">قطعة</span></button>
</div>
</div>
</header>
<main class="gm-inv-main pb-32 max-w-md lg:max-w-7xl mx-auto px-margin-mobile lg:px-8">

<!-- phone: search always at the top (design "MStock"); Enter searches by barcode, the tune button opens the full filters -->
<div class="gm-inv-q lg:hidden">
<span class="material-symbols-outlined" aria-hidden="true">search</span>
<input id="invQuick" type="search" dir="auto" enterkeyhint="search" placeholder="امسح أو اكتب الباركود" aria-label="بحث بالباركود"
  onkeydown="if (event.key === 'Enter') { event.preventDefault(); document.getElementById('search-barcode').value = this.value.trim(); runSearch(); }"/>
<button type="button" onclick="toggleSearch()" aria-label="فلاتر البحث" title="فلاتر البحث"><span class="material-symbols-outlined">tune</span></button>
</div>
<!-- Summary -->
<div class="gm-inv-hero" id="inv-summary">
<div class="flex justify-between items-end gap-3">
<div><div class="l">القطع المتوفرة</div><div class="big" id="piece-count">…</div></div>
<div class="text-left"><div class="l">الوزن القائم</div><div class="mid" id="total-weight"></div></div>
</div>
<div class="gm-dist" id="gmDistBar" role="img" aria-label="توزيع الوزن على الصناديق"></div>
<div class="grid grid-cols-2 gap-2">
<div class="gm-inv-mini hidden" id="total-accounting-weight-box"><div class="l">الوزن المحاسبي</div><div class="v" id="total-accounting-weight"></div></div>
<div class="gm-inv-mini"><div class="l">قيمة المصنعية</div><div class="v" id="total-fab"></div></div>
<div class="gm-inv-mini hidden" id="total-diamond-carat-box"><div class="l">الماس</div><div class="v" id="total-diamond-carat" dir="ltr"></div></div>
<div id="inv-karat-tiles"></div>
</div>
</div>
<!-- computer: side column -->
<aside id="invSide" aria-label="ملخص المخزن">
<section class="inv-card"><h2>آخر قطع دخلت</h2><div id="invRecent"></div></section>
<section class="inv-card"><h2>بدها انتباه</h2><div id="invAttn"></div></section>
<section class="inv-card"><h2>آخر جرد</h2><div id="invLastCount"><p class="text-[12px] text-on-surface-variant py-1">…</p></div><a href="inventory-count-ar.html" class="block text-center mt-2 text-[13px] font-bold" style="color:#7A6640">بدء جرد جديد ←</a></section>
</aside>
<div class="gm-status" role="group" aria-label="عرض حسب الحالة" id="gmStatusTiles"></div>

<!-- Search / filter panel (hidden by default) -->
<div class="hidden border border-outline-variant rounded-xl p-4 bg-surface-container-lowest mt-2 flex flex-col gap-3" id="search-panel">
<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[10px] font-semibold text-outline" for="search-barcode">رقم الباركود</label>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 text-[13px] font-data-mono" dir="ltr" id="search-barcode" onkeydown="if (event.key === 'Enter') { event.preventDefault(); runSearch(); }" placeholder="مثال: G000012" type="text"/>
</div>
<div class="grid grid-cols-2 gap-3">
<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[10px] font-semibold text-outline" for="search-weight-from">الوزن من (غ)</label>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 text-[13px] font-data-mono" id="search-weight-from" step="0.01" type="number"/>
</div>
<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[10px] font-semibold text-outline" for="search-weight-to">الوزن إلى (غ)</label>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 text-[13px] font-data-mono" id="search-weight-to" step="0.01" type="number"/>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[10px] font-semibold text-outline" for="search-type">النوع/الصنف</label>
<select class="w-full h-11 border border-outline-variant rounded-lg px-3 text-[13px] bg-surface-container-lowest" id="search-type">
<option value="">الكل</option>
</select>
</div>
<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[10px] font-semibold text-outline" for="search-status">الحالة</label>
<select class="w-full h-11 border border-outline-variant rounded-lg px-3 text-[13px] bg-surface-container-lowest" id="search-status">
<option value="">الكل</option>
<option value="available">متوفرة</option>
<option value="sold">مباعة لزبائن</option>
<option value="given_to_trader">مباعة لتجار (بضاعة خرجت لتاجر)</option>
<option value="reserved">محجوزة</option>
<option value="gifted">هدية</option>
<option value="cancelled">ملغاة</option>
</select>
</div>
</div>
<button onclick="runSearch()" class="w-full h-11 bg-primary text-on-primary rounded-lg font-bold text-[13px]">بحث</button>
</div>

<!-- Search results -->
<div class="hidden" id="search-results-view">
<button onclick="closeSearch()" class="flex items-center gap-1 text-primary font-semibold text-[13px] my-3">
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
رجوع لعرض العيارات
</button>
<div id="search-results-list" class="grid grid-cols-1 lg:grid-cols-3 gap-3 lg:gap-4 pb-8"></div>
</div>

<!-- Loading state -->
<div id="loading-state" class="py-16 text-center text-on-surface-variant font-label-md text-label-md">
    جارِ تحميل القطع...
</div>

<!-- Empty state -->
<div id="empty-state" class="hidden py-16 text-center flex flex-col items-center gap-3">
<span class="material-symbols-outlined text-outline text-5xl">inventory_2</span>
<p class="text-on-surface-variant font-body-md text-body-md">لا توجد قطع بالمخزون بعد.</p>
<button onclick="window.location.href='inventory-add.html'" class="mt-2 px-5 py-3 bg-primary text-on-primary rounded-lg font-semibold">أضف أول قطعة</button>
</div>

<!-- Error state -->
<div id="error-state" class="hidden py-6 px-4 rounded-lg bg-red-100 text-red-700 font-label-md text-label-md text-center"></div>

<!-- Karat boxes (default view, or scoped inside a box): pick a karat -->
<button id="karat-boxes-back" onclick="backFromKaratLevel()" class="hidden items-center gap-1 text-primary font-semibold text-[13px] mb-3">
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
<span id="karat-boxes-back-label">العودة لكل الصناديق</span>
</button>
<div id="karat-boxes" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-2.5 pb-3"></div>

<!-- Box/location boxes: only boxes that actually have pieces show up here -->
<div id="box-boxes" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-2.5 pb-6"></div>

<!-- Diamond pieces live in their own warehouse: a card that leads there -->
<div id="diamond-card" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-2.5 pb-6"></div>

<!-- Gold held by weight (scrap bought from individuals, bulk lots) -->
<section id="lots-section" class="hidden pb-8">
<h2 class="gm-sec" style="margin-top:0;">الذهب بالوزن</h2>
<p class="gm-on-canvas-sub text-[12px] text-on-surface-variant mb-3">الكسر والذهب غير المقطّع، مجمّعاً حسب الصندوق.</p>
<div id="lot-boxes" class="grid grid-cols-1 lg:grid-cols-2 gap-2.5"></div>
<div id="lot-detail" class="hidden mt-3 rounded-2xl overflow-hidden" style="background:#FFFDF8;color:#1F1A12;"></div>
</section>

<!-- Piece list for the selected karat -->
<div id="piece-list-view" class="hidden">
<button onclick="backFromPieceList()" class="flex items-center gap-1 text-primary font-semibold text-[13px] mb-3">
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
العودة لعرض العيارات
</button>
<h2 class="font-headline-md text-headline-md font-bold text-primary mb-3" id="piece-list-title"></h2>
<div id="pieces-list" class="grid grid-cols-1 lg:grid-cols-3 gap-3 lg:gap-4 pb-8"></div>
</div>

</main>

<!-- Photo Lightbox -->
<div id="photo-lightbox" onclick="closePhotoLightbox()" class="hidden fixed inset-0 bg-black/80 z-[300] flex items-center justify-center p-6">
<img id="lightbox-img" class="max-w-full max-h-full rounded-lg object-contain"/>
<button onclick="closePhotoLightbox()" class="absolute top-6 left-6 text-white">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
</div>

<!-- Bottom tabs (shared, gm-nav.js) + add-piece button (design "MStock") -->
<nav class="gm-bottom-tabs"></nav>
<a class="gm-fab" href="inventory-add.html" aria-label="إضافة قطعة" title="إضافة قطعة"><span class="material-symbols-outlined">add</span></a>

<script>
    let currentStore = null;
    let canViewAccWeight = false;
    (async function __enforcePermission() {
        await requireGoldMindSession('login-entry-ar.html');
        const { data: __staffPerm } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
        const __allowed = __staffPerm && (__staffPerm.role === 'owner' || (__staffPerm.permissions && __staffPerm.permissions['view_inventory'] === true));
        if (!__allowed) { alert('ليس لديك صلاحية الدخول لهذه الشاشة.'); window.location.href = 'index-ar.html'; }
        // Accounting weight is billing-relevant, same sensitivity class as
        // the reports/financial figures elsewhere in the app -- gated
        // behind the same view_reports permission rather than shown to
        // every employee who can merely view inventory.
        canViewAccWeight = __staffPerm && (__staffPerm.role === 'owner' || (__staffPerm.permissions && __staffPerm.permissions['view_reports'] === true));
    })();

    function openPhotoLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('photo-lightbox').classList.remove('hidden');
    }
    function closePhotoLightbox() {
        document.getElementById('photo-lightbox').classList.add('hidden');
    }

    const colorNames = { Gold: 'ذهبي', White: 'أبيض', Rose: 'وردي' };
    const colorSwatch = { Gold: '#E3C58E', White: '#E5E7EB', Rose: '#D4AF37' };
    const statusNames = { available: 'متوفرة', sold: 'مباعة لزبون', reserved: 'محجوزة', given_to_trader: 'مباعة لتاجر', gifted: 'هدية', cancelled: 'ملغاة' };
    const statusStyle = {
        available: 'bg-green-100 text-green-700',
        sold: 'bg-gray-200 text-gray-600',
        reserved: 'bg-amber-100 text-amber-700',
        given_to_trader: 'bg-blue-100 text-blue-700'
    };

    function pieceCardHtml(piece) {
        const statusLabel = statusNames[piece.status] || piece.status;
        const chip = { available: ['#E3F1E6', '#2E7D46'], reserved: ['#FFF1D6', '#8A5A00'], sold: ['#EFE9DD', '#6B6150'], given_to_trader: ['#E8EEF9', '#33517E'] }[piece.status] || ['#EFE9DD', '#6B6150'];
        const typeLabel = [piece.piece_type, piece.category1, piece.category2].filter(Boolean).join(' · ') || piece.description_ar || 'قطعة';
        const photo = piece.photo_url
            ? `<img src="${gmEscapeHtml(piece.photo_url)}" onclick="event.preventDefault(); event.stopPropagation(); openPhotoLightbox(${gmEscapeHtml(JSON.stringify(String(piece.photo_url)))})" alt="صورة القطعة" loading="lazy"/>`
            : `<span class="ph gm-gicon"><span class="material-symbols-outlined" style="position:relative;font-size:26px;">photo_camera</span><span class="gm-sweep" aria-hidden="true"></span></span>`;
        return `
        <a href="piece-edit-ar.html?id=${piece.id}" class="gm-piece">
            ${photo}
            <span style="flex:1;min-width:0;">
                <span class="block text-[14px] font-semibold truncate">${gmEscapeHtml(typeLabel)}</span>
                <span class="block text-[12px] truncate" style="color:#6B6150;"><span dir="ltr">${gmEscapeHtml(piece.barcode || 'بدون باركود')}</span> · ${piece.karat}K · ${piece.weight_grams} غ</span>
            </span>
            <span class="gm-chip" style="background:${chip[0]};color:${chip[1]};">${statusLabel}</span>
            <span class="material-symbols-outlined text-[18px]" style="color:#B3A68A;">chevron_left</span>
        </a>`;
    }

    // Computer (>=1024px): one wide table with every column instead of cards (design screen 2);
    // a row opens the piece like the card does. Empty list -> '' so each caller keeps its message.
    function piecesHtml(pieces) {
        if (!pieces.length) return '';
        // the piece page walks this same list (السابقة / التالية)
        try { sessionStorage.setItem('gm_piece_nav', JSON.stringify(pieces.map(p => p.id))); } catch (_) {}
        if (!(window.matchMedia && window.matchMedia('(min-width: 1024px)').matches)) return pieces.map(pieceCardHtml).join('');
        const th = t => `<th class="px-3 py-2.5 text-right text-[12px] font-bold whitespace-nowrap" style="color:#6B6150;background:#F7F2E6;border-bottom:1px solid #E4DAC0">${t}</th>`;
        const td = (v, extra) => `<td class="px-3 py-2.5 text-[13px] whitespace-nowrap" style="border-bottom:1px solid #EFE7D2" ${extra || ''}>${v}</td>`;
        const rows = pieces.map(piece => {
            const chip = { available: ['#E3F1E6', '#2E7D46'], reserved: ['#FFF1D6', '#8A5A00'], sold: ['#EFE9DD', '#6B6150'], given_to_trader: ['#E8EEF9', '#33517E'] }[piece.status] || ['#EFE9DD', '#6B6150'];
            const typeLabel = [piece.piece_type, piece.category1, piece.category2].filter(Boolean).join(' · ') || piece.description_ar || 'قطعة';
            const photo = piece.photo_url
                ? `<img src="${gmEscapeHtml(piece.photo_url)}" alt="" loading="lazy" style="width:40px;height:40px;object-fit:cover;border-radius:8px" onclick="event.stopPropagation(); openPhotoLightbox(${gmEscapeHtml(JSON.stringify(String(piece.photo_url)))})"/>`
                : '<span style="display:inline-block;width:40px;height:40px;border-radius:8px;background:#EFE7D2"></span>';
            const href = 'piece-edit-ar.html?id=' + encodeURIComponent(piece.id);
            return `<tr class="cursor-pointer hover:bg-[#FBF6E8]" onclick="location.href='${href}'">` +
                td(photo) + td(`<a href="${href}" dir="ltr" class="font-data-mono font-semibold" onclick="event.stopPropagation()">${gmEscapeHtml(piece.barcode || 'بدون باركود')}</a>`) +
                td(gmEscapeHtml(typeLabel)) + td(gmEscapeHtml(String(piece.karat || '')) + 'K') +
                td(`<span class="font-data-mono">${Number(piece.weight_grams || 0).toFixed(2)}</span>`) +
                (canViewAccWeight ? td(`<span class="font-data-mono">${piece.accounting_weight_grams != null ? Number(piece.accounting_weight_grams).toFixed(2) : '—'}</span>`) : '') +
                td(gmEscapeHtml(piece.box_name || '—')) +
                td(`<span class="gm-chip" style="background:${chip[0]};color:${chip[1]};">${gmEscapeHtml(statusNames[piece.status] || piece.status || '')}</span>`) + '</tr>';
        }).join('');
        return `<div class="col-span-full bg-white border rounded-xl overflow-x-auto" style="border-color:#E4DAC0"><table class="w-full border-collapse">
            <thead><tr>${th('<span class="sr-only">الصورة</span>')}${th('الباركود')}${th('الوصف')}${th('العيار')}${th('الوزن القائم')}${canViewAccWeight ? th('الوزن المحاسبي') : ''}${th('الصندوق')}${th('الحالة')}</tr></thead>
            <tbody>${rows}</tbody></table></div>`;
    }

    let ALL_PIECES = [];
    let ALL_PIECES_RAW = [];
    let OLD_BARCODES_BY_PIECE = {}; // piece id -> replaced barcode numbers

    function populateSearchTypeOptions() {
        const types = [...new Set(ALL_PIECES_RAW.map(p => p.piece_type).filter(Boolean))].sort();
        const select = document.getElementById('search-type');
        select.innerHTML = '<option value="">الكل</option>' + types.map(t => `<option value="${gmEscapeHtml(t)}">${gmEscapeHtml(t)}</option>`).join('');
    }

    function toggleSearch() {
        const panel = document.getElementById('search-panel');
        panel.classList.toggle('hidden');
    }

    function closeSearch() {
        document.getElementById('search-results-view').classList.add('hidden');
        document.getElementById('search-panel').classList.add('hidden');
        showKaratBoxes();
    }

    function runSearch() {
        const barcode = document.getElementById('search-barcode').value.trim().toLowerCase();
        const weightFrom = parseFloat(document.getElementById('search-weight-from').value);
        const weightTo = parseFloat(document.getElementById('search-weight-to').value);
        const type = document.getElementById('search-type').value;
        const status = document.getElementById('search-status').value;

        const results = ALL_PIECES_RAW.filter(p => {
            if (barcode && !gmBarcodeMatches(p.barcode, barcode)
                && !(OLD_BARCODES_BY_PIECE[p.id] || []).some(old => gmBarcodeMatches(old, barcode))) return false;
            if (!isNaN(weightFrom) && Number(p.weight_grams || 0) < weightFrom) return false;
            if (!isNaN(weightTo) && Number(p.weight_grams || 0) > weightTo) return false;
            if (type && p.piece_type !== type) return false;
            if (status && p.status !== status) return false;
            return true;
        });

        document.getElementById('karat-boxes').classList.add('hidden');
        document.getElementById('karat-boxes').classList.remove('grid');
        document.getElementById('piece-list-view').classList.add('hidden');
        document.getElementById('search-results-view').classList.remove('hidden');
        document.getElementById('diamond-card').classList.add('hidden');

        document.getElementById('piece-count').textContent = results.length + ' نتيجة';
        renderTotals(results);

        document.getElementById('search-results-list').innerHTML = piecesHtml(results) || '<p class="col-span-full text-center text-[12px] text-on-surface-variant py-8">لا توجد نتائج مطابقة.</p>';
        if (barcode && !results.length) findInDiamonds(barcode);
    }

    // A piece with diamonds is saved in the diamond warehouse, not here: say where it is.
    async function findInDiamonds(barcode) {
        const { data } = await goldmindClient.from('diamond_pieces').select('barcode')
            .eq('store_id', GOLDMIND_STORE_ID).ilike('barcode', '%' + barcode.replace(/[%_]/g, '') + '%').limit(5);
        if (!data || !data.length || document.getElementById('search-barcode').value.trim().toLowerCase() !== barcode) return;
        const p = document.createElement('p');
        p.className = 'col-span-full text-center text-[13px] py-2';
        p.innerHTML = 'القطعة ' + data.map(d => '<b>' + gmEscapeHtml(d.barcode) + '</b>').join('، ') +
            ' في مستودع الألماس — <a class="underline font-bold text-primary" href="diamond-inventory-list-ar.html">فتح مستودع الألماس</a>';
        document.getElementById('search-results-list').appendChild(p);
    }

    // Karat "box" cards -- distinct karat/color tints so they scan at a
    // glance, matching the colorSwatch palette already used per-piece below.
    const karatTint = {
        24: { bg: '#FCF1DD', ink: '#9A6B12', ring: '#E8B94F' },
        22: { bg: '#FBE6EC', ink: '#9C3B54', ring: '#E497A9' },
        21: { bg: '#E3F0EC', ink: '#2F6F5C', ring: '#8FC7B4' },
        18: { bg: '#E9EBFB', ink: '#3F459C', ring: '#9AA3E0' }
    };
    function tintFor(karat) {
        return karatTint[karat] || { bg: '#EEF0F2', ink: '#565E74', ring: '#B7BCC9' };
    }

    function totalFabValue(pieces) {
        return pieces.reduce((sum, p) => sum + Number(p.cost_fabrication_per_gram || 0) * Number(p.weight_grams || 0), 0);
    }

    function renderTotals(pieces) {
        const totalWeight = pieces.reduce((sum, p) => sum + Number(p.weight_grams || 0), 0);
        document.getElementById('total-weight').textContent = totalWeight.toFixed(2) + ' غ';
        document.getElementById('total-fab').textContent = gmFormatDualCurrency(totalFabValue(pieces), currentStore);

        // Di (accent diamonds) + Cs (center stone) combined, across whatever
        // scope is currently shown -- so staff can see how much diamond
        // carat is on hand without opening every single piece.
        const diamondEl = document.getElementById('total-diamond-carat');
        const totalDiamondCarat = pieces.reduce((sum, p) =>
            sum + Number(p.accent_diamond_carat || 0) + Number(p.center_stone_carat || 0), 0);
        if (totalDiamondCarat > 0) {
            diamondEl.textContent = totalDiamondCarat.toFixed(2) + ' ct';
            diamondEl.parentElement.classList.remove('hidden');
        } else {
            diamondEl.parentElement.classList.add('hidden');
        }

        const accEl = document.getElementById('total-accounting-weight');
        if (canViewAccWeight) {
            const totalAcc = pieces.reduce((sum, p) => sum + Number(p.accounting_weight_grams != null ? p.accounting_weight_grams : (p.weight_grams || 0)), 0);
            accEl.textContent = totalAcc.toFixed(2) + ' غ';
            accEl.parentElement.classList.remove('hidden');
        } else {
            accEl.parentElement.classList.add('hidden');
        }
    }

    let currentBoxScope = null; // box_name we've drilled into, or null at top level
    let currentPrefixScope = null; // barcode-prefix "batch" within the current box, or null

    // The barcode's leading letters (before the digits) -- set by the
    // store's barcode-prefix setting, so a change there naturally marks a
    // new batch/source. Pieces made before any prefix was ever generated
    // (or a manually-typed barcode with no letters) fall into one shared
    // "بدون بادئة" group rather than being dropped.
    function prefixOf(barcode) {
        const m = (barcode || '').match(/^[A-Za-z]+/);
        return m ? m[0].toUpperCase() : 'بدون بادئة';
    }

    function gmRowCard(onclick, iconHtml, name, sub, weight, extra) {
        return `
        <button ${onclick} class="gm-row" ${extra || ''}>
            <span class="gm-gicon" style="width:44px;height:44px;border-radius:14px;">${iconHtml}<span class="gm-sweep" aria-hidden="true"></span></span>
            <span style="flex:1;min-width:0;"><span class="nm truncate">${name}</span><span class="sb">${sub}</span></span>
            <span class="w" dir="ltr">${weight}</span>
            <span class="material-symbols-outlined text-[20px]" style="color:#9C8F72;">chevron_left</span>
        </button>`;
    }
    function karatBoxHtml(karat, pieces) {
        const totalWeight = pieces.reduce((sum, p) => sum + Number(p.weight_grams || 0), 0);
        return gmRowCard(`onclick="showKaratPieces(${karat})"`, `<span style="position:relative;font-size:13px;">${karat}K</span>`,
            'عيار ' + karat, pieces.length + ' قطعة', totalWeight.toFixed(2) + ' غ');
    }

    // Renders karat cards for a given piece set -- used at the top level
    // (all pieces), scoped inside a box, or scoped inside a box+batch.
    function renderKaratBoxesFor(pieces) {
        const boxesEl = document.getElementById('karat-boxes');
        const byKarat = {};
        pieces.forEach(p => {
            const k = p.karat || 0;
            if (!byKarat[k]) byKarat[k] = [];
            byKarat[k].push(p);
        });
        const karats = Object.keys(byKarat).map(Number).sort((a, b) => b - a);
        boxesEl.innerHTML = karats.map(k => karatBoxHtml(k, byKarat[k])).join('');
        document.getElementById('piece-count').textContent = pieces.length + ' قطعة';
        renderTotals(pieces);
        boxesEl.classList.remove('hidden');
        boxesEl.classList.add('grid');
    }

    // Only this one box breaks down further by karat -- it's the general
    // gold bucket where that grouping actually helps. Every other box
    // (Mirruba, custom brand boxes, ...) goes straight to its pieces once
    // past the batch/prefix picker, since the user manages those as one
    // group by design.
    const KARAT_GROUPED_BOX = 'قطع ذهبية';
    function usesKaratGrouping(boxName) { return boxName === KARAT_GROUPED_BOX; }

    // The drilled-in view (box / batch / karat) is kept in the address, so going back
    // from a piece reopens the same list instead of the top of the inventory.
    function gmViewUrl(params) {
        const u = new URL(location.href);
        ['box', 'pre', 'k', 'v'].forEach(x => u.searchParams.delete(x));
        Object.entries(params).forEach(([a, b]) => { if (b !== null && b !== undefined && b !== '') u.searchParams.set(a, b); });
        const before = location.pathname + location.search;
        history.replaceState(history.state, '', u);
        try { // keep the app's back-stack entry for this page in step with the address
            const st = JSON.parse(sessionStorage.getItem('gm_nav_stack') || '[]');
            if (st[st.length - 1] === before) { st[st.length - 1] = location.pathname + location.search; sessionStorage.setItem('gm_nav_stack', JSON.stringify(st)); }
        } catch (e) {}
    }
    window.addEventListener('pagehide', () => { try { sessionStorage.setItem('gm_inv_scroll', location.search + '|' + Math.round(scrollY)); } catch (e) {} });

    function renderKaratBoxes() {
        // Initial entry point (called once after pieces load): reopen the view in the address, if any.
        const q = new URLSearchParams(location.search);
        const box = q.get('box'), pre = q.get('pre'), k = q.get('k'), v = q.get('v');
        const boxExists = box && ALL_PIECES.some(p => (p.box_name || '').trim() === box);
        if (!boxExists) { showTopLevel(); return; }
        if (v === 'pre') showBoxPrefixes(box);
        else if (v === 'list') showScopePieces(box, pre);
        else if (k) { currentBoxScope = box; currentPrefixScope = pre; showKaratPieces(Number(k)); }
        else enterScope(box, pre);
        try {
            const [where, y] = (sessionStorage.getItem('gm_inv_scroll') || '').split('|');
            if (where === location.search && y) requestAnimationFrame(() => window.scrollTo(0, Number(y)));
        } catch (e) {}
    }

    // Top level: just the main boxes -- karats live inside "قطع ذهبية" only.
    function showTopLevel() {
        currentBoxScope = null;
        currentPrefixScope = null;
        gmViewUrl({});
        document.getElementById('karat-boxes-back').classList.add('hidden');
        document.getElementById('karat-boxes-back').classList.remove('flex');
        document.getElementById('karat-boxes').classList.add('hidden');
        document.getElementById('karat-boxes').classList.remove('grid');
        renderBoxBoxes();
        document.getElementById('box-boxes').classList.remove('hidden');
        renderLots();
        document.getElementById('diamond-card').classList.toggle('hidden', !DIAMOND_CARD_HTML);
        document.getElementById('piece-list-view').classList.add('hidden');
        document.getElementById('piece-count').textContent = ALL_PIECES.length + ' قطعة';
        renderTotals(ALL_PIECES);
        gmScopeChanged();
    }
    // Kept as an alias -- older calls in this file still reference it.
    function showKaratBoxes() { showTopLevel(); }

    // Entry point when a box card is clicked: if the box actually contains
    // more than one barcode-prefix "batch", show the batch picker first;
    // a box with just one batch goes straight into its scope (karat cards
    // for "قطع ذهبية", the piece list directly for every other box).
    function enterBox(boxName) {
        const pieces = ALL_PIECES.filter(p => (p.box_name || '').trim() === boxName);
        const prefixes = new Set(pieces.map(p => prefixOf(p.barcode)));
        if (prefixes.size > 1) showBoxPrefixes(boxName);
        else enterScope(boxName, null);
    }

    // Batch cards: one per distinct barcode-prefix within this box.
    function prefixBoxHtml(boxName, prefix, pieces) {
        const totalWeight = pieces.reduce((sum, p) => sum + Number(p.weight_grams || 0), 0);
        return gmRowCard(`onclick="enterScope(${gmEscapeHtml(JSON.stringify(String(boxName)))}, ${gmEscapeHtml(JSON.stringify(String(prefix)))})"`,
            '<span class="material-symbols-outlined" style="position:relative;font-size:22px;">sell</span>',
            gmEscapeHtml(prefix), pieces.length + ' قطعة', totalWeight.toFixed(2) + ' غ');
    }

    function showBoxPrefixes(boxName) {
        currentBoxScope = boxName;
        currentPrefixScope = null;
        gmViewUrl({ box: boxName, v: 'pre' });
        const pieces = ALL_PIECES.filter(p => (p.box_name || '').trim() === boxName);
        const byPrefix = {};
        pieces.forEach(p => {
            const pre = prefixOf(p.barcode);
            (byPrefix[pre] = byPrefix[pre] || []).push(p);
        });
        const prefixes = Object.keys(byPrefix).sort((a, b) => a.localeCompare(b));

        document.getElementById('box-boxes').classList.add('hidden'); document.getElementById('diamond-card').classList.add('hidden'); document.getElementById('lots-section').classList.add('hidden');
        document.getElementById('box-boxes').classList.remove('grid');
        document.getElementById('piece-list-view').classList.add('hidden');
        document.getElementById('karat-boxes-back-label').textContent = 'العودة لكل الصناديق';
        document.getElementById('karat-boxes-back').classList.remove('hidden');
        document.getElementById('karat-boxes-back').classList.add('flex');
        document.getElementById('piece-list-title').textContent = 'صندوق: ' + boxName;

        const boxesEl = document.getElementById('karat-boxes');
        boxesEl.innerHTML = prefixes.map(pre => prefixBoxHtml(boxName, pre, byPrefix[pre])).join('');
        document.getElementById('piece-count').textContent = pieces.length + ' قطعة';
        renderTotals(pieces);
        boxesEl.classList.remove('hidden');
        boxesEl.classList.add('grid');
        gmScopeChanged();
    }

    // Enter a box's (optionally batch-scoped) contents: karat cards for
    // "قطع ذهبية", straight to the piece list for every other box.
    function enterScope(boxName, prefix) {
        if (usesKaratGrouping(boxName)) {
            if (prefix) showPrefixKarats(boxName, prefix);
            else showBoxKarats(boxName);
        } else {
            showScopePieces(boxName, prefix);
        }
    }

    // Straight to the piece list for a box (or box+batch) that doesn't use
    // karat grouping -- all karats mixed together in one list.
    function showScopePieces(boxName, prefix) {
        currentBoxScope = boxName;
        currentPrefixScope = prefix;
        gmViewUrl({ box: boxName, pre: prefix, v: 'list' });
        const pieces = ALL_PIECES.filter(p =>
            (p.box_name || '').trim() === boxName &&
            (prefix === null || prefixOf(p.barcode) === prefix)
        );
        document.getElementById('karat-boxes').classList.add('hidden');
        document.getElementById('karat-boxes').classList.remove('grid');
        document.getElementById('karat-boxes-back').classList.add('hidden');
        document.getElementById('karat-boxes-back').classList.remove('flex');
        document.getElementById('box-boxes').classList.add('hidden'); document.getElementById('diamond-card').classList.add('hidden'); document.getElementById('lots-section').classList.add('hidden');
        document.getElementById('box-boxes').classList.remove('grid');
        document.getElementById('piece-list-view').classList.remove('hidden');
        document.getElementById('piece-list-title').textContent = boxName + (prefix ? ' — ' + prefix : '');

        document.getElementById('piece-count').textContent = pieces.length + ' قطعة';
        renderTotals(pieces);

        document.getElementById('pieces-list').innerHTML = piecesHtml(pieces);
        gmScopeChanged();
    }

    // Drill into one box (and, if applicable, one batch within it): show
    // the karat breakdown for that scope.
    function showBoxKarats(boxName) {
        currentBoxScope = boxName;
        currentPrefixScope = null;
        gmViewUrl({ box: boxName });
        const pieces = ALL_PIECES.filter(p => (p.box_name || '').trim() === boxName);
        document.getElementById('box-boxes').classList.add('hidden'); document.getElementById('diamond-card').classList.add('hidden'); document.getElementById('lots-section').classList.add('hidden');
        document.getElementById('box-boxes').classList.remove('grid');
        document.getElementById('piece-list-view').classList.add('hidden');
        document.getElementById('karat-boxes-back-label').textContent = 'العودة لكل الصناديق';
        document.getElementById('karat-boxes-back').classList.remove('hidden');
        document.getElementById('karat-boxes-back').classList.add('flex');
        document.getElementById('piece-list-title').textContent = 'صندوق: ' + boxName;
        renderKaratBoxesFor(pieces);
        gmScopeChanged();
    }

    function showPrefixKarats(boxName, prefix) {
        currentBoxScope = boxName;
        currentPrefixScope = prefix;
        gmViewUrl({ box: boxName, pre: prefix });
        const pieces = ALL_PIECES.filter(p => (p.box_name || '').trim() === boxName && prefixOf(p.barcode) === prefix);
        document.getElementById('box-boxes').classList.add('hidden'); document.getElementById('diamond-card').classList.add('hidden'); document.getElementById('lots-section').classList.add('hidden');
        document.getElementById('box-boxes').classList.remove('grid');
        document.getElementById('piece-list-view').classList.add('hidden');
        document.getElementById('karat-boxes-back-label').textContent = 'العودة لدفعات ' + boxName;
        document.getElementById('karat-boxes-back').classList.remove('hidden');
        document.getElementById('karat-boxes-back').classList.add('flex');
        document.getElementById('piece-list-title').textContent = 'صندوق: ' + boxName + ' — ' + prefix;
        renderKaratBoxesFor(pieces);
        gmScopeChanged();
    }

    // The back button above the karat/batch cards: where it goes depends
    // on how deep we are (batch-scoped karats -> that box's batch list;
    // box-scoped karats or the batch list itself -> the top level).
    function backFromKaratLevel() {
        if (currentPrefixScope) showBoxPrefixes(currentBoxScope);
        else showTopLevel();
    }

    function showKaratPieces(karat) {
        gmViewUrl({ box: currentBoxScope, pre: currentPrefixScope, k: karat });
        const pieces = ALL_PIECES.filter(p =>
            (p.karat || 0) === karat &&
            (currentBoxScope === null || (p.box_name || '').trim() === currentBoxScope) &&
            (currentPrefixScope === null || prefixOf(p.barcode) === currentPrefixScope)
        );
        document.getElementById('karat-boxes').classList.add('hidden');
        document.getElementById('karat-boxes').classList.remove('grid');
        document.getElementById('karat-boxes-back').classList.add('hidden');
        document.getElementById('karat-boxes-back').classList.remove('flex');
        document.getElementById('box-boxes').classList.add('hidden'); document.getElementById('diamond-card').classList.add('hidden'); document.getElementById('lots-section').classList.add('hidden');
        document.getElementById('box-boxes').classList.remove('grid');
        document.getElementById('piece-list-view').classList.remove('hidden');
        document.getElementById('piece-list-title').textContent =
            (currentBoxScope ? currentBoxScope + (currentPrefixScope ? ' — ' + currentPrefixScope : '') + ' — ' : '') + 'عيار ' + karat;

        document.getElementById('piece-count').textContent = pieces.length + ' قطعة';
        renderTotals(pieces);

        document.getElementById('pieces-list').innerHTML = piecesHtml(pieces);
    }

    // The piece-list "back" button: return to wherever we drilled in from.
    // "قطع ذهبية" has a karat layer to return to; every other box goes
    // straight back to its batch picker (if it has one) or the top level.
    function backFromPieceList() {
        if (gmStatusSel !== 'available' && currentBoxScope !== null) { gmPickStatus('available'); return; }
        if (currentBoxScope && usesKaratGrouping(currentBoxScope)) {
            if (currentPrefixScope) showPrefixKarats(currentBoxScope, currentPrefixScope);
            else showBoxKarats(currentBoxScope);
        } else if (currentBoxScope && currentPrefixScope) {
            showBoxPrefixes(currentBoxScope);
        } else {
            showTopLevel();
        }
    }

    // Box/location cards: one per distinct box_name actually in use --
    // pieces with no box assigned don't get a card, and a box with zero
    // pieces currently in it simply never appears (nothing to compute).
    // A small rotating palette (warm/jewel tones, distinct from the karat
    // cards' cooler tints) so box cards read as their own category and
    // multiple boxes stay visually distinguishable from each other.
    const boxTintPalette = [
        { bg: '#FBEFE0', ink: '#8A5A2B', ring: '#E0B37E' },
        { bg: '#EFE6F5', ink: '#5C3F82', ring: '#B79AD9' },
        { bg: '#E3F0EC', ink: '#2F6F5C', ring: '#8FC7B4' },
        { bg: '#FCE9EC', ink: '#9C3B54', ring: '#E497A9' },
        { bg: '#E8EEF9', ink: '#33517E', ring: '#9AB3DD' }
    ];
    function boxTintFor(boxName) {
        let hash = 0;
        for (let i = 0; i < boxName.length; i++) hash = (hash * 31 + boxName.charCodeAt(i)) >>> 0;
        return boxTintPalette[hash % boxTintPalette.length];
    }

    function boxBoxHtml(boxName, pieces) {
        const totalWeight = pieces.reduce((sum, p) => sum + Number(p.weight_grams || 0), 0);
        const icon = boxName === KARAT_GROUPED_BOX ? 'diamond' : 'inventory_2';
        const allW = ALL_PIECES.reduce((s, p) => s + Number(p.weight_grams || 0), 0);
        const share = allW ? Math.max(2, Math.round(totalWeight / allW * 100)) : 0;
        return gmRowCard(`onclick="enterBox(${gmEscapeHtml(JSON.stringify(String(boxName)))})"`,
            `<span class="material-symbols-outlined" style="position:relative;font-size:22px;">${icon}</span>`,
            gmEscapeHtml(boxName), pieces.length + ' قطعة', totalWeight.toFixed(2) + ' غ', `style="--share:${share}%" title="${share}% من وزن المخزن"`);
    }

    // one bar across the summary card: how the weight is split between boxes
    const GM_DIST_COLORS = ['linear-gradient(90deg,#8A6A1F,#F6E2A6,#C99A3B)', '#C98B4A', '#9C7BD0', '#6FA89A', '#D98FA3', '#7F95C9'];
    function gmRenderDist() {
        const bar = document.getElementById('gmDistBar');
        if (!bar) return;
        const byBox = {};
        ALL_PIECES.forEach(p => { const b = (p.box_name || '').trim() || 'بدون صندوق'; byBox[b] = (byBox[b] || 0) + Number(p.weight_grams || 0); });
        const lotsW = (typeof ALL_LOTS !== 'undefined' ? ALL_LOTS : []).reduce((s, l) => s + Number(l.weight_grams_remaining || 0), 0);
        if (lotsW > 0) byBox['الذهب بالوزن'] = lotsW;
        const parts = Object.entries(byBox).sort((a, b) => b[1] - a[1]);
        const total = parts.reduce((s, x) => s + x[1], 0);
        if (!total) { bar.innerHTML = ''; return; }
        bar.innerHTML = parts.map(([, w], i) => `<i style="width:${Math.max(1, w / total * 100).toFixed(2)}%;background:${GM_DIST_COLORS[i % GM_DIST_COLORS.length]};animation-delay:${i * 120}ms"></i>`).join('');
        bar.setAttribute('aria-label', 'توزيع الوزن: ' + parts.map(([n, w]) => n + ' ' + Math.round(w / total * 100) + '٪').join('، '));
    }

    // الكل / متوفرة / محجوزة / مباعة -- counts and filtering follow the box
    // (and batch) currently open; at the top level they cover every box.
    // "متوفرة" is the normal view (box cards / drill-down); "الكل" really
    // means every status, sold and reserved included.
    let gmStatusSel = 'available';
    const GM_STATUS_LABEL = { all: 'الكل', available: 'متوفرة', reserved: 'محجوزة', sold: 'مباعة' };
    function gmScopeRaw() {
        return ALL_PIECES_RAW.filter(p =>
            (currentBoxScope === null || (p.box_name || '').trim() === currentBoxScope) &&
            (currentPrefixScope === null || prefixOf(p.barcode) === currentPrefixScope));
    }
    // navigation into/out of a box resets the filter to the normal view
    function gmScopeChanged() { gmStatusSel = 'available'; gmRenderStatusTiles(); }
    function gmRenderStatusTiles() {
        const el = document.getElementById('gmStatusTiles');
        if (!el) return;
        const raw = gmScopeRaw();
        const n = (st) => raw.filter(p => p.status === st).length;
        const tiles = [['all', raw.length], ['available', n('available')], ['reserved', n('reserved')], ['sold', n('sold')]];
        el.innerHTML = tiles.map(([k, c]) => `<button type="button" data-st="${k}" aria-pressed="${gmStatusSel === k}"><span>${GM_STATUS_LABEL[k]}</span><b>${c}</b></button>`).join('');
        el.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => gmPickStatus(b.dataset.st)));
    }
    function gmPickStatus(st) {
        gmStatusSel = st;
        ['search-barcode', 'search-weight-from', 'search-weight-to', 'search-type'].forEach(id => { document.getElementById(id).value = ''; });
        document.getElementById('search-results-view').classList.add('hidden');
        if (st === 'available') {
            const box = currentBoxScope, pre = currentPrefixScope;
            if (box === null) showTopLevel(); else if (pre) enterScope(box, pre); else enterBox(box);
            return;
        }
        if (currentBoxScope === null) {
            // top level: search every box
            document.getElementById('search-status').value = st === 'all' ? '' : st;
            runSearch();
        } else {
            const pieces = gmScopeRaw().filter(p => st === 'all' || p.status === st);
            ['karat-boxes', 'box-boxes'].forEach(id => { const e = document.getElementById(id); e.classList.add('hidden'); e.classList.remove('grid'); });
            document.getElementById('lots-section').classList.add('hidden');
            document.getElementById('karat-boxes-back').classList.add('hidden');
            document.getElementById('karat-boxes-back').classList.remove('flex');
            document.getElementById('piece-list-view').classList.remove('hidden');
            document.getElementById('piece-list-title').textContent = currentBoxScope + (currentPrefixScope ? ' — ' + currentPrefixScope : '') + ' — ' + GM_STATUS_LABEL[st];
            document.getElementById('piece-count').textContent = pieces.length + ' قطعة';
            renderTotals(pieces);
            document.getElementById('pieces-list').innerHTML = piecesHtml(pieces) || '<p class="col-span-full text-center text-[12px] text-on-surface-variant py-8">لا توجد قطع بهذه الحالة في هذا الصندوق.</p>';
        }
        gmRenderStatusTiles();
    }

    // ---- Gold held by weight (gold_stock_lots with something left) ----
    let ALL_LOTS = [];
    let LOT_INVOICES = {};
    let openLotBox = null;
    const lotBoxName = (l) => (l.box_name || '').trim() || ('ذهب عيار ' + (l.karat || '—'));

    // Pieces with diamonds are kept in the diamond warehouse (not counted in this page's weight).
    let DIAMOND_CARD_HTML = '';
    async function loadDiamondCard() {
        const { data } = await goldmindClient.from('diamond_pieces').select('diamond_carat')
            .eq('store_id', GOLDMIND_STORE_ID).eq('status', 'available');
        if (!data || !data.length) return;
        const ct = data.reduce((s, d) => s + Number(d.diamond_carat || 0), 0);
        DIAMOND_CARD_HTML = gmRowCard(`onclick="location.href='diamond-inventory-list-ar.html'"`,
            '<span class="material-symbols-outlined" style="position:relative;font-size:22px;">diamond</span>',
            'مستودع الألماس', data.length + ' قطعة — منفصل عن وزن الذهب هنا', ct.toFixed(2) + ' ct');
        const el = document.getElementById('diamond-card');
        el.innerHTML = DIAMOND_CARD_HTML;
        if (currentBoxScope === null && document.getElementById('piece-list-view').classList.contains('hidden')
            && document.getElementById('search-results-view').classList.contains('hidden')) el.classList.remove('hidden');
    }

    async function loadLots() {
        const { data, error } = await goldmindClient.from('gold_stock_lots')
            .select('id, karat, weight_grams_total, weight_grams_remaining, box_name, source_invoice_id, notes, created_at, trader:trader_id(name)')
            .eq('store_id', GOLDMIND_STORE_ID).gt('weight_grams_remaining', 0)
            .order('created_at', { ascending: false });
        if (error) { console.warn('lots', error); return; }
        ALL_LOTS = data || [];
        const ids = [...new Set(ALL_LOTS.map(l => l.source_invoice_id).filter(Boolean))];
        if (ids.length) {
            const { data: invs } = await goldmindClient.from('invoices').select('id, invoice_number').in('id', ids);
            (invs || []).forEach(i => { LOT_INVOICES[i.id] = i.invoice_number; });
        }
        if (currentBoxScope === null) renderLots();
    }

    function renderLots() {
        const section = document.getElementById('lots-section');
        if (!ALL_LOTS.length) { section.classList.add('hidden'); return; }
        const groups = {};
        ALL_LOTS.forEach(l => { (groups[lotBoxName(l)] = groups[lotBoxName(l)] || []).push(l); });
        const names = Object.keys(groups).sort((a, b) => a.localeCompare(b, 'ar'));
        document.getElementById('lot-boxes').innerHTML = names.map(n => {
            const lots = groups[n];
            const w = lots.reduce((s, l) => s + Number(l.weight_grams_remaining || 0), 0);
            const t = boxTintFor(n);
            const sel = openLotBox === n;
            return `<button type="button" data-lot-box="${gmEscapeHtml(n)}" aria-expanded="${sel}" class="gm-row" style="${sel ? 'box-shadow:0 0 0 2px #8A6A1C inset;' : ''}">
                <span class="gm-gicon" style="width:44px;height:44px;border-radius:14px;"><span class="material-symbols-outlined" style="position:relative;font-size:22px;">scale</span><span class="gm-sweep" aria-hidden="true"></span></span>
                <span style="flex:1;min-width:0;"><span class="nm truncate">${gmEscapeHtml(n)}</span><span class="sb">${lots.length} دفعة</span></span>
                <span class="w" dir="ltr">${w.toFixed(2)} غ</span>
                <span class="material-symbols-outlined text-[20px]" style="color:#9C8F72;">${sel ? 'expand_less' : 'expand_more'}</span>
            </button>`;
        }).join('');
        document.querySelectorAll('#lot-boxes [data-lot-box]').forEach(b => b.addEventListener('click', () => {
            openLotBox = openLotBox === b.dataset.lotBox ? null : b.dataset.lotBox;
            renderLots();
        }));
        const detail = document.getElementById('lot-detail');
        if (openLotBox && groups[openLotBox]) {
            detail.innerHTML = groups[openLotBox].map(l => {
                const num = LOT_INVOICES[l.source_invoice_id];
                const d = gmFormatDateTime(l.created_at, { day: '2-digit', month: '2-digit', year: 'numeric' });
                const partial = Number(l.weight_grams_remaining) < Number(l.weight_grams_total);
                // where this gold came from: a purchase invoice, a trader, or only a note
                const src = num
                    ? `فاتورة شراء <a style="color:#8A6A1C;text-decoration:underline;font-weight:600" href="invoice-print-ar.html?id=${encodeURIComponent(l.source_invoice_id)}">${gmEscapeHtml(num)}</a>`
                    : (l.trader && l.trader.name ? 'مستلم من التاجر ' + gmEscapeHtml(l.trader.name) : '');
                const note = l.notes && !(num && /^ذهب كسر عيار \d+$/.test(l.notes.trim())) ? l.notes : '';
                return `<div class="flex items-start justify-between gap-3 px-4 py-3" style="border-bottom:1px solid #E8E0CF;">
                    <div class="min-w-0">
                        <div class="text-[13px] font-semibold">عيار ${l.karat || '—'} · ${d}</div>
                        ${src ? `<div class="text-[12px] mt-0.5" style="color:#5A5040">${src}</div>` : ''}
                        ${note ? `<div class="text-[11.5px] mt-0.5" style="color:#6B6150;white-space:normal">${gmEscapeHtml(note)}</div>` : ''}
                    </div>
                    <div class="text-left shrink-0">
                        <div class="font-bold text-[14px]" dir="ltr">${Number(l.weight_grams_remaining).toFixed(2)} غ</div>
                        ${partial ? `<div class="text-[11px]" style="color:#6B6150">من أصل ${Number(l.weight_grams_total).toFixed(2)} غ</div>` : ''}
                    </div>
                </div>`;
            }).join('');
            detail.classList.remove('hidden');
        } else {
            detail.classList.add('hidden');
        }
        section.classList.remove('hidden');
        gmRenderDist();
    }

    // computer: one tile per karat in the number strip, plus the side column
    function invRenderDesk() {
        const byK = {};
        ALL_PIECES.forEach(p => { const k = p.karat || '—'; byK[k] = byK[k] || { n: 0, w: 0 }; byK[k].n++; byK[k].w += Number(p.weight_grams || 0); });
        document.getElementById('inv-karat-tiles').innerHTML = Object.keys(byK).sort((a, b) => Number(b) - Number(a)).slice(0, 3).map(k =>
            `<div class="gm-inv-mini"><div class="l">عيار ${gmEscapeHtml(String(k))}</div><div class="v" dir="ltr" style="text-align:right">${byK[k].w.toFixed(2)} غ</div><div class="l">${byK[k].n} قطعة</div></div>`).join('');
        const recent = [...ALL_PIECES].sort((a, b) => String(b.created_at).localeCompare(String(a.created_at))).slice(0, 5);
        document.getElementById('invRecent').innerHTML = recent.length ? recent.map(p =>
            `<a class="inv-kv" href="piece-edit-ar.html?id=${encodeURIComponent(p.id)}"><span class="truncate"><b>${gmEscapeHtml(p.piece_type || p.description_ar || p.barcode || 'قطعة')}</b> <span class="inv-tag">${gmEscapeHtml(String(p.karat || '—'))}</span></span><span class="font-data-mono" dir="ltr">${Number(p.weight_grams || 0).toFixed(2)} غ</span></a>`).join('')
            : '<p class="text-[12px] text-on-surface-variant py-1">لا توجد قطع بعد.</p>';
        const yearAgo = Date.now() - 365 * 864e5;
        const noPhoto = ALL_PIECES.filter(p => !p.photo_url).length, old = ALL_PIECES.filter(p => p.created_at && Date.parse(p.created_at) < yearAgo).length;
        const reserved = ALL_PIECES_RAW.filter(p => p.status === 'reserved').length;
        document.getElementById('invAttn').innerHTML =
            `<div class="inv-kv"><span>قطع بدون صورة</span><span class="inv-tag ${noPhoto ? 'warn' : 'ok'}">${noPhoto}</span></div>`
            + `<div class="inv-kv"><span>أقدم من سنة بالمخزن</span><span class="inv-tag">${old}</span></div>`
            + `<button type="button" class="inv-kv w-full text-right" onclick="gmPickStatus('reserved')"><span>محجوزة لزبائن</span><span class="inv-tag ${reserved ? 'warn' : ''}">${reserved}</span></button>`;
    }
    async function invLoadLastCount() {
        const el = document.getElementById('invLastCount');
        const { data } = await goldmindClient.from('inventory_counts').select('id, status, started_at, completed_at, missing_count, unexpected_count')
            .eq('store_id', GOLDMIND_STORE_ID).neq('status', 'cancelled').order('started_at', { ascending: false }).limit(1);
        const c = data && data[0];
        if (!c) { el.innerHTML = '<p class="text-[12px] text-on-surface-variant py-1">ما في جرد سابق.</p>'; return; }
        const when = gmFormatDateTime(c.completed_at || c.started_at, { day: '2-digit', month: '2-digit', year: 'numeric' });
        const miss = Number(c.missing_count || 0) + Number(c.unexpected_count || 0);
        const tag = c.status === 'in_progress' ? '<span class="inv-tag warn">لم يكتمل</span>' : miss ? `<span class="inv-tag bad">فرق ${miss}</span>` : '<span class="inv-tag ok">مطابق</span>';
        el.innerHTML = `<div class="inv-kv"><span class="font-data-mono">${when}</span>${tag}</div>`;
    }

    function renderBoxBoxes() {
        const boxesEl = document.getElementById('box-boxes');
        const byBox = {};
        ALL_PIECES.forEach(p => {
            const b = (p.box_name || '').trim();
            if (!b) return;
            if (!byBox[b]) byBox[b] = [];
            byBox[b].push(p);
        });
        const boxNames = Object.keys(byBox).sort((a, b) => a.localeCompare(b));
        boxesEl.innerHTML = (boxNames.length ? '<h2 class="gm-sec">الصناديق</h2>' : '') + boxNames.map(b => boxBoxHtml(b, byBox[b])).join('');
        gmRenderDist();
        if (boxNames.length > 0) {
            boxesEl.classList.remove('hidden');
            boxesEl.classList.add('grid');
        } else {
            boxesEl.classList.add('hidden');
            boxesEl.classList.remove('grid');
        }
    }

    async function loadPieces() {
        const session = await requireGoldMindSession('login-entry-ar.html');
        if (!session) return;

        const loading = document.getElementById('loading-state');
        const empty = document.getElementById('empty-state');
        const errorBox = document.getElementById('error-state');
        const countLabel = document.getElementById('piece-count');

        try {
            // Was hardcoded to AED (AED) on every total-fab line below,
            // ignoring whatever currency the store is actually configured
            // with -- fetched here (alongside pieces, so it's guaranteed
            // ready before renderKaratBoxes() first runs) and now uses the
            // same store-aware formatter (gmFormatDualCurrency, theme.js)
            // every other page in the app uses.
            //
            // "المخزن" shows what's actually sitting in the warehouse right
            // now -- pieces that have been sold or given to a trader have
            // physically left, so they're excluded here (same status='available'
            // convention already used by reports-ar.html's stock-weight total
            // and inventory-count-ar.html's expected list).
            // Fetches every piece regardless of status now -- ALL_PIECES
            // (available-only, derived below) still drives the karat-box
            // drill-down exactly as before, but search needs to reach sold/
            // reserved/given-to-trader pieces too (status is itself one of
            // the filters), so the raw fetch can no longer exclude them.
            const [{ data, error }, { data: storeData }, { data: staffPerm2 }, histRows] = await Promise.all([
                // The server hands back at most 1000 rows per request, so read
                // in pages; otherwise pieces past the first 1000 vanish from search.
                (async () => {
                    const all = [];
                    for (let from = 0; ; from += 1000) {
                        const r = await goldmindClient.from('pieces').select('*')
                            .eq('store_id', GOLDMIND_STORE_ID)
                            .order('created_at', { ascending: false }).order('id')
                            .range(from, from + 999);
                        if (r.error) return r;
                        all.push(...(r.data || []));
                        if (!r.data || r.data.length < 1000) return { data: all, error: null };
                    }
                })(),
                goldmindClient.from('stores').select('currency, secondary_currency, secondary_currency_rate').eq('id', GOLDMIND_STORE_ID).maybeSingle(),
                goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle(),
                goldmindClient.from('piece_barcode_history').select('old_barcode, piece_id').eq('store_id', GOLDMIND_STORE_ID)
            ]);
            currentStore = storeData;
            // Old (replaced) barcode numbers per piece, so searching an old sticker still finds the piece
            OLD_BARCODES_BY_PIECE = {};
            (histRows.data || []).forEach(h => { (OLD_BARCODES_BY_PIECE[h.piece_id] = OLD_BARCODES_BY_PIECE[h.piece_id] || []).push(h.old_barcode); });
            // Fetched here (not just from the separate __enforcePermission
            // check above) so it's guaranteed ready before renderKaratBoxes()
            // first runs, rather than racing a second independent request.
            canViewAccWeight = staffPerm2 && (staffPerm2.role === 'owner' || (staffPerm2.permissions && staffPerm2.permissions['view_reports'] === true));

            loading.classList.add('hidden');

            if (error) {
                errorBox.textContent = 'حدث خطأ أثناء تحميل المخزون: ' + error.message;
                errorBox.classList.remove('hidden');
                return;
            }

            ALL_PIECES_RAW = data || [];
            ALL_PIECES = ALL_PIECES_RAW.filter(p => p.status === 'available');
            populateSearchTypeOptions();
            gmRenderStatusTiles();
            invRenderDesk(); invLoadLastCount();
            // From the home quick search ("ابحث عن القطعة ..."): run the search straight away.
            const __q = new URLSearchParams(location.search).get('q');
            if (__q) { document.getElementById('search-barcode').value = __q; setTimeout(runSearch, 0); }

            loadLots();
            loadDiamondCard();
            if (ALL_PIECES.length === 0) {
                empty.classList.remove('hidden');
                countLabel.textContent = '0 قطعة';
                return;
            }

            renderKaratBoxes();
        } catch (err) {
            // A thrown exception (network drop, CORS, etc.) used to leave the
            // spinner running forever since nothing ever hid #loading-state.
            // Any failure now always resolves to a visible error instead.
            loading.classList.add('hidden');
            errorBox.textContent = 'تعذّر الاتصال بالخادم لتحميل المخزون. تحقق من الاتصال بالإنترنت وأعد المحاولة.';
            errorBox.classList.remove('hidden');
        }
    }

    loadPieces();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
