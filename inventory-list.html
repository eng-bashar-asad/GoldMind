<script>
    requireGoldMindSession();

    const colorSwatch = {
        Gold: '#E3C58E',
        White: '#E5E7EB',
        Rose: '#D4AF37'
    };

    const statusStyle = {
        available: 'bg-green-100 text-green-700',
        sold: 'bg-gray-200 text-gray-600',
        reserved: 'bg-amber-100 text-amber-700'
    };

    function pieceCardHtml(piece) {
        const swatch = colorSwatch[piece.color] || '#cccccc';
        const badgeClass = statusStyle[piece.status] || 'bg-gray-100 text-gray-600';
        const photo = piece.photo_url
            ? `<img src="${piece.photo_url}" class="w-16 h-16 rounded-lg object-cover border border-outline-variant" alt="piece photo"/>`
            : `<div class="w-16 h-16 rounded-lg border border-dashed border-outline-variant bg-surface-container-low flex items-center justify-center">
                 <span class="material-symbols-outlined text-outline">photo_camera</span>
               </div>`;

        return `
        <div class="flex items-center gap-4 p-3 bg-surface-container-lowest border border-outline-variant rounded-xl">
            ${photo}
            <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-2">
                    <span class="font-data-mono text-data-mono font-bold">${piece.weight_grams} g</span>
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${badgeClass}">${piece.status}</span>
                </div>
                <div class="flex items-center gap-2 mt-1">
                    <div class="w-3 h-3 rounded-full shrink-0" style="background-color:${swatch}"></div>
                    <span class="text-on-surface-variant font-label-md text-label-md">${piece.color} &middot; ${piece.karat}K</span>
                </div>
                <div class="text-outline text-[11px] font-data-mono mt-1 truncate">${piece.barcode ? piece.barcode : 'No barcode'}</div>
            </div>
        </div>`;
    }

    async function loadPieces() {
        const loading = document.getElementById('loading-state');
        const empty = document.getElementById('empty-state');
        const errorBox = document.getElementById('error-state');
        const list = document.getElementById('pieces-list');
        const countLabel = document.getElementById('piece-count');
        const weightLabel = document.getElementById('total-weight');

        const { data, error } = await goldmindClient
            .from('pieces')
            .select('*')
            .eq('store_id', GOLDMIND_STORE_ID)
            .order('created_at', { ascending: false });

        loading.classList.add('hidden');

        if (error) {
            errorBox.textContent = 'Error loading inventory: ' + error.message;
            errorBox.classList.remove('hidden');
            return;
        }

        if (!data || data.length === 0) {
            empty.classList.remove('hidden');
            countLabel.textContent = '0 pieces';
            return;
        }

        const totalWeight = data.reduce((sum, p) => sum + Number(p.weight_grams || 0), 0);
        countLabel.textContent = data.length + (data.length === 1 ? ' piece' : ' pieces');
        weightLabel.textContent = totalWeight.toFixed(2) + ' g total';

        list.innerHTML = data.map(pieceCardHtml).join('');
    }

    loadPieces();
</script>
