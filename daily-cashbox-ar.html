<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>

<title>الحركة اليومية | GoldMind</title>

<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d", "success": "#1e7d32"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="window.location.href='index-ar.html'" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">الحركة اليومية</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>

<div id="page-content" class="hidden py-6 flex flex-col gap-4">

<p class="text-[11px] text-outline">هاد دفتر يدوي بسيط لمتابعة كاش الدرج بس — مش جزء من الحسابات الرسمية (المبيعات/الديون/الضريبة موجودين بمكان تاني). الرصيد بيترحل تلقائياً كل يوم كقيد افتتاحي لليوم يلي بعده.</p>

<div id="day-nav" class="hidden items-center justify-between bg-surface-container-lowest border border-outline-variant rounded-xl p-2">
<button onclick="shiftDay(-1)" class="h-9 w-9 flex items-center justify-center rounded-lg hover:bg-surface-container-low"><span class="material-symbols-outlined">chevron_right</span></button>
<span class="text-[13px] font-semibold" id="day-nav-label"></span>
<button onclick="shiftDay(1)" class="h-9 w-9 flex items-center justify-center rounded-lg hover:bg-surface-container-low" id="day-nav-next"><span class="material-symbols-outlined">chevron_left</span></button>
</div>

<div id="balances-by-currency" class="flex flex-col gap-2"></div>

<button onclick="toggleAddForm()" class="w-full h-12 border-2 border-dashed border-outline-variant text-on-background rounded-xl flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add</span> إضافة عملية
</button>

<div class="hidden bg-surface-container-lowest border border-outline-variant rounded-xl p-4" id="addForm">
<div id="addFormDateWrap" class="hidden mb-3">
<label class="block text-[12px] font-semibold text-on-surface-variant mb-1">تاريخ العملية</label>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 text-sm" id="addFormDate" type="date"/>
</div>
<div class="flex gap-2 mb-3">
<button class="flex-1 h-11 rounded-lg text-sm font-semibold border" id="dirInBtn" onclick="setDirection('in')">دخول كاش</button>
<button class="flex-1 h-11 rounded-lg text-sm font-semibold border" id="dirOutBtn" onclick="setDirection('out')">خروج كاش</button>
</div>
<input class="w-full h-11 border border-outline-variant rounded-lg px-3 text-sm mb-3" id="opTypeInput" placeholder="نوع العملية (مثال: بيع، شراء، شراء أثاث مكتب، دين عميل...)"/>
<input class="w-full h-12 border border-outline-variant rounded-lg px-3 text-sm mb-3 font-data-mono" id="amountInput" placeholder="المبلغ" type="number" step="0.01" dir="ltr"/>
<select class="w-full h-11 border border-outline-variant rounded-lg px-3 text-sm mb-3" id="currencySelect">
<option value="AED">درهم إماراتي (AED)</option>
<option value="USD">دولار أمريكي (USD)</option>
<option value="SAR">ريال سعودي (SAR)</option>
<option value="EGP">جنيه مصري (EGP)</option>
<option value="EUR">يورو (EUR)</option>
<option value="GBP">جنيه إسترليني (GBP)</option>
</select>
<textarea class="w-full h-16 border border-outline-variant rounded-lg px-3 py-2 text-sm mb-3" id="notesInput" placeholder="ملاحظة / وصف إضافي (اختياري)"></textarea>
<button onclick="submitEntry()" id="submitBtn" class="w-full h-11 bg-primary text-on-primary rounded-lg text-sm font-semibold">حفظ العملية</button>
<p class="text-error text-[12px] hidden mt-2" id="addFormError"></p>
</div>

<button onclick="toggleReportPanel()" class="w-full h-12 bg-secondary text-on-secondary rounded-xl flex items-center justify-center gap-2 font-semibold">
<span class="material-symbols-outlined">share</span> إرسال جدول اليوم عبر واتساب
</button>
<button onclick="openPrintView()" class="w-full h-12 border-2 border-outline-variant text-on-background rounded-xl flex items-center justify-center gap-2 font-semibold">
<span class="material-symbols-outlined">receipt_long</span> عرض كشف قابل للطباعة
</button>
<div class="hidden bg-surface-container-lowest border border-outline-variant rounded-xl p-4" id="reportPanel">
<p class="text-[12px] text-on-surface-variant mb-3" id="reportPanelIntro">جارِ تجهيز الجدول...</p>
<div id="reportRecipients" class="flex flex-col gap-2"></div>
</div>

<h2 class="font-semibold text-[13px] mt-2" id="entries-heading">عمليات اليوم</h2>
<div id="entries-list" class="flex flex-col gap-2"></div>
<p id="empty-state" class="hidden text-center text-on-surface-variant text-sm py-8">لا توجد عمليات مسجّلة اليوم بعد.</p>

</div>
</main>

<script>
let currentDirection = 'in';
let allEntries = []; // every entry ever (for computing running balance)
let todayEntries = []; // entries for the currently selected day
let canManageDates = false; // owner/manager only: view/add/edit entries on days other than today
let selectedDate = new Date(); selectedDate.setHours(0, 0, 0, 0);

function fmt(n) { return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function isToday(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return d.getTime() === t.getTime();
}

function updateDayNav() {
  const label = document.getElementById('day-nav-label');
  label.textContent = isToday(selectedDate) ? 'اليوم' : selectedDate.toLocaleDateString('ar-EG-u-nu-latn', { day: '2-digit', month: '2-digit', year: 'numeric' });
  document.getElementById('day-nav-next').classList.toggle('invisible', isToday(selectedDate));
  document.getElementById('entries-heading').textContent = isToday(selectedDate) ? 'عمليات اليوم' : 'عمليات يوم ' + label.textContent;
  document.getElementById('empty-state').textContent = isToday(selectedDate) ? 'لا توجد عمليات مسجّلة اليوم بعد.' : 'لا توجد عمليات مسجّلة بهذا اليوم.';
}

function shiftDay(delta) {
  if (delta > 0 && isToday(selectedDate)) return; // can't go past today
  const d = new Date(selectedDate);
  d.setDate(d.getDate() + delta);
  selectedDate = d;
  updateDayNav();
  document.getElementById('addFormDate').value = selectedDate.toISOString().slice(0, 10);
  reportPanelLoaded = false;
  document.getElementById('reportPanel').classList.add('hidden');
  renderAll();
}

function setDirection(dir) {
  currentDirection = dir;
  document.getElementById('dirInBtn').className = 'flex-1 h-11 rounded-lg text-sm font-semibold border ' + (dir === 'in' ? 'bg-success text-white border-success' : 'border-outline-variant');
  document.getElementById('dirOutBtn').className = 'flex-1 h-11 rounded-lg text-sm font-semibold border ' + (dir === 'out' ? 'bg-error text-white border-error' : 'border-outline-variant');
}

function toggleAddForm() {
  document.getElementById('addForm').classList.toggle('hidden');
  if (canManageDates) {
    document.getElementById('addFormDateWrap').classList.remove('hidden');
    document.getElementById('addFormDate').value = selectedDate.toISOString().slice(0, 10);
    document.getElementById('addFormDate').max = new Date().toISOString().slice(0, 10);
  }
}

async function submitEntry() {
  const opType = document.getElementById('opTypeInput').value.trim();
  const amount = parseFloat(document.getElementById('amountInput').value);
  const currency = document.getElementById('currencySelect').value;
  const notes = document.getElementById('notesInput').value.trim();
  const errEl = document.getElementById('addFormError');
  errEl.classList.add('hidden');

  if (!opType) { errEl.textContent = 'فضلاً اكتب نوع العملية'; errEl.classList.remove('hidden'); return; }
  if (!amount || amount <= 0) { errEl.textContent = 'فضلاً أدخل مبلغاً صحيحاً'; errEl.classList.remove('hidden'); return; }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  const insertPayload = {
    store_id: GOLDMIND_STORE_ID,
    operation_type: opType,
    direction: currentDirection,
    amount: amount,
    currency: currency,
    notes: notes || null,
    created_by: GOLDMIND_STAFF_ID
  };

  if (canManageDates) {
    const chosenDateStr = document.getElementById('addFormDate').value;
    if (chosenDateStr) {
      const now = new Date();
      const chosen = new Date(chosenDateStr + 'T00:00:00');
      // Keep the current time-of-day so entries added "for" a past day still
      // sort sensibly among that day's other entries.
      chosen.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
      insertPayload.created_at = chosen.toISOString();
    }
  }

  const { error } = await goldmindClient.from('daily_cash_log').insert(insertPayload);

  btn.disabled = false;
  btn.textContent = 'حفظ العملية';

  if (error) {
    errEl.textContent = 'تعذّر الحفظ: ' + error.message;
    errEl.classList.remove('hidden');
    return;
  }

  document.getElementById('opTypeInput').value = '';
  document.getElementById('amountInput').value = '';
  document.getElementById('notesInput').value = '';
  document.getElementById('addForm').classList.add('hidden');
  reportPanelLoaded = false;
  document.getElementById('reportPanel').classList.add('hidden');
  await loadAll();
}

async function loadAll() {
  const { data, error } = await goldmindClient
    .from('daily_cash_log')
    .select('*, staff:created_by(full_name)')
    .eq('store_id', GOLDMIND_STORE_ID)
    .order('created_at', { ascending: true });

  if (error) {
    document.getElementById('entries-list').innerHTML = `<p class="text-error text-sm text-center py-8">تعذّر التحميل: ${error.message}</p>`;
    return;
  }

  allEntries = data || [];
  renderAll();
}

function renderAll() {
  updateDayNav();

  const dayEnd = new Date(selectedDate); dayEnd.setDate(dayEnd.getDate() + 1);
  todayEntries = allEntries.filter(e => new Date(e.created_at) >= selectedDate && new Date(e.created_at) < dayEnd);
  const priorEntries = allEntries.filter(e => new Date(e.created_at) < selectedDate);

  // Running balance per currency: opening (everything before the selected day) + that day = closing
  const currencies = [...new Set(allEntries.map(e => e.currency))];
  const balancesEl = document.getElementById('balances-by-currency');

  if (currencies.length === 0) {
    balancesEl.innerHTML = '<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 text-center text-on-surface-variant text-sm">لا يوجد رصيد مسجّل بعد.</div>';
  } else {
    balancesEl.innerHTML = currencies.map(cur => {
      const opening = priorEntries.filter(e => e.currency === cur).reduce((s, e) => s + (e.direction === 'in' ? Number(e.amount) : -Number(e.amount)), 0);
      const todayNet = todayEntries.filter(e => e.currency === cur).reduce((s, e) => s + (e.direction === 'in' ? Number(e.amount) : -Number(e.amount)), 0);
      const closing = opening + todayNet;
      return `
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4">
          <div class="text-[11px] font-bold text-secondary mb-2">${cur}</div>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div><p class="text-[10px] text-on-surface-variant">افتتاحي اليوم</p><p class="font-bold text-[14px] font-data-mono">${fmt(opening)}</p></div>
            <div><p class="text-[10px] text-on-surface-variant">صافي اليوم</p><p class="font-bold text-[14px] font-data-mono ${todayNet >= 0 ? 'text-success' : 'text-error'}">${todayNet >= 0 ? '+' : ''}${fmt(todayNet)}</p></div>
            <div><p class="text-[10px] text-on-surface-variant">الرصيد الحالي</p><p class="font-bold text-[15px] font-data-mono">${fmt(closing)}</p></div>
          </div>
        </div>`;
    }).join('');
  }

  const listEl = document.getElementById('entries-list');
  const emptyEl = document.getElementById('empty-state');
  if (todayEntries.length === 0) {
    listEl.innerHTML = '';
    emptyEl.classList.remove('hidden');
  } else {
    emptyEl.classList.add('hidden');
    listEl.innerHTML = todayEntries.slice().reverse().map(e => {
      const isIn = e.direction === 'in';
      const time = new Date(e.created_at).toLocaleTimeString('ar-EG-u-nu-latn', { hour: '2-digit', minute: '2-digit' });
      return `
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4" id="entry-${e.id}">
          <div class="flex items-center justify-between mb-1">
            <span class="font-bold text-[14px]">${e.operation_type}</span>
            <span class="text-[11px] text-on-surface-variant">${time}</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="font-bold text-[15px] font-data-mono ${isIn ? 'text-success' : 'text-error'}">${isIn ? '+' : '-'}${fmt(e.amount)} ${e.currency}</span>
            <span class="text-[11px] text-on-surface-variant">${(e.staff && e.staff.full_name) || ''}</span>
          </div>
          ${e.notes ? `<p class="text-[12px] text-on-surface-variant mt-1">${e.notes}</p>` : ''}
          <div class="flex gap-2 mt-2 pt-2 border-t border-outline-variant">
            <button onclick="toggleEditEntry('${e.id}')" class="flex-1 h-9 border border-outline-variant rounded-lg text-[12px] font-semibold flex items-center justify-center gap-1">
              <span class="material-symbols-outlined text-[16px]">edit</span> تعديل
            </button>
            <button onclick="deleteEntry('${e.id}')" class="flex-1 h-9 border border-error text-error rounded-lg text-[12px] font-semibold flex items-center justify-center gap-1">
              <span class="material-symbols-outlined text-[16px]">delete</span> حذف
            </button>
          </div>
          <div class="hidden mt-3 pt-3 border-t border-outline-variant flex-col gap-2" id="edit-form-${e.id}">
            <div class="flex gap-2">
              <button class="flex-1 h-9 rounded-lg text-[12px] font-semibold border ${isIn ? 'bg-success text-white border-success' : 'border-outline-variant'}" id="edit-dir-in-${e.id}" onclick="setEditDirection('${e.id}', 'in')">دخول كاش</button>
              <button class="flex-1 h-9 rounded-lg text-[12px] font-semibold border ${!isIn ? 'bg-error text-white border-error' : 'border-outline-variant'}" id="edit-dir-out-${e.id}" onclick="setEditDirection('${e.id}', 'out')">خروج كاش</button>
            </div>
            <input class="w-full h-10 border border-outline-variant rounded-lg px-3 text-[13px]" id="edit-type-${e.id}" value="${(e.operation_type || '').replace(/"/g, '&quot;')}"/>
            <input class="w-full h-10 border border-outline-variant rounded-lg px-3 text-[13px] font-data-mono" id="edit-amount-${e.id}" type="number" step="0.01" dir="ltr" value="${e.amount}"/>
            <select class="w-full h-10 border border-outline-variant rounded-lg px-3 text-[13px]" id="edit-currency-${e.id}">
              <option value="AED" ${e.currency === 'AED' ? 'selected' : ''}>درهم إماراتي (AED)</option>
              <option value="USD" ${e.currency === 'USD' ? 'selected' : ''}>دولار أمريكي (USD)</option>
              <option value="SAR" ${e.currency === 'SAR' ? 'selected' : ''}>ريال سعودي (SAR)</option>
              <option value="EGP" ${e.currency === 'EGP' ? 'selected' : ''}>جنيه مصري (EGP)</option>
              <option value="EUR" ${e.currency === 'EUR' ? 'selected' : ''}>يورو (EUR)</option>
              <option value="GBP" ${e.currency === 'GBP' ? 'selected' : ''}>جنيه إسترليني (GBP)</option>
            </select>
            <textarea class="w-full h-14 border border-outline-variant rounded-lg px-3 py-2 text-[13px]" id="edit-notes-${e.id}">${e.notes || ''}</textarea>
            <div class="flex gap-2">
              <button onclick="saveEditEntry('${e.id}')" class="flex-1 h-9 bg-primary text-on-primary rounded-lg text-[12px] font-semibold">حفظ التعديل</button>
              <button onclick="toggleEditEntry('${e.id}')" class="flex-1 h-9 border border-outline-variant rounded-lg text-[12px] font-semibold">إلغاء</button>
            </div>
            <p class="text-error text-[11px] hidden" id="edit-error-${e.id}"></p>
          </div>
        </div>`;
    }).join('');
  }
}

const editDirections = {};

function toggleEditEntry(id) {
  const form = document.getElementById('edit-form-' + id);
  form.classList.toggle('hidden');
  form.classList.toggle('flex');
}

function setEditDirection(id, dir) {
  editDirections[id] = dir;
  document.getElementById('edit-dir-in-' + id).className = 'flex-1 h-9 rounded-lg text-[12px] font-semibold border ' + (dir === 'in' ? 'bg-success text-white border-success' : 'border-outline-variant');
  document.getElementById('edit-dir-out-' + id).className = 'flex-1 h-9 rounded-lg text-[12px] font-semibold border ' + (dir === 'out' ? 'bg-error text-white border-error' : 'border-outline-variant');
}

async function saveEditEntry(id) {
  const opType = document.getElementById('edit-type-' + id).value.trim();
  const amount = parseFloat(document.getElementById('edit-amount-' + id).value);
  const currency = document.getElementById('edit-currency-' + id).value;
  const notes = document.getElementById('edit-notes-' + id).value.trim();
  const errEl = document.getElementById('edit-error-' + id);
  errEl.classList.add('hidden');

  if (!opType) { errEl.textContent = 'فضلاً اكتب نوع العملية'; errEl.classList.remove('hidden'); return; }
  if (!amount || amount <= 0) { errEl.textContent = 'فضلاً أدخل مبلغاً صحيحاً'; errEl.classList.remove('hidden'); return; }

  const originalEntry = todayEntries.find(e => e.id === id);
  const direction = editDirections[id] || (originalEntry ? originalEntry.direction : 'in');

  const { error } = await goldmindClient.from('daily_cash_log').update({
    operation_type: opType,
    direction: direction,
    amount: amount,
    currency: currency,
    notes: notes || null
  }).eq('id', id);

  if (error) {
    errEl.textContent = 'تعذّر الحفظ: ' + error.message;
    errEl.classList.remove('hidden');
    return;
  }

  reportPanelLoaded = false;
  document.getElementById('reportPanel').classList.add('hidden');
  await loadAll();
}

async function deleteEntry(id) {
  if (!confirm('هل أنت متأكد من حذف هذه العملية نهائياً؟ الرصيد رح يتحدّث تلقائياً.')) return;

  const { error } = await goldmindClient.from('daily_cash_log').delete().eq('id', id);
  if (error) {
    alert('تعذّر الحذف: ' + error.message);
    return;
  }

  reportPanelLoaded = false;
  document.getElementById('reportPanel').classList.add('hidden');
  await loadAll();
}

function openPrintView() {
  const dateStr = selectedDate.toISOString().slice(0, 10);
  window.open('daily-cashbox-print-ar.html?date=' + dateStr, '_blank');
}

let reportPanelLoaded = false;
function toggleReportPanel() {
  const panel = document.getElementById('reportPanel');
  panel.classList.toggle('hidden');
  if (!panel.classList.contains('hidden') && !reportPanelLoaded) {
    reportPanelLoaded = true;
    buildDailyReport();
  }
}

async function buildDailyReport() {
  const todayStart = selectedDate;
  const dateLabel = todayStart.toLocaleDateString('ar-EG-u-nu-latn', { day: '2-digit', month: '2-digit', year: 'numeric' });

  const { data: store } = await goldmindClient.from('stores').select('name').eq('id', GOLDMIND_STORE_ID).maybeSingle();

  // WhatsApp has no real table markup, but wrapping fixed-width padded
  // rows in a ``` code block renders them in a monospace font, so the
  // description/amount columns line up visually like a table.
  const rows = todayEntries.map(e => {
    const isIn = e.direction === 'in';
    const signedAmount = (isIn ? '+' : '-') + fmt(e.amount) + ' ' + e.currency;
    return { label: e.operation_type + (e.notes ? ' (' + e.notes + ')' : ''), amount: signedAmount };
  });

  let tableBlock;
  if (rows.length === 0) {
    tableBlock = 'لا توجد عمليات اليوم';
  } else {
    const labelWidth = Math.min(28, Math.max(...rows.map(r => r.label.length)));
    const amountWidth = Math.max(...rows.map(r => r.amount.length));
    const tableLines = rows.map(r => {
      const label = r.label.length > labelWidth ? r.label.slice(0, labelWidth - 1) + '…' : r.label.padEnd(labelWidth, ' ');
      const amount = r.amount.padStart(amountWidth, ' ');
      return label + '  ' + amount;
    });
    tableBlock = '```\n' + tableLines.join('\n') + '\n```';
  }

  const currencies = [...new Set(allEntries.map(e => e.currency))];
  const balanceLines = currencies.map(cur => {
    const total = allEntries.filter(e => e.currency === cur).reduce((s, e) => s + (e.direction === 'in' ? Number(e.amount) : -Number(e.amount)), 0);
    return `${cur}: ${fmt(total)}`;
  }).join('\n') || 'لا يوجد رصيد';

  const dateStr = selectedDate.toISOString().slice(0, 10);
  const printLink = window.location.origin + window.location.pathname.replace('daily-cashbox-ar.html', 'daily-cashbox-print-ar.html') + '?date=' + dateStr;
  const fileLine = `\n📎 الكشف القابل للطباعة:\n${printLink}`;

  const reportText =
    `*جدول الحركة اليومية*\n` +
    `Day ${dateLabel}\n` +
    `${store ? store.name : ''}\n` +
    `——————————\n` +
    `${tableBlock}\n` +
    `——————————\n` +
    `💰 الرصيد الحالي بالدرج:\n${balanceLines}\n` +
    fileLine;

  document.getElementById('reportPanelIntro').textContent = 'الجدول جاهز — اختر مين تبعتله:';

  const { data: managers } = await goldmindClient
    .from('staff').select('id, full_name, whatsapp_phone')
    .eq('store_id', GOLDMIND_STORE_ID).eq('permissions->>view_reports', 'true')
    .not('whatsapp_phone', 'is', null);

  const listEl = document.getElementById('reportRecipients');
  if (!managers || managers.length === 0) {
    listEl.innerHTML = '<p class="text-[12px] text-on-surface-variant">ما في مدراء فعّلوا رقم واتساب لاستلام التقارير بعد (من صفحة "الأمان وكلمة المرور").</p>';
    return;
  }

  listEl.innerHTML = managers.map(m => `
    <a class="h-11 flex items-center justify-center gap-2 bg-success text-white rounded-lg text-sm font-semibold"
       href="https://wa.me/${m.whatsapp_phone}?text=${encodeURIComponent(reportText)}" target="_blank" rel="noopener">
      <span class="material-symbols-outlined text-[18px]">send</span> إرسال لـ ${m.full_name}
    </a>`).join('');
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  const { data: staffRow } = await goldmindClient.from('staff').select('permissions, role').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
  canManageDates = !!(staffRow && (staffRow.role === 'owner' || (staffRow.permissions && staffRow.permissions.view_profit_report)));
  document.getElementById('day-nav').classList.toggle('hidden', !canManageDates);
  document.getElementById('day-nav').classList.toggle('flex', canManageDates);

  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('page-content').classList.remove('hidden');
  setDirection('in');
  await loadAll();
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
