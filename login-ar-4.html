<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --royal-gold: #FFD700;
            --deep-navy: #0f172a;
        }
        body {
            font-family: 'IBM+Plex+Sans+Arabic', 'Inter', sans-serif;

        }

            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);

            box-shadow: 0 0 0 1px var(--royal-gold);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #FFD700 0%, #B4955A 100%);
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);

        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            font-size: 20px;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#FFD700",
                        "on-primary": "#0f172a",
                        "secondary": "#745a25",
                        "surface": "#0f172a",
                        "surface-container": "#1e293b",
                        "outline": "#76777d",
                        "background": "#0f172a"
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    fontFamily: {
                        "headline-xl": ["Inter", "IBM+Plex+Sans+Arabic"],
                        "body-md": ["Inter", "IBM+Plex+Sans+Arabic"]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">
<!-- Atmospheric Background Animation -->
<div class="fixed inset-0 z-0 opacity-20 pointer-events-none">
</div>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Identity -->
<div class="mb-10 text-center animate-fade-in">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-full border-2 border-primary/30 mb-6 bg-surface-container relative">
<span class="material-symbols-outlined text-primary text-5xl gold-glow" style="font-variation-settings: 'FILL' 1;">temp_preferences_custom</span>
<div class="absolute inset-0 rounded-full animate-pulse bg-primary/10 blur-xl"></div>
</div>
<h1 class="text-4xl font-headline-xl font-bold tracking-tight text-primary mb-2">جولد مايند</h1>
<p class="text-xl text-primary/80 opacity-90">مرحباً بك في جولد مايند</p>
</div>
<!-- Login Form Card -->
<div class="glass-panel w-full p-8 rounded-xl shadow-2xl space-y-8 animate-fade-in">
<a class="inline-flex items-center gap-1 text-sm text-primary/60 hover:text-primary transition-colors mb-4" href="login-entry-ar.html">
<span class="material-symbols-outlined text-base">arrow_forward</span>
                تغيير البريد الإلكتروني
            </a>
<div class="text-center mb-8">
<h2 class="text-2xl font-bold text-white">التحقق بخطوتين</h2>
<div class="h-1 w-12 bg-primary mx-auto mt-2 rounded-full"></div>
<p class="text-sm text-primary/70 mt-4">أدخل الرمز المكوّن من ٨ أرقام المرسل إلى بريدك الإلكتروني</p>
<p class="text-sm text-primary font-semibold mt-1" dir="ltr" id="phoneDisplay"></p>
</div>
<form class="space-y-8" id="otpForm">
<div class="flex justify-center gap-2 dir-ltr" dir="ltr">
<input class="w-10 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-10 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-10 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-10 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-10 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-10 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-10 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
<input class="w-10 h-14 text-center text-2xl font-bold bg-black/20 border border-primary/30 rounded-lg text-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all" maxlength="1" type="text"/>
</div>
<button class="w-full gold-gradient text-on-primary font-bold py-4 rounded-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-200 text-lg" type="submit">
            تحقق
        </button>
<div class="text-center">
<button class="text-sm font-semibold text-primary hover:text-white transition-colors duration-200" id="resendBtn" type="button">
                إعادة إرسال الرمز
            </button>
<p class="text-error text-sm mt-3 hidden text-center" id="otpFormError"></p>
</div>
</form>
<!-- Footer / Language Switcher -->
<footer class="mt-12 flex flex-col items-center gap-6 text-primary/40">
<div class="flex items-center gap-4 text-sm font-medium">
<button class="text-primary hover:text-white transition-colors">العربية</button>
<div class="w-px h-3 bg-primary/20"></div>
<button class="hover:text-primary transition-colors">English</button>
</div>
<p class="text-xs">© ٢٠٢٤ جولد مايند لإدارة محلات الذهب. جميع الحقوق محفوظة.</p>
</footer>
</main>
<!-- Side Decorative elements -->
<div class="fixed top-0 right-0 w-64 h-64 bg-primary/5 blur-[120px] rounded-full -mr-32 -mt-32"></div>
<div class="fixed bottom-0 left-0 w-64 h-64 bg-primary/5 blur-[120px] rounded-full -ml-32 -mb-32"></div>
<script>
        // Require the email-entry step first; if this page is opened directly, send back
        (function() {
            const email = sessionStorage.getItem('goldmind_email');
            if (!email) {
                window.location.href = 'login-entry-ar.html';
                return;
            }
            const el = document.getElementById('phoneDisplay');
            if (el) el.textContent = email;
        })();

        // If a session already exists (e.g. the user came back after clicking the
        // email link in another tab), skip straight to the dashboard.
        (async function checkExistingSession() {
            const { data: { session } } = await goldmindClient.auth.getSession();
            if (session) window.location.href = 'index-ar.html';
        })();

        // Auto-advance between the 6 OTP boxes as the user types
        const otpInputs = document.querySelectorAll('input[maxlength="1"]');
        otpInputs.forEach((input, idx) => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^0-9]/g, '');
                if (input.value && idx < otpInputs.length - 1) {
                    otpInputs[idx + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && idx > 0) {
                    otpInputs[idx - 1].focus();
                }
            });
        });

        // Real verification against Supabase, then create the owner profile on first login
        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = sessionStorage.getItem('goldmind_email');
            const code = Array.from(otpInputs).map(i => i.value).join('');
            const errEl = document.getElementById('otpFormError');
            errEl.classList.add('hidden');

            if (code.length !== 8) {
                errEl.textContent = 'فضلاً أدخل الرمز المكوّن من ٨ أرقام كاملاً';
                errEl.classList.remove('hidden');
                return;
            }

            const { data, error } = await goldmindClient.auth.verifyOtp({
                email: email,
                token: code,
                type: 'email'
            });

            if (error) {
                errEl.textContent = 'الرمز غير صحيح أو منتهي الصلاحية: ' + error.message;
                errEl.classList.remove('hidden');
                return;
            }

            const user = data.user;
            const { data: existingStaff } = await goldmindClient
                .from('staff')
                .select('id')
                .eq('id', user.id)
                .maybeSingle();

            if (!existingStaff) {
                const { count } = await goldmindClient
                    .from('staff')
                    .select('id', { count: 'exact', head: true })
                    .eq('store_id', GOLDMIND_STORE_ID);
                const role = (count === 0) ? 'owner' : 'staff';
                await goldmindClient.from('staff').insert({
                    id: user.id,
                    store_id: GOLDMIND_STORE_ID,
                    full_name: email.split('@')[0],
                    role: role,
                    can_sell: true,
                    can_manage_inventory: role === 'owner',
                    can_view_reports: role === 'owner',
                    can_delete: role === 'owner'
                });
            }

            sessionStorage.removeItem('goldmind_email');
            window.location.href = 'index-ar.html';
        });

        // Resend the sign-in link
        document.getElementById('resendBtn').addEventListener('click', async function() {
            const email = sessionStorage.getItem('goldmind_email');
            const errEl = document.getElementById('otpFormError');
            this.disabled = true;
            const original = this.textContent;
            this.textContent = 'جارِ الإرسال...';
            const { error } = await goldmindClient.auth.signInWithOtp({
                email,
                options: {
                    shouldCreateUser: true,
                    emailRedirectTo: 'https://eng-bashar-asad.github.io/GoldMind/auth-callback-ar.html'
                }
            });
            this.disabled = false;
            this.textContent = original;
            if (error) {
                errEl.textContent = 'تعذّر إعادة الإرسال: ' + error.message;
                errEl.classList.remove('hidden');
            } else {
                errEl.classList.add('hidden');
                alert('تم إرسال رابط جديد إلى بريدك الإلكتروني');
            }
        });

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple mouse tracking for a subtle parallax glow effect on the card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-panel');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
</body></html>
