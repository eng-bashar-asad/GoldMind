        html { font-size: 87.5%; }
    .logo-tilt-wrap { position: relative; width: 58%; max-width: 230px; margin: 0 auto 0.75rem auto; aspect-ratio: 1033 / 1204; padding: 0; overflow: hidden; }
    .logo-tilt-wrap { animation: gmLogoArrive 0.9s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes gmLogoArrive {
      0%   { opacity: 0; transform: scale(0.82); filter: brightness(1.6) saturate(0.6); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: scale(1); filter: brightness(1) saturate(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-tilt-wrap { animation: none; }
    }
    .logo-tilt-inner { width: 100%; height: 100%; position: relative; }
    .logo-tilt-img { width: 100%; height: 100%; display: block; border: 0; pointer-events: none; object-fit: contain; }
    .logo-tilt-glare { position: absolute; inset: 0; opacity: 0; transition: opacity 0.2s ease-out; pointer-events: none; mix-blend-mode: screen; }
    .logo-auto-shine {
        position: absolute; inset-block: 0; left: -33%; width: 33%; pointer-events: none;
        background: linear-gradient(100deg, transparent, rgba(255,255,255,0.6), transparent);
        animation: gmLogoAutoShine 7s ease-in-out infinite;
    }
    @keyframes gmLogoAutoShine {
        0%, 72% { transform: translateX(-400%) skewX(-18deg); opacity: 0; }
        76% { opacity: .8; }
        94%, 100% { transform: translateX(500%) skewX(-18deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo-auto-shine { animation: none; display: none; }
    }

        :root {
            --royal-gold: #FFD700;
            --deep-navy: #0f232a;
        }
        body {
            font-family: 'IBM+Plex+Sans+Arabic', 'Inter', sans-serif;
            background-color: var(--deep-navy);
            overflow: hidden;
        }
        .gold-glow {
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .gem-comet {
            filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.9)) drop-shadow(0 0 7px rgba(255, 255, 255, 0.6));
        }
        .gem-comet-a {
            animation: gemCometForward 1.4s linear infinite;
        }
        .gem-comet-b {
            animation: gemCometReverse 2.3s linear infinite;
        }
        @keyframes gemCometForward {
            to { stroke-dashoffset: -140; }
        }
        @keyframes gemCometReverse {
            to { stroke-dashoffset: 140; }
        }
        .gem-node {
            transform-box: fill-box;
            transform-origin: center;
            animation: gemPulse 1.8s ease-in-out infinite;
        }
        .gem-node-2 { animation-delay: 0.3s; }
        .gem-node-3 { animation-delay: 0.6s; }
        @keyframes gemPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.45; }
        }
        .gold-border-focus:focus-within {
            border-color: var(--royal-gold);
            box-shadow: 0 0 0 1px var(--royal-gold);
        }
        .gold-gradient {
            background: linear-gradient(135deg, #FFD700 0%, #B4955A 100%);
        }
        .glass-panel {
            background: rgba(30, 51, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
            font-size: 18px;
        }
        .otp-box {
            opacity: 0;
            transform: translateY(16px) scale(0.9);
            animation: otpIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.18);
        }
        @keyframes otpIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .otp-box.filled {
            border-color: var(--royal-gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.45);
        }
        .shield-badge {
            width: 56px; height: 56px; border-radius: 999px;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(255,215,0,0.18) 0%, rgba(255,215,0,0.04) 70%);
            border: 1px solid rgba(255, 215, 0, 0.35);
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.25);
            animation: shieldPulse 2.4s ease-in-out infinite;
            margin: 0 auto 0.75rem;
            transition: border-color 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
        }
        .shield-badge.success {
            background: radial-gradient(circle, rgba(34,197,94,0.22) 0%, rgba(34,197,94,0.04) 70%);
            border-color: rgba(34, 197, 94, 0.5);
            box-shadow: 0 0 22px rgba(34, 197, 94, 0.4);
            animation: none;
        }
        @keyframes shieldPulse {
            0%, 100% { box-shadow: 0 0 14px rgba(255, 215, 0, 0.2); }
            50% { box-shadow: 0 0 26px rgba(255, 215, 0, 0.4); }
        }
        #otpSubmitBtn { transition: background 0.35s ease, box-shadow 0.35s ease, transform 0.2s ease; }
        #otpSubmitBtn.otp-btn-verifying {
            background: linear-gradient(135deg, #3a3120 0%, #4a3f28 100%) !important;
            box-shadow: 0 0 16px rgba(255, 215, 0, 0.3);
            pointer-events: none;
        }
        #otpSubmitBtn.otp-btn-success {
            background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%) !important;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
            pointer-events: none;
        }
        .otp-btn-spinner {
            width: 18px; height: 18px; border-radius: 999px;
            border: 2.5px solid rgba(255, 215, 0, 0.25);
            border-top-color: var(--royal-gold);
            animation: otpSpin 0.7s linear infinite;
            display: inline-block; vertical-align: middle;
        }
        @keyframes otpSpin { to { transform: rotate(360deg); } }
        .otp-btn-check {
            display: inline-block; vertical-align: middle;
            animation: otpCheckPop 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes otpCheckPop {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }
        /* "Verifying" ring: the boxes fade out and a scanning ring with
           orbiting satellite dots (echoing the digits) takes their place;
           on success the orbit stops and the ring turns green with a
           checkmark growing at its center. */
        #otpScanWrap {
            display: none; align-items: center; justify-content: center;
            height: 132px; position: relative;
        }
        #otpScanWrap.active { display: flex; }
        .otp-scan-ring {
            width: 92px; height: 92px; border-radius: 999px;
            border: 2px solid rgba(255, 215, 0, 0.55);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            animation: scanPulse 1.3s ease-in-out infinite;
        }
        .otp-scan-ring.success {
            border-color: rgba(34, 197, 94, 0.7);
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.5);
            animation: none;
        }
        @keyframes scanPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(255, 215, 0, 0.25); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
        }
        .otp-scan-core {
            width: 14px; height: 14px; border-radius: 999px;
            background: var(--royal-gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
            transition: all 0.3s ease;
        }
        .otp-scan-ring.success .otp-scan-core { width: 0; height: 0; box-shadow: none; }
        .otp-scan-check {
            position: absolute; opacity: 0; transform: scale(0.3);
            color: #22c55e; font-size: 32px;
        }
        .otp-scan-ring.success .otp-scan-check {
            animation: otpCheckPop 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .otp-scan-orbit { position: absolute; inset: -22px; animation: orbitSpin 2.6s linear infinite; }
        .otp-scan-ring.success .otp-scan-orbit { animation: none; opacity: 0; transition: opacity 0.3s ease; }
        @keyframes orbitSpin { to { transform: rotate(360deg); } }
        .otp-scan-dot {
            position: absolute; top: 50%; left: 50%; width: 7px; height: 7px; border-radius: 999px;
            background: var(--royal-gold); box-shadow: 0 0 7px rgba(255, 215, 0, 0.75);
            margin: -3.5px 0 0 -3.5px;
        }

<script>
        // Require the email-entry step first; if this page is opened directly, send back
        (function() {
            const email = sessionStorage.getItem('goldmind_email');
            if (!email) {
                window.location.href = 'login-entry-ar.html';
                return;
            }
            const el = document.getElementById('phoneDisplay');
            if (el) el.textContent = email;
        })();

        // If a session already exists (e.g. the user came back after clicking the
        // email link in another tab), skip straight to the dashboard.
        (async function checkExistingSession() {
            const { data: { session } } = await goldmindClient.auth.getSession();
            if (session) window.location.href = 'index-ar.html';
        })();

        // Auto-advance between the 8 OTP boxes as the user types
        const otpInputs = document.querySelectorAll('.otp-box');
        otpInputs[0].focus();

        function distributeCode(code) {
            const digits = code.replace(/[^0-9]/g, '').slice(0, otpInputs.length).split('');
            digits.forEach((d, i) => {
                otpInputs[i].value = d;
                otpInputs[i].classList.add('filled');
            });
            const nextEmpty = digits.length < otpInputs.length ? digits.length : otpInputs.length - 1;
            otpInputs[nextEmpty].focus();
            maybeAutoSubmit();
        }

        // Once all 8 boxes are filled (paste or manual typing), submit immediately
        // without waiting for the "تحقق" button — mirrors native OTP autofill UX.
        function maybeAutoSubmit() {
            const code = Array.from(otpInputs).map(i => i.value).join('');
            if (code.length === otpInputs.length) {
                document.getElementById('otpForm').requestSubmit();
            }
        }

        otpInputs.forEach((input, idx) => {
            input.addEventListener('input', () => {
                const digitsOnly = input.value.replace(/[^0-9]/g, '');

                if (digitsOnly.length > 1) {
                    // A full/partial code landed in one box (paste, or fast typing
                    // that outran maxlength) — redistribute it across all boxes.
                    distributeCode(digitsOnly);
                    return;
                }

                input.value = digitsOnly;
                input.classList.toggle('filled', !!digitsOnly);
                if (digitsOnly && idx < otpInputs.length - 1) {
                    otpInputs[idx + 1].focus();
                }
                maybeAutoSubmit();
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && idx > 0) {
                    otpInputs[idx - 1].focus();
                }
            });
            input.addEventListener('paste', (e) => {
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                if (pasted && pasted.replace(/[^0-9]/g, '').length >= 2) {
                    e.preventDefault();
                    distributeCode(pasted);
                }
            });
        });

        // Also catch a paste anywhere on the form (in case focus isn't on a box)
        document.getElementById('otpForm').addEventListener('paste', (e) => {
            const pasted = (e.clipboardData || window.clipboardData).getData('text');
            if (pasted && pasted.replace(/[^0-9]/g, '').length >= 2) {
                e.preventDefault();
                distributeCode(pasted);
            }
        });

        // Real verification against Supabase, then create the owner profile on first login
        let otpSubmitting = false;

        function setOtpButtonState(state) {
            const btn = document.getElementById('otpSubmitBtn');
            const label = document.getElementById('otpSubmitBtnLabel');
            const boxes = document.getElementById('otpBoxes');
            const scanWrap = document.getElementById('otpScanWrap');
            const scanRing = document.getElementById('otpScanRing');
            const badge = document.getElementById('otpHeaderBadge');
            const icon = document.getElementById('otpHeaderIcon');

            btn.classList.remove('otp-btn-verifying', 'otp-btn-success');
            scanRing.classList.remove('success');
            badge.classList.remove('success');

            if (state === 'verifying') {
                boxes.classList.add('hidden');
                scanWrap.classList.add('active');
                btn.classList.add('otp-btn-verifying');
                label.innerHTML = '<span class="otp-btn-spinner"></span> جارِ التحقق...';
            } else if (state === 'success') {
                boxes.classList.add('hidden');
                scanWrap.classList.add('active');
                scanRing.classList.add('success');
                badge.classList.add('success');
                icon.textContent = 'verified_user';
                icon.style.color = '#22c55e';
                btn.classList.add('otp-btn-success');
                label.innerHTML = '<span class="otp-btn-check material-symbols-outlined" style="font-variation-settings: \'FILL\' 1, \'wght\' 700; font-size: 20px;">check_circle</span> تم التحقق';
            } else {
                boxes.classList.remove('hidden');
                scanWrap.classList.remove('active');
                icon.textContent = 'key';
                icon.style.color = 'var(--royal-gold)';
                label.textContent = 'تحقق';
            }
        }

        async function showVerifiedThenNavigate(url) {
            setOtpButtonState('success');
            await new Promise(r => setTimeout(r, 750));
            gmDissolveNavigate(url);
        }

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (otpSubmitting) return; // ponytail: simple in-flight guard, no cancellation/retry logic
            const email = sessionStorage.getItem('goldmind_email');
            const code = Array.from(otpInputs).map(i => i.value).join('');
            const errEl = document.getElementById('otpFormError');
            errEl.classList.add('hidden');

            if (code.length !== 8) {
                errEl.textContent = 'فضلاً أدخل الرمز المكوّن من ٨ أرقام كاملاً';
                errEl.classList.remove('hidden');
                return;
            }

            otpSubmitting = true;
            setOtpButtonState('verifying');
            const { data, error } = await goldmindClient.auth.verifyOtp({
                email: email,
                token: code,
                type: 'email'
            });

            if (error) {
                errEl.textContent = 'الرمز غير صحيح أو منتهي الصلاحية: ' + error.message;
                errEl.classList.remove('hidden');
                otpSubmitting = false;
                setOtpButtonState('idle');
                return;
            }

            const user = data.user;
            const mode = sessionStorage.getItem('goldmind_mode');

            if (mode === 'join') {
                // Check EXISTING memberships first -- someone already
                // belonging to more than one company needs to pick which
                // to enter now, same as someone with 2+ pending invites.
                const { data: memberships } = await goldmindClient
                    .from('staff').select('store_id, stores(name)').eq('user_id', user.id);

                if (memberships && memberships.length > 1) {
                    otpSubmitting = false;
                    setOtpButtonState('idle');
                    const listEl = document.getElementById('otpInviteList');
                    listEl.classList.remove('hidden');
                    listEl.classList.add('flex');
                    listEl.innerHTML = '';
                    memberships.forEach(m => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'w-full h-12 rounded-lg font-bold text-black';
                        btn.style.background = 'linear-gradient(135deg, #FFD700 0%, #B4955A 100%)';
                        btn.textContent = (m.stores && m.stores.name) || m.store_id;
                        btn.onclick = () => {
                            localStorage.setItem('goldmind_active_store', m.store_id);
                            sessionStorage.removeItem('goldmind_email');
                            sessionStorage.removeItem('goldmind_mode');
                            sessionStorage.removeItem('goldmind_company_name');
                            showVerifiedThenNavigate('index-ar.html');
                        };
                        listEl.appendChild(btn);
                    });
                    listEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
                    return; // wait for the user's pick above
                }

                const anyMembership = memberships && memberships.length === 1 ? memberships[0] : null;

                if (!anyMembership) {
                    // Which company(ies) this email is invited to is only
                    // resolved NOW, after the code has proven this person
                    // actually owns the email -- find_my_pending_invites()
                    // is scoped entirely to auth.uid()'s own verified email
                    // server-side, so no company name or invite is ever
                    // exposed based on a client-supplied value.
                    const { data: invites, error: invitesError } = await goldmindClient.rpc('find_my_pending_invites');

                    if (invitesError || !invites || invites.length === 0) {
                        errEl.textContent = 'هذا البريد الإلكتروني مو مدعو من أي شركة. تواصل مع مدير الشركة ليضيفك، أو سجّل شركة جديدة.';
                        errEl.classList.remove('hidden');
                        otpSubmitting = false;
                        setOtpButtonState('idle');
                        await goldmindClient.auth.signOut();
                        return;
                    }

                    if (invites.length === 1) {
                        const { error: rpcError } = await goldmindClient.rpc('join_company_by_invite', { target_store_id: invites[0].store_id });
                        if (rpcError) {
                            errEl.textContent = 'تعذّر الانضمام للشركة: ' + rpcError.message;
                            errEl.classList.remove('hidden');
                            otpSubmitting = false;
                            setOtpButtonState('idle');
                            await goldmindClient.auth.signOut();
                            return;
                        }
                        localStorage.setItem('goldmind_active_store', invites[0].store_id);
                    } else {
                        // Rare: same email invited to more than one company.
                        // Show only THEIR OWN invited companies to pick from.
                        otpSubmitting = false;
                        setOtpButtonState('idle');
                        const listEl = document.getElementById('otpInviteList');
                        listEl.classList.remove('hidden');
                        listEl.classList.add('flex');
                        listEl.innerHTML = '';
                        invites.forEach(inv => {
                            const btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'w-full h-12 rounded-lg font-bold text-black';
                            btn.style.background = 'linear-gradient(135deg, #FFD700 0%, #B4955A 100%)';
                            btn.textContent = inv.store_name;
                            btn.onclick = async () => {
                                listEl.innerHTML = '';
                                listEl.classList.add('hidden');
                                setOtpButtonState('loading');
                                const { error: joinError } = await goldmindClient.rpc('join_company_by_invite', { target_store_id: inv.store_id });
                                if (joinError) {
                                    errEl.textContent = 'تعذّر الانضمام للشركة: ' + joinError.message;
                                    errEl.classList.remove('hidden');
                                    setOtpButtonState('idle');
                                    await goldmindClient.auth.signOut();
                                    return;
                                }
                                localStorage.setItem('goldmind_active_store', inv.store_id);
                                sessionStorage.removeItem('goldmind_email');
                                sessionStorage.removeItem('goldmind_mode');
                                sessionStorage.removeItem('goldmind_company_name');
                                showVerifiedThenNavigate('index-ar.html');
                            };
                            listEl.appendChild(btn);
                        });
                        listEl.scrollIntoView({ behavior: 'smooth', block: 'end' });
                        return; // wait for the user's pick above
                    }
                }
            } else if (mode === 'new') {
                // A "new company" request must always create the company,
                // even if this email already owns/joined other companies
                // (multi-tenant: same email can belong to several stores).
                const companyName = sessionStorage.getItem('goldmind_company_name');
                const termsAccepted = sessionStorage.getItem('goldmind_terms_accepted') === 'true';
                const { data: newStoreId, error: rpcError } = await goldmindClient.rpc('register_new_company', { company_name: companyName, terms_accepted: termsAccepted, terms_version: '1.0' });
                if (rpcError) {
                    errEl.textContent = 'تعذّر إنشاء الشركة: ' + rpcError.message;
                    errEl.classList.remove('hidden');
                    otpSubmitting = false;
                    setOtpButtonState('idle');
                    return;
                }
                if (newStoreId) {
                    localStorage.setItem('goldmind_active_store', newStoreId);
                }
            } else {
                const { data: anyMembership } = await goldmindClient
                    .from('staff').select('id').eq('user_id', user.id).limit(1).maybeSingle();

                if (!anyMembership) {
                    const { data: isAdmin } = await goldmindClient.rpc('is_platform_admin');
                    if (isAdmin) {
                        sessionStorage.removeItem('goldmind_email');
                        sessionStorage.removeItem('goldmind_mode');
                        sessionStorage.removeItem('goldmind_company_name');
                        sessionStorage.removeItem('goldmind_store_id');
                        sessionStorage.removeItem('goldmind_store_name');
                        showVerifiedThenNavigate('admin-panel-ar.html');
                        return;
                    }

                    errEl.textContent = 'فضلاً ابدأ من صفحة تسجيل الدخول واختر شركة أو سجّل شركة جديدة.';
                    errEl.classList.remove('hidden');
                    otpSubmitting = false;
                    setOtpButtonState('idle');
                    await goldmindClient.auth.signOut();
                    return;
                }
            }

            sessionStorage.removeItem('goldmind_email');
            sessionStorage.removeItem('goldmind_mode');
            sessionStorage.removeItem('goldmind_company_name');
            sessionStorage.removeItem('goldmind_store_id');
            sessionStorage.removeItem('goldmind_store_name');
            showVerifiedThenNavigate('index-ar.html');
        });

        // Resend the sign-in code, with a 60s cooldown timer
        const resendBtn = document.getElementById('resendBtn');
        const RESEND_COOLDOWN = 60;
        let resendTimer = null;

        function startResendCooldown() {
            let remaining = RESEND_COOLDOWN;
            resendBtn.disabled = true;
            resendBtn.textContent = 'إعادة الإرسال بعد ' + remaining + ' ثانية';
            clearInterval(resendTimer);
            resendTimer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(resendTimer);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'إعادة إرسال الرمز';
                } else {
                    resendBtn.textContent = 'إعادة الإرسال بعد ' + remaining + ' ثانية';
                }
            }, 1000);
        }

        startResendCooldown();

        resendBtn.addEventListener('click', async function() {
            const email = sessionStorage.getItem('goldmind_email');
            const errEl = document.getElementById('otpFormError');
            this.disabled = true;
            const original = 'إعادة إرسال الرمز';
            this.textContent = 'جارِ الإرسال...';
            const { error } = await goldmindClient.auth.signInWithOtp({
                email,
                options: {
                    shouldCreateUser: true,
                    emailRedirectTo: 'https://eng-bashar-asad.github.io/GoldMind/auth-callback-ar.html'
                }
            });
            if (error) {
                this.disabled = false;
                this.textContent = original;
                errEl.textContent = 'تعذّر إعادة الإرسال: ' + error.message;
                errEl.classList.remove('hidden');
            } else {
                errEl.classList.add('hidden');
                alert('تم إرسال رمز جديد إلى بريدك الإلكتروني');
                startResendCooldown();
            }
        });

        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple mouse tracking for a subtle parallax glow effect on the card
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-panel');
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>

<script>
(function initLogoParallax() {
  if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;
  const wrap = document.getElementById('logoTiltWrap');
  const inner = document.getElementById('logoTiltInner');
  const obj = document.getElementById('logoTiltObject');
  if (!wrap || !inner || !obj) return;
  const glare = inner.querySelector('.logo-tilt-glare');
  const maxShift = 14;
  let layerBack, layerMid, layerFront;

  function bindLayers() {
    const doc = obj.contentDocument;
    if (!doc) return;
    layerBack = doc.getElementById('layer-back');
    layerMid = doc.getElementById('layer-mid');
    layerFront = doc.getElementById('layer-front');
  }
  obj.addEventListener('load', bindLayers);
  bindLayers();

  window.addEventListener('mousemove', function (e) {
    const dx = Math.max(-1, Math.min(1, (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2)));
    const dy = Math.max(-1, Math.min(1, (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2)));
    if (layerBack) layerBack.style.transform = 'translate(' + (dx * maxShift * 0.3) + 'px,' + (dy * maxShift * 0.3) + 'px)';
    if (layerMid) layerMid.style.transform = 'translate(' + (dx * maxShift * 0.6) + 'px,' + (dy * maxShift * 0.6) + 'px)';
    if (layerFront) layerFront.style.transform = 'translate(' + (dx * maxShift) + 'px,' + (dy * maxShift) + 'px)';
    if (glare) {
      glare.style.opacity = '0.35';
      glare.style.background = 'radial-gradient(circle at ' + (50 + dx * 30) + '% ' + (50 + dy * 30) + '%, rgba(255,255,255,0.35), transparent 60%)';
    }
  });

  wrap.addEventListener('mouseleave', function () {
    if (layerBack) layerBack.style.transform = 'translate(0px,0px)';
    if (layerMid) layerMid.style.transform = 'translate(0px,0px)';
    if (layerFront) layerFront.style.transform = 'translate(0px,0px)';
    if (glare) glare.style.opacity = '0';
  });
})();
</script>
