<div>

<span class="material-symbols-outlined">person_add</span>

<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[10px] font-semibold text-outline" for="manual-desc">وصف القطعة</label>
<input class="w-full h-12 border border-outline-variant rounded-lg px-3 text-right" id="manual-desc" placeholder="خاتم، حلق، سلسال..." type="text"/>
</div>
<div class="grid grid-cols-2 gap-3">
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[10px] font-semibold text-outline" for="manual-weight">الوزن (غ)</label>

</div>
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[10px] font-semibold text-outline" for="manual-karat">العيار</label>
<select class="w-full h-12 border border-outline-variant rounded-lg px-3 text-right" id="manual-karat">
<option value="18">18</option>
<option selected="" value="21">21</option>
<option value="22">22</option>
<option value="24">24</option>
</select>
</div>
</div>
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[10px] font-semibold text-outline" for="manual-price">السعر</label>

</div>
<button onclick="addManualToCart()" class="w-full h-12 bg-surface-container-high border border-outline-variant text-primary font-semibold rounded-lg active:scale-95 transition-all flex items-center justify-center gap-2">

</div>

<script>
    requireGoldMindSession('login-entry-ar.html');

    let selectedCustomer = null;
    let selectedPaymentMethod = 'cash';
    const cart = []; // { cartId, piece (or null), barcode, karat, weight, price }
    let cartCounter = 0;

    // ---------- Payment toggle ----------
    function selectPayment(mode) {
        selectedPaymentMethod = mode;
        const cashBtn = document.getElementById('pay-cash');
        const bankBtn = document.getElementById('pay-bank');
        const active = 'flex flex-col items-center justify-center p-4 rounded-xl border border-primary bg-primary text-white transition-all active:scale-95';
        const inactive = 'flex flex-col items-center justify-center p-4 rounded-xl border border-outline-variant bg-white text-on-surface-variant transition-all active:scale-95';
        cashBtn.className = mode === 'cash' ? active : inactive;
        bankBtn.className = mode === 'bank' ? active : inactive;
    }

    // ---------- Customer search ----------
    const customerSearchInput = document.getElementById('customer-search');
    const customerResults = document.getElementById('customer-results');

    let searchTimeout;
    customerSearchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        const q = customerSearchInput.value.trim();
        if (!q) { customerResults.innerHTML = ''; return; }
        searchTimeout = setTimeout(() => searchCustomers(q), 350);
    });

    async function searchCustomers(q) {
        const session = await requireGoldMindSession('login-entry-ar.html');
        if (!session) return;

        const { data, error } = await goldmindClient
            .from('customers')
            .select('*')
            .eq('store_id', GOLDMIND_STORE_ID)
            .or(`name.ilike.%${q}%,phone.ilike.%${q}%`)
            .limit(8);

        if (error) {
            customerResults.innerHTML = `<div class="text-error text-sm">خطأ بالبحث: ${error.message}</div>`;
            return;
        }

        if (!data || data.length === 0) {
            customerResults.innerHTML = `<div class="text-on-surface-variant text-sm p-2">لا يوجد عميل مطابق. جرب "إضافة عميل جديد".</div>`;
            return;
        }

        customerResults.innerHTML = data.map(c => `
            <div class="flex items-center justify-between bg-surface-container-low rounded-lg p-3 cursor-pointer active:scale-[0.98] transition-all" onclick='pickCustomer(${JSON.stringify(c).replace(/'/g, "&apos;")})'>
                <div>
                    <div class="font-bold">${c.name}</div>
                    <div class="text-on-surface-variant text-sm font-data-mono" dir="ltr">${c.phone || ''}</div>
                </div>
                <span class="material-symbols-outlined text-primary">chevron_left</span>
            </div>
        `).join('');
    }

    function pickCustomer(c) {
        selectedCustomer = c;
        document.getElementById('customer-selected-name').textContent = c.name;
        document.getElementById('customer-selected-phone').textContent = c.phone || '';
        document.getElementById('customer-selected').classList.remove('hidden');
        document.getElementById('customer-selected').classList.add('flex');
        document.getElementById('customer-search-block').classList.add('hidden');
    }

    function clearCustomer() {
        selectedCustomer = null;
        document.getElementById('customer-selected').classList.add('hidden');
        document.getElementById('customer-selected').classList.remove('flex');
        document.getElementById('customer-search-block').classList.remove('hidden');
        customerSearchInput.value = '';
        customerResults.innerHTML = '';
    }

    // ---------- Barcode search ----------
    const barcodeResult = document.getElementById('barcode-result');
    document.getElementById('barcode-search-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchByBarcode();
    });

    async function searchByBarcode() {
        const session = await requireGoldMindSession('login-entry-ar.html');
        if (!session) return;

        const input = document.getElementById('barcode-search-input');
        const code = input.value.trim();
        if (!code) return;

        barcodeResult.innerHTML = '<div class="text-on-surface-variant text-sm p-2">جارِ البحث...</div>';

        const { data, error } = await goldmindClient
            .from('pieces')
            .select('*')
            .eq('store_id', GOLDMIND_STORE_ID)
            .eq('barcode', code)
            .eq('status', 'available')
            .maybeSingle();

        if (error) {
            barcodeResult.innerHTML = `<div class="text-error text-sm p-2">خطأ: ${error.message}</div>`;
            return;
        }

        if (!data) {
            barcodeResult.innerHTML = '<div class="text-error text-sm p-2">لا توجد قطعة متوفرة بهذا الباركود.</div>';
            return;
        }

        const pieceId = data.id;
        barcodeResult.innerHTML = `
            <div class="p-3 bg-surface-container-low rounded-lg flex flex-col gap-2">
                <div class="flex items-center justify-between gap-2">
                    <div class="min-w-0">
                        <div class="font-data-mono font-bold text-sm">${data.weight_grams} غ &middot; عيار ${data.karat}</div>
                        <div class="text-outline text-[11px] font-data-mono truncate">${data.barcode}</div>
                    </div>
                </div>
                <input type="text" placeholder="وصف القطعة (خاتم، حلق...)" class="w-full h-10 border border-outline-variant rounded px-3 text-right" id="barcode-desc-input"/>
                <div class="flex items-center gap-2">
                    <input type="number" placeholder="السعر" class="flex-1 h-10 border border-outline-variant rounded px-2 text-left font-data-mono" id="barcode-price-input"/>
                    <button onclick='confirmAddBarcodePiece(${JSON.stringify(data).replace(/'/g, "&apos;")})' class="w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center active:scale-90 transition-all shrink-0">
                        <span class="material-symbols-outlined">add</span>
                    </button>
                </div>
            </div>
        `;
    }

    function confirmAddBarcodePiece(piece) {
        const priceInput = document.getElementById('barcode-price-input');
        const descInput = document.getElementById('barcode-desc-input');
        const price = parseFloat(priceInput.value);
        if (!price || price <= 0) {
            priceInput.classList.add('border-error');
            priceInput.focus();
            return;
        }
        cart.push({
            cartId: ++cartCounter,
            piece: piece,
            barcode: piece.barcode,
            karat: piece.karat,
            weight: piece.weight_grams,
            price: price,
            description: descInput.value.trim() || null
        });
        document.getElementById('barcode-search-input').value = '';
        barcodeResult.innerHTML = '';
        renderCart();
    }

    // ---------- Manual entry (no barcode) ----------
    function addManualToCart() {
        const weight = parseFloat(document.getElementById('manual-weight').value);
        const karat = parseInt(document.getElementById('manual-karat').value, 10);
        const price = parseFloat(document.getElementById('manual-price').value);

        const weightInput = document.getElementById('manual-weight');
        const priceInput = document.getElementById('manual-price');
        weightInput.classList.remove('border-error');
        priceInput.classList.remove('border-error');

        let valid = true;
        if (!weight || weight <= 0) { weightInput.classList.add('border-error'); valid = false; }
        if (!price || price <= 0) { priceInput.classList.add('border-error'); valid = false; }
        if (!valid) return;

        cart.push({
            cartId: ++cartCounter,
            piece: null,
            barcode: null,
            karat: karat,
            weight: weight,
            price: price,
            description: document.getElementById('manual-desc').value.trim() || null
        });

        document.getElementById('manual-desc').value = '';
        document.getElementById('manual-weight').value = '';
        document.getElementById('manual-price').value = '';
        renderCart();
    }

    // ---------- Cart ----------
    function removeFromCart(cartId) {
        const idx = cart.findIndex(item => item.cartId === cartId);
        if (idx !== -1) cart.splice(idx, 1);
        renderCart();
    }

    function renderCart() {
        const body = document.getElementById('cart-body');
        if (cart.length === 0) {
            body.innerHTML = '<tr id="cart-empty-row"><td colspan="5" class="px-4 py-4 text-center text-on-surface-variant font-body-md">لم تُضف أي قطعة بعد</td></tr>';
            document.getElementById('grand-total').textContent = '0.00 د.إ';
            return;
        }

        body.innerHTML = cart.map(item => `
            <tr>
                <td class="px-3 py-3">
                    <div class="font-body-md">${item.description || '—'}</div>
                    <div class="text-outline text-[10px] font-data-mono">${item.barcode || ''}</div>
                </td>
                <td class="px-2 py-3 text-center">${item.karat}K</td>
                <td class="px-2 py-3 text-left">${item.weight}</td>
                <td class="px-2 py-3 text-left font-semibold">${item.price.toFixed(2)}</td>
                <td class="px-2 py-3 text-left">
                    <button onclick="removeFromCart(${item.cartId})" class="text-error">
                        <span class="material-symbols-outlined text-[18px]">close</span>
                    </button>
                </td>
            </tr>
        `).join('');

        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById('grand-total').textContent = total.toFixed(2) + ' د.إ';
    }

    // ---------- Save invoice ----------
    const saveBtn = document.getElementById('save-invoice-btn');
    const messageBox = document.getElementById('save-message');

    function showMessage(text, isError) {
        messageBox.textContent = text;
        messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
        messageBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
    }

    saveBtn.addEventListener('click', async () => {
        const gmSession = await requireGoldMindSession('login-entry-ar.html');
        if (!gmSession) return;

        if (!selectedCustomer) {
            showMessage('الرجاء اختيار عميل أولاً.', true);
            return;
        }
        if (cart.length === 0) {
            showMessage('الرجاء إضافة قطعة واحدة على الأقل.', true);
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'جارِ الحفظ...';

        const { data: { session } } = await goldmindClient.auth.getSession();
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        const invoiceNumber = 'INV-' + Date.now();

        const { data: invoiceRow, error: invoiceError } = await goldmindClient
            .from('invoices')
            .insert({
                store_id: GOLDMIND_STORE_ID,
                invoice_number: invoiceNumber,
                type: 'sale',
                customer_id: selectedCustomer.id,
                payment_method: selectedPaymentMethod,
                fabrication_fees: 0,
                vat_amount: 0,
                total_amount: total,
                amount_paid: total,
                status: 'paid',
                created_by: GOLDMIND_STAFF_ID
            })
            .select()
            .single();

        if (invoiceError) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ الفاتورة';
            showMessage('خطأ بحفظ الفاتورة: ' + invoiceError.message, true);
            return;
        }

        const itemsPayload = cart.map(item => ({
            invoice_id: invoiceRow.id,
            piece_id: item.piece ? item.piece.id : null,
            barcode: item.barcode,
            karat: item.karat,
            weight_grams: item.weight,
            fabrication_fee: 0,
            line_total: item.price,
            description: item.description
        }));

        const { error: itemsError } = await goldmindClient.from('invoice_items').insert(itemsPayload);

        if (itemsError) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ الفاتورة';
            showMessage('تم حفظ الفاتورة لكن حدث خطأ بإضافة القطع: ' + itemsError.message, true);
            return;
        }

        const pieceIds = cart.filter(item => item.piece).map(item => item.piece.id);
        if (pieceIds.length > 0) {
            await goldmindClient.from('pieces').update({ status: 'sold' }).in('id', pieceIds);
        }

        showMessage('تم حفظ الفاتورة بنجاح!', false);
        setTimeout(() => {
            window.location.href = 'invoice-print-ar.html?id=' + invoiceRow.id;
        }, 800);
    });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
