<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>كشف الحركة اليومية | GoldMind</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js?v=5"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = { theme: { extend: {
    "colors": {
      "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)",
      "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
      "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
      "surface-container-lowest": "var(--gm-surface-lowest)", "primary": "var(--gm-primary)",
      "accent": "var(--gm-accent)"
    }
  } } }
</script>
<style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
    @media print {
        .no-print { display: none !important; }
        body { background: #fff !important; }
        #sheet { box-shadow: none !important; border: none !important; margin: 0 !important; max-width: none !important; }
    }
</style>
</head>
<body class="bg-background text-on-surface">

<div class="no-print sticky top-0 bg-surface-container-lowest border-b border-outline-variant z-50 flex items-center justify-between px-4 h-14">
<button onclick="window.location.href='daily-cashbox-ar.html'" class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_forward</span>
<span class="text-sm font-semibold">الحركة اليومية</span>
</button>
<button onclick="window.print()" class="flex items-center gap-2 bg-primary text-on-primary px-4 py-2 rounded-lg text-sm font-semibold">
<span class="material-symbols-outlined">print</span> طباعة
</button>
<button onclick="downloadCashboxPdf()" id="download-pdf-btn" class="flex items-center gap-2 bg-surface-container-lowest text-on-surface border border-outline-variant px-4 py-2 rounded-lg text-sm font-semibold">
<span class="material-symbols-outlined">download</span> تحميل PDF
</button>
</div>

<div id="loading" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>

<div id="sheet" class="hidden max-w-2xl mx-auto my-6 p-3 sm:p-5 bg-background">
<div class="rounded-lg shadow-xl">
<div class="bg-surface-container-lowest rounded-lg overflow-hidden">

<!-- Letterhead -->
<div class="p-6 text-center border-b-4 border-accent bg-surface-container-low">
<img id="storeLogo" crossorigin="anonymous" class="hidden w-16 h-16 mx-auto mb-2 object-contain"/>
<h1 id="storeName" class="text-xl font-bold text-on-surface"></h1>
<p id="storeAddress" class="text-[12px] text-on-surface-variant mt-1"></p>
<p id="storePhone" class="text-[12px] text-on-surface-variant" dir="ltr"></p>
</div>

<div class="p-5">
<div class="flex items-center justify-between mb-4">
<h2 class="text-lg font-bold text-on-surface">كشف الحركة اليومية</h2>
<span id="dateLabel" class="text-[12px] text-on-surface-variant" dir="ltr"></span>
</div>

<!-- Two symmetric columns: incoming (right) / outgoing (left) -->
<div class="rounded-xl shadow-lg">
<div class="rounded-xl overflow-hidden border border-outline-variant">
<table class="w-full text-[13px]">
<thead>
<tr>
<th colspan="2" class="bg-green-100 text-green-800 py-2.5 font-bold">الداخل</th>
<th colspan="2" class="bg-red-100 text-red-800 py-2.5 font-bold">الصادر</th>
</tr>
</thead>
<tbody id="rowsBody"></tbody>
</table>
</div>
</div>

<!-- Per-currency totals, mirroring the reference sheet's summary block -->
<div class="mt-5">
<h3 class="text-[13px] font-bold text-on-surface-variant mb-2">الرصيد الحالي بالدرج</h3>
<div class="rounded-xl shadow-lg">
<table class="w-full text-[13px] rounded-xl overflow-hidden border border-outline-variant" id="totalsTable"></table>
</div>
</div>
</div>

</div>
</div></div>

<script>
function fmt(n) { return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function getSelectedDate() {
  const params = new URLSearchParams(window.location.search);
  const dateStr = params.get('date');
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// Same deterministic pastel-per-link_group palette used on the in-app
// "الحركة اليومية" page, so a shared/printed copy of the day visually
// matches what staff already see and color-recognize inside the app.
const GM_LINK_PALETTE = ['#FEF3C7', '#DBEAFE', '#DCFCE7', '#FCE7F3', '#FFEDD5', '#E0E7FF', '#CFFAFE', '#FEE2E2'];
function gmLinkColorFor(group) {
  if (!group) return null;
  let hash = 0;
  for (let i = 0; i < group.length; i++) hash = (hash * 31 + group.charCodeAt(i)) >>> 0;
  return GM_LINK_PALETTE[hash % GM_LINK_PALETTE.length];
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  const { data: store } = await goldmindClient.from('stores').select('name, address, phone, logo_url').eq('id', GOLDMIND_STORE_ID).maybeSingle();
  if (store) {
    document.getElementById('storeName').textContent = store.name || '';
    if (store.address) document.getElementById('storeAddress').textContent = store.address;
    if (store.phone) document.getElementById('storePhone').textContent = store.phone;
    if (store.logo_url) {
      const logo = document.getElementById('storeLogo');
      logo.src = store.logo_url;
      logo.classList.remove('hidden');
    }
  }

  const selectedDate = getSelectedDate();
  const dayEnd = new Date(selectedDate); dayEnd.setDate(dayEnd.getDate() + 1);
  document.getElementById('dateLabel').textContent = selectedDate.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });

  const { data: allEntries, error } = await goldmindClient
    .from('daily_cash_log')
    .select('*')
    .eq('store_id', GOLDMIND_STORE_ID)
    .order('created_at', { ascending: true });

  if (error) {
    document.getElementById('loading').textContent = 'تعذّر التحميل: ' + error.message;
    return;
  }

  const dayEntries = (allEntries || []).filter(e => new Date(e.created_at) >= selectedDate && new Date(e.created_at) < dayEnd);
  const priorEntries = (allEntries || []).filter(e => new Date(e.created_at) < selectedDate);

  // Cluster by link_group (same rule as the in-app page) so a linked out/in
  // pair lands on the same row AND shares the same pastel highlight color.
  const clustersByKey = new Map();
  dayEntries.forEach(e => {
    const key = e.link_group || ('__solo_' + e.id);
    if (!clustersByKey.has(key)) clustersByKey.set(key, { group: e.link_group || null, members: [] });
    clustersByKey.get(key).members.push(e);
  });
  const clusters = [...clustersByKey.values()];

  const outEntries = [];
  const inEntries = [];
  const rowColors = [];
  clusters.forEach(cluster => {
    const outMembers = cluster.members.filter(e => e.direction === 'out');
    const inMembers = cluster.members.filter(e => e.direction === 'in');
    const rows = Math.max(outMembers.length, inMembers.length);
    const color = gmLinkColorFor(cluster.group);
    for (let i = 0; i < rows; i++) {
      outEntries.push(outMembers[i]);
      inEntries.push(inMembers[i]);
      rowColors.push(color);
    }
  });
  const rowCount = Math.max(outEntries.length, 1);

  const rowsBody = document.getElementById('rowsBody');
  let rowsHtml = '';
  for (let i = 0; i < rowCount; i++) {
    const o = outEntries[i];
    const inn = inEntries[i];
    const bg = rowColors[i] ? `background-color:${rowColors[i]};` : '';
    rowsHtml += `<tr style="${bg}">
      <td class="py-2.5 px-3 border-t border-outline-variant">${inn ? inn.operation_type + (inn.notes ? ' — ' + inn.notes : '') : ''}</td>
      <td class="py-2.5 px-3 border-t border-r border-outline-variant font-bold text-left" dir="ltr">${inn ? fmt(inn.amount) + ' ' + inn.currency : ''}</td>
      <td class="py-2.5 px-3 border-t border-r border-outline-variant">${o ? o.operation_type + (o.notes ? ' — ' + o.notes : '') : ''}</td>
      <td class="py-2.5 px-3 border-t border-r border-outline-variant font-bold text-left" dir="ltr">${o ? fmt(o.amount) + ' ' + o.currency : ''}</td>
    </tr>`;
  }
  if (dayEntries.length === 0) {
    rowsHtml = '<tr><td colspan="4" class="py-6 text-center text-on-surface-variant border-t border-outline-variant">لا توجد عمليات بهذا اليوم</td></tr>';
  }
  rowsBody.innerHTML = rowsHtml;

  const currencies = [...new Set((allEntries || []).map(e => e.currency))];
  const totalsTable = document.getElementById('totalsTable');
  if (currencies.length === 0) {
    totalsTable.innerHTML = '<tr><td class="py-3 px-2 text-center text-on-surface-variant border border-outline-variant">لا يوجد رصيد مسجّل بعد</td></tr>';
  } else {
    totalsTable.innerHTML = currencies.map(cur => {
      const opening = priorEntries.filter(e => e.currency === cur).reduce((s, e) => s + (e.direction === 'in' ? Number(e.amount) : -Number(e.amount)), 0);
      const dayNet = dayEntries.filter(e => e.currency === cur).reduce((s, e) => s + (e.direction === 'in' ? Number(e.amount) : -Number(e.amount)), 0);
      const closing = opening + dayNet;
      return `<tr>
        <td class="py-2 px-3 border border-outline-variant font-bold bg-surface-container-low">${cur}</td>
        <td class="py-2 px-3 border border-outline-variant text-left" dir="ltr">${fmt(closing)}</td>
      </tr>`;
    }).join('');
  }

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('sheet').classList.remove('hidden');
}

load();

// ---- Download an official PDF copy (client-side html2pdf.js) ----
// Captures the real, visible #sheet element directly — no off-screen clone.
// (An earlier version cloned the sheet into a detached wrapper positioned
// far off-screen; that pattern is known to render blank in some mobile
// browsers, especially in RTL documents. Capturing the live, attached,
// on-screen element is far more reliable.)
async function downloadCashboxPdf() {
  const sheet = document.getElementById('sheet');
  if (!sheet || sheet.classList.contains('hidden')) return;

  const btn = document.getElementById('download-pdf-btn');
  const originalHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> ...جارِ التجهيز';

  if (document.fonts && document.fonts.ready) { await document.fonts.ready; }

  const dateLabel = (document.getElementById('dateLabel')?.textContent || 'daily-cashbox').trim();

  try {
    await html2pdf().set({
      margin: 10,
      filename: `كشف-يومي-${dateLabel}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(sheet).save();
  } catch (err) {
    console.error('PDF generation failed', err);
    alert('تعذّر توليد ملف PDF، حاول مرة أخرى');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}
</script>
</body></html>
