<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>معاينة الشعار | GoldMind</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root { --royal-gold: #FFD700; --deep-navy: #0f172a; --bronze: #B4955A; }
  body {
    margin: 0; background: var(--deep-navy); color: #fff;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px; gap: 40px;
  }
  h1 { color: var(--royal-gold); font-size: 22px; margin-bottom: 0; }
  .options { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
  .card {
    background: rgba(30,41,59,0.7); border: 1px solid rgba(255,215,0,0.15);
    border-radius: 20px; padding: 32px 28px; text-align: center; width: 220px;
  }
  .badge {
    width: 96px; height: 96px; border-radius: 24px; border: 2px solid rgba(255,215,0,0.3);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    background: rgba(255,255,255,0.03); position: relative;
  }
  .badge::after {
    content: ''; position: absolute; inset: 0; border-radius: 24px;
    box-shadow: 0 0 30px rgba(255,215,0,0.25); pointer-events: none;
  }
  .label { font-weight: 700; color: #fff; margin-bottom: 4px; }
  .sub { font-size: 12px; color: rgba(255,215,0,0.6); }
</style>
</head>
<body>
<h1>اختر شعار جولد مايند</h1>
<div class="options">

<div class="card">
<div class="badge">
<!-- Option 4: gem with circuit lines -->
<svg width="56" height="56" viewBox="0 0 56 56" fill="none">
<defs>
<linearGradient id="gemGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFD700"/>
<stop offset="1" stop-color="#B4955A"/>
</linearGradient>
</defs>
<path d="M28 4 L48 20 L40 50 L16 50 L8 20 Z" stroke="url(#gemGrad)" stroke-width="2" fill="rgba(255,215,0,0.06)" stroke-linejoin="round"/>
<path d="M8 20 L48 20" stroke="url(#gemGrad)" stroke-width="1.5" opacity="0.7"/>
<path d="M18 20 L16 50" stroke="url(#gemGrad)" stroke-width="1" opacity="0.5"/>
<path d="M38 20 L40 50" stroke="url(#gemGrad)" stroke-width="1" opacity="0.5"/>
<path d="M28 4 L28 20" stroke="url(#gemGrad)" stroke-width="1" opacity="0.5"/>
<circle cx="28" cy="20" r="2" fill="#FFD700"/>
<circle cx="18" cy="20" r="1.4" fill="#FFD700" opacity="0.8"/>
<circle cx="38" cy="20" r="1.4" fill="#FFD700" opacity="0.8"/>
<path d="M28 4 L18 20 M28 4 L38 20" stroke="url(#gemGrad)" stroke-width="1" opacity="0.4"/>
</svg>
</div>
<div class="label">الخيار 4</div>
<div class="sub">جوهرة + خطوط ذكاء اصطناعي</div>
</div>

<div class="card">
<div class="badge">
<!-- Option 2: interlocking G + M monogram -->
<svg width="56" height="56" viewBox="0 0 56 56" fill="none">
<defs>
<linearGradient id="gmGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFD700"/>
<stop offset="1" stop-color="#B4955A"/>
</linearGradient>
</defs>
<!-- G: open circle with inward bar -->
<path d="M38 16 A15 15 0 1 0 40 34 L40 26 L31 26" stroke="url(#gmGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<!-- M: layered in front, slightly smaller, warm bronze for depth -->
<path d="M17 40 V17 L28 30 L39 17" stroke="#FFD700" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
</div>
<div class="label">الخيار 2</div>
<div class="sub">مونوغرام G + M</div>
</div>

</div>
<p style="color:rgba(255,255,255,0.4); font-size:12px; max-width:320px; text-align:center;">هاي معاينة أولية بسيطة — قلي أي وحدة عاجبتك وبطورها وبطبقها بشكل نهائي على شاشات الدخول.</p>
</body></html>
