<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>مستندات KYC — الشركات | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js?v=13"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
          "colors": {
                  "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "on-tertiary": "#ffffff",
                  "error": "#ba1a1a", "on-secondary": "#ffffff", "primary-container": "#131b2e",
                  "on-surface": "var(--gm-on-surface)", "surface-container": "#eceef0", "surface-container-highest": "#e0e3e5",
                  "surface-container-low": "var(--gm-surface-low)", "on-primary": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)",
                  "outline-variant": "var(--gm-outline-variant)", "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)",
                  "error-container": "#ffdad6", "primary": "var(--gm-primary)", "on-background": "var(--gm-on-primary)",
                  "on-error": "#ffffff", "surface-variant": "#e0e3e5", "outline": "#76777d",
                  "surface-container-high": "#e6e8ea", "secondary-container": "#ffdb99", "on-secondary-container": "#795f29"
          },
          "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"] }
        } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
    body { min-height: max(884px, 100dvh); }
    .gm-badge-complete { background: #dcf5e6; color: #1e7a46; }
    .gm-badge-incomplete { background: #fdf0d5; color: #8a6508; }
</style>
</head>
<body class="bg-background font-body-md text-on-background antialiased pb-24">
<header class="bg-surface-container-lowest text-primary flex justify-between items-center px-4 w-full h-16 sticky top-0 z-50 border-b border-outline-variant">
<div class="flex items-center gap-3">
<button onclick="window.location.href='index-ar.html'" class="cursor-pointer active:opacity-80 font-bold" style="direction:ltr;font-size:32px;line-height:1;" aria-label="رجوع">&#8594;</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">مستندات KYC — الشركات</h1>
</div>
<button onclick="window.location.href='customer-add-ar.html?type=company'" class="flex items-center gap-1 h-9 px-3 rounded-lg bg-secondary text-on-secondary text-[13px] font-bold active:scale-[0.97] transition-all">
<span class="material-symbols-outlined text-[18px]">domain_add</span> شركة جديدة
</button>
</header>
<main class="max-w-md lg:max-w-3xl mx-auto px-4 pt-6 space-y-3">

<div class="relative">
<input class="w-full h-12 px-10 py-2 border border-outline-variant rounded-lg bg-white focus:border-primary focus:ring-0 transition-all text-body-md font-body-md text-right" id="search-input" oninput="renderList()" placeholder="ابحث باسم الشركة..." type="text"/>
<span class="absolute right-3 top-3 material-symbols-outlined text-outline">search</span>
</div>

<div id="loading-state" class="text-center text-on-surface-variant text-sm py-10">جارِ التحميل...</div>
<div id="empty-state" class="hidden text-center text-on-surface-variant text-sm py-10">لا يوجد عملاء شركات بعد. اضغط "شركة جديدة" لإضافة أول شركة.</div>
<div class="space-y-3" id="companies-list"></div>

</main>

<script>
    (async function __enforcePermission() {
        await requireGoldMindSession('login-entry-ar.html');
        const { data: __staffPerm } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
        const __allowed = __staffPerm && (__staffPerm.role === 'owner' || (__staffPerm.permissions && __staffPerm.permissions['view_customers'] === true));
        if (!__allowed) { alert('ليس لديك صلاحية الدخول لهذه الشاشة.'); window.location.href = 'index-ar.html'; }
    })();

    let companies = []; // [{ customer, docs: [...] }]

    function isKycComplete(c) {
        return !!(c.trade_license_number && c.authorized_signatory_name && c.authorized_signatory_id_number);
    }

    async function load() {
        const session = await requireGoldMindSession('login-entry-ar.html');
        if (!session) return;

        const { data: customers, error: custError } = await goldmindClient
            .from('customers').select('*')
            .eq('store_id', GOLDMIND_STORE_ID)
            .eq('is_company', true)
            .order('name');

        if (custError) {
            document.getElementById('loading-state').textContent = 'تعذّر التحميل: ' + custError.message;
            return;
        }

        const customerIds = (customers || []).map(c => c.id);
        let docsByCustomer = {};
        if (customerIds.length > 0) {
            const { data: docs } = await goldmindClient
                .from('company_kyc_documents')
                .select('*')
                .eq('owner_type', 'customer')
                .in('document_category', ['kyc', 'trade_license', 'signatory_id'])
                .in('owner_id', customerIds)
                .order('created_at', { ascending: false });
            (docs || []).forEach(d => {
                if (!docsByCustomer[d.owner_id]) docsByCustomer[d.owner_id] = [];
                docsByCustomer[d.owner_id].push(d);
            });
        }

        // Show every company customer, not just ones with existing docs.
        companies = (customers || []).map(c => ({ customer: c, docs: docsByCustomer[c.id] || [] }));

        document.getElementById('loading-state').classList.add('hidden');
        renderList();
    }

    async function renderList() {
        const q = document.getElementById('search-input').value.trim().toLowerCase();
        const filtered = companies.filter(row =>
            !q || (row.customer.name || '').toLowerCase().includes(q) || (row.customer.legal_name || '').toLowerCase().includes(q)
        );

        if (filtered.length === 0) {
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('companies-list').innerHTML = '';
            return;
        }
        document.getElementById('empty-state').classList.add('hidden');

        const cards = await Promise.all(filtered.map(async row => {
            const c = row.customer;
            const docsHtml = await Promise.all(row.docs.map(async doc => {
                const { data: signed } = await goldmindClient.storage.from('company-kyc-documents').createSignedUrl(doc.file_url, 3600);
                const url = signed ? signed.signedUrl : '#';
                const catLabel = doc.document_category === 'trade_license' ? '(الرخصة) ' : doc.document_category === 'signatory_id' ? '(هوية المفوّض) ' : '';
                return `<a href="${url}" target="_blank" class="flex items-center gap-2 text-[12px] text-secondary underline">
                    <span class="material-symbols-outlined text-[15px]">description</span> ${catLabel}${gmEscapeHtml(doc.file_name)}
                </a>`;
            }));

            const complete = isKycComplete(c);
            const badge = complete
                ? '<span class="gm-badge-complete text-[10px] font-bold px-2 py-0.5 rounded-full">KYC مكتمل</span>'
                : '<span class="gm-badge-incomplete text-[10px] font-bold px-2 py-0.5 rounded-full">بيانات ناقصة</span>';

            const legalLine = complete
                ? `<div class="text-[11px] text-on-surface-variant leading-relaxed">
                     ترخيص: ${gmEscapeHtml(c.trade_license_number || '')}${c.business_activity ? ' • ' + gmEscapeHtml(c.business_activity) : ''}<br/>
                     المفوّض: ${gmEscapeHtml(c.authorized_signatory_name || '')}${c.ubo_name ? ' • المستفيد الحقيقي: ' + gmEscapeHtml(c.ubo_name) : ''}
                   </div>`
                : '';

            return `
            <div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm p-4">
                <div class="flex items-center justify-between mb-1">
                    <div class="font-bold text-[14px]">${gmEscapeHtml(c.legal_name || c.name)}</div>
                    ${badge}
                </div>
                <div class="text-[11px] text-on-surface-variant mb-1">${gmEscapeHtml(c.name)}${c.tax_number ? ' • TRN: ' + gmEscapeHtml(c.tax_number) : ''}</div>
                ${legalLine}
                <div class="flex flex-col gap-1.5 ${docsHtml.length ? 'pt-2 border-t border-outline-variant mb-2 mt-2' : 'mb-2'}">${docsHtml.join('') || '<p class="text-[11px] text-on-surface-variant">لا يوجد مستندات مرفوعة بعد.</p>'}</div>
                <div class="grid grid-cols-2 gap-2">
                    <label class="flex items-center justify-center gap-1.5 text-[11px] font-semibold text-primary border border-dashed border-outline-variant rounded-lg py-2 cursor-pointer active:opacity-70">
                        <span class="material-symbols-outlined text-[15px]">upload_file</span>
                        <span class="add-doc-label">الرخصة</span>
                        <input type="file" accept="image/*,.pdf" class="hidden" onchange="addDocument('${c.id}', this, 'trade_license')"/>
                    </label>
                    <label class="flex items-center justify-center gap-1.5 text-[11px] font-semibold text-primary border border-dashed border-outline-variant rounded-lg py-2 cursor-pointer active:opacity-70">
                        <span class="material-symbols-outlined text-[15px]">upload_file</span>
                        <span class="add-doc-label">هوية المفوّض</span>
                        <input type="file" accept="image/*,.pdf" class="hidden" onchange="addDocument('${c.id}', this, 'signatory_id')"/>
                    </label>
                </div>
            </div>`;
        }));

        document.getElementById('companies-list').innerHTML = cards.join('');
    }

    async function addDocument(customerId, inputEl, category) {
        const file = inputEl.files && inputEl.files[0];
        if (!file) return;
        const labelEl = inputEl.closest('label').querySelector('.add-doc-label');
        const originalLabel = labelEl.textContent;
        labelEl.textContent = 'جارِ الرفع...';

        const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
        const path = GOLDMIND_STORE_ID + '/customer-' + customerId + '/' + category + '-' + Date.now() + '.' + ext;

        const { error: uploadError } = await goldmindClient.storage
            .from('company-kyc-documents').upload(path, file, { upsert: false });
        if (uploadError) {
            alert('تعذّر رفع الملف: ' + uploadError.message);
            labelEl.textContent = originalLabel;
            return;
        }

        const { error: rowError } = await goldmindClient.from('company_kyc_documents').insert({
            store_id: GOLDMIND_STORE_ID,
            owner_type: 'customer',
            owner_id: customerId,
            document_category: category,
            file_url: path,
            file_name: file.name,
            uploaded_by: GOLDMIND_STAFF_ID
        });
        if (rowError) {
            alert('تعذّر حفظ بيانات الملف: ' + rowError.message);
            labelEl.textContent = originalLabel;
            return;
        }

        await load();
    }

    load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
