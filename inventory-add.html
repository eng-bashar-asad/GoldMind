</a>

<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-md text-label-md">Settings</span>

<script>
        // Require an active session before allowing use of this page
        requireGoldMindSession();

        // Micro-interactions for form elements
        document.querySelectorAll('button, select, input').forEach(el => {
            el.addEventListener('touchstart', () => {
                // Haptic feedback feel via scale already in Tailwind
            });
        });

        // Simple validation visualization
        const weightInput = document.getElementById('weight');
        weightInput.addEventListener('input', (e) => {
            if (e.target.value > 1000) {
                weightInput.classList.add('text-error');
            } else {
                weightInput.classList.remove('text-error');
            }
        });

        // Color selection state
        let selectedColor = 'Gold';
        const colorButtons = document.querySelectorAll('.color-btn');
        colorButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                selectedColor = btn.dataset.color;
                colorButtons.forEach(b => {
                    b.classList.remove('border-2', 'border-primary');
                    b.classList.add('border', 'border-outline-variant');
                    b.querySelector('span').classList.remove('font-bold', 'text-primary');
                    b.querySelector('span').classList.add('text-on-surface-variant');
                });
                btn.classList.remove('border', 'border-outline-variant');
                btn.classList.add('border-2', 'border-primary');
                btn.querySelector('span').classList.remove('text-on-surface-variant');
                btn.querySelector('span').classList.add('font-bold', 'text-primary');
            });
        });

        // Save piece to Supabase
        const saveBtn = document.getElementById('save-btn');
        const messageBox = document.getElementById('save-message');

        function showMessage(text, isError) {
            messageBox.textContent = text;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            messageBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
        }

        saveBtn.addEventListener('click', async () => {
            const barcode = document.getElementById('barcode-id').value.trim();
            const weight = parseFloat(document.getElementById('weight').value);
            const karat = parseInt(document.getElementById('karat').value, 10);

            if (!weight || weight <= 0) {
                showMessage('Please enter a valid weight.', true);
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            const { data: { session } } = await goldmindClient.auth.getSession();

            const { error } = await goldmindClient.from('pieces').insert({
                store_id: GOLDMIND_STORE_ID,
                barcode: barcode || null,
                weight_grams: weight,
                karat: karat,
                color: selectedColor,
                status: 'available',
                created_by: session ? session.user.id : null
            });

            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Piece to Inventory';

            if (error) {
                showMessage('Error: ' + error.message, true);
                return;
            }

            showMessage('Piece saved successfully! Ready for next piece.', false);
                    document.getElementById('barcode-id').value = '';
                    document.getElementById('weight').value = '';
                    document.getElementById('weight').focus();
        });
    </script>
