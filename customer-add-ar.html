<!DOCTYPE html>

<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إضافة عميل | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#45464d",
                    "on-secondary-container": "#795f29",
                    "secondary": "#745a25",
                    "surface-dim": "#d8dadc",
                    "on-tertiary": "#ffffff",
                    "surface-bright": "#f7f9fb",
                    "error": "#ba1a1a",
                    "on-secondary": "#ffffff",
                    "on-surface": "#191c1e",
                    "surface-container": "#eceef0",
                    "surface-container-highest": "#e0e3e5",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f2f4f6",
                    "on-primary": "#ffffff",
                    "background": "#f7f9fb",
                    "outline-variant": "#c6c6cd",
                    "surface-container-lowest": "#ffffff",
                    "surface": "#f7f9fb",
                    "error-container": "#ffdad6",
                    "primary": "#000000",
                    "on-background": "#191c1e",
                    "on-error": "#ffffff",
                    "surface-variant": "#e0e3e5",
                    "outline": "#76777d",
                    "surface-container-high": "#e6e8ea",
                    "secondary-container": "#ffdb99"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "data-mono": ["IBM Plex Sans"],
                    "headline-md": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "data-mono": ["15px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation Bar -->
<header class="bg-surface-container-lowest text-primary docked full-width top-0 border-b border-outline-variant z-50 sticky">
<div class="flex justify-between items-center px-margin-mobile w-full h-16">
<div class="flex items-center gap-4">
<button onclick="window.location.href='index-ar.html'" class="cursor-pointer active:opacity-80 p-2 hover:bg-surface-container-high transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">إضافة عميل</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md mx-auto px-margin-mobile">

<section class="py-6 flex flex-col gap-6">

<!-- Name Input -->
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[11px] font-semibold text-outline tracking-wider" for="customer-name">اسم العميل</label>
<input class="w-full h-14 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all text-right" id="customer-name" placeholder="اكتب اسم العميل" type="text"/>
</div>

<!-- Phone Input -->
<div class="relative">
<label class="absolute -top-2 right-3 bg-background px-1 text-[11px] font-semibold text-outline tracking-wider" for="customer-phone">رقم الهاتف</label>
<input class="w-full h-14 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-data-mono text-right" dir="ltr" id="customer-phone" placeholder="09xxxxxxxx" type="tel"/>
</div>

<!-- Status Message -->
<div id="save-message" class="hidden text-center text-sm font-semibold py-2 rounded-lg"></div>

<!-- Save Button -->
<div class="pt-4">
<button id="save-btn" class="w-full h-14 bg-secondary text-on-secondary rounded-lg font-bold text-body-md shadow-md active:scale-[0.98] transition-all hover:brightness-110">
    حفظ العميل
</button>
</div>

</section>
</main>

<script>
    requireGoldMindSession('login-entry-ar.html');

    const saveBtn = document.getElementById('save-btn');
    const messageBox = document.getElementById('save-message');

    function showMessage(text, isError) {
        messageBox.textContent = text;
        messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
        messageBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
    }

    saveBtn.addEventListener('click', async () => {
        const name = document.getElementById('customer-name').value.trim();
        const phone = document.getElementById('customer-phone').value.trim();

        if (!name) {
            showMessage('الرجاء إدخال اسم العميل.', true);
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'جارِ الحفظ...';

        const { error } = await goldmindClient.from('customers').insert({
            store_id: GOLDMIND_STORE_ID,
            name: name,
            phone: phone || null
        });

        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ العميل';

        if (error) {
            showMessage('خطأ: ' + error.message, true);
            return;
        }

        showMessage('تم حفظ العميل بنجاح! جاهز لإضافة عميل آخر.', false);
        document.getElementById('customer-name').value = '';
        document.getElementById('customer-phone').value = '';
        document.getElementById('customer-name').focus();
    });
</script>
</body></html>
