<!DOCTYPE html>

<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إضافة عميل | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js?v=4"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "var(--gm-on-surface-variant)",
                    "on-secondary-container": "#795f29",
                    "secondary": "var(--gm-secondary)",
                    "surface-dim": "#d8dadc",
                    "on-tertiary": "#ffffff",
                    "surface-bright": "#f7f9fb",
                    "error": "#ba1a1a",
                    "on-secondary": "#ffffff",
                    "on-surface": "var(--gm-on-surface)",
                    "surface-container": "#eceef0",
                    "surface-container-highest": "#e0e3e5",
                    "on-error-container": "#93000a",
                    "surface-container-low": "var(--gm-surface-low)",
                    "on-primary": "var(--gm-on-primary)",
                    "background": "var(--gm-bg-elevated)",
                    "outline-variant": "var(--gm-outline-variant)",
                    "surface-container-lowest": "var(--gm-surface-lowest)",
                    "surface": "var(--gm-bg-elevated)",
                    "error-container": "#ffdad6",
                    "primary": "var(--gm-primary)",
                    "on-background": "var(--gm-on-primary)",
                    "on-error": "#ffffff",
                    "surface-variant": "#e0e3e5",
                    "outline": "#76777d",
                    "surface-container-high": "#e6e8ea",
                    "secondary-container": "#ffdb99"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "margin-mobile": "16px"
            },
            "fontFamily": {
                    "body-md": ["Inter"],
                    "data-mono": ["IBM Plex Sans"],
                    "headline-md": ["Inter"],
                    "label-md": ["Inter"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "data-mono": ["15px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        html { font-size: 87.5%; }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            font-size: 18px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation Bar -->
<header class="bg-surface-container-lowest text-primary docked full-width top-0 border-b border-outline-variant z-50 sticky">
<div class="flex justify-between items-center px-margin-mobile w-full h-16">
<div class="flex items-center gap-4">
<button onclick="window.location.href='index-ar.html'" class="cursor-pointer active:opacity-80 p-2 hover:bg-surface-container-high transition-colors rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">إضافة عميل</h1>
</div>
</div>
</header>
<main class="pb-32 max-w-md lg:max-w-3xl mx-auto px-margin-mobile">

<section class="py-6 flex flex-col gap-6">

<!-- Account type toggle -->
<div class="flex rounded-lg border border-outline-variant overflow-hidden">
<button type="button" id="type-individual-btn" onclick="setCustomerType(false)" class="flex-1 h-12 font-semibold text-sm transition-all">فرد</button>
<button type="button" id="type-company-btn" onclick="setCustomerType(true)" class="flex-1 h-12 font-semibold text-sm transition-all">شركة</button>
</div>

<!-- Name Input -->
<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[11px] font-semibold text-outline tracking-wider" for="customer-name" id="customer-name-label">اسم العميل</label>
<input class="w-full h-14 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all text-right text-on-background" id="customer-name" placeholder="اكتب اسم العميل" type="text"/>
</div>

<!-- Company-only fields -->
<div id="company-fields" class="hidden flex-col gap-6">

<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[11px] font-semibold text-outline tracking-wider" for="company-legal-name">اسم الشركة القانوني</label>
<input class="w-full h-14 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all text-right text-on-background" id="company-legal-name" placeholder="الاسم القانوني الكامل" type="text"/>
</div>

<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[11px] font-semibold text-outline tracking-wider" for="company-tax-number">الرقم الضريبي (اختياري)</label>
<input class="w-full h-14 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-data-mono text-right text-on-background" dir="ltr" id="company-tax-number" placeholder="اختياري" type="text"/>
</div>

<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[11px] font-semibold text-outline tracking-wider" for="company-address">عنوان الشركة</label>
<textarea class="w-full h-24 bg-transparent border border-outline-variant rounded-lg px-4 py-3 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all text-right text-on-background resize-none" id="company-address" placeholder="الشارع، المدينة، الدولة"></textarea>
</div>

<div class="relative">
<label class="absolute -top-2 right-3 bg-surface-container-lowest px-1 text-[11px] font-semibold text-outline tracking-wider" for="company-email">إيميل الشركة</label>
<input class="w-full h-14 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-data-mono text-right text-on-background" dir="ltr" id="company-email" placeholder="info@company.com" type="email"/>
</div>

<div>
<label class="block text-[11px] font-semibold text-outline tracking-wider mb-1 px-1">رقم التواصل</label>
<div class="flex gap-2">
<select class="h-14 bg-transparent border border-outline-variant rounded-lg px-2 focus:ring-1 focus:ring-primary outline-none text-sm font-data-mono" dir="ltr" id="company-phone-code"></select>
<input class="flex-1 h-14 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-data-mono text-right text-on-background" dir="ltr" id="company-phone" placeholder="رقم الموبايل أو الأرضي" type="tel"/>
</div>
</div>

<div>
<label class="block text-[11px] font-semibold text-outline tracking-wider mb-1 px-1">مستندات KYC (صور أو PDF)</label>
<input class="w-full text-sm border border-dashed border-outline-variant rounded-lg px-3 py-3" id="kyc-files" multiple="" type="file" accept="image/*,.pdf"/>
<p class="text-[11px] text-outline mt-1 px-1">مستندات إثبات هوية الشركة (سجل تجاري، رخصة...) — بتنرفع بعد ما تحفظ الشركة.</p>
</div>

</div>

<!-- Phone Input (individual) -->
<div id="individual-phone-wrap">
<label class="block text-[11px] font-semibold text-outline tracking-wider mb-1 px-1">رقم الهاتف</label>
<div class="flex gap-2">
<select class="h-14 bg-transparent border border-outline-variant rounded-lg px-2 focus:ring-1 focus:ring-primary outline-none text-sm font-data-mono" dir="ltr" id="individual-phone-code"></select>
<input class="flex-1 h-14 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-data-mono text-right text-on-background" dir="ltr" id="customer-phone" placeholder="09xxxxxxxx" type="tel"/>
</div>
</div>

<!-- ID document upload (individual only) -->
<div id="individual-id-doc-wrap">
<label class="block text-[11px] font-semibold text-outline tracking-wider mb-1 px-1">صورة الهوية أو جواز السفر (اختياري)</label>
<input class="w-full text-sm border border-dashed border-outline-variant rounded-lg px-3 py-3" id="id-doc-files" multiple="" type="file" accept="image/*,.pdf"/>
<p class="text-[11px] text-outline mt-1 px-1">بتنحفظ بملف العميل داخل حساب الشركة فقط — ما بتظهر إطلاقاً على الفواتير المطبوعة أو المرسلة للعميل.</p>
</div>

<!-- Extra Phone Numbers -->
<div>
<label class="block text-[11px] font-semibold text-outline tracking-wider mb-1 px-1">أرقام هاتف إضافية (اختياري)</label>
<div class="flex flex-col gap-2" id="extra-phones-list"></div>
<button type="button" id="add-extra-phone-btn" class="mt-2 w-full h-11 border border-dashed border-outline-variant rounded-lg text-sm font-semibold text-primary active:scale-[0.98] transition-all">+ إضافة رقم هاتف آخر</button>
</div>

<!-- Status Message -->
<div id="save-message" class="hidden text-center text-sm font-semibold py-2 rounded-lg"></div>

<!-- Save Button -->
<div class="pt-4">
<button id="save-btn" class="w-full h-14 bg-secondary text-on-secondary rounded-lg font-bold text-body-md shadow-md active:scale-[0.98] transition-all hover:brightness-110">
    حفظ العميل
</button>
</div>

</section>
</main>

<script>
    (async function __enforcePermission() {
        await requireGoldMindSession('login-entry-ar.html');
        const { data: __staffPerm } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
        const __allowed = __staffPerm && (__staffPerm.role === 'owner' || (__staffPerm.permissions && __staffPerm.permissions['add_customers'] === true));
        if (!__allowed) { alert('ليس لديك صلاحية الدخول لهذه الشاشة.'); window.location.href = 'index-ar.html'; }
    })();

    const saveBtn = document.getElementById('save-btn');
    const messageBox = document.getElementById('save-message');
    let isCompany = false;

    // Populate the phone country-code selects from the shared map.
    function populatePhoneCodeSelect(select) {
        Object.keys(GOLDMIND_COUNTRY_PHONE_MAP).forEach(function (cc) {
            const opt = document.createElement('option');
            opt.value = GOLDMIND_COUNTRY_PHONE_MAP[cc];
            opt.textContent = '+' + GOLDMIND_COUNTRY_PHONE_MAP[cc] + ' (' + cc + ')';
            select.appendChild(opt);
        });
        select.value = GOLDMIND_DEFAULT_PHONE_CODE;
    }
    const phoneCodeSelect = document.getElementById('company-phone-code');
    populatePhoneCodeSelect(phoneCodeSelect);
    const individualPhoneCodeSelect = document.getElementById('individual-phone-code');
    populatePhoneCodeSelect(individualPhoneCodeSelect);

    // Extra phone numbers (repeatable rows) -----------------------------
    const extraPhonesList = document.getElementById('extra-phones-list');
    document.getElementById('add-extra-phone-btn').addEventListener('click', addExtraPhoneRow);

    function addExtraPhoneRow() {
        const row = document.createElement('div');
        row.className = 'flex gap-2 items-center';
        row.innerHTML = `
            <input class="flex-1 h-12 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-data-mono text-right text-on-background extra-phone-input" dir="ltr" placeholder="رقم هاتف إضافي" type="tel"/>
            <button type="button" class="h-12 w-12 flex items-center justify-center rounded-lg border border-outline-variant text-error active:scale-[0.98] transition-all remove-extra-phone-btn">
                <span class="material-symbols-outlined">delete</span>
            </button>
        `;
        row.querySelector('.remove-extra-phone-btn').addEventListener('click', () => row.remove());
        extraPhonesList.appendChild(row);
    }

    function getExtraPhoneValues() {
        return Array.from(document.querySelectorAll('.extra-phone-input'))
            .map(i => i.value.trim())
            .filter(v => v.length > 0);
    }

    // A customer name must include at least a first name and a last name/kunya.
    function hasFullName(value) {
        return value.split(/\s+/).filter(Boolean).length >= 2;
    }

    function setCustomerType(company) {
        isCompany = company;
        document.getElementById('type-company-btn').classList.toggle('bg-secondary', company);
        document.getElementById('type-company-btn').classList.toggle('text-on-secondary', company);
        document.getElementById('type-individual-btn').classList.toggle('bg-secondary', !company);
        document.getElementById('type-individual-btn').classList.toggle('text-on-secondary', !company);
        document.getElementById('company-fields').classList.toggle('hidden', !company);
        document.getElementById('company-fields').classList.toggle('flex', company);
        document.getElementById('individual-phone-wrap').classList.toggle('hidden', company);
        document.getElementById('individual-id-doc-wrap').classList.toggle('hidden', company);
        document.getElementById('customer-name-label').textContent = company ? 'اسم العميل (مختصر/شائع)' : 'اسم العميل';
    }
    setCustomerType(false);

    function showMessage(text, isError) {
        messageBox.textContent = text;
        messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
        messageBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
    }

    async function uploadKycFiles(customerId, inputId, category) {
        const filesInput = document.getElementById(inputId);
        const files = filesInput.files;
        if (!files || files.length === 0) return { ok: true };

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
            const path = GOLDMIND_STORE_ID + '/customer-' + customerId + '/' + category + '-' + Date.now() + '-' + i + '.' + ext;

            const { error: uploadError } = await goldmindClient.storage
                .from('company-kyc-documents').upload(path, file, { upsert: false });
            if (uploadError) return { ok: false, message: uploadError.message };

            const { error: rowError } = await goldmindClient.from('company_kyc_documents').insert({
                store_id: GOLDMIND_STORE_ID,
                owner_type: 'customer',
                owner_id: customerId,
                document_category: category,
                file_url: path,
                file_name: file.name,
                uploaded_by: GOLDMIND_STAFF_ID
            });
            if (rowError) return { ok: false, message: rowError.message };
        }
        return { ok: true };
    }

    saveBtn.addEventListener('click', async () => {
        const session = await requireGoldMindSession('login-entry-ar.html');
        if (!session) return;

        const name = document.getElementById('customer-name').value.trim();
        const phone = document.getElementById('customer-phone').value.trim();
        const legalName = document.getElementById('company-legal-name').value.trim();
        const taxNumber = document.getElementById('company-tax-number').value.trim();
        const address = document.getElementById('company-address').value.trim();
        const email = document.getElementById('company-email').value.trim();
        const companyPhone = document.getElementById('company-phone').value.trim();
        const phoneCode = document.getElementById('company-phone-code').value;

        if (!name) {
            showMessage('الرجاء إدخال اسم العميل.', true);
            return;
        }
        if (!isCompany && !hasFullName(name)) {
            showMessage('الرجاء إدخال الاسم الكامل (الاسم والكنية على الأقل).', true);
            return;
        }
        if (isCompany && !legalName) {
            showMessage('الرجاء إدخال اسم الشركة القانوني.', true);
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'جارِ الحفظ...';

        const { data: existingCustomers, error: dupCheckError } = await goldmindClient
            .from('customers')
            .select('id, name, phone')
            .eq('store_id', GOLDMIND_STORE_ID)
            .ilike('name', name);

        if (dupCheckError) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ العميل';
            showMessage('خطأ: ' + dupCheckError.message, true);
            return;
        }

        if (existingCustomers && existingCustomers.length > 0) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ العميل';
            const existing = existingCustomers[0];
            const phoneNote = existing.phone ? ` (${existing.phone})` : '';
            showMessage('يوجد عميل مسجل مسبقاً بنفس الاسم "' + existing.name + '"' + phoneNote + '. الرجاء اختيار العميل الموجود بدلاً من إضافة تكرار.', true);
            return;
        }

        const insertPayload = {
            store_id: GOLDMIND_STORE_ID,
            name: name,
            is_company: isCompany
        };
        if (isCompany) {
            insertPayload.phone = companyPhone || null;
            insertPayload.phone_country_code = companyPhone ? phoneCode : null;
            insertPayload.legal_name = legalName;
            insertPayload.tax_number = taxNumber || null;
            insertPayload.address = address || null;
            insertPayload.email = email || null;
        } else {
            insertPayload.phone = phone || null;
            insertPayload.phone_country_code = phone ? individualPhoneCodeSelect.value : null;
        }

        const { data: inserted, error } = await goldmindClient.from('customers').insert(insertPayload).select('id').single();

        if (error) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ العميل';
            showMessage('خطأ: ' + error.message, true);
            return;
        }

        let kycMessage = '';
        if (isCompany) {
            const kycResult = await uploadKycFiles(inserted.id, 'kyc-files', 'kyc');
            if (!kycResult.ok) {
                kycMessage = ' (تنبيه: تعذّر رفع بعض مستندات KYC: ' + kycResult.message + ')';
            }
        } else {
            const idDocResult = await uploadKycFiles(inserted.id, 'id-doc-files', 'id_document');
            if (!idDocResult.ok) {
                kycMessage = ' (تنبيه: تعذّر رفع صورة الهوية: ' + idDocResult.message + ')';
            }
        }

        const extraPhoneValues = getExtraPhoneValues();
        if (extraPhoneValues.length > 0) {
            const extraPhonesPayload = extraPhoneValues.map(p => ({
                store_id: GOLDMIND_STORE_ID,
                customer_id: inserted.id,
                phone: p
            }));
            const { error: extraPhonesError } = await goldmindClient.from('customer_phones').insert(extraPhonesPayload);
            if (extraPhonesError) {
                kycMessage += ' (تنبيه: تعذّر حفظ بعض أرقام الهاتف الإضافية: ' + extraPhonesError.message + ')';
            }
        }

        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ العميل';

        showMessage('تم حفظ العميل بنجاح! جاهز لإضافة عميل آخر.' + kycMessage, kycMessage !== '');
        extraPhonesList.innerHTML = '';
        document.getElementById('customer-name').value = '';
        document.getElementById('customer-phone').value = '';
        individualPhoneCodeSelect.value = GOLDMIND_DEFAULT_PHONE_CODE;
        document.getElementById('company-legal-name').value = '';
        document.getElementById('company-tax-number').value = '';
        document.getElementById('company-address').value = '';
        document.getElementById('company-email').value = '';
        document.getElementById('company-phone').value = '';
        document.getElementById('kyc-files').value = '';
        document.getElementById('id-doc-files').value = '';
        document.getElementById('customer-name').focus();
    });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
