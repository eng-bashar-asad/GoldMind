<script>
    (async function __enforcePermission() {
        await requireGoldMindSession('login-entry-ar.html');
        const { data: __staffPerm } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
        const __allowed = __staffPerm && (__staffPerm.role === 'owner' || (__staffPerm.permissions && __staffPerm.permissions['add_customers'] === true));
        if (!__allowed) { alert('ليس لديك صلاحية الدخول لهذه الشاشة.'); window.location.href = 'index-ar.html'; }
    })();

    const saveBtn = document.getElementById('save-btn');
    const messageBox = document.getElementById('save-message');
    let isCompany = false;

    // Populate the phone country-code selects from the shared map.
    function populatePhoneCodeSelect(select) {
        Object.keys(GOLDMIND_COUNTRY_PHONE_MAP).forEach(function (cc) {
            const opt = document.createElement('option');
            opt.value = GOLDMIND_COUNTRY_PHONE_MAP[cc];
            opt.textContent = '+' + GOLDMIND_COUNTRY_PHONE_MAP[cc] + ' (' + cc + ')';
            select.appendChild(opt);
        });
        select.value = GOLDMIND_DEFAULT_PHONE_CODE;
    }
    const phoneCodeSelect = document.getElementById('company-phone-code');
    populatePhoneCodeSelect(phoneCodeSelect);
    const individualPhoneCodeSelect = document.getElementById('individual-phone-code');
    populatePhoneCodeSelect(individualPhoneCodeSelect);

    // Extra phone numbers (repeatable rows) -----------------------------
    const extraPhonesList = document.getElementById('extra-phones-list');
    document.getElementById('add-extra-phone-btn').addEventListener('click', addExtraPhoneRow);

    function addExtraPhoneRow() {
        const row = document.createElement('div');
        row.className = 'flex gap-2 items-center';
        row.innerHTML = `
            <input class="flex-1 h-12 bg-transparent border border-outline-variant rounded-lg px-4 focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all font-data-mono text-right text-on-background extra-phone-input" dir="ltr" placeholder="رقم هاتف إضافي" type="tel"/>
            <button type="button" class="h-12 w-12 flex items-center justify-center rounded-lg border border-outline-variant text-error active:scale-[0.98] transition-all remove-extra-phone-btn">
                <span class="material-symbols-outlined">delete</span>
            </button>
        `;
        row.querySelector('.remove-extra-phone-btn').addEventListener('click', () => row.remove());
        extraPhonesList.appendChild(row);
    }

    function getExtraPhoneValues() {
        return Array.from(document.querySelectorAll('.extra-phone-input'))
            .map(i => i.value.trim())
            .filter(v => v.length > 0);
    }

    // A customer name must include at least a first name and a last name/kunya.
    function hasFullName(value) {
        return value.split(/\s+/).filter(Boolean).length >= 2;
    }

    function setCustomerType(company) {
        isCompany = company;
        document.getElementById('type-company-btn').classList.toggle('bg-secondary', company);
        document.getElementById('type-company-btn').classList.toggle('text-on-secondary', company);
        document.getElementById('type-individual-btn').classList.toggle('bg-secondary', !company);
        document.getElementById('type-individual-btn').classList.toggle('text-on-secondary', !company);
        document.getElementById('company-fields').classList.toggle('hidden', !company);
        document.getElementById('company-fields').classList.toggle('flex', company);
        document.getElementById('individual-phone-wrap').classList.toggle('hidden', company);
        document.getElementById('individual-legal-fields').classList.toggle('hidden', company);
        document.getElementById('customer-name-label').textContent = company ? 'اسم العميل (مختصر/شائع)' : 'اسم العميل';
    }

    // Allow deep-linking with ?type=company from the KYC company page.
    const __urlParams = new URLSearchParams(window.location.search);
    setCustomerType(__urlParams.get('type') === 'company');

    function showMessage(text, isError) {
        messageBox.textContent = text;
        messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
        messageBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
    }

    async function uploadKycFile(customerId, inputId, category) {
        const filesInput = document.getElementById(inputId);
        const file = filesInput.files && filesInput.files[0];
        if (!file) return { ok: true };

        const ext = (file.name.split('.').pop() || 'bin').toLowerCase();
        const path = GOLDMIND_STORE_ID + '/customer-' + customerId + '/' + category + '-' + Date.now() + '.' + ext;

        const { error: uploadError } = await goldmindClient.storage
            .from('company-kyc-documents').upload(path, file, { upsert: false });
        if (uploadError) return { ok: false, message: uploadError.message };

        const { error: rowError } = await goldmindClient.from('company_kyc_documents').insert({
            store_id: GOLDMIND_STORE_ID,
            owner_type: 'customer',
            owner_id: customerId,
            document_category: category,
            file_url: path,
            file_name: file.name,
            uploaded_by: GOLDMIND_STAFF_ID
        });
        if (rowError) return { ok: false, message: rowError.message };
        return { ok: true };
    }

    saveBtn.addEventListener('click', async () => {
        const session = await requireGoldMindSession('login-entry-ar.html');
        if (!session) return;

        const name = document.getElementById('customer-name').value.trim();
        const phone = document.getElementById('customer-phone').value.trim();
        const legalName = document.getElementById('company-legal-name').value.trim();
        const taxNumber = document.getElementById('company-tax-number').value.trim();
        const tradeLicense = document.getElementById('company-trade-license').value.trim();
        const businessActivity = document.getElementById('company-activity').value.trim();
        const address = document.getElementById('company-address').value.trim();
        const email = document.getElementById('company-email').value.trim();
        const companyPhone = document.getElementById('company-phone').value.trim();
        const phoneCode = document.getElementById('company-phone-code').value;
        const uboName = document.getElementById('company-ubo-name').value.trim();
        const uboId = document.getElementById('company-ubo-id').value.trim();
        const uboPercent = document.getElementById('company-ubo-percent').value;
        const signatoryName = document.getElementById('company-signatory-name').value.trim();
        const signatoryId = document.getElementById('company-signatory-id').value.trim();

        const nationality = document.getElementById('ind-nationality').value.trim();
        const dob = document.getElementById('ind-dob').value || null;
        const idType = document.getElementById('ind-id-type').value;
        const idNumber = document.getElementById('ind-id-number').value.trim();
        const idExpiry = document.getElementById('ind-id-expiry').value || null;
        const indAddress = document.getElementById('ind-address').value.trim();
        const occupation = document.getElementById('ind-occupation').value.trim();
        const sourceOfFunds = document.getElementById('ind-source-funds').value.trim();

        const declarationAccepted = document.getElementById('kyc-declaration').checked;

        if (!name) {
            showMessage('الرجاء إدخال اسم العميل.', true);
            return;
        }
        if (!isCompany && !hasFullName(name)) {
            showMessage('الرجاء إدخال الاسم الكامل (الاسم والكنية على الأقل).', true);
            return;
        }
        if (isCompany && !legalName) {
            showMessage('الرجاء إدخال اسم الشركة القانوني.', true);
            return;
        }
        if (!declarationAccepted) {
            showMessage('الرجاء تأكيد إقرار صحة البيانات (KYC) قبل الحفظ.', true);
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'جارِ الحفظ...';

        const { data: existingCustomers, error: dupCheckError } = await goldmindClient
            .from('customers')
            .select('id, name, phone')
            .eq('store_id', GOLDMIND_STORE_ID)
            .ilike('name', name);

        if (dupCheckError) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ العميل';
            showMessage('خطأ: ' + dupCheckError.message, true);
            return;
        }

        if (existingCustomers && existingCustomers.length > 0) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ العميل';
            const existing = existingCustomers[0];
            const phoneNote = existing.phone ? ` (${existing.phone})` : '';
            showMessage('يوجد عميل مسجل مسبقاً بنفس الاسم "' + existing.name + '"' + phoneNote + '. الرجاء اختيار العميل الموجود بدلاً من إضافة تكرار.', true);
            return;
        }

        const insertPayload = {
            store_id: GOLDMIND_STORE_ID,
            name: name,
            is_company: isCompany,
            kyc_declaration_accepted: true,
            kyc_completed_at: new Date().toISOString()
        };
        if (isCompany) {
            insertPayload.phone = companyPhone || null;
            insertPayload.phone_country_code = companyPhone ? phoneCode : null;
            insertPayload.legal_name = legalName;
            insertPayload.tax_number = taxNumber || null;
            insertPayload.address = address || null;
            insertPayload.email = email || null;
            insertPayload.trade_license_number = tradeLicense || null;
            insertPayload.business_activity = businessActivity || null;
            insertPayload.ubo_name = uboName || null;
            insertPayload.ubo_id_number = uboId || null;
            insertPayload.ubo_ownership_percent = uboPercent ? Number(uboPercent) : null;
            insertPayload.authorized_signatory_name = signatoryName || null;
            insertPayload.authorized_signatory_id_number = signatoryId || null;
        } else {
            insertPayload.phone = phone || null;
            insertPayload.phone_country_code = phone ? individualPhoneCodeSelect.value : null;
            insertPayload.nationality = nationality || null;
            insertPayload.date_of_birth = dob;
            insertPayload.id_type = idType || null;
            insertPayload.id_number = idNumber || null;
            insertPayload.id_expiry_date = idExpiry;
            insertPayload.address = indAddress || null;
            insertPayload.occupation = occupation || null;
            insertPayload.source_of_funds = sourceOfFunds || null;
        }

        const { data: inserted, error } = await goldmindClient.from('customers').insert(insertPayload).select('id').single();

        if (error) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'حفظ العميل';
            showMessage('خطأ: ' + error.message, true);
            return;
        }

        let kycMessage = '';
        if (isCompany) {
            const licenseResult = await uploadKycFile(inserted.id, 'company-license-file', 'trade_license');
            if (!licenseResult.ok) kycMessage += ' (تنبيه: تعذّر رفع الرخصة التجارية: ' + licenseResult.message + ')';
            const signatoryResult = await uploadKycFile(inserted.id, 'company-signatory-id-file', 'signatory_id');
            if (!signatoryResult.ok) kycMessage += ' (تنبيه: تعذّر رفع هوية المفوّض: ' + signatoryResult.message + ')';
        } else {
            const frontResult = await uploadKycFile(inserted.id, 'id-doc-front-file', 'id_document_front');
            if (!frontResult.ok) kycMessage += ' (تنبيه: تعذّر رفع وجه الهوية: ' + frontResult.message + ')';
            const backResult = await uploadKycFile(inserted.id, 'id-doc-back-file', 'id_document_back');
            if (!backResult.ok) kycMessage += ' (تنبيه: تعذّر رفع ظهر الهوية: ' + backResult.message + ')';
        }

        const extraPhoneValues = getExtraPhoneValues();
        if (extraPhoneValues.length > 0) {
            const extraPhonesPayload = extraPhoneValues.map(p => ({
                store_id: GOLDMIND_STORE_ID,
                customer_id: inserted.id,
                phone: p
            }));
            const { error: extraPhonesError } = await goldmindClient.from('customer_phones').insert(extraPhonesPayload);
            if (extraPhonesError) {
                kycMessage += ' (تنبيه: تعذّر حفظ بعض أرقام الهاتف الإضافية: ' + extraPhonesError.message + ')';
            }
        }

        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ العميل';

        showMessage('تم حفظ العميل بنجاح! جاهز لإضافة عميل آخر.' + kycMessage, kycMessage !== '');
        extraPhonesList.innerHTML = '';
        document.getElementById('customer-name').value = '';
        document.getElementById('customer-phone').value = '';
        individualPhoneCodeSelect.value = GOLDMIND_DEFAULT_PHONE_CODE;
        document.getElementById('company-legal-name').value = '';
        document.getElementById('company-tax-number').value = '';
        document.getElementById('company-trade-license').value = '';
        document.getElementById('company-activity').value = '';
        document.getElementById('company-address').value = '';
        document.getElementById('company-email').value = '';
        document.getElementById('company-phone').value = '';
        document.getElementById('company-ubo-name').value = '';
        document.getElementById('company-ubo-id').value = '';
        document.getElementById('company-ubo-percent').value = '';
        document.getElementById('company-signatory-name').value = '';
        document.getElementById('company-signatory-id').value = '';
        document.getElementById('company-license-file').value = '';
        document.getElementById('company-signatory-id-file').value = '';
        document.getElementById('ind-nationality').value = '';
        document.getElementById('ind-dob').value = '';
        document.getElementById('ind-id-type').value = 'emirates_id';
        document.getElementById('ind-id-number').value = '';
        document.getElementById('ind-id-expiry').value = '';
        document.getElementById('ind-address').value = '';
        document.getElementById('ind-occupation').value = '';
        document.getElementById('ind-source-funds').value = '';
        document.getElementById('id-doc-front-file').value = '';
        document.getElementById('id-doc-back-file').value = '';
        document.getElementById('kyc-declaration').checked = false;
        document.getElementById('customer-name').focus();
    });
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
