<script>
let invoice = null;
let items = [];
let removedItems = [];
let newlyAddedCount = 0;
let itemUid = 0;

function fmt(n) { return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function renderItems() {
  document.getElementById('items-editor').innerHTML = items.map((it, idx) => {
    const isDiamond = !!it.diamond_piece_id;
    return `
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-1.5">
          ${it._new ? '<span class="text-[10px] font-semibold text-secondary bg-secondary/10 px-2 py-0.5 rounded-full">جديدة</span>' : '<span></span>'}
          ${isDiamond ? '<span class="text-[10px] font-semibold text-primary bg-primary/10 px-2 py-0.5 rounded-full">قطعة ألماس</span>' : ''}
        </div>
        <button onclick="removeItem(${idx})" class="text-error"><span class="material-symbols-outlined text-[18px]">delete</span></button>
      </div>
      <input class="w-full h-10 border border-outline-variant rounded-lg px-3 text-[13px] mb-2" placeholder="الوصف" value="${(it.description || '').replace(/"/g,'&quot;')}" oninput="items[${idx}].description = this.value"/>
      ${isDiamond ? `
      <div class="grid grid-cols-1 gap-2">
        <div>
          <label class="text-[10px] text-outline">السعر</label>
          <input type="number" step="0.01" class="w-full h-10 border border-outline-variant rounded-lg px-2 text-[13px] font-data-mono" value="${it.line_total}" oninput="items[${idx}].line_total = parseFloat(this.value)||0; updateTotal();"/>
        </div>
      </div>
      <p class="text-[10px] text-outline mt-1.5">مواصفات الماس (القيراط/الـ4Cs) تُعدَّل من صفحة مخزون الماس، مو من هنا. ${it.weight_grams ? `الجزء الذهبي المرافق: ${it.weight_grams}غ عيار ${it.karat}.` : ''}</p>
      ` : `
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="text-[10px] text-outline">الوزن (غ)</label>
          <input type="number" step="0.01" class="w-full h-10 border border-outline-variant rounded-lg px-2 text-[13px] font-data-mono" value="${it.weight_grams}" oninput="items[${idx}].weight_grams = parseFloat(this.value)||0; updateTotal();"/>
        </div>
        <div>
          <label class="text-[10px] text-outline">العيار</label>
          <select class="w-full h-10 border border-outline-variant rounded-lg px-1 text-[13px]" onchange="items[${idx}].karat = parseInt(this.value)">
            ${[18,21,22,24].map(k => `<option value="${k}" ${it.karat==k?'selected':''}>${k}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-[10px] text-outline">السعر</label>
          <input type="number" step="0.01" class="w-full h-10 border border-outline-variant rounded-lg px-2 text-[13px] font-data-mono" value="${it.line_total}" oninput="items[${idx}].line_total = parseFloat(this.value)||0; updateTotal();"/>
        </div>
      </div>
      `}
    </div>`;
  }).join('') || '<p class="text-center text-on-surface-variant text-sm py-4">لا توجد قطع — أضف واحدة بالأسفل.</p>';
  updateTotal();
}

function removeItem(idx) {
  const [removed] = items.splice(idx, 1);
  if (!removed._new) removedItems.push(removed);
  renderItems();
}

function toggleAddItemForm() {
  const form = document.getElementById('addItemForm');
  form.classList.toggle('hidden');
  form.classList.toggle('flex');
  const barcodeRow = document.getElementById('barcodeSearchRow');
  if (invoice && invoice.type === 'sale') { barcodeRow.classList.remove('hidden'); }
}

async function lookupPieceByBarcode() {
  const barcode = document.getElementById('newItemBarcode').value.trim();
  const msgEl = document.getElementById('barcodeLookupMsg');
  msgEl.classList.remove('hidden');
  if (!barcode) { msgEl.textContent = ''; msgEl.classList.add('hidden'); return; }

  const { data, error } = await goldmindClient
    .from('pieces').select('*').eq('store_id', GOLDMIND_STORE_ID).eq('barcode', barcode).eq('status', 'available').maybeSingle();

  if (error || !data) {
    msgEl.textContent = 'لم يتم العثور على قطعة متاحة بهذا الباركود';
    msgEl.className = 'text-[11px] mt-1 text-error';
    window.__lookedUpPiece = null;
    return;
  }
  window.__lookedUpPiece = data;
  document.getElementById('newItemDesc').value = data.description_ar || '';
  document.getElementById('newItemWeight').value = data.weight_grams;
  document.getElementById('newItemKarat').value = data.karat;
  msgEl.textContent = 'تم العثور على القطعة وتعبئة بياناتها';
  msgEl.className = 'text-[11px] mt-1 text-success';
}

function addNewItem() {
  const weight = parseFloat(document.getElementById('newItemWeight').value);
  const karat = parseInt(document.getElementById('newItemKarat').value, 10);
  const price = parseFloat(document.getElementById('newItemPrice').value);
  const desc = document.getElementById('newItemDesc').value.trim();

  if (!weight || weight <= 0 || !price || price <= 0) { alert('فضلاً أدخل وزن وسعر صحيحين'); return; }

  const piece = window.__lookedUpPiece || null;
  items.push({
    _uid: ++itemUid,
    _new: true,
    piece_id: piece ? piece.id : null,
    barcode: piece ? piece.barcode : null,
    karat, weight_grams: weight, accounting_weight_grams: piece ? (piece.accounting_weight_grams || weight) : weight,
    description: desc || (piece ? piece.description_ar : null),
    description_en: piece ? piece.description_en : null,
    line_total: price,
    gold_price_per_gram: null
  });

  document.getElementById('newItemBarcode').value = '';
  document.getElementById('newItemDesc').value = '';
  document.getElementById('newItemWeight').value = '';
  document.getElementById('newItemPrice').value = '';
  window.__lookedUpPiece = null;
  document.getElementById('barcodeLookupMsg').classList.add('hidden');
  renderItems();
}

function updateTotal() {
  const total = items.reduce((s, it) => s + Number(it.line_total || 0), 0);
  document.getElementById('newTotal').textContent = fmt(total);
}

async function postLedgerEntry(invoiceType, paymentMethod, amount, mode, description) {
  const isTraderInvoice = invoiceType === 'buyTrader' || invoiceType === 'buyRetail';
  const isAdding = mode === 'add';

  if (paymentMethod === 'cash' || paymentMethod === 'bank') {
    // Sale: adding money in means direction 'in'; purchase: adding means 'out'.
    let direction;
    if (invoiceType === 'sale') direction = isAdding ? 'in' : 'out';
    else direction = isAdding ? 'out' : 'in';

    await goldmindClient.from('cash_movements').insert({
      store_id: GOLDMIND_STORE_ID, box: 'main', direction, amount,
      description, created_by: GOLDMIND_STAFF_ID, invoice_id: invoice.id
    });
  } else if (paymentMethod === 'credit' && invoiceType === 'sale') {
    await goldmindClient.from('customer_debts').insert({
      store_id: GOLDMIND_STORE_ID, customer_id: invoice.customer_id, invoice_id: invoice.id,
      movement_type: isAdding ? 'debt_increase' : 'debt_decrease',
      cash_amount: amount, gold_grams_24k: 0,
      notes: description, created_by: GOLDMIND_STAFF_ID
    });
  } else if (paymentMethod === 'credit' && isTraderInvoice) {
    await goldmindClient.from('trader_movements').insert({
      store_id: GOLDMIND_STORE_ID, trader_id: invoice.trader_id, invoice_id: invoice.id,
      movement_type: isAdding ? 'debt_increase' : 'debt_decrease',
      weight_grams: 0, karat: null, gold_24k_equivalent: 0, fab_fee_amount: amount,
      notes: description
    });
  }
}

async function saveEdit() {
  const errEl = document.getElementById('save-error');
  const okEl = document.getElementById('save-success');
  errEl.classList.add('hidden');
  okEl.classList.add('hidden');

  const newTotal = items.reduce((s, it) => s + Number(it.line_total || 0), 0);
  const oldTotal = Number(invoice.total_amount);
  const delta = newTotal - oldTotal;
  const newPaymentMethod = document.getElementById('paymentMethodSelect').value;
  const paymentMethodChanged = newPaymentMethod !== invoice.payment_method;

  if (!confirm('هل أنت متأكد من حفظ التعديلات؟ الفرق بالمبلغ (' + fmt(delta) + ') بينسجّل كحركة بتاريخ اليوم.')) return;

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = 'جارِ الحفظ...';

  const isTrader = invoice.type === 'buyTrader' || invoice.type === 'buyRetail';
  const counterpartyVal = document.getElementById('counterpartyInput').value.trim();

  const updatePayload = {
    payment_method: newPaymentMethod,
    total_amount: newTotal,
    amount_paid: (newPaymentMethod === 'credit') ? 0 : newTotal
  };
  if (invoice.type === 'sale' || invoice.type === 'return') {
    // customer editing left as-is (rare case) — only re-linkable via cancel+reissue
  } else if (invoice.type === 'buyRetail') {
    updatePayload.counterparty_name = counterpartyVal || null;
  }

  const { data: invUpdateData, error: invUpdateError } = await goldmindClient.from('invoices').update(updatePayload).eq('id', invoice.id);
  if (invUpdateError) {
    btn.disabled = false; btn.textContent = 'حفظ التعديلات';
    errEl.textContent = 'تعذّر حفظ الفاتورة: ' + invUpdateError.message;
    errEl.classList.remove('hidden');
    return;
  }

  // Update fields on items that already existed
  for (const it of items.filter(i => !i._new)) {
    await goldmindClient.from('invoice_items').update({
      description: it.description,
      weight_grams: it.weight_grams,
      karat: it.karat,
      line_total: it.line_total
    }).eq('id', it.id);
  }

  // Insert brand-new items (create a piece first for purchase invoices so
  // the added stock actually lands in inventory; sale items reuse a piece
  // found via barcode lookup, or stay unlinked like a manual sale line)
  const newItems = items.filter(i => i._new);
  for (const it of newItems) {
    let pieceId = it.piece_id;
    if (!pieceId && isTrader) {
      const { data: barcode, error: bcError } = await goldmindClient.rpc('next_piece_barcode', { target_store_id: GOLDMIND_STORE_ID, category: 'gold' });
      const { data: newPiece } = await goldmindClient.from('pieces').insert({
        store_id: GOLDMIND_STORE_ID,
        barcode: bcError ? null : barcode,
        weight_grams: it.weight_grams, karat: it.karat, description_ar: it.description,
        status: 'available', created_by: GOLDMIND_STAFF_ID
      }).select().single();
      pieceId = newPiece ? newPiece.id : null;
    } else if (pieceId && invoice.type === 'sale') {
      await goldmindClient.from('pieces').update({ status: 'sold' }).eq('id', pieceId);
    }

    await goldmindClient.from('invoice_items').insert({
      invoice_id: invoice.id, piece_id: pieceId, barcode: it.barcode,
      karat: it.karat, weight_grams: it.weight_grams, accounting_weight_grams: it.accounting_weight_grams,
      fabrication_fee: 0, line_total: it.line_total,
      description: it.description, description_en: it.description_en,
      gold_price_per_gram: it.gold_price_per_gram
    });
  }

  // Release pieces/diamonds/bulk-lot weight from removed items back to a sane inventory state
  const bulkRestoreByLot = {};
  for (const it of removedItems) {
    await goldmindClient.from('invoice_items').delete().eq('id', it.id);
    if (it.piece_id) {
      await goldmindClient.from('pieces').update({
        status: invoice.type === 'sale' ? 'available' : 'cancelled'
      }).eq('id', it.piece_id);
    }
    if (it.diamond_piece_id) {
      await goldmindClient.from('diamond_pieces').update({
        status: invoice.type === 'sale' ? 'available' : 'cancelled'
      }).eq('id', it.diamond_piece_id);
    }
    if (it.gold_stock_lot_id && it.weight_grams && invoice.type === 'sale') {
      bulkRestoreByLot[it.gold_stock_lot_id] = (bulkRestoreByLot[it.gold_stock_lot_id] || 0) + Number(it.weight_grams);
    }
  }
  for (const lotId of Object.keys(bulkRestoreByLot)) {
    const { data: lot } = await goldmindClient.from('gold_stock_lots').select('weight_grams_remaining').eq('id', lotId).maybeSingle();
    if (lot) {
      await goldmindClient.from('gold_stock_lots').update({
        weight_grams_remaining: Number(lot.weight_grams_remaining) + bulkRestoreByLot[lotId]
      }).eq('id', lotId);
    }
  }

  // Post the money/debt effect as TWO explicit dated entries — a full
  // removal of the old invoice value, then a full addition of the new
  // value — instead of one net delta. Never touches the original entry.
  if (oldTotal > 0) {
    await postLedgerEntry(invoice.type, invoice.payment_method, oldTotal, 'remove',
      'حذف قيمة فاتورة ' + invoice.invoice_number + ' (قبل التعديل)');
  }
  if (newTotal > 0) {
    await postLedgerEntry(invoice.type, newPaymentMethod, newTotal, 'add',
      'إضافة قيمة فاتورة ' + invoice.invoice_number + ' (بعد التعديل)');
  }

  okEl.textContent = 'تم حفظ التعديلات بنجاح';
  okEl.classList.remove('hidden');
  btn.disabled = false;
  btn.textContent = 'حفظ التعديلات';
  setTimeout(() => { window.location.href = 'invoice-print-ar.html?id=' + invoice.id; }, 1000);
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  const params = new URLSearchParams(window.location.search);
  const invoiceId = params.get('id');
  const loading = document.getElementById('loading-state');
  const noAccess = document.getElementById('no-access');

  if (!invoiceId) {
    loading.classList.add('hidden');
    noAccess.textContent = 'لم يتم تحديد فاتورة.';
    noAccess.classList.remove('hidden');
    return;
  }

  const { data: staffRow } = await goldmindClient.from('staff').select('role, permissions').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
  const canEdit = staffRow && (staffRow.role === 'owner' || (staffRow.permissions && staffRow.permissions.edit_invoice));

  const { data: inv, error: invError } = await goldmindClient.from('invoices').select('*').eq('id', invoiceId).single();

  loading.classList.add('hidden');

  if (!canEdit) {
    noAccess.textContent = 'ليس لديك صلاحية تعديل الفواتير.';
    noAccess.classList.remove('hidden');
    return;
  }
  if (invError || !inv) {
    noAccess.textContent = 'تعذّر تحميل الفاتورة.';
    noAccess.classList.remove('hidden');
    return;
  }
  if (inv.status === 'cancelled') {
    noAccess.textContent = 'هذه الفاتورة ملغاة، لا يمكن تعديلها.';
    noAccess.classList.remove('hidden');
    return;
  }
  if (inv.type === 'return' || inv.type === 'traderPay') {
    noAccess.textContent = 'هذا النوع من الفواتير غير قابل للتعديل من هنا.';
    noAccess.classList.remove('hidden');
    return;
  }

  invoice = inv;

  const { data: itemRows } = await goldmindClient.from('invoice_items').select('*').eq('invoice_id', invoiceId);
  items = itemRows || [];

  document.getElementById('lockedNumber').textContent = invoice.invoice_number;
  document.getElementById('lockedDate').textContent = gmFormatDateTime(invoice.created_at);

  const paySelect = document.getElementById('paymentMethodSelect');
  if (invoice.type === 'sale') {
    paySelect.innerHTML = '<option value="cash">نقدي</option><option value="bank">فيزا/بنك</option><option value="credit">دين</option>';
  } else {
    paySelect.innerHTML = '<option value="cash">نقدي</option><option value="credit">دين</option>';
  }
  paySelect.value = invoice.payment_method;

  const counterpartyBlock = document.getElementById('counterpartyBlock');
  if (invoice.type === 'buyRetail') {
    document.getElementById('counterpartyLabel').textContent = 'اسم البائع';
    document.getElementById('counterpartyInput').value = invoice.counterparty_name || '';
  } else {
    counterpartyBlock.classList.add('hidden');
  }

  renderItems();
  document.getElementById('page-content').classList.remove('hidden');
}

load();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
