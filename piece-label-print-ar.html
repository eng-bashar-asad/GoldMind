<!DOCTYPE html>
<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ملصق قطعة | GoldMind</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zebra-browser-print-min@3.0.216/BrowserPrint-3.0.216.min.js"></script>
<script src="zebra-rfid.js"></script>
<script src="theme.js?v=20"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
    @media print {
        .no-print { display: none !important; }
        body { background: #fff !important; }
        #label { box-shadow: none !important; margin: 0 auto !important; }
        #panelBarcode, #panelSpecs { border: 1px dashed #999 !important; }
    }
    @page { margin: 0; }
</style>
</head>
<body class="bg-gray-100 text-gray-900">

<div class="no-print sticky top-0 bg-white border-b border-gray-200 z-50 flex items-center justify-between px-4 h-14">
<button onclick="gmSmartBack('inventory-list-ar.html')" class="flex items-center gap-2 text-gray-700">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0, 'wght' 700; font-size: 28px;">arrow_forward</span>
<span class="text-sm font-semibold">المخزن</span>
</button>
<div class="flex items-center gap-2">
<button onclick="window.print()" class="flex items-center gap-2 bg-black text-white px-4 py-2 rounded-lg text-sm font-semibold">
<span class="material-symbols-outlined">print</span> طباعة
</button>
<button id="zebra-btn" class="flex items-center gap-2 bg-sky-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">
<span class="material-symbols-outlined">print</span> طباعة Zebra
</button>
<button id="rfid-btn" class="hidden flex items-center gap-2 bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">
<span class="material-symbols-outlined">wifi_tethering</span> طباعة + برمجة RFID
</button>
<button id="reset-orientation-btn" class="flex items-center gap-2 bg-gray-500 text-white px-3 py-2 rounded-lg text-xs font-semibold" title="لو دوران الطابعة عم يطلع غير مستجيب لأي إعداد، جرّب هاد مرة وحدة">
<span class="material-symbols-outlined text-[16px]">restart_alt</span> إعادة ضبط دوران الطابعة
</button>
<a href="zebra-label-designer-ar.html" class="flex items-center gap-2 border border-gray-400 text-gray-700 px-3 py-2 rounded-lg text-xs font-semibold">
<span class="material-symbols-outlined text-[16px]">design_services</span> تعديل تصميم الملصق
</a>
</div>
</div>

<div id="rfid-status" class="no-print hidden max-w-xs mx-auto mt-3 text-center text-xs font-semibold px-3 py-2 rounded-lg"></div>

<div id="loading" class="py-16 text-center text-gray-500 text-sm">جارِ التحميل...</div>
<div id="error-box" class="hidden py-10 px-6 text-center text-red-700 bg-red-100 max-w-sm mx-auto mt-6 rounded-lg"></div>

<div id="label" class="hidden max-w-sm mx-auto my-8 flex gap-3 text-center" dir="ltr">
<div id="panelBarcode" class="flex-1 px-3 py-3 bg-white shadow rounded-lg border border-gray-200 flex flex-col items-center justify-center gap-1 min-w-0">
<div id="barcodeNumber" class="text-[11px] font-bold"></div>
<svg id="barcodeSvg" class="w-full"></svg>
<div id="storeName" class="text-[11px] font-bold truncate w-full"></div>
</div>
<div id="panelSpecs" class="flex-1 px-3 py-3 bg-white shadow rounded-lg border border-gray-200 flex flex-col items-start justify-center gap-1.5 text-[12px] font-bold min-w-0">
<div id="specWeight"></div>
<div id="specKarat"></div>
<div id="specMc"></div>
<div id="specType" class="truncate w-full"></div>
</div>
</div>
<div id="rfidBadge" class="hidden text-[10px] font-semibold text-amber-700 flex items-center justify-center gap-1 mb-6">
<span class="material-symbols-outlined" style="font-size:13px;">sensors</span>
<span>محمّلة RFID</span>
</div>

<script>
    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    let currentPiece = null;
    let currentStore = null;
    let labelFields = [];

    async function loadLabel() {
        const session = await requireGoldMindSession('login-entry-ar.html');
        if (!session) return;

        const pieceId = getParam('id');
        const loading = document.getElementById('loading');
        const errorBox = document.getElementById('error-box');
        const label = document.getElementById('label');

        if (!pieceId) {
            loading.classList.add('hidden');
            errorBox.textContent = 'لم يتم تحديد القطعة.';
            errorBox.classList.remove('hidden');
            return;
        }

        const [{ data: piece, error: pieceError }, { data: store }, { data: fields }] = await Promise.all([
            goldmindClient.from('pieces').select('*').eq('id', pieceId).eq('store_id', GOLDMIND_STORE_ID).maybeSingle(),
            goldmindClient.from('stores').select('name, rfid_enabled, label_mc_multiplier, label_mc_addend, zebra_label_width_mm, zebra_label_height_mm, zebra_label_dpi, zebra_label_x_offset_mm, zebra_label_y_offset_mm, zebra_barcode_height_mm, zebra_label_rotate_180, zebra_darkness, zebra_field_spacing_mm, zebra_barcode_module_width').eq('id', GOLDMIND_STORE_ID).maybeSingle(),
            goldmindClient.from('zebra_label_fields').select('*').eq('store_id', GOLDMIND_STORE_ID).order('column_num').order('row_order')
        ]);
        labelFields = fields || [];

        loading.classList.add('hidden');

        if (pieceError || !piece) {
            errorBox.textContent = 'تعذر إيجاد هذه القطعة.';
            errorBox.classList.remove('hidden');
            return;
        }

        currentPiece = piece;
        currentStore = store;

        document.getElementById('storeName').textContent = (store && store.name) ? store.name : 'GoldMind';

        document.getElementById('specWeight').textContent = 'W: ' + Number(piece.weight_grams || 0).toFixed(2);
        document.getElementById('specKarat').textContent = 'Kt: ' + (piece.karat || '');

        const mcMultiplier = (store && store.label_mc_multiplier != null) ? Number(store.label_mc_multiplier) : 1;
        const mcAddend = (store && store.label_mc_addend != null) ? Number(store.label_mc_addend) : 0;
        const rawFab = piece.cost_fabrication_per_gram;
        document.getElementById('specMc').textContent = 'MC: ' + (rawFab != null ? String(Math.round(Number(rawFab) * mcMultiplier + mcAddend)) : '—');

        document.getElementById('specType').textContent = piece.description_en || piece.description_ar || piece.piece_type || '';

        const barcodeValue = piece.barcode || pieceId.slice(0, 12).toUpperCase();
        document.getElementById('barcodeNumber').textContent = barcodeValue;
        try {
            JsBarcode('#barcodeSvg', barcodeValue, {
                format: 'CODE128', width: 1.3, height: 34, displayValue: false,
                margin: 2
            });
        } catch (e) {
            document.getElementById('barcodeSvg').outerHTML = '<div class="text-xs text-red-600">تعذّر توليد الباركود</div>';
        }

        if (piece.rfid_epc) {
            document.getElementById('rfidBadge').classList.remove('hidden');
        }

        if (store && store.rfid_enabled) {
            document.getElementById('rfid-btn').classList.remove('hidden');
            document.getElementById('rfid-btn').classList.add('flex');
        }

        label.classList.remove('hidden');
    }

    function showRfidStatus(text, isError) {
        const box = document.getElementById('rfid-status');
        box.textContent = text;
        box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
        box.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
    }

    // Resolves the data each configurable field (see zebra-label-designer-ar.html)
    // can reference. Shared by both print paths below.
    function buildZebraValues() {
        const mcMultiplier = (currentStore && currentStore.label_mc_multiplier != null) ? Number(currentStore.label_mc_multiplier) : 1;
        const mcAddend = (currentStore && currentStore.label_mc_addend != null) ? Number(currentStore.label_mc_addend) : 0;
        const rawFab = currentPiece.cost_fabrication_per_gram;
        const mcText = rawFab != null ? String(Math.round(Number(rawFab) * mcMultiplier + mcAddend)) : '—';
        return {
            barcode: currentPiece.barcode || currentPiece.id.slice(0, 12).toUpperCase(),
            storeName: (currentStore && currentStore.name) || 'GoldMind',
            weight: Number(currentPiece.weight_grams || 0).toFixed(2),
            karat: currentPiece.karat || '',
            mc: mcText,
            // Zebra's default font can't render Arabic -- never fall back to
            // description_ar/piece_type here (that's exactly what caused
            // garbled text before); the on-screen HTML label can still use
            // Arabic fine.
            description: currentPiece.description_en || '',
            diamondCarat: currentPiece.accent_diamond_carat != null ? Number(currentPiece.accent_diamond_carat).toFixed(2) : ''
        };
    }

    document.getElementById('zebra-btn').addEventListener('click', async function () {
        if (!currentPiece) return;
        const btn = this;

        if (!GMZebra.isAvailable()) {
            showRfidStatus('Zebra Browser Print غير متاح على هذا الجهاز — يجب تثبيت تطبيق Zebra Browser Print أولاً.', true);
            return;
        }

        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined">hourglass_top</span> جارِ الطباعة...';

        try {
            const dpi = (currentStore && currentStore.zebra_label_dpi) || 203;
            const widthDots = GMZebra.mmToDots((currentStore && currentStore.zebra_label_width_mm) || 50, dpi);
            const heightDots = GMZebra.mmToDots((currentStore && currentStore.zebra_label_height_mm) || 25, dpi);
            const xOffsetDots = GMZebra.mmToDots((currentStore && currentStore.zebra_label_x_offset_mm) || 0, dpi);
            const yOffsetDots = GMZebra.mmToDots((currentStore && currentStore.zebra_label_y_offset_mm) || 0, dpi);
            const barHeightDots = GMZebra.mmToDots((currentStore && currentStore.zebra_barcode_height_mm) || 5, dpi);
            const moduleWidth = (currentStore && currentStore.zebra_barcode_module_width) || 2;
            const spacingDots = GMZebra.mmToDots((currentStore && currentStore.zebra_field_spacing_mm != null) ? currentStore.zebra_field_spacing_mm : 0.75, dpi);
            const rotate180 = !!(currentStore && currentStore.zebra_label_rotate_180);
            const darkness = (currentStore && currentStore.zebra_darkness != null) ? currentStore.zebra_darkness : 15;

            await GMZebra.printBarcodeLabel({
                fields: labelFields,
                values: buildZebraValues(),
                dpi: dpi,
                widthDots: widthDots,
                heightDots: heightDots,
                xOffsetDots: xOffsetDots,
                yOffsetDots: yOffsetDots,
                barHeightDots: barHeightDots,
                moduleWidth: moduleWidth,
                spacingDots: spacingDots,
                rotate180: rotate180,
                darkness: darkness
            });

            showRfidStatus('تم إرسال الملصقة لطابعة Zebra.', false);
        } catch (err) {
            showRfidStatus(err.message || 'فشل غير متوقع أثناء الطباعة.', true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    });

    document.getElementById('rfid-btn').addEventListener('click', async function () {
        if (!currentPiece) return;
        const btn = this;

        if (!GMZebra.isAvailable()) {
            showRfidStatus('Zebra Browser Print غير متاح على هذا الجهاز — يجب تثبيت تطبيق Zebra Browser Print أولاً.', true);
            return;
        }

        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined">hourglass_top</span> جارِ الطباعة...';

        try {
            const barcodeValue = currentPiece.barcode || currentPiece.id.slice(0, 12).toUpperCase();
            const epcSource = GMZebra.buildEpcSource(barcodeValue, GOLDMIND_STORE_ID.slice(0, 8));
            const epcHex = GMZebra.asciiToHex(epcSource);

            const dpi = (currentStore && currentStore.zebra_label_dpi) || 203;
            const widthDots = GMZebra.mmToDots((currentStore && currentStore.zebra_label_width_mm) || 50, dpi);
            const heightDots = GMZebra.mmToDots((currentStore && currentStore.zebra_label_height_mm) || 25, dpi);
            const xOffsetDots = GMZebra.mmToDots((currentStore && currentStore.zebra_label_x_offset_mm) || 0, dpi);
            const yOffsetDots = GMZebra.mmToDots((currentStore && currentStore.zebra_label_y_offset_mm) || 0, dpi);
            const barHeightDots = GMZebra.mmToDots((currentStore && currentStore.zebra_barcode_height_mm) || 5, dpi);
            const moduleWidth = (currentStore && currentStore.zebra_barcode_module_width) || 2;
            const spacingDots = GMZebra.mmToDots((currentStore && currentStore.zebra_field_spacing_mm != null) ? currentStore.zebra_field_spacing_mm : 0.75, dpi);
            const rotate180 = !!(currentStore && currentStore.zebra_label_rotate_180);
            const darkness = (currentStore && currentStore.zebra_darkness != null) ? currentStore.zebra_darkness : 15;

            await GMZebra.printAndEncodeRfid({
                fields: labelFields,
                values: buildZebraValues(),
                barcode: barcodeValue,
                epcHex: epcHex,
                widthDots: widthDots,
                heightDots: heightDots,
                xOffsetDots: xOffsetDots,
                yOffsetDots: yOffsetDots,
                barHeightDots: barHeightDots,
                moduleWidth: moduleWidth,
                spacingDots: spacingDots,
                rotate180: rotate180,
                darkness: darkness
            });

            const { error: updateError } = await goldmindClient.from('pieces').update({
                rfid_epc: epcHex,
                rfid_encoded_at: new Date().toISOString()
            }).eq('id', currentPiece.id);

            if (updateError) {
                showRfidStatus('طُبعت الملصقة لكن تعذّر تحديث سجل القطعة: ' + updateError.message, true);
            } else {
                showRfidStatus('تم طباعة الملصقة وبرمجة الرقاقة بنجاح.', false);
                document.getElementById('rfidBadge').classList.remove('hidden');
            }
        } catch (err) {
            showRfidStatus(err.message || 'فشل غير متوقع أثناء الطباعة.', true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    });

    document.getElementById('reset-orientation-btn').addEventListener('click', async function () {
        const btn = this;
        if (!GMZebra.isAvailable()) {
            showRfidStatus('Zebra Browser Print غير متاح على هذا الجهاز — يجب تثبيت تطبيق Zebra Browser Print أولاً.', true);
            return;
        }
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="material-symbols-outlined text-[16px]">hourglass_top</span> جارِ الإرسال...';
        try {
            await GMZebra.resetPrinterOrientation();
            showRfidStatus('تم إرسال أمر إعادة الضبط للطابعة. جرّب الطباعة من جديد الآن.', false);
        } catch (err) {
            showRfidStatus(err.message || 'فشل غير متوقع.', true);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    });

    loadLabel();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
