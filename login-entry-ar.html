<!DOCTYPE html>
<html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GoldMind | تسجيل الدخول</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
        html { font-size: 87.5%; }
        :root { --royal-gold: #FFD700; --deep-navy: #0f172a; }
        body { font-family: 'IBM+Plex+Sans+Arabic', 'Inter', sans-serif; background-color: var(--deep-navy); }
        .gold-glow { text-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .gem-comet {
            filter: drop-shadow(0 0 3px rgba(255, 215, 0, 0.9)) drop-shadow(0 0 7px rgba(255, 255, 255, 0.6));
        }
        .gem-comet-a {
            animation: gemCometForward 1.4s linear infinite;
        }
        .gem-comet-b {
            animation: gemCometReverse 2.3s linear infinite;
        }
        @keyframes gemCometForward {
            to { stroke-dashoffset: -140; }
        }
        @keyframes gemCometReverse {
            to { stroke-dashoffset: 140; }
        }
        .gem-node {
            transform-box: fill-box;
            transform-origin: center;
            animation: gemPulse 1.8s ease-in-out infinite;
        }
        .gem-node-2 { animation-delay: 0.3s; }
        .gem-node-3 { animation-delay: 0.6s; }
        @keyframes gemPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.8); opacity: 0.45; }
        }
        .gold-border-focus:focus-within { border-color: var(--royal-gold); box-shadow: 0 0 0 1px var(--royal-gold); }
        .gold-gradient { background: linear-gradient(135deg, #FFD700 0%, #B4955A 100%); }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 215, 0, 0.1); }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; vertical-align: middle; font-size: 18px; }
        .error-text { display: none; }
        .tab-btn { transition: all .15s ease; }
        .tab-btn.active { background: rgba(255,215,0,0.12); color: var(--royal-gold); }
        .tab-btn:not(.active) { color: rgba(255,255,255,0.55); }
        .company-result:hover { background: rgba(255,215,0,0.08); }
        .company-chip { background: rgba(255,215,0,0.12); border: 1px solid rgba(255,215,0,0.35); }
    </style>
<script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: {
            colors: { "primary": "#FFD700", "on-primary": "#0f172a", "secondary": "#745a25",
                "surface": "#0f172a", "surface-container": "#1e293b", "outline": "#76777d", "background": "#0f172a" },
            borderRadius: { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
            fontFamily: { "headline-xl": ["Inter", "IBM+Plex+Sans+Arabic"], "body-md": ["Inter", "IBM+Plex+Sans+Arabic"] }
        } } }
    </script>
<style> body { min-height: max(884px, 100dvh); } </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4">
<main class="relative z-10 w-full max-w-[440px] flex flex-col items-center">
<div class="mb-8 text-center">
<div class="inline-flex items-center justify-center w-32 h-32 rounded-full border-2 border-primary/30 mb-6 bg-surface-container relative">
<svg width="78" height="78" viewBox="0 0 56 56" fill="none" class="relative z-10">
<defs>
<linearGradient id="gemGrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFD700"/>
<stop offset="1" stop-color="#B4955A"/>
</linearGradient>
<linearGradient id="cometGradA" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFD700" stop-opacity="0"/>
<stop offset="0.55" stop-color="#FFD700" stop-opacity="0.85"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
</linearGradient>
<linearGradient id="cometGradB" x1="1" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
<stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.75"/>
<stop offset="1" stop-color="#FFD700" stop-opacity="1"/>
</linearGradient>
</defs>
<path class="gem-track" d="M28 4 L48 20 L40 50 L16 50 L8 20 Z" stroke="url(#gemGrad)" stroke-width="1.5" fill="rgba(255,215,0,0.07)" stroke-linejoin="round" opacity="0.4"/>
<path class="gem-comet gem-comet-a" d="M28 4 L48 20 L40 50 L16 50 L8 20 Z" pathLength="140" stroke="url(#cometGradA)" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="22 118"/>
<path class="gem-comet gem-comet-b" d="M28 4 L48 20 L40 50 L16 50 L8 20 Z" pathLength="140" stroke="url(#cometGradB)" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="14 126"/>
<path d="M8 20 L48 20" stroke="url(#gemGrad)" stroke-width="1.2" opacity="0.5"/>
<path d="M18 20 L16 50" stroke="url(#gemGrad)" stroke-width="1" opacity="0.4"/>
<path d="M38 20 L40 50" stroke="url(#gemGrad)" stroke-width="1" opacity="0.4"/>
<path d="M28 4 L18 20" stroke="url(#gemGrad)" stroke-width="1" opacity="0.35"/>
<path d="M28 4 L38 20" stroke="url(#gemGrad)" stroke-width="1" opacity="0.35"/>
<circle class="gem-node" cx="28" cy="20" r="2.2" fill="#FFD700"/>
<circle class="gem-node gem-node-2" cx="18" cy="20" r="1.5" fill="#FFD700" opacity="0.8"/>
<circle class="gem-node gem-node-3" cx="38" cy="20" r="1.5" fill="#FFD700" opacity="0.8"/>
</svg> 
<div class="absolute inset-0 rounded-full animate-pulse bg-primary/10 blur-xl"></div>
</div>
<h1 class="text-4xl font-headline-xl font-bold tracking-tight text-primary mb-2">جولد مايند</h1>
<p class="text-xl text-primary/80 opacity-90">مرحباً بك في جولد مايند</p>
</div>

<div class="glass-panel w-full p-6 rounded-xl shadow-2xl space-y-6">

<!-- Mode tabs -->
<div class="flex bg-black/20 rounded-lg p-1 gap-1">
<button class="tab-btn active flex-1 py-2.5 rounded-md text-sm font-semibold" id="tabJoin" type="button" onclick="setMode('join')">الدخول لشركتي</button>
<button class="tab-btn flex-1 py-2.5 rounded-md text-sm font-semibold" id="tabNew" type="button" onclick="setMode('new')">تسجيل شركة جديدة</button>
</div>

<!-- JOIN mode -->
<div id="joinPanel">
<div class="text-center mb-4">
<h2 class="text-lg font-bold text-white">ابحث عن شركتك</h2>
<p class="text-xs text-primary/70 mt-2">اكتب اسم الشركة يلي عندك حساب فيها</p>
</div>
<div class="relative mb-3">
<div class="flex items-center gold-border-focus border border-primary/30 rounded-lg bg-black/20 overflow-hidden transition-all" id="companyInputWrap">
<span class="material-symbols-outlined text-primary/50 px-3">search</span>
<input class="flex-1 bg-transparent py-3.5 pl-4 text-white placeholder:text-white/30 focus:outline-none" id="companySearch" placeholder="اسم الشركة..." type="text"/>
</div>
<div class="absolute top-full right-0 left-0 bg-surface-container border border-t-0 border-primary/30 rounded-b-lg overflow-hidden hidden z-20 max-h-48 overflow-y-auto shadow-lg" id="companyResults"></div>
</div>
<div class="hidden items-center justify-between company-chip rounded-lg px-4 py-3 mb-4" id="selectedCompanyChip">
<span class="text-sm font-semibold" id="selectedCompanyName"></span>
<button class="text-white/50 hover:text-white" onclick="clearSelectedCompany()" type="button"><span class="material-symbols-outlined text-base">close</span></button>
</div>
<form class="space-y-5" id="joinForm">
<div>
<label class="block text-sm font-semibold text-primary/80 mb-2" for="joinEmail">بريدك الإلكتروني</label>
<div class="flex items-center gold-border-focus border border-primary/30 rounded-lg bg-black/20 overflow-hidden">
<input class="flex-1 bg-transparent px-4 py-4 text-white placeholder:text-white/30 focus:outline-none text-lg" dir="ltr" id="joinEmail" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<button class="w-full gold-gradient text-on-primary font-bold py-4 rounded-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-200 text-lg" id="joinSubmitBtn" type="submit">إرسال رمز التحقق</button>
<p class="text-error text-sm text-center hidden" id="joinFormError"></p>
</form>
</div>

<!-- NEW COMPANY mode -->
<div class="hidden" id="newPanel">
<div class="text-center mb-4">
<h2 class="text-lg font-bold text-white">سجّل شركتك</h2>
<p class="text-xs text-primary/70 mt-2">أنشئ حساباً جديداً وستصبح مالك الشركة تلقائياً</p>
</div>
<form class="space-y-5" id="newForm">
<div>
<label class="block text-sm font-semibold text-primary/80 mb-2" for="newCompanyName">اسم الشركة</label>
<div class="flex items-center gold-border-focus border border-primary/30 rounded-lg bg-black/20 overflow-hidden">
<input class="flex-1 bg-transparent px-4 py-4 text-white placeholder:text-white/30 focus:outline-none text-lg" id="newCompanyName" placeholder="مثال: شركة الذهب العصري" required="" type="text"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-primary/80 mb-2" for="newEmail">بريدك الإلكتروني</label>
<div class="flex items-center gold-border-focus border border-primary/30 rounded-lg bg-black/20 overflow-hidden">
<input class="flex-1 bg-transparent px-4 py-4 text-white placeholder:text-white/30 focus:outline-none text-lg" dir="ltr" id="newEmail" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<button class="w-full gold-gradient text-on-primary font-bold py-4 rounded-lg shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-200 text-lg" id="newSubmitBtn" type="submit">إنشاء الشركة وإرسال الرمز</button>
<p class="text-error text-sm text-center hidden" id="newFormError"></p>
</form>
</div>

</div>

<footer class="mt-12 flex flex-col items-center gap-6 text-primary/40">
<div class="flex items-center gap-4 text-sm">
<span class="text-white/70 cursor-pointer hover:text-white transition-colors">English</span>
<span class="opacity-30">|</span>
<span class="text-primary font-semibold">العربية</span>
</div>
<p class="text-xs">© ٢٠٢٦ جولد مايند لإدارة محلات الذهب. جميع الحقوق محفوظة.</p>
</footer>
</main>
<script>
const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
let selectedCompany = null; // { id, name }

function setMode(mode) {
    document.getElementById('tabJoin').classList.toggle('active', mode === 'join');
    document.getElementById('tabNew').classList.toggle('active', mode === 'new');
    document.getElementById('joinPanel').classList.toggle('hidden', mode !== 'join');
    document.getElementById('newPanel').classList.toggle('hidden', mode !== 'new');
}

function closeCompanyResults() {
    document.getElementById('companyResults').classList.add('hidden');
    document.getElementById('companyInputWrap').classList.remove('rounded-b-none');
}

function openCompanyResults() {
    document.getElementById('companyResults').classList.remove('hidden');
    document.getElementById('companyInputWrap').classList.add('rounded-b-none');
}

function clearSelectedCompany() {
    selectedCompany = null;
    document.getElementById('selectedCompanyChip').classList.add('hidden');
    document.getElementById('selectedCompanyChip').classList.remove('flex');
    document.getElementById('companySearch').value = '';
    document.getElementById('companyInputWrap').classList.remove('hidden');
    closeCompanyResults();
}

function selectCompany(id, name) {
    selectedCompany = { id, name };
    document.getElementById('selectedCompanyName').textContent = name;
    document.getElementById('selectedCompanyChip').classList.remove('hidden');
    document.getElementById('selectedCompanyChip').classList.add('flex');
    closeCompanyResults();
    document.getElementById('companyInputWrap').classList.add('hidden');
}

let searchDebounce;
document.getElementById('companySearch').addEventListener('input', function () {
    clearTimeout(searchDebounce);
    const q = this.value.trim();
    const resultsBox = document.getElementById('companyResults');
    if (q.length < 1) { closeCompanyResults(); return; }
    searchDebounce = setTimeout(async () => {
        const { data, error } = await goldmindClient.rpc('search_companies', { q });
        if (error || !data || data.length === 0) {
            resultsBox.innerHTML = '<div class="px-4 py-3 text-sm text-white/40">لا توجد نتائج</div>';
            openCompanyResults();
            return;
        }
        resultsBox.innerHTML = data.map(c =>
            `<div class="company-result px-4 py-3 text-sm cursor-pointer text-white/90" onclick="selectCompany('${c.id}', '${c.name.replace(/'/g, "\\'")}')">${c.name}</div>`
        ).join('');
        openCompanyResults();
    }, 150);
});

document.addEventListener('click', function (e) {
    const wrap = document.getElementById('companyInputWrap');
    const resultsBox = document.getElementById('companyResults');
    if (!wrap.contains(e.target) && !resultsBox.contains(e.target)) {
        closeCompanyResults();
    }
});

document.getElementById('joinForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('joinEmail').value.trim();
    const errEl = document.getElementById('joinFormError');
    errEl.classList.add('hidden');

    if (!selectedCompany) {
        errEl.textContent = 'فضلاً اختر اسم الشركة أولاً من نتائج البحث';
        errEl.classList.remove('hidden');
        return;
    }
    if (!emailPattern.test(email)) {
        errEl.textContent = 'فضلاً أدخل بريد إلكتروني صحيح';
        errEl.classList.remove('hidden');
        return;
    }

    const btn = document.getElementById('joinSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'جارِ الإرسال...';

    const { error } = await goldmindClient.auth.signInWithOtp({
        email: email,
        options: { shouldCreateUser: true, emailRedirectTo: 'https://eng-bashar-asad.github.io/GoldMind/auth-callback-ar.html' }
    });

    btn.disabled = false;
    btn.textContent = 'إرسال رمز التحقق';

    if (error) {
        errEl.textContent = 'تعذّر إرسال الرمز: ' + error.message;
        errEl.classList.remove('hidden');
        return;
    }

    sessionStorage.setItem('goldmind_email', email);
    sessionStorage.setItem('goldmind_mode', 'join');
    sessionStorage.setItem('goldmind_store_id', selectedCompany.id);
    sessionStorage.setItem('goldmind_store_name', selectedCompany.name);
    window.location.href = 'login-ar-4.html';
});

document.getElementById('newForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const companyName = document.getElementById('newCompanyName').value.trim();
    const email = document.getElementById('newEmail').value.trim();
    const errEl = document.getElementById('newFormError');
    errEl.classList.add('hidden');

    if (!companyName) {
        errEl.textContent = 'فضلاً أدخل اسم الشركة';
        errEl.classList.remove('hidden');
        return;
    }
    if (!emailPattern.test(email)) {
        errEl.textContent = 'فضلاً أدخل بريد إلكتروني صحيح';
        errEl.classList.remove('hidden');
        return;
    }

    const btn = document.getElementById('newSubmitBtn');
    btn.disabled = true;
    btn.textContent = 'جارِ الإرسال...';

    const { error } = await goldmindClient.auth.signInWithOtp({
        email: email,
        options: { shouldCreateUser: true, emailRedirectTo: 'https://eng-bashar-asad.github.io/GoldMind/auth-callback-ar.html' }
    });

    btn.disabled = false;
    btn.textContent = 'إنشاء الشركة وإرسال الرمز';

    if (error) {
        errEl.textContent = 'تعذّر إرسال الرمز: ' + error.message;
        errEl.classList.remove('hidden');
        return;
    }

    sessionStorage.setItem('goldmind_email', email);
    sessionStorage.setItem('goldmind_mode', 'new');
    sessionStorage.setItem('goldmind_company_name', companyName);
    window.location.href = 'login-ar-4.html';
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
