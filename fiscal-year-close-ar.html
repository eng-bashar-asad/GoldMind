<!DOCTYPE html>
<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إغلاق السنة المالية | GoldMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js?v=7"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = { darkMode: "class", theme: { extend: {
        "colors": {
          "on-surface-variant": "var(--gm-on-surface-variant)", "secondary": "var(--gm-secondary)", "error": "#ba1a1a",
          "on-secondary": "#ffffff", "on-surface": "var(--gm-on-surface)", "surface-container-low": "var(--gm-surface-low)",
          "on-primary": "var(--gm-on-primary)", "on-background": "var(--gm-on-primary)", "background": "var(--gm-bg-elevated)", "outline-variant": "var(--gm-outline-variant)",
          "surface-container-lowest": "var(--gm-surface-lowest)", "surface": "var(--gm-bg-elevated)", "primary": "var(--gm-primary)",
          "outline": "#76777d", "success": "#1e7d32"
        },
        "fontFamily": { "body-md": ["Inter"], "data-mono": ["IBM Plex Sans"], "headline-md": ["Inter"], "label-md": ["Inter"] },
        "fontSize": {
          "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
          "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
          "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]
        }
      } } }
    </script>
<style>
    html { font-size: 87.5%; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400; font-size: 18px; }
</style>
<style> body { min-height: max(884px, 100dvh); } </style>
</head>
<body class="bg-background text-on-background font-body-md">
<header class="bg-surface-container-lowest text-primary border-b border-outline-variant z-50 sticky top-0">
<div class="flex justify-between items-center px-4 w-full h-16">
<div class="flex items-center gap-4">
<button onclick="window.location.href='index-ar.html'" class="cursor-pointer p-2 hover:bg-surface-container-low rounded-full flex items-center justify-center">
<span class="material-symbols-outlined">arrow_forward</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold">إغلاق السنة المالية</h1>
</div>
<button onclick="gmOpenTimezonePicker()" class="w-9 h-9 rounded-full border border-outline-variant flex items-center justify-center active:scale-90 transition-all" title="المنطقة الزمنية للعرض">
<span class="material-symbols-outlined text-primary text-[18px]">schedule</span>
</button>
</div>
</header>
<main class="pb-32 max-w-md lg:max-w-3xl mx-auto px-4">

<div id="loading-state" class="py-16 text-center text-on-surface-variant text-sm">جارِ التحميل...</div>
<div id="no-access" class="hidden py-16 text-center text-error text-sm">هذا الإجراء متاح فقط لمالك الشركة.</div>

<div id="page-content" class="hidden py-6 flex flex-col gap-5">

<p class="text-[11px] text-outline">إغلاق السنة المالية إجراء يدوي بالكامل — لازم تسوّي كل تعديلات المخزون والفواتير المتأخرة أولاً قبل ما تسكّرها. بعد الإغلاق بيتحفظ ملخص دائم للسنة، وترقيم الفواتير بيرجع تلقائياً لـ ١ مع بداية كل سنة (بدون علاقة بالإغلاق).</p>

<div id="years-list" class="flex flex-col gap-4"></div>

</div>
</main>

<script>
function fmt(n) { return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

async function computePreview(storeId, year) {
  const yrStart = new Date(year, 0, 1).toISOString();
  const yrEnd = new Date(year + 1, 0, 1).toISOString();

  const { data: sales } = await goldmindClient.from('invoices').select('total_amount')
    .eq('store_id', storeId).eq('type', 'sale').neq('status', 'cancelled')
    .gte('created_at', yrStart).lt('created_at', yrEnd);
  const { data: returns } = await goldmindClient.from('invoices').select('total_amount')
    .eq('store_id', storeId).eq('type', 'return')
    .gte('created_at', yrStart).lt('created_at', yrEnd);

  const totalSales = (sales || []).reduce((s, i) => s + Number(i.total_amount), 0);
  const totalReturns = (returns || []).reduce((s, i) => s + Number(i.total_amount), 0);
  return { totalSales, totalReturns, netSales: totalSales - totalReturns, count: (sales || []).length };
}

async function closeYear(storeId, year) {
  if (!confirm('هل أنت متأكد من إغلاق السنة المالية ' + year + '؟ تأكد إنك سوّيت كل التعديلات اللازمة على المخزون والفواتير أولاً — هذا الإجراء يسجّل ملخص دائم لهذه السنة.')) return;

  const btn = document.getElementById('close-btn-' + year);
  btn.disabled = true;
  btn.textContent = 'جارِ الإغلاق...';

  const { error } = await goldmindClient.rpc('close_fiscal_year', { target_store_id: storeId, target_year: year });

  if (error) {
    alert('تعذّر الإغلاق: ' + error.message);
    btn.disabled = false;
    btn.textContent = 'إغلاق هذه السنة';
    return;
  }
  await load();
}

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  const { data: staffRow } = await goldmindClient.from('staff').select('role').eq('id', GOLDMIND_STAFF_ID).maybeSingle();
  document.getElementById('loading-state').classList.add('hidden');

  if (!staffRow || staffRow.role !== 'owner') {
    document.getElementById('no-access').classList.remove('hidden');
    return;
  }
  document.getElementById('page-content').classList.remove('hidden');

  const { data: storeRow } = await goldmindClient.from('stores').select('created_at').eq('id', GOLDMIND_STORE_ID).maybeSingle();
  const startYear = storeRow ? new Date(storeRow.created_at).getFullYear() : new Date().getFullYear();
  const currentYear = new Date().getFullYear();

  const { data: closures } = await goldmindClient.from('fiscal_year_closures').select('*').eq('store_id', GOLDMIND_STORE_ID);
  const closedMap = {};
  (closures || []).forEach(c => closedMap[c.fiscal_year] = c);

  const years = [];
  for (let y = startYear; y <= currentYear; y++) years.push(y);
  years.reverse();

  const listEl = document.getElementById('years-list');
  listEl.innerHTML = '<p class="text-center text-on-surface-variant text-sm py-4">جارِ حساب الملخصات...</p>';

  const cardsHtml = [];
  for (const year of years) {
    const closure = closedMap[year];
    if (closure) {
      cardsHtml.push(`
        <div class="bg-surface-container-lowest border border-success rounded-xl p-4">
          <div class="flex items-center justify-between mb-2">
            <p class="font-bold text-[15px]">سنة ${year}</p>
            <span class="text-success text-[12px] font-semibold flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">check_circle</span> مُغلقة</span>
          </div>
          <p class="text-[12px] text-on-surface-variant">صافي المبيعات: <span class="font-data-mono font-bold text-on-surface">${fmt(closure.total_sales - closure.total_returns)}</span></p>
          <p class="text-[12px] text-on-surface-variant">ضريبة المخرجات: <span class="font-data-mono">${fmt(closure.total_output_tax)}</span> · ضريبة المدخلات: <span class="font-data-mono">${fmt(closure.total_input_tax)}</span></p>
          <p class="text-[11px] text-outline mt-1">أُغلقت بتاريخ ${gmFormatDateTime(closure.closed_at)}</p>
        </div>`);
    } else if (year < currentYear) {
      const preview = await computePreview(GOLDMIND_STORE_ID, year);
      cardsHtml.push(`
        <div class="bg-surface-container-lowest border-2 border-error/40 rounded-xl p-4">
          <div class="flex items-center justify-between mb-2">
            <p class="font-bold text-[15px]">سنة ${year}</p>
            <span class="text-error text-[12px] font-semibold">غير مُغلقة بعد</span>
          </div>
          <p class="text-[12px] text-on-surface-variant mb-3">صافي المبيعات المتوقّع: <span class="font-data-mono font-bold text-on-surface">${fmt(preview.netSales)}</span> (${preview.count} فاتورة)</p>
          <button id="close-btn-${year}" onclick="closeYear('${GOLDMIND_STORE_ID}', ${year})" class="w-full h-11 bg-error text-white rounded-lg text-sm font-semibold">إغلاق هذه السنة</button>
        </div>`);
    } else {
      cardsHtml.push(`
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 opacity-70">
          <p class="font-bold text-[15px]">سنة ${year} (السنة الحالية)</p>
          <p class="text-[11px] text-outline mt-1">بتقدر تسكّرها بعد ما تخلص وتبلش سنة جديدة.</p>
        </div>`);
    }
  }

  listEl.innerHTML = cardsHtml.join('') || '<p class="text-center text-on-surface-variant text-sm py-8">لا توجد سنوات سابقة بعد.</p>';
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body></html>
