<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"/>
<title>كشف حساب عميل | GoldMind</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="theme.js?v=11"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Inter', sans-serif; }
    .font-data-mono { font-family: 'IBM Plex Sans', sans-serif; }
    @media print { .no-print { display: none !important; } body { padding: 0; } }
</style>
</head>
<body class="bg-gray-100 text-gray-900">
<div class="no-print sticky top-0 bg-white border-b px-4 py-3 flex items-center justify-between z-10">
<button onclick="history.back()" class="flex items-center gap-2 text-sm font-semibold">
<span class="material-symbols-outlined">arrow_forward</span> رجوع
</button>
<button onclick="window.print()" class="flex items-center gap-2 bg-black text-white px-4 py-2 rounded-lg text-sm font-semibold">
<span class="material-symbols-outlined">print</span> طباعة
</button>
</div>

<div id="loading-state" class="py-20 text-center text-gray-500 text-sm">جارِ التحميل...</div>
<div id="error-state" class="hidden py-20 text-center text-red-600 text-sm px-6"></div>

<div id="statement" class="hidden max-w-md lg:max-w-3xl mx-auto bg-white my-4 p-6 rounded-xl shadow-sm">
<div class="text-center mb-6 pb-4 border-b">
<h1 class="font-bold text-lg" id="store-name"></h1>
<p class="text-xs text-gray-500 mt-1">كشف حساب عميل</p>
<p class="text-xs text-gray-400 mt-1" id="print-date"></p>
</div>

<div class="mb-5">
<p class="text-sm font-bold" id="customer-name"></p>
<p class="text-xs text-gray-500 font-data-mono" dir="ltr" id="customer-phone"></p>
</div>

<div class="bg-gray-50 rounded-lg p-4 mb-5 text-center">
<p class="text-xs text-gray-500 mb-1">الرصيد الحالي</p>
<p class="font-bold text-2xl font-data-mono" id="current-balance">0.00</p>
<p class="text-[11px] text-gray-400 mt-1" id="balance-label"></p>
</div>

<table class="w-full text-xs mb-2">
<thead><tr class="border-b text-gray-500">
<th class="py-2 text-right">التاريخ</th><th class="py-2 text-right">البيان</th><th class="py-2 text-left">المبلغ</th>
</tr></thead>
<tbody id="movements-tbody"></tbody>
</table>
<p id="empty-movements" class="hidden text-center text-gray-400 text-sm py-8">لا توجد حركات مسجّلة.</p>

<div class="text-center text-[10px] text-gray-400 mt-6 pt-4 border-t">تم إصدار هذا الكشف عبر GoldMind</div>
</div>

<script>
function fmt(n) { return Number(n || 0).toLocaleString('ar-EG-u-nu-latn', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

async function load() {
  const session = await requireGoldMindSession('login-entry-ar.html');
  if (!session) return;

  const params = new URLSearchParams(window.location.search);
  const customerId = params.get('id');
  const loading = document.getElementById('loading-state');
  const errorEl = document.getElementById('error-state');

  if (!customerId) {
    loading.classList.add('hidden');
    errorEl.textContent = 'لم يتم تحديد عميل.';
    errorEl.classList.remove('hidden');
    return;
  }

  const [{ data: store }, { data: customer, error: custError }, { data: movements }] = await Promise.all([
    goldmindClient.from('stores').select('name').eq('id', GOLDMIND_STORE_ID).maybeSingle(),
    goldmindClient.from('customers').select('*').eq('id', customerId).maybeSingle(),
    goldmindClient.from('customer_debts').select('*, invoice:invoice_id(invoice_number)').eq('customer_id', customerId).order('created_at', { ascending: true })
  ]);

  loading.classList.add('hidden');

  if (custError || !customer) {
    errorEl.textContent = 'تعذّر تحميل بيانات العميل.';
    errorEl.classList.remove('hidden');
    return;
  }

  document.getElementById('store-name').textContent = store ? store.name : 'GoldMind';
  document.getElementById('print-date').textContent = 'تاريخ الإصدار: ' + gmFormatDateTime(new Date());
  document.getElementById('customer-name').textContent = customer.name;
  document.getElementById('customer-phone').textContent = customer.phone || '';

  const MOVEMENT_LABELS = { debt_increase: 'فاتورة بيع بالدين', debt_decrease: 'دفعة مسدَّدة' };
  const moves = movements || [];

  const balance = moves.reduce((s, m) => s + (m.movement_type === 'debt_increase' ? Number(m.cash_amount) : -Number(m.cash_amount)), 0);
  const balEl = document.getElementById('current-balance');
  balEl.textContent = fmt(Math.abs(balance));
  balEl.className = 'font-bold text-2xl font-data-mono ' + (balance > 0 ? 'text-red-600' : 'text-green-700');
  document.getElementById('balance-label').textContent = balance > 0 ? 'دين على العميل لصالح المحل' : (balance < 0 ? 'رصيد زائد لصالح العميل' : 'الحساب متوازن');

  const tbody = document.getElementById('movements-tbody');
  if (moves.length === 0) {
    document.getElementById('empty-movements').classList.remove('hidden');
  } else {
    tbody.innerHTML = moves.map(m => {
      const isIncrease = m.movement_type === 'debt_increase';
      const date = gmFormatDateTime(m.created_at, { day: '2-digit', month: '2-digit', year: 'numeric' });
      const label = (MOVEMENT_LABELS[m.movement_type] || m.movement_type) + (m.invoice && m.invoice.invoice_number ? ' (' + m.invoice.invoice_number + ')' : '');
      return `
        <tr class="border-b border-gray-100">
          <td class="py-2 font-data-mono text-gray-500">${date}</td>
          <td class="py-2">${label}</td>
          <td class="py-2 font-data-mono font-bold text-left ${isIncrease ? 'text-red-600' : 'text-green-700'}">${isIncrease ? '+' : '-'}${fmt(m.cash_amount)}</td>
        </tr>`;
    }).join('');
  }

  document.getElementById('statement').classList.remove('hidden');
}

load();
</script>
</body></html>
